<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img"><title>Two team structures and the two architectures they produce</title><rect width="600" height="230" fill="#141516"/><defs><marker id="cw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e36d51"></path></marker></defs><text x="20" y="20" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#bdb6aa">Communication structure</text><text x="360" y="20" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#bdb6aa">What ships</text><g><line x1="76" y1="62" x2="106" y2="62" stroke="#bdb6aa" stroke-width="1.5"></line><line x1="138" y1="62" x2="168" y2="62" stroke="#bdb6aa" stroke-width="1.5"></line><g><circle cx="60" cy="62" r="15" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></circle><text x="60" y="66" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#bdb6aa">A</text></g><g><circle cx="122" cy="62" r="15" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></circle><text x="122" y="66" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#bdb6aa">B</text></g><g><circle cx="184" cy="62" r="15" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></circle><text x="184" y="66" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#bdb6aa">C</text></g></g><text x="20" y="98" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#bdb6aa">Three teams, one shared channel</text><line x1="230" y1="62" x2="352" y2="62" stroke="#e36d51" stroke-width="1.5" marker-end="url(#cw-arrow)"></line><rect x="360" y="44" width="200" height="36" rx="5" fill="#e36d51" fill-opacity="0.18" stroke="#e36d51" stroke-opacity="0.6"></rect><text x="460" y="67" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ece7de">One integrated service, one seam</text><g><line x1="76" y1="158" x2="106" y2="158" stroke="#bdb6aa" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 4"></line><line x1="138" y1="158" x2="168" y2="158" stroke="#bdb6aa" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 4"></line><g><circle cx="60" cy="158" r="15" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></circle><text x="60" y="162" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#bdb6aa">A</text></g><g><circle cx="122" cy="158" r="15" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></circle><text x="122" y="162" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#bdb6aa">B</text></g><g><circle cx="184" cy="158" r="15" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></circle><text x="184" y="162" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#bdb6aa">C</text></g></g><text x="20" y="194" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#bdb6aa">Three teams, no channel</text><line x1="230" y1="158" x2="352" y2="158" stroke="#e36d51" stroke-width="1.5" marker-end="url(#cw-arrow)"></line><g><rect x="360" y="140" width="58" height="36" rx="5" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></rect><line x1="418" y1="158" x2="428" y2="158" stroke="#ef8669" stroke-width="1.5" stroke-dasharray="3 3"></line></g><g><rect x="428" y="140" width="58" height="36" rx="5" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></rect><line x1="486" y1="158" x2="496" y2="158" stroke="#ef8669" stroke-width="1.5" stroke-dasharray="3 3"></line></g><g><rect x="496" y="140" width="58" height="36" rx="5" fill="#1c1d1f" stroke="#bdb6aa" stroke-opacity="0.6"></rect></g><text x="460" y="200" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ef8669">Three services, two brittle seams</text><text x="423" y="133" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ef8669">seam</text></svg>
