# Columns: a guided read through several laws, in an order that tells one
# story. Like situations, they are listed in the README and on the site; the
# site's default index is unchanged. Each note says why this law comes next. It
# links laws to each other and leaves explaining a law to the law's own article.
collections:
  - key: working-as-a-team
    en:
      title: Working as a team
      lede: A team exists to do what one person cannot. As it grows, that can stop being true in several places, in coordination, ownership, knowledge and decisions. This column reads through them in that order, along with what keeps a team working.
    ja:
      title: チームで働く
      lede: チームは、一人ではできないことをやるために組む。人が増えると、それが効かなくなる場面が出てくる。調整、担当、知識、意思決定だ。このコラムはそれをこの順に読み、チームを動かし続けるための手もたどる。
    laws:
      - slug: brooks-law
        en: It usually starts when the work falls behind and someone asks for more people.
        ja: たいていは、作業が遅れて人を増やそうという話から始まる。
      - slug: dunbars-number
        en: Brooks' Law is about a project that is already late. A related cost can keep running when nothing is late and the team simply keeps hiring.
        ja: ブルックスの法則は、すでに遅れたプロジェクトの話だ。遅れていなくても、人を採り続ければ、似たコストが効いてくることがある。
      - slug: ringelmann-effect
        en: Coordination is the cost everyone can see. The quieter cost is in how much each person puts in once the group is large.
        ja: 調整は、誰にでも見えるコストだ。見えにくいコストは、大きな集団の中で一人ひとりが出す力のほうに現れる。
      - slug: bystander-effect
        en: That is about work everyone is already doing. Work nobody has started yet, like a page sent to a group channel, tends to run into the same problem.
        ja: ここまでは、全員がもう手をつけている仕事の話だ。まだ誰も手をつけていない仕事、たとえばグループチャンネルに飛んだ呼び出しにも、同じことが起きやすい。
      - slug: conways-law
        en: The usual fix is to split the team and give each part an owner. How it is split does not stay on the org chart.
        ja: よくある手は、チームを分けてそれぞれに担当を置くことだ。その分け方は、組織図の上だけでは終わらない。
      - slug: bus-factor
        en: Naming one owner is the fix the last few laws point to. It has a price, because what keeps that part running collects with its owner.
        ja: 担当を一人決める、というのがここまでの処方だ。ただし代償もある。その部分を動かす知識が、担当者のところに溜まっていく。
      - slug: curse-of-knowledge
        en: The usual remedy is a handover document, and the person who has to write it is often the one least able to see what a newcomer lacks.
        ja: よくある手は引き継ぎ文書だ。だが、それを書くのは、新しい人に何が足りないかにいちばん気づきにくい当の本人であることが多い。
      - slug: context-not-control
        en: When decisions get made without that knowledge, a common response in a growing team is one more rule or approval step.
        ja: その知識がないまま判断が下されると、大きくなるチームでよくある対応は、ルールか承認を一つ足すことだ。
      - slug: law-of-triviality
        en: Some decisions still go to a meeting, and uneven knowledge shows up there too.
        ja: それでも、会議で決めることは残る。そこにも知識の偏りが出る。
      - slug: narratives-not-slides
        en: One way to bring the discussion back to what matters is to change what the team reads when the meeting starts.
        ja: 議論を大事なところに戻す手の一つは、会議の冒頭で読むものを変えることだ。
      - slug: disagree-and-commit
        en: Even a well-argued proposal leaves someone unconvinced, and the team still has to act as one.
        ja: よく書けた提案でも、納得しない人は残る。それでもチームは、一つになって動かなければならない。
  - key: when-ai-writes-the-code
    en:
      title: When AI writes the code
      lede: AI has made writing code cheaper. This column reads through what that can do to a team, more code arriving, more than can be checked, less of it understood, and finally what handing off more of the work costs.
    ja:
      title: AI がコードを書くとき
      lede: AI のおかげで、コードを書くのは安くなった。このコラムは、それがチームに何を起こしうるかを順に読む。コードが増え、確かめきれなくなり、理解が追いつかなくなりうる。最後に、任せる範囲を広げたときの代償をたどる。
    laws:
      - slug: jevons-paradox
        en: The first thing AI changes is the price of a line of code. What a lower price does to the amount written is an old question.
        ja: AI がまず変えるのは、コード一行の値段だ。値段が下がったとき書かれる量がどうなるかは、古くからある問いだ。
      - slug: theory-of-constraints
        en: More code only helps if the rest of the pipeline keeps up. If it does not, the work piles up at the next tightest step, such as review.
        ja: コードが増えても、後ろの工程が追いつかなければ届く量は増えない。仕事は次に詰まる工程、たとえばレビューに溜まる。
      - slug: small-changes
        en: Theory of Constraints says to get the most out of the bottleneck before anything else. For review, the cheapest lever is what the author sends to it.
        ja: 制約理論は、まずボトルネックを使い切れと言う。レビューの場合、いちばん安い手は書く側が何を送るかだ。
      - slug: brandolinis-law
        en: Splitting a change makes each piece readable, not fewer. Each one is still a claim that the code works, and that claim can now cost far less to make than to check.
        ja: 変更を分ければ一つずつは読みやすくなるが、数は減らない。どれも、このコードは動くという主張だ。その主張は、確かめるよりずっと安く出せるようになりうる。
      - slug: automation-bias
        en: A reviewer facing a queue that never empties, of changes that cost more to check than to make, has a shortcut close at hand, which is to let the tool's answer stand.
        ja: 減らないキューと、作るより確かめるほうが高くつく変更を前にしたレビュアーには、手近な近道がある。ツールの答えをそのまま通すことだ。
      - slug: test-oracle-problem
        en: A natural fix is to let tests do the checking, and have the tool write those too, from the same code it just produced.
        ja: 自然な手は、確認をテストに任せ、そのテストもツールに書かせることだ。元になるのは、ツールがいま生成したそのコードだ。
      - slug: kernighans-law
        en: Whatever slips through still has to be debugged, by someone who did not write the code and may not fully follow it.
        ja: それでもすり抜けたものは、誰かがデバッグすることになる。その人はそのコードを書いておらず、隅々まで追えているとも限らない。
      - slug: programming-as-theory-building
        en: Debugging is hardest when nobody holds the reasoning behind the code, and generated code can start out that way.
        ja: コードがなぜそうなっているかを誰も言えないとき、デバッグはいちばん難しくなる。生成されたコードは、最初からそうなりうる。
      - slug: ironies-of-automation
        en: The last law's remedy is a person who can say why the code is shaped the way it is. That person is built by doing the work, and doing the work is the part being handed off.
        ja: 前の法則の処方は、コードがなぜこの形なのかを言える人を置くことだ。そういう人は手を動かすことで育つ。そして手を動かす部分こそ、いま任せている部分だ。
      - slug: lethal-trifecta
        en: Handing off more usually comes with giving agents more access, and some combinations of access are dangerous even when the code they write is fine.
        ja: 任せる範囲が広がると、たいていエージェントに渡す権限も増える。権限の組み合わせによっては、書くコードが正しくても危ない。
  - key: deciding-what-to-build
    en:
      title: Deciding what to build
      lede: Deciding what to build can go wrong in several places, in how the problem is framed, which ideas look good, the order of the work, when to commit, and how the result is judged. This column reads through them in that order.
    ja:
      title: 何を作るか決める
      lede: 何を作るかを決めるときは、いくつもの場所でつまずく。問題の捉え方、案の良し悪し、仕事の順番、確定する時期、結果の見方だ。このコラムはそれをこの順に読む。
    laws:
      - slug: xy-problem
        en: It often starts with a request that is really a solution in disguise.
        ja: 始まりは、解決策の形をした依頼であることが多い。
      - slug: wicked-problems
        en: Sometimes asking for the real goal does not settle it, because the goal itself shifts as the work goes on.
        ja: 本当の目的を聞いても決まらないこともある。作業が進むにつれて、目的そのものが動くからだ。
      - slug: working-backwards
        en: If the problem statement can only be a draft, the cheapest draft to throw away is a page the customer would read.
        ja: 問題の書き方が下書きにしかならないなら、いちばん安く捨てられる下書きは、顧客が読む一枚の文章だ。
      - slug: most-ideas-fail
        en: A press release that survives the team's review has convinced the team. That is a different test from the one users run.
        ja: チームのレビューを通った発表文は、チームを納得させた。それは、使う人が下す判定とは別の試験だ。
      - slug: cost-of-delay
        en: If most ideas fail, a team has to try many of them with the same people, so which goes first becomes a decision of its own.
        ja: 大半のアイデアが外れるなら、同じ人数で数多く試すしかない。だから、どれを先にやるかが一つの決定になる。
      - slug: last-responsible-moment
        en: Ordering the work is one decision. When to commit to each design choice inside it is another.
        ja: 仕事の順番を決めるのと、その中の設計判断をいつ確定するかは、別の決定だ。
      - slug: pre-mortem
        en: Deciding before an option expires is half of it. The other half is hearing, before the work is under way, what the team privately doubts about the plan.
        ja: 選択肢が消える前に決めるのは半分だ。残り半分は、仕事が動き出す前に、チームが計画について内心で疑っていることを聞き出すことだ。
      - slug: disagree-and-commit
        en: A pre-mortem brings doubts out, and not every one gets resolved. When the work has to start, some people will still think the plan is wrong.
        ja: プレモーテムで疑問は出てくるが、すべてが解消するわけではない。仕事を始めるときにも、計画は間違っていると思う人は残る。
      - slug: mcnamara-fallacy
        en: Most Ideas Fail asked for a metric before building. Once the result is in, that metric is also the easiest place to stop looking.
        ja: 「大半のアイデアは失敗する」は、作る前に指標を決めろと言った。結果が出ると、その指標の外を見なくなりやすい。
  - key: before-and-after-an-incident
    en:
      title: Before and after an incident
      lede: An incident is often several things lining up rather than one bad moment. This column reads from the small exceptions that build up before it, through the moment it is noticed, to what a team does afterwards so the next one is less likely.
    ja:
      title: 障害の前とあと
      lede: 障害は、一度の失敗ではなく、いくつかのことが重なって起きることが多い。このコラムは、障害の前に積み重なる小さな例外から、それに気づく瞬間、そして次を起こりにくくするための事後の手までを順に読む。
    laws:
      - slug: normalization-of-deviance
        en: It often starts well before anything breaks, with a shortcut that worked.
        ja: 多くの場合、何かが壊れるずっと前、うまくいった近道から始まる。
      - slug: broken-windows-theory
        en: An accepted exception does not stay alone. Left in plain sight, it invites the next one.
        ja: 受け入れられた例外は、一つでは終わらない。見える所に放置されると、次の例外を呼ぶ。
      - slug: normalcy-bias
        en: When the first real warning arrives, it looks like one more of the exceptions everyone has learned to live with.
        ja: 最初の本物の警告が来ても、みんなが慣れてしまった例外の一つに見える。
      - slug: andon
        en: Noticing is half of it. The other half is whether whoever noticed feels free to say so out loud.
        ja: 気づくのは半分だ。残り半分は、気づいた人がそれを口に出してよいと思えるかどうかだ。
      - slug: blameless-postmortem
        en: After the incident the same question returns. Will the people closest to it say what they saw?
        ja: 障害のあとも同じ問いが戻ってくる。いちばん近くにいた人は、見たことを話すだろうか。
      - slug: five-whys
        en: An honest account gives the analysis something to work with. How far it digs decides what the fix can reach.
        ja: 正直な証言があれば、分析には材料ができる。どこまで掘るかで、対策がどこまで届くかが決まる。
      - slug: swiss-cheese-model
        en: One chain of whys follows one path. Looking back, there is often more than one place the incident could have been stopped.
        ja: なぜを一本たどれば、見えるのは一つの経路だ。振り返ると、止められた場所は一つではないことが多い。
      - slug: normal-accident-theory
        en: Adding another layer is the obvious response, and in some systems the new layer is one more way to fail.
        ja: 層をもう一つ足すのが自然な対応だ。だがシステムによっては、足した層そのものが新しい壊れ方になる。
      - slug: mechanisms-not-good-intentions
        en: Whatever the analysis finds, it ends as action items, and the kind of item decides whether the next incident is less likely.
        ja: 分析が何を見つけても、最後は対策の一覧になる。どんな種類の対策かで、次の障害が起きにくくなるかが決まる。
      - slug: chaos-engineering
        en: The postmortem steps all start from an incident that already happened. The last step is to learn some of the same lessons without one.
        ja: ポストモーテムからの手は、どれも起きてしまった障害が出発点だ。最後の一歩は、障害を待たずに、同じ教訓のいくつかを学ぶことだ。
  - key: when-numbers-run-the-work
    en:
      title: When the numbers run the work
      lede: Teams measure to see what is happening, and can end up working to the measure. This column reads through how that can go wrong, from choosing what to count, to rewarding it, to reading the result, and then how to keep a number useful.
    ja:
      title: 数字で仕事を回すとき
      lede: チームは何が起きているかを見るために測り、やがてその数字に向けて働くようになりやすい。このコラムは、何を数えるか、それに報いるとどうなるか、結果をどう読むか、そして数字を役に立つまま保つ手までを順に読む。
    laws:
      - slug: pareto-principle
        en: Numbers earn their place by pointing at where to look first.
        ja: 数字が役に立つのは、まずどこを見ればいいかを指してくれるからだ。
      - slug: mcnamara-fallacy
        en: A ranking only covers what someone thought to count.
        ja: ただ、順位がつくのは、誰かが数えようと決めたものだけだ。
      - slug: goodharts-law
        en: That harm comes from what the number leaves out, even while the number is honest. Tie it to a reward and the number itself can stop measuring well.
        ja: ここまでの害は、数字が正直でも、その外にあるものから来る。報酬に結びつけると、今度は数字そのものが実態を測らなくなりうる。
      - slug: cobra-effect
        en: Gaming a number is the mild case. The severe case is a reward that makes the problem itself grow.
        ja: 数字を取り繕うだけなら、まだ軽い。重いのは、報酬が問題そのものを育ててしまう場合だ。
      - slug: survivorship-bias
        en: Reading the results has its own trap, because the cases that make it into the report are not the only ones that happened.
        ja: 結果を読む段にも罠がある。報告に残った例だけが、起きたことのすべてではない。
      - slug: twymans-law
        en: Even the numbers that are in the report can mislead, most of all the surprising ones, and a surprisingly good one is easy to leave unchecked.
        ja: 報告に載った数字でさえ、人を迷わせうる。とくに意外な数字がそうで、良すぎる数字は確かめられないままになりやすい。
      - slug: genchi-genbutsu
        en: Checking the plumbing still means checking a number against other numbers. At some point someone has to look at the work itself.
        ja: 配管を確かめても、比べている相手はまだ別の数字だ。どこかで誰かが、仕事そのものを見に行く必要がある。
      - slug: error-budget
        en: Another way is to agree, before the number moves, what the team will do when it does, so nobody argues over it in the moment.
        ja: もう一つの手は、数字が動く前に、動いたら何をするかを決めておくことだ。そうすれば、その場で誰も言い争わずに済む。
  - key: making-it-faster
    en:
      title: Making it faster
      lede: When something is too slow, the first instinct is to speed up the part you know. This column reads from finding where the time actually goes, to the limits on any speedup, to why waiting grows, and then to what keeps speed over time.
    ja:
      title: 速くしたいとき
      lede: 何かが遅いとき、まず手をつけたくなるのは自分の知っている部分だ。このコラムは、時間が実際にどこで使われているかを見つけるところから、速くできる限界、待ち時間が伸びる理由、そして速さを保ち続ける手までを順に読む。
    laws:
      - slug: premature-optimization
        en: It often starts with a part someone already suspects.
        ja: 多くの場合、誰かが前から怪しいと思っている部分から始まる。
      - slug: theory-of-constraints
        en: Measuring turns up many slow steps. When the work passes through them in a chain, only one of them sets how much gets through.
        ja: 測ると遅い工程がいくつも見つかる。仕事がそれらを順に通るなら、どれだけ流れるかを決めるのはそのうち一つだ。
      - slug: amdahls-law
        en: Even after finding the bottleneck, how much a fix can help depends on how much of the total it is.
        ja: ボトルネックを見つけても、直してどれだけ効くかは、それが全体のどれだけを占めるかで決まる。
      - slug: littles-law
        en: Amdahl counts the time spent doing the work. In a busy system the bigger share can be time spent before the work starts, waiting for it.
        ja: アムダールが数えるのは、仕事をしている時間だ。混んでいるシステムでは、仕事が始まるまで待つ時間のほうが大きくなりうる。
      - slug: kingmans-formula
        en: Little's Law ties waiting to the length of the line. What makes the line long is the next question.
        ja: リトルの法則は、待ち時間を列の長さに結びつける。何が列を長くするのかが、次の問いだ。
      - slug: tail-at-scale
        en: A request that touches many servers is likely to meet some node's queue or stall, and the user waits for the slowest.
        ja: 多くのサーバに触れるリクエストは、どこかのサーバの列や停止に出会いやすい。利用者は、いちばん遅いものを待つ。
      - slug: constant-work
        en: The usual cures for the tail, hedging and retrying, add work, and work that grows exactly when things go wrong is a slowdown of its own.
        ja: 裾への定番の手であるヘッジや再試行は、仕事を増やす。物事がうまくいかないときにちょうど増える仕事は、それ自体が遅さの原因になる。
      - slug: wirths-law
        en: Most fixes so far are one-offs. Speed won once does not stay won unless something defends it.
        ja: ここまでの手の多くは一回きりだ。一度勝ち取った速さも、守る仕組みがなければ残らない。
  - key: living-with-old-code
    en:
      title: Living with old code
      lede: Old code invites two opposite urges, to delete what looks useless and to rewrite the whole thing. This column reads from finding out why the code is there and who relies on it, to keeping it changeable, to replacing it without a big rewrite.
    ja:
      title: 古いコードとつきあう
      lede: 古いコードは、二つの逆向きの衝動を呼ぶ。無駄に見えるものを消したい衝動と、全部書き直したい衝動だ。このコラムは、そのコードがなぜあり、誰が頼っているかを知るところから、変えられる状態を保つ手、そして大きな書き直しをせずに置き換える手までを順に読む。
    laws:
      - slug: chestertons-fence
        en: It often starts with a piece that looks like it does nothing.
        ja: 多くの場合、何もしていないように見える部分から始まる。
      - slug: programming-as-theory-building
        en: Learning why it is there often means asking the people who built it, and they may be gone.
        ja: なぜそこにあるのかを知るには、作った人に聞くことになりやすい。その人たちは、もういないかもしれない。
      - slug: hyrums-law
        en: Even they could not list everything it is relied on for. That list is held by its users.
        ja: その人たちでも、何に頼られているかを全部は挙げられない。それを知っているのは使っている側だ。
      - slug: lehmans-laws
        en: Nobody gets to wait until the code is understood again, because code still in use keeps being changed.
        ja: コードが理解し直されるまで待ってはもらえない。使われているコードは変更され続けるからだ。
      - slug: technical-debt
        en: Some of that complexity was taken on knowingly, by shipping before the problem was fully understood, and that part can be recorded as a loan.
        ja: その複雑さの一部は、問題を理解しきる前に承知で出したコードだ。その分は借金として記録できる。
      - slug: boy-scout-rule
        en: Part of it can be paid back without waiting for a project of its own.
        ja: その一部は、専用のプロジェクトを待たずに返せる。
      - slug: second-system-effect
        en: When small repairs feel too slow, the other urge from the start takes over, and a rewrite tempts you to fix more than was broken.
        ja: 小さな手直しでは遅すぎると感じると、もう一方の衝動が勝つ。作り直すなら、壊れていない所まで直したくなる。
      - slug: galls-law
        en: "A rewrite also gives up something the old system already has: it works."
        ja: 作り直しは、古いシステムが持っているもの、つまり今動いているという事実も手放す。
      - slug: strangler-fig
        en: If a replacement has to grow from something that works, the old system can be that something.
        ja: 置き換えも動くものから育てるなら、その動くものは古いシステム自身でよい。
      - slug: beyonce-rule
        en: Each piece moved can break someone who relied on the old behaviour, and the people moving it see only what a test checks.
        ja: 部品を一つ移すたびに、古い挙動に頼っていた誰かが壊れうる。移す側に見えるのは、テストが確かめている挙動だけだ。
  - key: why-estimates-slip
    en:
      title: Why estimates slip
      lede: Estimates tend to slip one way, late, and the reasons are well known. This column reads from the estimate itself, to how work behaves once it starts and while it waits, to what a late project tempts a team to do, and then to planning that expects the slip.
    ja:
      title: 見積りがずれるわけ
      lede: 見積りは遅れる側にずれやすく、その理由はよく知られている。このコラムは、見積りそのものから、始めた仕事と待たされる仕事のふるまい、遅れたプロジェクトがチームを誘う手、そしてずれを前提にした計画までを順に読む。
    laws:
      - slug: hofstadters-law
        en: It starts with the estimate, which is made when the least is known.
        ja: 始まりは見積りだ。見積りは、分かっていることがいちばん少ないときに出される。
      - slug: ninety-ninety-rule
        en: The gap is hard to see early on, because early progress is easy to count.
        ja: ずれは序盤には見えにくい。序盤の進み具合は数えやすいからだ。
      - slug: parkinsons-law
        en: You might hope tasks that come in under would offset the ones that run over. Tasks that could finish early tend to expand to fill their time, so early finishes rarely offset the late ones.
        ja: 遅れた仕事の分を、早く終わった仕事が取り返してくれると期待したくなる。だが、早く終わりそうな仕事は時間いっぱいまで膨らみやすく、早めが遅れを取り返すことはまれだ。
      - slug: kingmans-formula
        en: "One delay sits outside every task's estimate: on a team whose every hour is booked, new work is likely to wait in line before it even starts."
        ja: どの作業の見積りにも入らない遅れもある。予定が埋まりきったチームでは、新しい仕事は始まる前から列で待たされやすい。
      - slug: brooks-law
        en: When the date is at risk, the obvious fix is more people.
        ja: 期日が危なくなると、まず思いつくのは人を増やすことだ。
      - slug: fixed-time-variable-scope
        en: Besides adding people, a late project can move the date or the scope. Moving the date is padding by another name, and padding tends to get used up. Moving scope is the one that can be planned in from the start.
        ja: 人を足す以外に、遅れたプロジェクトが動かせるのは期日かスコープだ。期日を動かすのは余裕を足すのと変わらず、余裕は使い切られやすい。スコープを動かす手なら、最初から計画に組み込める。
      - slug: cost-of-delay
        en: Moving scope means deciding what ships inside the box and what waits, and what waits keeps losing value.
        ja: スコープを動かすと、箱に入れるものと後に回すものを決めることになる。後に回したものは、待つ間も価値を失い続ける。

laws:
  - slug: type-1-vs-type-2-decisions
    tag: decision
    source_url: https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm
    see_also:
      - sunk-cost-fallacy
      - parkinsons-law
      - disagree-and-commit
      - narratives-not-slides
      - test-oracle-problem
      - last-responsible-moment
    en:
      title: Type 1 vs Type 2 Decisions
      concept: Teams spend the caution meant for irreversible decisions on ones they could easily undo.
      stance: Ask whether you can undo it before you ask how sure you are
      mechanism: |-
        Bezos's letter makes an argument about organizations. As a company grows it tends to run the heavyweight process built for irreversible (Type 1) decisions on most decisions, reversible (Type 2) ones included. The result, in the letter's words, is "slowness, unthoughtful risk aversion, failure to experiment sufficiently, and consequently diminished invention."
      counter:
        name: Hidden One-Way Doors
        note: |-
          many decisions look reversible and are not (a public API, a data format written to disk, a price announced to customers), and fast-tracking them ships a commitment you cannot take back
      guideline: |-
        Classify a decision before you schedule the debate. If you could undo it within a sprint at a cost you would accept, let one person or a small group decide it this week. Keep the full review for decisions that touch persisted data, public interfaces, security, or something already promised to customers.
      source: |-
        Jeff Bezos, *2015 Letter to Shareholders* (Amazon.com, Inc., filed April 2016) — the letter that introduced the "Type 1 / Type 2 decisions" framing. The 1997 letter is the "Day 1" letter and does not contain it.
    ja:
      title: タイプ 1／タイプ 2 の意思決定
      concept: やり直せる決定にまで、やり直せない決定と同じ慎重さを払ってしまう。
      stance: 確信の度合いより先に、やり直せるかを問う
      mechanism: |-
        Bezos の手紙は組織について論じている。会社は大きくなるにつれ、取り返しのつかない決定（タイプ1）向けの重い手順を、やり直せる決定（タイプ2）も含めたほとんどの決定に使うようになる。手紙によれば、その結果は「遅さ、考えなしのリスク回避、実験の不足、そしてその帰結としての発明の減少」だ。
      counter:
        name: 隠れた一方通行のドア
        note: |-
          やり直せるように見えて実はやり直せない決定は多い（公開 API、ディスクに書いたデータ形式、顧客に告知した価格）。こうした決定を速く通すと、取り消せない約束を世に出してしまう
      guideline: |-
        議論の予定を組む前に、その決定がどちらの種類かを見極める。1スプリント以内に、受け入れられるコストでやり直せるなら、一人か少人数が今週中に決める。完全なレビューは、永続化するデータ、公開インタフェース、セキュリティ、顧客にすでに約束したことに関わる決定に限る。
      source: |-
        Jeff Bezos『2015 年 株主への手紙』(Amazon.com, Inc., 2016 年 4 月提出)。"Type 1 / Type 2 decisions" という枠組みの出典。1997 年の手紙は「Day 1」の手紙で、この枠組みは含まれていない。

  - slug: normalization-of-deviance
    tag: safety
    source_url: https://www.press.uchicago.edu/ucp/books/book/chicago/C/bo22781921.html
    example_url: "https://govinfo.library.unt.edu/caib/news/report/pdf/vol1/chapters/chapter8.pdf"
    see_also:
      - swiss-cheese-model
      - normal-accident-theory
      - boy-scout-rule
      - normalcy-bias
      - broken-windows-theory
      - blameless-postmortem
      - error-budget
      - andon
    en:
      title: Normalization of Deviance
      concept: A broken rule that causes no immediate harm quietly becomes the new normal.
      stance: An exception that caused no harm is not proof that it is safe
      mechanism: |-
        Vaughan found no rule-breaking villains at NASA. Each time O-ring erosion appeared and the shuttle came back safely, engineers documented it, judged it acceptable, and widened what counted as acceptable for the next flight. Every step was reasoned and signed off. The deviation became the standard through the organization's normal process, which is why nobody felt they were taking a risk.
      counter:
        name: Error Budget
        note: |-
          not every deviation is a precursor; a team that investigates every one stops shipping and starts ignoring the investigations, so an agreed allowance keeps the real alarms visible
      guideline: |-
        When a check fails and you ship anyway, write down who decided, why, and when it will be reviewed. In postmortems, ask which past exceptions made this one look normal.
      example: |-
        The board that investigated the 2003 loss of Space Shuttle Columbia found that foam had been shed on many earlier flights, with left bipod ramp foam lost on 10 percent of the flights with visible evidence, and that NASA had come to treat it as normal. When a large piece of bipod foam struck the booster on STS-112 in October 2002, management did not classify it as an In-Flight Anomaly and downgraded it to an "action" item.
      source: |-
        Diane Vaughan, *The Challenger Launch Decision: Risky Technology, Culture, and Deviance at NASA* (University of Chicago Press, 1996; enlarged edition 2016, which is what this links to) — where the term is coined, from the Challenger O-ring decisions.
    ja:
      title: 逸脱の常態化
      concept: |-
        すぐに害が出なかったルール違反は、いつの間にか当たり前になる。
      stance: 何も起きなかった例外は、安全の証明ではない
      mechanism: |-
        Vaughan が NASA で見つけたのは、ルールを破る悪人ではなかった。O リングの侵食が見つかってもシャトルが無事に戻るたびに、技術者はそれを記録し、許容範囲内と判断し、次の飛行で許容する範囲を広げた。どの段階にも理由があり、承認も通っていた。逸脱は組織の通常の手続きを経て標準になったので、誰もリスクを取っているとは感じなかった。
      counter:
        name: エラーバジェット
        note: |-
          逸脱がすべて前兆とは限らない。一つ残らず調べるチームは出荷が止まり、やがて調査そのものを無視し始める。許容量を合意しておけば、本物の警報が埋もれない
      guideline: |-
        チェックが失敗したまま出荷するなら、誰がなぜ決めたか、いつ見直すかを書き残す。ポストモーテムでは、過去のどの例外のせいで今回が当たり前に見えたのかを問う。
      example: |-
        2003年のスペースシャトル・コロンビア喪失を調べた事故調査委員会は、断熱材の剥落がそれ以前の多くの飛行で起きており、目視で確認できた飛行の10%では左バイポッド部の断熱材が剥がれていたと指摘した。NASA はこれを普通のことと見なすようになっていた。2002年10月の STS-112 で大きな断熱材片が固体ロケットブースターに当たったときも、経営陣は飛行中異常に指定せず、格下げした「対応事項」として扱った。
      source: |-
        Diane Vaughan『The Challenger Launch Decision: Risky Technology, Culture, and Deviance at NASA』(University of Chicago Press, 1996、増補版 2016、本項のリンク先)。チャレンジャー号の O リングをめぐる判断の分析から生まれたこの用語の出典。

  - slug: chestertons-fence
    tag: systems
    source_url: https://www.chesterton.org/taking-a-fence-down/
    example_url: "https://research.swtch.com/openssl"
    see_also:
      - eaglesons-law
      - yagni
    en:
      title: Chesterton's Fence
      concept: "Code or rules whose origin you don't know look like clutter, which makes them tempting to delete."
      stance: Learn why it is there before you remove it, but set a deadline on the search
      mechanism: |-
        A rule or a branch of code records the answer to a problem, not the problem. The incident it prevents, the customer it was written for and the person who added it are rarely in the file, so the answer looks like noise. Removing it is cheap and instant; the cost arrives later, often to someone else, when the problem it answered comes back.
      counter:
        name: Time-Boxed Archaeology
        note: |-
          taken absolutely the rule removes nothing ever, because the reason is sometimes gone with the person who had it
      guideline: |-
        You are forbidden from removing a "fence" (code/rule) until you can explain why it was put there — but put a deadline on the search. When it expires, take the fence down behind a flag, with a rollback ready, and watch what complains.
      example: |-
        In 2006 a Debian maintainer removed a line from OpenSSL's random number generator because Valgrind flagged it for reading uninitialized memory, writing that he had "no idea what effect this really has on the RNG." That line was what added the caller's data to the entropy pool, leaving the process ID as the only unpredictable input. Until the flaw was announced in May 2008, ssh-keygen on Debian-based systems could produce only about 32,767 different keys of each type and size.
      source: |-
        G. K. Chesterton, *The Thing* (1929) — the original parable of the fence in the road.
    ja:
      title: チェスタトンの柵
      concept: 経緯を知らないコードやルールは無駄に見え、理由も知らずに消したくなる。
      stance: 理由を知ってから消す。ただし探すのは期限つきで
      mechanism: |-
        ルールやコードの分岐に残っているのは問題への答えで、問題そのものは残っていない。それが防いでいる障害も、誰のために書かれたかも、誰が足したかも、ファイルにはまず書かれていないので、答えは雑音に見える。消すのは安く、一瞬で済む。そのコストは、元の問題が戻ってきたときに、たいてい別の誰かに回ってくる。
      counter:
        name: |-
          期限付きの経緯調査
        note: |-
          この規則を絶対視すると何ひとつ消せなくなる。理由を知っていた人がいなくなり、理由ごと失われていることもあるからだ
      guideline: |-
        その「柵」（コードやルール）がなぜ立てられたのかを説明できるまで、取り除かない。ただし調べる期限は決めておく。期限が来たら、ロールバックを用意してフラグの裏で外し、どこから苦情が出るかを見る。
      example: |-
        2006年、Debian のメンテナが OpenSSL の乱数生成器から1行を削除した。Valgrind が未初期化メモリの読み取りとして警告していたからで、本人は「乱数生成器に実際どう影響するのか見当がつかない」と書いていた。その行こそが呼び出し側のデータをエントロピープールに加える処理で、削除後に予測不能な入力として残ったのはプロセス ID だけだった。2008年5月に欠陥が公表されるまで、Debian 系の ssh-keygen は鍵の種類と長さごとに約32,767通りの鍵しか作れなかった。
      source: |-
        G. K. Chesterton『The Thing』(1929)。道に立つ柵の寓話の出典。

  - slug: normalcy-bias
    tag: cognition
    source_url: https://en.wikipedia.org/wiki/Normalcy_bias
    see_also:
      - murphys-law
      - normalization-of-deviance
      - occams-razor
    en:
      title: Normalcy Bias
      concept: Faced with a real anomaly, people reach for the familiar, harmless explanation.
      stance: Ask what it would mean if it were real before you explain it away
      mechanism: |-
        Most anomalies really are the usual thing, so the usual explanation is right most of the time, and people learn to reach for it. In a real emergency that habit becomes delay: people look for confirmation, check with others, and finish what they were doing before acting. In an incident it sounds like "probably a transient network blip" while the database is corrupting.
      counter:
        name: Alarm Fatigue
        note: |-
          treating every anomaly as the start of a collapse burns out the on-call rotation, and an engineer who escalates everything is soon ignored; most anomalies really are the usual thing
      guideline: |-
        When an error occurs, ask: "If this were the start of a total system collapse, what would the next 10 minutes look like?" If that scares you, investigate now.
      source: |-
        No single originator; the term grew out of disaster-response research on why people delay evacuating. Amanda Ripley, *The Unthinkable: Who Survives When Disaster Strikes — and Why* (Crown, 2008) — the survey this entry relies on, including delay on 9/11 in the World Trade Center. Hirotada Hirose, *Hito wa naze nigeokureru no ka* (Why People Are Late to Evacuate; Shueisha Shinsho, 2004, in Japanese) covers the same pattern.
    ja:
      title: 正常性バイアス
      concept: 本物の異常を前にしても、人はいつもの無害な説明に飛びつく。
      stance: 打ち消す前に、本物だったら何が起きるかを考える
      mechanism: |-
        たいていの異常は本当にいつものことなので、いつもの説明はたいてい当たる。だから人はその説明に飛びつく癖がつく。本物の緊急事態では、この癖が対応を遅らせる。人は確証を探し、周りに確かめ、やりかけの作業を片付けてから動く。障害対応では、データベースの破損が進んでいる最中に「たぶん一時的なネットワークの瞬断だろう」という声が上がる。
      counter:
        name: アラーム疲れ
        note: |-
          異常のたびに崩壊の始まりとして扱えばオンコールが燃え尽き、何でもエスカレーションする人はやがて相手にされなくなる。たいていの異常は本当にいつものことだ
      guideline: |-
        異常が起きたら、「これがシステム全体の崩壊の始まりだとしたら、この先10分で何が起きるか」を考える。その答えが怖いなら、すぐに調査する。
      source: |-
        特定の提唱者はいない。避難が遅れる理由を調べた災害研究から生まれた言葉である。Amanda Ripley『The Unthinkable: Who Survives When Disaster Strikes — and Why』(Crown, 2008) が本項の拠り所で、世界貿易センターでの避難の遅れも扱う。広瀬弘忠『人はなぜ逃げおくれるのか ―災害の心理学』(集英社新書, 2004) も同じ現象を扱う。

  - slug: law-of-triviality
    tag: organization
    source_url: https://en.wikipedia.org/wiki/Law_of_triviality
    example_url: "https://phk.freebsd.dk/sagas/bikeshed/"
    see_also:
      - parkinsons-law
      - disagree-and-commit
      - code-health-standard
      - believability-weighted-decisions
    en:
      title: Law of Triviality
      concept: Discussion goes to the parts everyone understands, not the parts that matter.
      stance: Spend the discussion where the risk is, not where the opinions are
      mechanism: |-
        Parkinson's committee approves a reactor in minutes and spends forty-five on a bicycle shed, because everyone can picture a shed and only a few can judge a reactor. Commenting on what you understand feels like contributing, and the cost of the discussion is the same whatever its subject, so attention flows to the cheapest topic rather than the most important one.
      counter:
        name: Names Are Interfaces
        note: |-
          the small, easy-to-discuss things are sometimes the permanent ones; a public API name or a config key is cheap to argue about and expensive to change after release
      guideline: |-
        Move everything a tool can decide (format, import order, lint rules) out of human review. When a review thread is mostly style, stop it and ask one question about the riskiest part of the change. In meetings, put the most expensive or riskiest item first on the agenda.
      example: |-
        On October 2, 1999, FreeBSD developer Poul-Henning Kamp wrote to the project's mailing list after a long argument over whether sleep(1) should accept fractional seconds. He called that thread "the most blatant example of a bike shed discussion we have had ever in FreeBSD," noting that small, easy-to-grasp changes draw endless debate while complex ones pass with little comment.
      source: |-
        C. Northcote Parkinson, *Parkinson's Law and Other Studies in Administration* (Houghton Mifflin, 1957), in the chapter "High Finance, or the Point of Vanishing Interest" — the original bike-shed committee parable. Published in the UK as *Parkinson's Law: The Pursuit of Progress* (John Murray, 1958).
    ja:
      title: パーキンソンの凡俗法則
      concept: 議論は重要な部分ではなく、誰でも口を出せる簡単な部分に集中する。
      stance: 議論は、意見の多いところでなくリスクの大きいところに使う
      mechanism: |-
        Parkinson の委員会は原子炉の計画を数分で承認し、自転車置き場には45分かける。自転車置き場なら誰でも思い描けるが、原子炉を判断できる人は少ないからだ。分かることに口を出すと役に立った気になれるし、議論のコストは議題によらず変わらない。そのため注意は、最も重要な議題ではなく、最も口を出しやすい議題に流れる。
      counter:
        name: 名前はインタフェースである
        note: |-
          議論しやすい小さなことが、後から変えられないこともある。公開 API の名前や設定キーは、議論するのは安いが、リリース後に変えるのは高くつく
      guideline: |-
        ツールで決められること（整形、import の順序、lint ルール）は人のレビューから外す。レビューのやり取りがスタイルの話ばかりになったら打ち切り、変更のうち最もリスクの高い部分について一つ質問する。会議では、金額やリスクの最も大きい議題を最初に置く。
      example: |-
        1999年10月2日、FreeBSD 開発者の Poul-Henning Kamp は、sleep(1)に小数の秒数を渡せるようにするかで延々と続いた議論のあと、プロジェクトのメーリングリストに投稿した。彼はこのスレッドを「FreeBSD でこれまでにあった中で最もあからさまな自転車置き場の議論」と呼び、誰でもわかる小さな変更ほど議論が尽きず、複雑な変更はほとんど意見が出ないまま通ると書いた。
      source: |-
        C. Northcote Parkinson『Parkinson's Law and Other Studies in Administration』(Houghton Mifflin, 1957) 所収「High Finance, or the Point of Vanishing Interest」。自転車置き場の委員会の寓話の出典。英国版は『Parkinson's Law: The Pursuit of Progress』(John Murray, 1958)。

  - slug: galls-law
    tag: systems
    source_url: https://en.wikipedia.org/wiki/John_Gall_(author)
    example_url: "https://oig.justice.gov/sites/default/files/legacy/reports/FBI/a0614/final.pdf"
    see_also:
      - worse-is-better
      - yagni
      - second-system-effect
      - strangler-fig
    en:
      title: Gall's Law
      concept: "Complex systems that work usually grew from simple systems that worked; designed ones rarely do."
      stance: Distrust a design that has to work all at once to work at all
      mechanism: |-
        A design written from scratch has to anticipate every interaction between its parts, and in a complex system most interactions are only discovered by running it. A simple system that works has already had its interactions tested by use; each addition is then a small change to something known. A system designed whole has to discover all its interactions at once, after the investment has been made.
      counter:
        name: Some Systems Cannot Grow From a Toy
        note: |-
          a payments ledger, a safety interlock or a protocol with many independent implementers has to be right in its first version, and evolving it in production means running the incorrect versions on real money or real people
      guideline: |-
        Ship the smallest version that does one real job end to end, and grow it in steps that each keep it working. When a rewrite is proposed, ask which working system it will grow from.
      example: |-
        In March 2005 the FBI terminated the Virtual Case File, a three-year, $170 million effort to replace its paper-based case management in one system, after a pilot in a field office confirmed the project was not working. The Justice Department's Inspector General recorded that its replacement, Sentinel, would instead be built in four overlapping phases, each delivering distinct capabilities, starting with a web portal.
      source: |-
        John Gall, *General Systemantics: An Essay on How Systems Work, and Especially How They Fail* (General Systemantics Press, 1975); reissued as *Systemantics: How Systems Work and Especially How They Fail* (Quadrangle, 1977) — "A complex system that works is invariably found to have evolved from a simple system that worked."
    ja:
      title: ガルの法則
      concept: 動く複雑なシステムは、たいてい動く単純なシステムから育ったものだ。最初から設計したものが動くことはまれだ。
      stance: 一度に全部動かないと動かない設計を疑う
      mechanism: |-
        ゼロから書いた設計は、部品同士のあらゆる相互作用を前もって見込んでおく必要がある。だが複雑なシステムでは、相互作用のほとんどは動かしてみて初めて分かる。うまく動く単純なシステムは、使われるなかで相互作用がすでに試されており、そこに何かを足すのは分かっているものへの小さな変更で済む。丸ごと設計したシステムは、投資を済ませた後で、すべての相互作用を一度に見つけることになる。
      counter:
        name: おもちゃから育てられないシステムもある
        note: |-
          決済の元帳、安全インターロック、独立した実装が多いプロトコルは、最初の版から正しくなければならない。こうしたものを本番で育てると、誤った版を本物のお金や人に対して動かすことになる
      guideline: |-
        本物の仕事を端から端まで一つこなせる最小の版を出し、動く状態を保ったまま段階的に育てる。書き直しが提案されたら、どの動いているシステムから育てるのかを問う。
      example: |-
        2005年3月、FBI は Virtual Case File を打ち切った。紙中心の事件管理を一つのシステムで置き換えようとした3年がかり、1億7000万ドルの計画で、ある支局での試験運用でもうまくいかないことが確かめられていた。司法省監察総監の報告によれば、後継の Sentinel はそれぞれ別の機能を提供する4つの段階に分けて、まず Web ポータルから順に作る方針に変わった。
      source: |-
        John Gall『General Systemantics: An Essay on How Systems Work, and Especially How They Fail』(General Systemantics Press, 1975)。『Systemantics: How Systems Work and Especially How They Fail』(Quadrangle, 1977) として再刊。「うまく動く複雑なシステムは、例外なく、うまく動く単純なシステムから進化したものである」の出典。

  - slug: conways-law
    tag: organization
    source_url: https://www.melconway.com/Home/Committees_Paper.html
    example_url: "https://ideas.repec.org/p/hbs/wpaper/08-039.html"
    see_also:
      - dunbars-number
      - brooks-law
      - single-responsibility-principle
      - you-build-it-you-run-it
      - context-not-control
    en:
      title: Conway's Law
      concept: Systems end up shaped like the communication paths of the teams that build them.
      stance: To change the architecture, change the teams first
      mechanism: |-
        Every interface in a system has to be agreed by the people on either side of it. Where people talk every day, interfaces can be fine-grained and change often; where they rarely talk, interfaces become coarse, formal and slow to change. So the boundaries that are easy to build are the ones that match the communication paths, and the design converges on them whether anyone intends it or not.
      counter:
        name: Monolith First
        note: |-
          giving every team its own service imports the costs of a distributed system; sometimes one team should own one deployable unit whatever the org chart says
      guideline: |-
        If you want a modular architecture, create modular, independent teams first. Do not fight the org chart with code.
      example: |-
        In a 2008 Harvard Business School study, Alan MacCormack, John Rusnak and Carliss Baldwin compared pairs of software products that do the same job, one built by a tightly coupled commercial firm and one by a loosely coupled open source community. In every pair the open source product was significantly more modular, and a change to one component in the commercial product could spread to others up to eight times as much. The authors read this as evidence consistent with a product's architecture mirroring the organization that builds it.
      source: |-
        Melvin E. Conway, *How Do Committees Invent?* (Datamation, April 1968).
    ja:
      title: コンウェイの法則
      concept: システムの構造は、作るチーム同士の意思疎通の形に似てくる。
      stance: アーキテクチャを変えたいなら、先にチームを変える
      mechanism: |-
        システムのインタフェースは、どれもその両側にいる人たちの合意で決まる。毎日話す相手となら、インタフェースは細かくでき、頻繁に変えられる。めったに話さない相手となら、粗く、形式張った、変えにくいものになる。だから作りやすい境界は意思疎通の経路に沿った境界で、誰かが意図したかどうかに関係なく、設計はそこに落ち着く。
      counter:
        name: まずモノリス
        note: |-
          チームごとにサービスを持たせると、分散システムのコストまで抱え込む。組織図がどうであれ、一つのチームが一つのデプロイ単位を持つべき場合もある
      guideline: |-
        モジュール化されたアーキテクチャが欲しいなら、先にチームを独立したモジュールとして編成する。組織構造にコードで逆らわない。
      example: |-
        2008年、ハーバード・ビジネス・スクールの Alan MacCormack、John Rusnak、Carliss Baldwin は、同じ役割を果たすソフトウェアを対にして比べた。一方は結びつきの強い商用企業が、もう一方は結びつきの緩いオープンソースのコミュニティが作ったものだ。どの対でもオープンソース側のほうがはっきりモジュール化されており、ある部品への変更が他へ波及する度合いは商用側で最大8倍あった。著者らはこれを、製品の構造が作り手の組織構造を映すことと整合する証拠とした。
      source: |-
        Melvin E. Conway『How Do Committees Invent?』(Datamation, 1968 年 4 月号)。

  - slug: hyrums-law
    tag: systems
    source_url: https://www.hyrumslaw.com/
    example_url: "https://bugzilla.redhat.com/show_bug.cgi?id=638477"
    see_also:
      - postels-law
      - principle-of-least-astonishment
      - beyonce-rule
      - churn-rule
      - one-version-rule
    en:
      title: Hyrum's Law
      concept: With enough users, every observable behavior of a system, bugs included, is depended on.
      stance: Assume everything users can observe has been promised
      mechanism: |-
        A contract says what is promised; users see what happens. Response order, timing, error text, the exact rounding: each is observable, and with enough users someone builds on each one, usually without knowing it was never promised. The cost lands on the maintainer, who discovers the dependency only when a "safe" internal change breaks a customer.
      counter:
        name: Deliberate Variance
        note: |-
          if every observable behavior were sacred nothing could ever change, so vary what you never promised — randomized iteration order, planned outages — and the dependency never forms
      guideline: |-
        "Internal" doesn't exist once you have users. Version and feature-flag what you promise; deliberately vary what you do not, so nobody can build on it in the first place.
      example: |-
        In 2010 a Fedora 14 development build of glibc shipped a faster memcpy for some Intel CPUs that copied memory backward, and audio in Adobe's 64-bit Flash plugin turned to noise. Flash had been calling memcpy on overlapping buffers, which the C standard leaves undefined but the old forward copy had happened to handle. The bug thread split over whether glibc should keep the old behavior, with Linus Torvalds arguing memcpy should simply act like memmove.
      source: |-
        Hyrum Wright, *hyrumslaw.com*; canonicalized in *Software Engineering at Google* (Winters, Manshreck, Wright, 2020).
    ja:
      title: ハイラムの法則
      concept: 利用者が十分に多ければ、バグも含めた観測可能な挙動すべてに誰かが依存する。
      stance: 見えているものは、すべて約束したものとみなす
      mechanism: |-
        契約に書かれているのは約束したことで、利用者が見ているのは実際に起きていることだ。応答の順序、タイミング、エラーメッセージの文面、丸め方の細部は、どれも外から観測できる。利用者が十分に多ければ、そのどれかに依存する人が出てくる。たいていは、それが約束されていなかったことを知らないままだ。コストを負うのは保守する側で、「安全な」はずの内部変更で顧客側が動かなくなって初めて依存に気づく。
      counter:
        name: 意図的なゆらぎ
        note: |-
          観測できる挙動をすべて不可侵にすると、何も変えられなくなる。約束していない部分は、反復順序のランダム化や計画的な停止のように意図的に揺らしておく。そうすれば依存はそもそも生まれない
      guideline: |-
        利用者がいる以上、「内部実装」というものはない。約束した部分はバージョニングと機能フラグで守り、約束していない部分は意図的に揺らして、そもそも依存されないようにする。
      example: |-
        2010年、Fedora 14開発版の glibc に、一部の Intel CPU 向けに後ろからコピーする高速な memcpy が入ると、Adobe の64ビット版 Flash プラグインの音声がノイズになった。Flash は重なり合うバッファに memcpy を使っていた。C 標準では未定義の動作だが、以前の前からコピーする実装ではたまたま動いていた。バグ報告では、glibc が古い挙動を守るべきかで意見が割れ、Linus Torvalds は memcpy を memmove と同じように動かせばよいと主張した。
      source: |-
        Hyrum Wright『hyrumslaw.com』。『Software Engineering at Google』(Winters, Manshreck, Wright, 2020) で正式化された。

  - slug: brooks-law
    tag: organization
    source_url: https://en.wikipedia.org/wiki/Brooks%27s_law
    see_also:
      - conways-law
      - dunbars-number
      - second-system-effect
      - metcalfes-law
    en:
      title: Brooks' Law
      concept: Adding people to a late project tends to make it later, because ramp-up and coordination cost more than they add.
      stance: When a project is late, cut scope or move the date before adding people
      mechanism: |-
        Adding people to a late project increases communication overhead quadratically (n(n-1)/2 communication channels for n people). For a while, new people take more time from veterans than they contribute.
      counter:
        name: Partitionable Work
        note: |-
          Brooks introduced the law as "oversimplifying outrageously": people added early, to work that splits cleanly with little communication, do speed it up
      guideline: |-
        If a project is late, cut scope or move the date first. Add people only to work that splits cleanly and that they can start without a veteran's daily help, and do it early, not in the last month.
      source: |-
        Fred Brooks, *The Mythical Man-Month* (Addison-Wesley, 1975; anniversary edition 1995), ch. 2 — where the law is stated.
    ja:
      title: ブルックスの法則
      concept: 遅れたプロジェクトに人を足すと、立ち上がりと調整にかかる手間が、増えた人の働きを上回り、かえって遅れがちだ。
      stance: 遅れたら、人を足す前に範囲か期限を動かす
      mechanism: |-
        遅れているプロジェクトに人を足すと、意思疎通のコストは人数のほぼ二乗で増える（n人ならn(n-1)/2本の経路）。新しく入った人は、しばらくの間、自分がこなす仕事より多くの時間をベテランから奪う。
      counter:
        name: 分割できる仕事
        note: |-
          Brooks 自身、この法則を「とんでもなく単純化すれば」と断って述べている。早い段階で、ほとんど意思疎通なしにきれいに分けられる仕事に人を足せば、速くなる
      guideline: |-
        プロジェクトが遅れたら、まずスコープを削るか期限を動かす。人を足すのは、きれいに分けられて、ベテランの日々の手助けなしに始められる仕事に限る。それも最後の月ではなく、早いうちに足す。
      source: |-
        Fred Brooks『人月の神話 (The Mythical Man-Month)』(Addison-Wesley, 1975、20 周年記念版 1995) 第 2 章。この法則が述べられた箇所の出典。

  - slug: xy-problem
    tag: cognition
    source_url: https://xyproblem.info/
    see_also:
      - curse-of-knowledge
      - working-backwards
      - five-whys
      - wicked-problems
    en:
      title: XY Problem
      concept: People ask for help with their attempted fix instead of the problem they actually have.
      stance: Look past the question to what the asker is trying to do
      mechanism: |-
        Once someone has picked an approach, the approach becomes the problem in their head, and they ask about the step that failed rather than the goal. The helper sees only Y, so they answer Y, and both sides can spend an hour on a solution to a problem that a different X-level approach makes disappear.
      counter:
        name: Answer the Question Asked
        note: |-
          sometimes the asker has already weighed X and needs Y for reasons they do not owe you; interrogating every question is patronizing and slows down the people who knew what they were doing
      guideline: |-
        When someone asks "How do I do Y?", answer Y if it is cheap, then ask once what they are trying to achieve.
      source: |-
        Folklore from the Perl IRC and sysadmin communities; canonical write-up at *xyproblem.info*.
    ja:
      title: XY問題
      concept: |-
        人は本当の問題ではなく、自分が試している解決策について助けを求める。
      stance: 質問された手段より、その先の目的を見る
      mechanism: |-
        いったん手段を選ぶと、頭の中ではその手段が問題そのものになる。そのため目的ではなく、つまずいた一歩について質問する。助ける側には Y しか見えないので Y に答える。こうして、X の段階で別のやり方を選べば消えていた問題に、双方が1時間を費やすことになる。
      counter:
        name: 聞かれたことに答える
        note: |-
          質問者が X をすでに検討したうえで、こちらに説明する義理のない理由で Y を必要としていることもある。毎回問いただすのは相手を見下す態度で、分かっている人の足を引っ張る
      guideline: |-
        「Y はどうやるのか」と聞かれたら、手早く答えられるなら Y に答える。そのうえで、何を達成したいのかを一度だけ聞く。
      source: |-
        Perl IRC やシステム管理者コミュニティ発の口承。標準的な解説は『xyproblem.info』。

  - slug: postels-law
    tag: distributed-systems
    source_url: https://www.rfc-editor.org/rfc/rfc761
    example_url: "https://www.rfc-editor.org/rfc/rfc9413.html"
    see_also:
      - hyrums-law
      - fallacies-of-distributed-computing
    en:
      title: Postel's Law
      concept: "Systems that assume every peer follows the spec exactly tend to be brittle against the first one that doesn't."
      stance: Be exact in what you send, and explicit about what you tolerate
      mechanism: |-
        Specifications are incomplete and implementations are written by different people at different times. A receiver that rejects anything slightly off breaks against the first peer that read the spec differently; a sender that emits only the strict core gives receivers the least to disagree about. Postel's asymmetry helped early internet implementations interoperate before the specs had settled.
      counter:
        name: Maintaining Robust Protocols (RFC 9413)
        note: |-
          tolerating malformed input lets broken senders ship, every receiver then has to copy the tolerance, and the de facto protocol drifts from the spec; the IAB now asks protocol designers to keep maintaining their specifications so tolerance does not become permanent, and calls ignoring faulty input almost always the wrong fix
      guideline: |-
        Send exactly what the spec says. Accept small deviations at the edge only where they are documented and logged, and set a date to stop accepting them.
      example: |-
        RFC 9413 (2023), written by Martin Thomson and David Schinazi to examine the robustness principle, recounts that some widely deployed TLS servers dropped the connection when a ClientHello ended with an empty extension, even though TLS lets extensions appear in any order. Clients that followed the spec exactly broke against those servers, so they had to avoid that ordering to keep working.
      source: |-
        Jon Postel, *RFC 761* (DoD Standard TCP, January 1980) §2.10 — "be conservative in what you do, be liberal in what you accept from others". The same guidance appears in *RFC 760* (IP) §3.2 in different words, and verbatim again in *RFC 793* (1981).
    ja:
      title: ポステルの法則
      concept: 相手が仕様どおりに動く前提のシステムは、最初の逸脱にもろくなりがちだ。
      stance: 送るものは厳密に、受け入れる逸脱は明示して
      mechanism: |-
        仕様は不完全で、実装は別々の人が別々の時期に書く。少しでも外れた入力を拒む受信側は、仕様を違うふうに読んだ最初の相手に対して動かなくなる。仕様に厳密に沿った部分だけを送る送信側は、受信側が解釈で食い違う余地をいちばん小さくする。Postel のこの非対称な原則は、仕様が固まる前の初期インターネットで、実装同士の相互運用を助けた。
      counter:
        name: 堅牢なプロトコルの維持（RFC 9413）
        note: |-
          不正な入力を許すと、壊れた送信側がそのまま出荷される。受信側はみな同じ寛容さを真似るしかなくなり、事実上のプロトコルが仕様から離れていく。IAB は現在、寛容さが恒久化しないよう仕様を保守し続けることを設計者に求めており、不正な入力を無視するのはほぼ常に誤った対処だとしている
      guideline: |-
        送るものは仕様どおりにする。受け取る側の小さな逸脱は、文書化してログに残すときに限って境界で受け入れ、受け入れをやめる期日を決めておく。
      example: |-
        堅牢性原則を見直すために2023年に Martin Thomson と David Schinazi が書いた RFC 9413は、広く使われていた一部の TLS サーバーが、空の拡張で終わる ClientHello を受け取ると接続を切っていた例を挙げている。TLS では拡張をどの順序で並べてもよいことになっている。仕様どおりに動くクライアントはこうしたサーバーとつながらず、その並び順を避けて回避するしかなかった。
      source: |-
        Jon Postel『RFC 761』(DoD Standard TCP, 1980 年 1 月) §2.10。"be conservative in what you do, be liberal in what you accept from others" の出典。同じ趣旨は『RFC 760』(IP) §3.2 に別の言い回しで、『RFC 793』(1981) に同文で再掲される。

  - slug: hanlons-razor
    tag: organization
    source_url: https://en.wikipedia.org/wiki/Hanlon%27s_razor
    example_url: "https://blog.cloudflare.com/18-november-2025-outage/"
    see_also:
      - bystander-effect
      - occams-razor
      - blameless-postmortem
      - psychological-safety
    en:
      title: Hanlon's Razor
      concept: People read malice into delays and bugs that are better explained by fatigue or missing context.
      stance: Look for what was missing before you look for who meant it
      mechanism: |-
        Inside a team the people whose work affects you are mostly invisible: you see the broken build, not the pager that woke them at 4 AM or the requirement they were never told about. Intent fills the gap in the story, and malice is the most vivid intent available. Acting on it turns a fixable gap in context into a conflict between people.
      counter:
        name: Assume Breach
        note: |-
          some failures are malicious, and an attacker relies on looking like an honest mistake; the xz utils backdoor (2024) came from a helpful, patient contributor
      guideline: |-
        Before you attribute a failure to intent, find out what the person could see at the time, and fix what was missing. Raise intent only with evidence, and then privately.
      example: |-
        When Cloudflare's network began failing on November 18, 2025, the team at first suspected a hyper-scale DDoS attack, a suspicion strengthened when its separately hosted status page went down at the same time by coincidence. The real cause was a database permissions change that made a query return duplicate rows, doubling a Bot Management feature file past a size limit in the routing software. Cloudflare's postmortem states the outage was not caused by any attack or malicious activity.
      source: |-
        Robert J. Hanlon, contributed to *Murphy's Law Book Two* (Arthur Bloch, 1980).
    ja:
      title: ハンロンの剃刀
      concept: 疲労や文脈不足で説明がつく遅れやバグに、人は悪意を読み取ってしまう。
      stance: 悪意を疑う前に、相手に何が見えていなかったかを探す
      mechanism: |-
        チームの中では、自分の仕事に影響する人たちの事情はほとんど見えない。見えるのは壊れたビルドで、午前4時に彼らを起こした呼び出しや、彼らが知らされていなかった要件は見えない。見えない部分は意図で補われ、いちばん思い浮かびやすい意図が悪意だ。悪意を前提に動くと、直せたはずの文脈の欠落が、人と人との対立に変わる。
      counter:
        name: 侵害を前提にする
        note: |-
          悪意による失敗もあり、攻撃者は正直なミスに見えることを当てにしている。xz utils のバックドア（2024年）は、親切で辛抱強い貢献者が持ち込んだものだった
      guideline: |-
        失敗を意図のせいにする前に、その人がその時点で何を見られたかを確かめ、欠けていたものを補う。意図を問題にするのは証拠があるときだけにし、その場合も一対一で話す。
      example: |-
        2025年11月18日に Cloudflare のネットワークが障害を起こしたとき、チームは当初、超大規模な DDoS 攻撃を疑った。別の場所で運用していたステータスページが偶然同時に落ちたことで、その疑いは強まった。実際の原因はデータベースの権限変更で、クエリが重複行を返すようになり、Bot Management の特徴量ファイルが倍の大きさになってルーティングソフトウェアのサイズ上限を超えた。Cloudflare の事後報告は、攻撃や悪意ある行為によるものではなかったと明記している。
      source: |-
        Robert J. Hanlon が『Murphy's Law Book Two』(Arthur Bloch 編, 1980) に寄稿した格言。

  - slug: hofstadters-law
    tag: estimation
    source_url: https://en.wikipedia.org/wiki/Hofstadter%27s_law
    example_url: "https://www.gao.gov/assets/gao-18-273.pdf"
    see_also:
      - ninety-ninety-rule
      - parkinsons-law
      - fixed-time-variable-scope
    en:
      title: Hofstadter's Law
      concept: Work takes longer than estimated, even when the estimate already allows for that.
      stance: Trust what past work actually took over how this work looks today
      mechanism: |-
        "It always takes longer than you expect, even when you take into account Hofstadter's Law." Estimates are built from the steps you can picture, and the steps you cannot picture (integration surprises, rework, waiting on other people) are exactly the ones missing. Adjusting for that from the inside fails for the same reason: you can only adjust for the surprises you can already imagine.
      counter:
        name: Parkinson's Law
        note: |-
          padding an estimate does not bank the slack; the work expands into it, so a generous estimate can be as late as a tight one
      guideline: |-
        Estimate from what similar past work actually took, not from how this work looks today. Write down, at the start, which scope you will cut when the date is at risk, and re-estimate when a milestone lands rather than only at the end.
      example: |-
        When NASA re-planned the James Webb Space Telescope in 2011, it set an October 2018 launch and built in 13 months of funded schedule reserve, later raised to 14. By early 2018 the GAO reported that the project had used all of that reserve on technical problems such as an anomaly in vibration testing, had moved launch to a window at least five months later, and was likely to slip further.
      source: |-
        Douglas Hofstadter, *Gödel, Escher, Bach: an Eternal Golden Braid* (Basic Books, 1979) — where the law is stated.
    ja:
      title: ホフスタッターの法則
      concept: |-
        作業は見積りより長くかかる。それを織り込んで見積もっても、やはり長くかかる。
      stance: 見積りは、いまの見た目より過去の実績を信じる
      mechanism: |-
        「ホフスタッターの法則を考慮に入れても、いつも予想より長くかかる」。見積りは思い描ける手順から組み立てるので、思い描けない手順（統合時の想定外、手戻り、他人待ち）がそっくり抜け落ちる。見積もる本人がそれを補正しようとしても、同じ理由でうまくいかない。補正できるのは、すでに想像できる想定外だけだからだ。
      counter:
        name: パーキンソンの法則
        note: |-
          見積りに余裕を足しても、その余裕は貯金されない。仕事のほうが膨らんで埋めるので、余裕のある見積りもきつい見積りと同じくらい遅れる
      guideline: |-
        見積りは、今どう見えるかではなく、似た過去の作業に実際にかかった時間から出す。期限が危うくなったときに削るスコープは最初に書いておく。終盤だけでなく、マイルストーンを終えるたびに見積り直す。
      example: |-
        2011年に NASA がジェイムズ・ウェッブ宇宙望遠鏡の計画を立て直したとき、打ち上げを2018年10月とし、予算の裏づけのある13か月のスケジュール予備を組み込んだ。予備はのちに14か月に増えた。それでも2018年初めの GAO 報告によれば、振動試験での異常などの技術的問題で予備を使い切り、打ち上げは少なくとも5か月遅い時期にずれ込み、さらに遅れる見込みだった。
      source: |-
        Douglas Hofstadter『ゲーデル、エッシャー、バッハ — あるいは不思議の環 (Gödel, Escher, Bach)』(Basic Books, 1979)。この法則が述べられた箇所の出典。

  - slug: goodharts-law
    tag: incentives
    source_url: https://en.wikipedia.org/wiki/Goodhart%27s_law
    example_url: "https://www.consumerfinance.gov/about-us/newsroom/consumer-financial-protection-bureau-fines-wells-fargo-100-million-widespread-illegal-practice-secretly-opening-unauthorized-accounts/"
    see_also:
      - cobra-effect
      - shirky-principle
      - error-budget
      - mechanisms-not-good-intentions
      - genchi-genbutsu
      - mcnamara-fallacy
      - twymans-law
    en:
      title: Goodhart's Law
      concept: A number stops measuring well once people are rewarded for moving it.
      stance: Watch the outcome, not the number that stands for it
      mechanism: |-
        In Marilyn Strathern's phrasing, "when a measure becomes a target, it ceases to be a good measure." A number is useful because it moves with the thing you care about; once people are rewarded for the number, they find cheaper ways to move it that leave the thing alone. Reward "number of commits" and people make tiny, useless commits.
      counter:
        name: Balanced Scorecards
        note: |-
          you still have to steer by numbers; several measures that are hard to game together, read alongside the work itself, keep the signal longer than refusing to measure
      guideline: |-
        Never use a single metric to judge performance. Observe the system's output, not its proxies.
      example: |-
        In September 2016 the US Consumer Financial Protection Bureau fined Wells Fargo $100 million after the bank's own analysis found employees had opened more than two million deposit and credit card accounts customers may not have authorized. The CFPB said the conduct was "spurred by sales targets and compensation incentives," and that employees were paid for meeting sales goals.
      source: |-
        Charles Goodhart, *Problems of Monetary Management: The U.K. Experience* (Papers in Monetary Economics, Reserve Bank of Australia, 1975) — the original law; Marilyn Strathern, *'Improving ratings': audit in the British University system* (European Review, 1997) — the "when a measure becomes a target" wording usually quoted.
    ja:
      title: グッドハートの法則
      concept: 数字を動かすことに報酬がつくと、その数字は実態を測らなくなる。
      stance: 数字ではなく、数字が表しているはずの結果を見る
      mechanism: |-
        Marilyn Strathern の言い方では「ある指標が目標になると、それは良い指標ではなくなる」。数字が役に立つのは、気にしている実態と一緒に動くからだ。数字に報酬がつくと、人は実態を変えずに数字だけを動かす安上がりな方法を見つける。「コミット数」で評価すれば、意味のない小さなコミットが量産される。
      counter:
        name: バランスト・スコアカード
        note: |-
          それでも数字なしでは舵を取れない。まとめて操作するのが難しい複数の指標を、仕事そのものと並べて読めば、測るのをやめるよりも長く信号を保てる
      guideline: |-
        単一の指標で成果を評価しない。代わりの指標ではなく、システムが実際に出しているものを見る。
      example: |-
        2016年9月、米消費者金融保護局(CFPB)は Wells Fargo に1億ドルの制裁金を科した。銀行自身の分析で、顧客が承認していない可能性のある預金口座とクレジットカード口座が200万件以上、従業員によって開設されていたことがわかったからだ。CFPB はこの行為が販売目標と報酬のインセンティブに後押しされたもので、従業員は販売目標を達成すると報酬を得ていたとした。
      source: |-
        Charles Goodhart『Problems of Monetary Management: The U.K. Experience』(Papers in Monetary Economics, Reserve Bank of Australia, 1975)。元の法則の出典。よく引用される「指標が目標になると」の言い回しは Marilyn Strathern『'Improving ratings': audit in the British University system』(European Review, 1997) による。

  - slug: lindy-effect
    tag: systems
    source_url: https://en.wikipedia.org/wiki/Lindy_effect
    see_also:
      - worse-is-better
      - amaras-law
      - choose-boring-technology
    en:
      title: Lindy Effect
      concept: For ideas and software, the longer something has survived, the longer it is likely to last.
      stance: For things that must last, bet on what has already lasted
      mechanism: |-
        For things that do not wear out, every year of survival is evidence of having passed tests that killed the alternatives: changes in hardware, fashion, maintainers and scale. Software that has lasted twenty years has had its bugs found, its edge cases documented and its operators trained. A new tool has not been tested yet, so its expected remaining life is short, however good it looks.
      counter:
        name: The Substrate Changes
        note: |-
          age measures survival under past conditions; when the hardware, scale or threat model shifts, the long-lived choice can be the one that was optimized for a world that no longer exists
      guideline: |-
        If you need a stable system for 10 years, choose a technology that has already been around for 10 years (e.g., PostgreSQL over a new NoSQL).
      source: |-
        Coined by Albert Goldman (*New Republic*, 1964); formalized by Benoit Mandelbrot and popularized by Nassim Taleb, *Antifragile* (2012).
    ja:
      title: リンディ効果
      concept: アイデアやソフトウェアは、長く生き残ったものほどこの先も長く残る可能性が高い。
      stance: 長く使うものは、すでに長く生き残ったものから選ぶ
      mechanism: |-
        摩耗しないものにとって、生き延びた1年1年は、ほかの選択肢を消してきた試練をくぐり抜けた証拠になる。試練とは、ハードウェアの変化、流行、保守者の交代、規模の変化だ。20年続いたソフトウェアは、バグが見つかり、エッジケースが文書化され、運用者も育っている。新しい道具はまだ試されていないので、どれほど良く見えても、この先残る見込みは短い。
      counter:
        name: 土台は変わる
        note: |-
          年数が示すのは、過去の条件で生き延びたことだ。ハードウェアや規模、脅威モデルが変われば、長く使われてきた選択肢こそが、もうない世界に合わせて最適化されていることもある
      guideline: |-
        10年安定して動くシステムが必要なら、すでに10年使われてきた技術を選ぶ（例: 新しい NoSQL より PostgreSQL）。
      source: |-
        Albert Goldman が命名 (New Republic, 1964)。Benoit Mandelbrot が形式化し、Nassim Taleb『Antifragile』(2012) で広まった。

  - slug: sunk-cost-fallacy
    tag: decision
    source_url: https://doi.org/10.1016/0749-5978(85)90049-4
    see_also:
      - type-1-vs-type-2-decisions
      - fixed-time-variable-scope
    en:
      title: Sunk Cost Fallacy
      concept: Teams keep funding a failing project because of what they have already spent on it.
      stance: Decide on what lies ahead, not on what is already spent
      mechanism: |-
        Stopping a project turns money already spent from "investment" into "loss", and someone has to own that loss in public. Continuing defers the admission and keeps alive the chance of being proved right. Arkes and Blumer found the effect even in people paying for their own theater tickets: those who paid full price attended more often than those who got a discount.
      counter:
        name: The J-Curve
        note: |-
          many worthwhile projects look worst in the middle, and a team that kills everything at the first trough never finishes anything; past investment says nothing, but the remaining cost to finish may be small
      guideline: |-
        Ask: "If we started today with zero investment, would we choose this path?" If no, kill it.
      source: |-
        Hal R. Arkes & Catherine Blumer, *The Psychology of Sunk Cost* (Organizational Behavior and Human Decision Processes, 1985).
    ja:
      title: サンクコストの誤謬
      concept: すでに注ぎ込んだ分が惜しくて、失敗しているプロジェクトに投資し続ける。
      stance: 使ったコストではなく、この先の見込みで決める
      mechanism: |-
        プロジェクトを止めると、使ったお金は「投資」から「損失」に変わり、誰かがその損失を公に認めなければならない。続ければ認めるのを先送りでき、自分が正しかったと証明される望みも残る。Arkes と Blumer は、自分のお金で劇場のチケットを買う人にもこの効果を見つけた。定価で買った人は、割引で買った人よりも多く劇場に足を運んだ。
      counter:
        name: J カーブ
        note: |-
          価値あるプロジェクトの多くは、途中でいちばん悪く見える。最初の谷で何でも打ち切るチームは、何も完成させられない。過去の投資は判断材料にならないが、完成までに残るコストは小さいかもしれない
      guideline: |-
        「今日、何も投資していない状態から始めるとしたら、この道を選ぶか」と問う。選ばないなら、やめる。
      source: |-
        Hal R. Arkes & Catherine Blumer『The Psychology of Sunk Cost』(Organizational Behavior and Human Decision Processes, 1985)。

  - slug: cargo-cult-engineering
    tag: cognition
    source_url: https://calteches.library.caltech.edu/51/2/CargoCult.htm
    see_also:
      - survivorship-bias
      - the-bitter-lesson
    en:
      title: Cargo Cult Engineering
      concept: "Teams copy another company's practices without the conditions that made them work."
      stance: Copy a practice only if you have the problem it solved
      mechanism: |-
        A practice is visible; the conditions that made it work are not. Another company's process, tool or team model gets published as a description of what they do, without the scale, people and problems that made it pay off, so copying it reproduces the form and not the conditions. Feynman's islanders built a runway, a hut for a controller and wooden headphones, and the planes did not land.
      counter:
        name: Proven Practice
        note: |-
          deriving everything from first principles throws away other people's hard-won lessons; copying a practice that is widely known to work is usually cheaper than reinventing it
      guideline: |-
        Do not adopt a tool/process because Google uses it. Adopt it because you have the exact problem Google had at that scale.
      source: |-
        Richard P. Feynman, *Cargo Cult Science* (Caltech commencement address, 1974).
    ja:
      title: カーゴ・カルト・エンジニアリング
      concept: うまくいった理由を理解しないまま、他社のやり方の形だけを真似る。
      stance: その手法が解いた問題を抱えているときだけ真似る
      mechanism: |-
        やり方は目に見えるが、それをうまくいかせた条件は見えない。他社のプロセスや道具、チームの組み方は「何をしているか」の説明として公開され、元が取れた理由である規模や人、抱えていた問題は書かれない。だから真似しても再現されるのは形だけで、条件は再現されない。Feynman が描いた島の人々は、滑走路と管制官の小屋と木製のヘッドフォンを作ったが、飛行機は降りてこなかった。
      counter:
        name: 実績あるやり方
        note: |-
          すべてを第一原理から導くと、他人が苦労して得た教訓を捨てることになる。うまくいくと広く知られたやり方を真似るほうが、作り直すよりたいてい安い
      guideline: |-
        Google が使っているという理由で道具やプロセスを導入しない。導入するのは、Google があの規模で抱えていたのと同じ問題を自分たちが抱えているときに限る。
      source: |-
        Richard P. Feynman『Cargo Cult Science』(Caltech 卒業式講演, 1974)。

  - slug: amdahls-law
    tag: performance
    source_url: https://doi.org/10.1145/1465482.1465560
    see_also:
      - gustafsons-law
      - premature-optimization
      - theory-of-constraints
    en:
      title: Amdahl's Law
      concept: Speeding up one part of a system barely helps when the bottleneck is somewhere else.
      stance: Find the bottleneck before you speed anything up
      mechanism: |-
        If a fraction s of the work cannot be parallelized or sped up, the whole job can never run faster than 1/s, however much the rest improves. With 5% serial work, even infinite processors give at most a 20× speedup. Effort spent on the parallel part has diminishing returns, and the serial part sets the ceiling.
      counter:
        name: Gustafson's Law
        note: |-
          when the problem grows with the machine, the serial fraction shrinks and speedup keeps climbing
      guideline: |-
        Profile first; time usually concentrates in a small part of the code, often around 1% of it taking 90% of the time. Optimize that part only, and ignore the rest.
      source: |-
        Gene Amdahl, *Validity of the Single Processor Approach to Achieving Large Scale Computing Capabilities* (AFIPS, 1967).
    ja:
      title: アムダールの法則
      concept: ボトルネックが別の場所にあれば、一部を速くしても全体はほとんど速くならない。
      stance: 何かを速くする前に、ボトルネックを見つける
      mechanism: |-
        仕事のうち割合 s が並列化も高速化もできないなら、残りをどれだけ改善しても、全体は1/s倍より速くならない。逐次部分が5%なら、プロセッサを無限に足しても速くなるのは最大20倍だ。並列化できる部分に労力をかけても効果は次第に小さくなり、上限は逐次部分で決まる。
      counter:
        name: グスタフソンの法則
        note: |-
          問題の規模が計算機とともに大きくなるなら、逐次部分の割合は縮み、速度向上は伸び続ける
      guideline: |-
        まずプロファイルを取る。時間はたいていコードのごく一部に集中していて、1%のコードが90%の時間を占めることも多い。最適化するのはその部分だけにして、残りは気にしなくてよい。
      source: |-
        Gene Amdahl『Validity of the Single Processor Approach to Achieving Large Scale Computing Capabilities』(AFIPS, 1967)。

  - slug: leaky-abstractions
    tag: systems
    source_url: https://www.joelonsoftware.com/2002/11/11/the-law-of-leaky-abstractions/
    example_url: "https://blog.cloudflare.com/how-and-why-the-leap-second-affected-cloudflare-dns/"
    see_also:
      - teslers-law
      - law-of-demeter
    en:
      title: Law of Leaky Abstractions
      concept: Every non-trivial abstraction eventually exposes the details it was meant to hide.
      stance: Use the abstraction, but keep someone who knows what is under it
      mechanism: |-
        An abstraction hides details by assuming they behave well, and they behave well only most of the time. TCP hides packet loss until the cable is cut; SQL hides access paths until a missing index turns a query from milliseconds into minutes. When the assumption breaks, the problem shows up in terms of the hidden layer, and only someone who understands that layer can read it.
      counter:
        name: Information Hiding
        note: |-
          most users of an abstraction never hit the leak, and the point of a layer is that most people do not have to learn what is underneath (Parnas, 1972)
      guideline: |-
        Use abstractions to move fast, but ensure at least one person on the team understands the layer beneath it.
      example: |-
        At midnight UTC on January 1, 2017, a leap second stepped the clock back, and Cloudflare's RRDNS DNS software computed a negative response time by subtracting a start time from Go's time.Now(), which at the time was not monotonic. The negative value eventually reached rand.Int63n(), which panicked, and some DNS lookups for customers using CNAME records failed, peaking at about 0.2% of queries.
      source: |-
        Joel Spolsky, *The Law of Leaky Abstractions* (Joel on Software, 2002).
    ja:
      title: リーキー・アブストラクション
      concept: 込み入った抽象化はいずれ、隠したはずの下の層の詳細を露出させる。
      stance: 抽象化には乗る。ただし下の層を知る人を残す
      mechanism: |-
        抽象化は、下の層がおとなしく動くと仮定して詳細を隠す。だが下の層がおとなしいのは、たいていの場合に限られる。TCP はケーブルが切れるまでパケットの喪失を隠し、SQL はインデックスがなくてクエリが数ミリ秒から数分になるまでアクセス経路を隠す。仮定が崩れると、問題は隠していた層の言葉で現れ、それを読めるのはその層を理解している人だけだ。
      counter:
        name: 情報隠蔽
        note: |-
          抽象化の利用者のほとんどは漏れに出くわさない。下に何があるかを大半の人が学ばずに済むことが、層を設ける意味だ（Parnas, 1972）
      guideline: |-
        抽象化を使って速く進める。ただし、その下の層を理解している人をチームに少なくとも一人置く。
      example: |-
        2017年1月1日0時(UTC)、うるう秒で時計が巻き戻り、Cloudflare の DNS ソフトウェア RRDNS が負の応答時間を計算した。開始時刻を Go の time.Now()から引いて測っていたが、当時の time.Now()は単調増加を保証していなかった。負の値はやがて rand.Int63n()に渡ってパニックを起こし、CNAME レコードを使う顧客の一部で DNS 解決が失敗した。ピーク時には問い合わせの約0.2%が失敗した。
      source: |-
        Joel Spolsky『The Law of Leaky Abstractions』(Joel on Software, 2002)。

  - slug: pareto-principle
    tag: decision
    source_url: https://en.wikipedia.org/wiki/Pareto_principle
    example_url: "https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/sosp153-glerum-web.pdf"
    see_also:
      - premature-optimization
      - cost-of-delay
    en:
      title: Pareto Principle
      concept: Most of the effect comes from a small share of the causes, such as bugs in a few modules.
      stance: Find the few causes that matter and start there
      mechanism: |-
        Causes are rarely spread evenly. Pareto noticed it in Italian land ownership; Juran generalized it to quality as "the vital few and the trivial many". In software, defects, load and support tickets tend to cluster in a few modules, endpoints and customers. The ratio is rarely exactly 80/20, but the skew is usually large enough that ranking beats spreading effort evenly.
      counter:
        name: The Long Tail
        note: |-
          the many small causes can add up to more than the few big ones; in availability and security, the rare path you deprioritized is where the outage or breach comes from
      guideline: |-
        Before a quality push, rank modules by defects or incidents over the last quarter and start at the top. Re-rank every quarter; the vital few move.
      example: |-
        Microsoft's 2009 SOSP paper on Windows Error Reporting, drawn from crash reports across about a billion machines, states that error reports "follow a Pareto distribution with a small number of bugs accounting for most error reports." The top 500 buckets accounted for 65% of all error reports for Windows Vista, and when ranked by volume, the first quarter of reports came from well under 1% of buckets.
      source: |-
        Vilfredo Pareto, *Cours d'Économie Politique* (1896); applied to quality engineering by Joseph M. Juran (*Quality Control Handbook*, 1951).
    ja:
      title: パレートの法則
      concept: |-
        結果の大半は少数の原因から生まれる。たとえば、バグは一部のモジュールに集中する。
      stance: 効いている少数の原因を見つけて、そこから手をつける
      mechanism: |-
        原因が均等に散らばることはめったにない。Pareto はイタリアの土地所有でこれに気づき、Juran は品質管理に一般化して「重要な少数と些細な多数」と呼んだ。ソフトウェアでも、欠陥や負荷、問い合わせは一部のモジュール、エンドポイント、顧客に集中しやすい。比率がちょうど80対20になることはまれだが、偏りはたいてい大きいので、均等に手をかけるより順位を付けて取り組むほうが効果が大きい。
      counter:
        name: ロングテール
        note: |-
          小さな原因も数が多ければ、少数の大きな原因を合計で上回ることがある。可用性やセキュリティでは、後回しにしたまれな経路から障害や侵害が起きる
      guideline: |-
        品質改善を始める前に、直近の四半期の欠陥やインシデントの件数でモジュールを並べ、上から手を付ける。重要な少数は入れ替わるので、順位は四半期ごとに付け直す。
      example: |-
        約10億台のマシンから集まるクラッシュ報告をもとにした Microsoft の2009年の SOSP 論文は、Windows Error Reporting のエラー報告が「パレート分布に従い、少数のバグが報告の大半を占める」と述べている。Windows Vista では上位500のバケットが全エラー報告の65%を占め、件数順に並べると報告の最初の4分の1は全バケットの1%にはるかに満たない数から来ていた。
      source: |-
        Vilfredo Pareto『Cours d'Économie Politique』(1896)。品質工学への応用は Joseph M. Juran『Quality Control Handbook』(1951)。

  - slug: survivorship-bias
    tag: cognition
    source_url: https://en.wikipedia.org/wiki/Survivorship_bias
    see_also:
      - cargo-cult-engineering
      - amaras-law
      - most-ideas-fail
      - mcnamara-fallacy
      - twymans-law
    en:
      title: Survivorship Bias
      concept: Conclusions drawn only from successes ignore the failures that used the same strategy.
      stance: Count the failures before you copy the success
      mechanism: |-
        Success stories are easy to find because the successes are still around to tell them; the projects that used the same strategy and failed left no blog post, no conference talk and no case study. Any sample built from what survived is skewed toward whatever survival looks like. Wald's bombers are the classic case: the planes that came back showed where a plane could be hit and still return, so the armor belonged where the returning planes had no holes.
      counter:
        name: Learning From Success (Safety-II)
        note: |-
          studying only failures misses why things usually go right; most of the time the same messy practices succeed, and that is evidence too
      guideline: |-
        Before adopting a strategy because "Company X succeeded with it," research how many companies failed using the same approach. The dead don't write blog posts.
      source: |-
        Abraham Wald, *A Method of Estimating Plane Vulnerability Based on Damage of Survivors* (Statistical Research Group, Columbia University, 1943; reprinted by the Center for Naval Analyses, 1980) — the WWII bomber-armor analysis.
    ja:
      title: 生存者バイアス
      concept: 成功例だけから結論を出すと、同じやり方で失敗した例が見えなくなる。
      stance: 成功例を真似る前に、同じことをして消えた例を数える
      mechanism: |-
        成功談が見つけやすいのは、成功した側が今も残っていて語れるからだ。同じやり方で失敗したプロジェクトは、ブログ記事も講演も事例研究も残さない。生き残ったものだけで作った標本は、生き残ったものの特徴に偏る。典型例は Wald の爆撃機だ。帰還した機体が示していたのは、被弾しても戻れる場所だった。だから装甲が要るのは、帰還機に穴がなかった場所だった。
      counter:
        name: 成功から学ぶ（Safety-II）
        note: |-
          失敗だけを調べると、なぜ普段はうまくいくのかを見落とす。たいていは同じ雑なやり方で成功しており、それも証拠になる
      guideline: |-
        「X社がこの方法で成功した」を根拠に採用する前に、同じ方法で失敗した企業がどれだけあるかを調べる。死者はブログ記事を書かない。
      source: |-
        Abraham Wald『A Method of Estimating Plane Vulnerability Based on Damage of Survivors』(Statistical Research Group, Columbia University, 1943、Center for Naval Analyses が 1980 年に再刊)。第二次大戦時の爆撃機の装甲分析の出典。

  - slug: kernighans-law
    tag: maintainability
    source_url: https://en.wikipedia.org/wiki/The_Elements_of_Programming_Style
    see_also:
      - eaglesons-law
      - kiss-principle
      - brandolinis-law
    en:
      title: Kernighan's Law
      concept: Debugging is harder than writing, so code written at your cleverest is beyond your debugging.
      stance: Write code a tired stranger could debug
      mechanism: |-
        Kernighan and Plauger's words are: "Everyone knows that debugging is twice as hard as writing a program in the first place. So if you're as clever as you can be when you write it, how will you ever debug it?" When you write code you hold the whole design in your head. Debugging starts from a symptom, often months later and often by someone else, and has to rebuild that context from the code alone. Every trick that made the code shorter to write makes the rebuilding longer.
      counter:
        name: Leverage of Abstraction
        note: |-
          the clever version is sometimes the short, correct one; a well-chosen data structure or library can remove whole classes of bugs that the "simple" hand-written loop keeps
      guideline: |-
        In review, ask whether the next on-call engineer could explain the code without the author. If a trick is worth keeping, name it, link to where it is explained and add a test that pins its behavior.
      source: |-
        Brian W. Kernighan & P. J. Plauger, *The Elements of Programming Style*, 2nd ed. (McGraw-Hill, 1978), ch. 2 — the original wording; the "by definition, not smart enough" version is a later paraphrase.
    ja:
      title: カーニハンの法則
      concept: |-
        デバッグは書くより難しい。だから、最大限に凝って書いたコードは自分でもデバッグできない。
      stance: 疲れた他人でもデバッグできるコードを書く
      mechanism: |-
        Kernighan と Plauger の原文はこうだ。「デバッグがそもそもプログラムを書くことの2倍難しいのは誰でも知っている。だから、書くときに精一杯賢く書いたら、いったいどうやってデバッグするのか」。書くときは設計全体が頭に入っている。デバッグは症状から始まり、たいていは数か月後で、別の人が担当することも多い。その人はコードだけを手がかりに文脈を組み立て直さなければならない。書く手間を減らす技巧は、どれもこの組み立て直しを長引かせる。
      counter:
        name: |-
          抽象化の力
        note: |-
          凝った版のほうが、短くて正しいこともある。うまく選んだデータ構造やライブラリは、「単純な」手書きのループに残り続ける種類のバグを丸ごとなくせる
      guideline: |-
        レビューでは、次のオンコール担当が作者に聞かずにそのコードを説明できるかを確かめる。残す価値のある技巧なら、名前を付け、解説へのリンクを置き、振る舞いを固定するテストを足す。
      source: |-
        Brian W. Kernighan & P. J. Plauger『The Elements of Programming Style』第 2 版 (McGraw-Hill, 1978) 第 2 章。原文の出典。「定義上、デバッグするだけの賢さが足りない」という形は後世の言い換えである。

  - slug: cobra-effect
    tag: incentives
    source_url: https://en.wikipedia.org/wiki/Perverse_incentive
    example_url: "https://ideas.repec.org/a/taf/tcpoxx/v11y2011i2p851-864.html"
    see_also:
      - goodharts-law
      - jevons-paradox
    en:
      title: Cobra Effect
      concept: An incentive meant to reduce a problem rewards people for producing more of it.
      stance: Ask how each incentive could be earned without fixing anything
      mechanism: |-
        A bounty pays for evidence of the problem, not for the problem going away, and evidence is usually cheaper to produce than the outcome. Siebert named the effect after an undocumented anecdote from colonial Delhi, a cobra bounty that led to cobra farming. The documented case is Hanoi in 1902, where a French bounty on rat tails led people to cut off tails and release the rats to breed, and rats were farmed outside the city. When such a bounty ends, the stock it created is released and the problem is bigger than before.
      counter:
        name: Incentives Mostly Work
        note: |-
          most bounties and targets do move behavior the intended way; refusing to reward the outcome because it could be gamed leaves the problem unpaid-for
      guideline: |-
        For every incentive, ask how someone would earn it without fixing the problem, pay for the outcome rather than the evidence where you can, and decide in advance how you will wind it down.
      example: |-
        Under the Kyoto Protocol's Clean Development Mechanism, factories making the refrigerant HCFC-22 could earn carbon credits for destroying HFC-23, a potent greenhouse gas the process gives off. Lambert Schneider's 2011 study in Climate Policy found that these plants produced significantly less HFC-23 in periods when no credits could be claimed, and that their HCFC-22 output appeared to be set mainly by CDM rules. He concluded the scheme gave "perverse incentives to generate more HFC-23."
      source: |-
        Horst Siebert, *Der Kobra-Effekt: Wie man Irrwege der Wirtschaftspolitik vermeidet* (DVA, 2001) — who named the effect; the documented Hanoi case is Michael G. Vann, *Of Rats, Rice, and Race: The Great Hanoi Rat Massacre* (French Colonial History, 2003).
    ja:
      title: コブラ効果
      concept: 問題を減らすための報酬が、問題を増やす行動に報いてしまう。
      stance: どの報酬も、問題を解かずに稼ぐ道がないか疑う
      mechanism: |-
        報奨金が支払われるのは問題の証拠に対してで、問題が消えたことに対してではない。そして証拠は、たいてい成果より安く作れる。Siebert はこの効果を、英領インドのデリーでコブラに懸賞金をかけたら養殖が始まったという逸話から名付けたが、この逸話には記録上の裏付けがない。記録に残っている例は1902年のハノイだ。フランス当局がネズミの尻尾に報奨金を出すと、人々は尻尾だけを切ってネズミを放し、繁殖させた。市外ではネズミの養殖まで始まった。報奨金をやめると、それまでに増やされた分が放たれ、問題は前より大きくなる。
      counter:
        name: インセンティブはたいてい効く
        note: |-
          報奨金や目標の多くは、意図した方向に行動を動かす。悪用されうるからといって成果に報いなければ、問題の解決に誰もお金を払わないままになる
      guideline: |-
        インセンティブを作るたびに、問題を直さずに報酬を得る方法がないかを考える。できるなら証拠ではなく成果に支払い、終わらせ方を先に決めておく。
      example: |-
        京都議定書のクリーン開発メカニズム(CDM)では、冷媒 HCFC-22 を作る工場が、その製造で出る強力な温室効果ガス HFC-23 を破壊すると排出削減クレジットを得られた。Lambert Schneider が2011年に Climate Policy 誌で発表した研究によれば、こうした工場はクレジットを請求できない期間には HFC-23 の発生量がはっきり少なく、HCFC-22 の生産量もおもに CDM のルールで決まっているように見えた。Schneider は、この制度が HFC-23 を余計に生み出すゆがんだ動機を与えていると結論づけた。
      source: |-
        Horst Siebert『Der Kobra-Effekt: Wie man Irrwege der Wirtschaftspolitik vermeidet』(DVA, 2001)。この効果の命名の出典。記録に残るハノイの例は Michael G. Vann『Of Rats, Rice, and Race: The Great Hanoi Rat Massacre』(French Colonial History, 2003) による。

  - slug: dunbars-number
    tag: organization
    source_url: https://doi.org/10.1016/0047-2484(92)90081-J
    see_also:
      - conways-law
      - brooks-law
      - millers-law
      - metcalfes-law
      - ringelmann-effect
    en:
      title: Dunbar's Number
      concept: "People keep only about 150 stable relationships. Engineers extrapolate: past shared context, added headcount goes to coordination."
      stance: When people lose track of each other's work, it is time to split
      mechanism: |-
        Humans can maintain approximately 150 stable social relationships. Dunbar's result is about neocortex size and group size across primates — it is not about work teams. What engineering extrapolates from it is a separate argument: communication channels grow as n(n-1)/2, so past the size where everyone can still hold everyone else's context, added people go into coordination rather than output.
      counter:
        name: Coordination Through Interfaces
        note: |-
          large groups do ship coherent systems (the Linux kernel has thousands of contributors) when the interfaces between parts are stable enough that most people never need each other's context
      guideline: |-
        Watch for the symptom, not a number: when the people on one team can no longer say what everyone else is working on, or status meetings start multiplying, split along the seams of the system. Treat any specific size limit as a convention, not a finding.
      source: |-
        Robin I. M. Dunbar, *Neocortex size as a constraint on group size in primates* (Journal of Human Evolution, 1992). The smaller team-size figures usually quoted alongside it are not Dunbar's finding: 7±2 is folklore, and the two-pizza rule is an Amazon convention attributed to Jeff Bezos ("We try to create teams that are no larger than can be fed by two pizzas", AWS, *Introduction to DevOps on AWS*).
    ja:
      title: ダンバー数
      concept: |-
        人が安定して保てる関係は150人ほどだ。エンジニアリングではそこから、文脈を共有できる規模を超えると増員分は調整に消えると類推している。
      stance: 互いの仕事が見えなくなったら、分けどきだ
      mechanism: |-
        人間が安定した社会関係を保てるのはおよそ150人とされる。ダンバーの結果は霊長類全般の新皮質の大きさと群れの大きさの関係を扱ったもので、仕事のチームの話ではない。エンジニアリングがそこから類推しているのは別の議論だ。意思疎通の経路は n(n-1)/2 で増えるので、全員が全員の文脈をまだ把握できる規模を超えると、増えた人員は成果ではなく調整に消える。
      counter:
        name: インタフェースによる協調
        note: |-
          部品間のインタフェースが十分に安定していて、ほとんどの人が互いの文脈を必要としないなら、大きな集団でも一貫したシステムを出せる（Linux カーネルには数千人の貢献者がいる）
      guideline: |-
        人数ではなく症状を見る。チームの誰もが他の全員の作業内容を言えなくなったり、状況共有の会議が増え始めたりしたら、システムの継ぎ目に沿ってチームを分ける。具体的な人数の上限は、知見ではなく慣習として扱う。
      source: |-
        Robin I. M. Dunbar『Neocortex size as a constraint on group size in primates』(Journal of Human Evolution, 1992)。併せて引かれる小さいチーム規模の数字はダンバーの知見ではない。7±2 は通俗的な外挿で、ツー・ピザ・ルールは Jeff Bezos の言葉とされる Amazon の慣行だ ("We try to create teams that are no larger than can be fed by two pizzas"、AWS『Introduction to DevOps on AWS』)。

  - slug: worse-is-better
    tag: systems
    source_url: https://www.dreamsongs.com/RiseOfWorseIsBetter.html
    example_url: "https://spectrum.ieee.org/osi-the-internet-that-wasnt"
    see_also:
      - galls-law
      - lindy-effect
      - second-system-effect
    en:
      title: Worse is Better
      concept: A simpler design that is easy to build and adopt tends to beat a more correct but complex one.
      stance: Keep the implementation simple and spend the care on the interface
      mechanism: |-
        A simpler, "inferior" design that is easy to implement and adopt will beat a theoretically "correct" but complex design in the real world. Unix beat Lisp. HTTP beat CORBA.
      counter:
        name: The Right Thing
        note: |-
          Gabriel's own opposite: when the interface is hard to change later (a protocol, a file format, a security boundary) getting it right first can matter more than getting it out first
      guideline: |-
        For anything users will build on, ship the simplest version whose interface you can live with for years; keep the implementation simple and spend the care on the interface.
      example: |-
        In the 1980s the OSI networking standards were written by international committees that, unable to settle disputes between the computer and telecom camps, put options for both designs into the standard, making it larger and more complex. TCP/IP was already running on ARPA's network and its specifications were free, while OSI documents had to be bought from ISO. By the early 1990s TCP/IP had won, and in 1992 Internet engineers loudly rejected an ISO protocol offered as a replacement for IP.
      source: |-
        Richard P. Gabriel, *Lisp: Good News, Bad News, How to Win Big* (1991) — the "Worse is Better" essay.
    ja:
      title: 劣っている方が勝つ
      concept: 作りやすく広めやすい単純な設計は、正しいが複雑な設計に勝ちやすい。
      stance: 実装は単純に出し、手間はインタフェースにかける
      mechanism: |-
        実装しやすく広めやすい、単純で「劣った」設計は、理論的には「正しい」が複雑な設計に、現実では勝つ。Unix は Lisp に勝ち、HTTP は CORBA に勝った。
      counter:
        name: 正しいもの（The Right Thing）
        note: |-
          Gabriel 自身が対置した考え方。プロトコル、ファイル形式、セキュリティ境界のように後から変えにくいインタフェースでは、先に出すことより先に正しく作ることのほうが大事になる場合がある
      guideline: |-
        利用者がその上に何かを作るものは、何年も付き合えるインタフェースを備えた最も単純な版で出す。実装は単純に保ち、手間はインタフェースにかける。
      example: |-
        1980年代、OSI のネットワーク標準は国際委員会が作っていた。委員会はコンピュータ業界と通信業界の対立を解消できず、両方の設計を選択肢として標準に盛り込んだため、規格は大きく複雑になった。一方の TCP/IP はすでに ARPA のネットワークで動いており、仕様は無料で手に入った。OSI の文書は ISO から1部ずつ買う必要があった。1990年代初めには TCP/IP が勝ち、1992年には IP の後継として提案された ISO のプロトコルをインターネットの技術者たちが強く拒んだ。
      source: |-
        Richard P. Gabriel『Lisp: Good News, Bad News, How to Win Big』(1991)。「Worse is Better」の節の出典。

  - slug: cunninghams-law
    tag: organization
    source_url: https://meta.wikimedia.org/wiki/Cunningham%27s_Law
    see_also:
      - linus-law
      - brandolinis-law
    en:
      title: Cunningham's Law
      concept: People are quicker to correct a wrong answer than to answer a question.
      stance: Post your best guess and let others correct it
      mechanism: |-
        A plausible reading: answering a question means admitting you have time to help a stranger; correcting a wrong answer feels like defending the record, and it costs less because the wrong answer already set out the structure. So a confident mistake draws replies that an open question does not. The law is itself an example: Cunningham disowns it, yet it still circulates under his name.
      counter:
        name: Wrong Answers Persist
        note: |-
          the correction does not always arrive, and the wrong answer gets copied and indexed in the meantime; in shared docs, a guess must be labeled as a guess
      guideline: |-
        When documentation is missing, write your best understanding, mark it as unverified, and send it to the person most likely to know.
      source: |-
        Steven McGeady, comment on a New York Times blog (2010), recalling advice Ward Cunningham gave him in the early 1980s about Usenet. Cunningham disowns it: "a misquote that disproves itself by propagating through the internet as Cunningham's Law."
    ja:
      title: カニンガムの法則
      concept: 人は質問に答えるより、間違った答えを訂正するほうに熱心だ。
      stance: 正解がほしければ、まず自分の答えを出して直してもらう
      mechanism: |-
        一つの解釈として、質問に答えるのは、見知らぬ人を助ける暇があると認めることになる。間違いを正すのは記録を守る行為のように感じられ、しかも間違った答えがすでに骨組みを示しているので手間も少ない。だから自信ありげな誤りには、答えの出ていない質問には来ない返事が集まる。この法則自体がその例で、Cunningham 本人は否定しているのに、今も彼の名前で出回っている。
      counter:
        name: 誤答は残る
        note: |-
          訂正が来るとは限らず、その間に誤答は複製され、検索に載る。共有ドキュメントでは、推測は推測だと明記しなければならない
      guideline: |-
        ドキュメントがないときは、自分の理解を書いて未確認だと明記し、知っていそうな人に送る。
      source: |-
        Steven McGeady が 2010 年に New York Times のブログに寄せたコメント。1980 年代初めに Ward Cunningham から Usenet について受けた助言として紹介した。Cunningham 本人は「インターネット上で Cunningham の法則として広まることで、自らの誤りを証明している誤引用だ」と否定している。

  - slug: bystander-effect
    tag: organization
    source_url: https://doi.org/10.1037/h0025589
    see_also:
      - hanlons-razor
      - ringelmann-effect
      - blameless-postmortem
      - bus-factor
    en:
      title: Bystander Effect
      concept: The more people who see a problem, the less likely any one of them is to act on it.
      stance: If everyone owns it, no one does, so name one person
      mechanism: |-
        In an emergency, the more people who are present, the less likely any single person is to take action. "Someone else will handle it." A meta-analysis of five decades of studies (Fischer et al., Psychological Bulletin, 2011) found the effect weaker when the danger is obvious, but a page in a busy channel rarely looks like danger. In engineering, a page sent to a group channel often means nobody responds.
      counter:
        name: Single Point of Failure
        note: |-
          naming one owner every time makes that person the bottleneck and the bus factor; the owner should coordinate the response, not do all of it
      guideline: |-
        Never say "Can someone look at this?" Instead, say "@name, you are investigating this." Assign a single, named owner for every incident.
      source: |-
        John M. Darley & Bibb Latané, *Bystander Intervention in Emergencies: Diffusion of Responsibility* (JPSP, 1968).
    ja:
      title: 傍観者効果
      concept: 問題を目にする人が多いほど、一人ひとりが自分から動く可能性は下がる。
      stance: 全員の担当は誰の担当でもない。一人を名指しする
      mechanism: |-
        緊急時には、居合わせる人が多いほど、一人ひとりが動く可能性は下がる。「誰かが対応するだろう」と思うからだ。50年分の研究をまとめたメタ分析（Fischer ら、Psychological Bulletin、2011年）によれば、危険が明白な場面ではこの効果は弱まる。だが、人の多いチャンネルへの呼び出しが危険に見えることはまれだ。エンジニアリングでは、グループチャンネルに送った呼び出しには誰も応答しないことが多い。
      counter:
        name: 単一障害点
        note: |-
          毎回一人を名指しすると、その人がボトルネックになり、いなくなれば止まる。担当者は対応を調整する役であって、全部を自分でやる役ではない
      guideline: |-
        「誰か見てもらえますか」とは言わない。「@名前 さん、これの調査をお願いします」と名指しで頼む。インシデントには必ず、名前のついた担当者を一人割り当てる。
      source: |-
        John M. Darley & Bibb Latané『Bystander Intervention in Emergencies: Diffusion of Responsibility』(Journal of Personality and Social Psychology, 1968)。

  - slug: murphys-law
    tag: safety
    source_url: https://en.wikipedia.org/wiki/Murphy%27s_law
    example_url: "https://aws.amazon.com/message/41926/"
    see_also:
      - normalcy-bias
      - fallacies-of-distributed-computing
      - chaos-engineering
      - pre-mortem
    en:
      title: Murphy's Law
      concept: Given enough time and traffic, a failure mode that can happen eventually will.
      stance: Build the failure path as if it will run, because in time it will
      mechanism: |-
        The popular form is "Anything that can go wrong, will go wrong." Given enough time, traffic, or unexpected input, every latent failure mode eventually fires. Engineers who design only for the happy path build systems that are one network blip away from collapse.
      counter:
        name: Risk Budgeting
        note: |-
          defending against every conceivable failure costs more than some of the failures; rank failure modes by likelihood and cost and accept the cheap, rare ones
      guideline: |-
        Treat every external dependency, retry, and timeout as something that *will* fail in production. Build the failure path before the success path.
      example: |-
        On February 28, 2017, an AWS engineer running a playbook to remove a few servers from an S3 billing subsystem in US-EAST-1 mistyped one input, and the command removed far more servers, including ones the S3 index and placement subsystems depended on. S3 in the region could not serve requests until those subsystems restarted, about four hours later. AWS's fix was to change the tool so it removes capacity more slowly and refuses to take any subsystem below its minimum required capacity.
      source: |-
        Capt. Edward A. Murphy Jr., USAF Project MX981 (1949); popularized by Maj. John Paul Stapp. Accounts of the original words conflict; see Nick T. Spark, *A History of Murphy's Law* (2006).
    ja:
      title: マーフィーの法則
      concept: 時間と負荷が十分にあれば、起こりうる故障はいずれ起きる。
      stance: 失敗する経路は、いつか通るものとして作る
      mechanism: |-
        よく知られた形は「うまくいかない可能性のあることは、必ずうまくいかない」だ。時間、トラフィック、想定外の入力が十分にあれば、潜んでいる故障モードはいずれ必ず表に出る。ハッピーパスだけを設計するエンジニアは、ネットワークが一瞬揺れただけで崩れるシステムを作る。
      counter:
        name: リスクの予算化
        note: |-
          考えうる故障すべてに備えると、故障の一部が起きたときの損失より高くつく。故障モードを起こりやすさとコストで並べ、安くてまれなものは受け入れる
      guideline: |-
        外部依存、リトライ、タイムアウトはすべて、本番でいつか必ず失敗するものとして扱う。成功パスより先に失敗パスを作る。
      example: |-
        2017年2月28日、AWS のエンジニアが US-EAST-1 の S3 課金系サブシステムから数台のサーバーを外す手順を実行した際、入力を1つ打ち間違え、コマンドは S3 のインデックスと配置のサブシステムが頼るサーバーまで大量に外してしまった。そのリージョンの S3 は、これらのサブシステムが再起動するまでおよそ4時間リクエストを処理できなかった。AWS はツールを改め、容量の削除をゆっくりにし、どのサブシステムも必要最小限の容量を下回るような削除は拒むようにした。
      source: |-
        Capt. Edward A. Murphy Jr. (USAF MX981 計画, 1949)。Maj. John Paul Stapp により広まった。原文の言い回しについては証言が食い違う。Nick T. Spark『A History of Murphy's Law』(2006) を参照。

  - slug: boy-scout-rule
    tag: maintainability
    source_url: https://www.oreilly.com/library/view/97-things-every/9780596809515/ch08.html
    see_also:
      - normalization-of-deviance
      - broken-windows-theory
      - code-health-standard
      - technical-debt
      - lehmans-laws
      - small-changes
    en:
      title: Boy Scout Rule
      concept: Code decays because cleanup tends to be deferred to a refactor that rarely happens.
      stance: Leave what you touch a little better, in the same diff
      mechanism: |-
        Codebases decay because cleanup is always "someone else's job." Each engineer absorbs the entropy hit but defers the fix to a future refactor that never lands. The graph trends down.
      counter:
        name: One Reason Per Diff
        note: |-
          cleanup riding along with a behavior change hides the change, and a pull request that also renames forty things is one nobody reviews
      guideline: |-
        Always leave the code cleaner than you found it, and keep the cleanup small enough to read inside the same diff — a one-line rename, a clearer comment, a deleted dead branch. Anything bigger gets its own commit.
      source: |-
        Robert C. Martin, *The Boy Scout Rule*, in Kevlin Henney (ed.), *97 Things Every Programmer Should Know* (O'Reilly, 2010) — adapting Baden-Powell's "leave this world a little better than you found it". Also stated in *Clean Code* (2008).
    ja:
      title: ボーイスカウトの規則
      concept: |-
        コードが劣化するのは、片付けが、めったに実施されないリファクタリングに先送りされがちだからだ。
      stance: 触ったところは、同じ差分の中で少しだけきれいにする
      mechanism: |-
        コードベースが劣化するのは、片付けがいつも「誰か別の人の仕事」になるからだ。エンジニアはそれぞれ散らかった状態の影響を受けながら、直すのは将来のリファクタリングに回し、そのリファクタリングは結局来ない。グラフは右肩下がりになる。
      counter:
        name: 1つの差分に1つの理由
        note: |-
          振る舞いの変更に片付けが相乗りすると、変更そのものが埋もれる。ついでに40箇所をリネームした PR は、誰もレビューしない
      guideline: |-
        コードは必ず来たときよりもきれいにして去る。ただし片付けは、同じ差分の中で読み切れる大きさにとどめる。1行のリネーム、分かりやすくしたコメント、使われていない分岐の削除くらいだ。それより大きい片付けは別のコミットにする。
      source: |-
        Robert C. Martin『The Boy Scout Rule』(Kevlin Henney 編『97 Things Every Programmer Should Know』O'Reilly, 2010 所収)。ベーデン＝パウエルの「この世界を来たときより少しだけ良くして去れ」を翻案した規則の出典。『Clean Code』(2008) にも記述がある。

  - slug: teslers-law
    tag: systems
    source_url: https://en.wikipedia.org/wiki/Law_of_conservation_of_complexity
    see_also:
      - leaky-abstractions
      - ashbys-law
    en:
      title: Tesler's Law
      concept: "A system's inherent complexity can't be removed, only moved to someone else."
      stance: Complexity only moves, so know who you moved it to
      mechanism: |-
        Every system has an irreducible amount of complexity that cannot be removed — only relocated. Hide it from the user and it lands on the developer. Hide it from the developer and it lands on the operator. Hide it from the operator and it lands on the customer at 3 AM.
      counter:
        name: Accidental Complexity
        note: |-
          Brooks split complexity into essential and accidental; much of what a system carries is the accidental kind, and that can be deleted rather than moved
      guideline: |-
        When a "simple API" feels too clean, ask: who absorbed the complexity I just removed? If you can't name them, you didn't simplify — you displaced.
      source: |-
        Larry Tesler, interviewed in Dan Saffer, *Designing for Interaction* (New Riders, 2006) — recalling that he formulated the Law of Conservation of Complexity at Apple in the mid-1980s while arguing for MacApp.
    ja:
      title: テスラーの複雑性保存則
      concept: システムに本来備わる複雑さは消せない。誰か別の人に移るだけだ。
      stance: 複雑さは消えない。誰に移したかを把握する
      mechanism: |-
        どのシステムにも取り除けない複雑さがあり、それは消えずに場所を移すだけだ。利用者から隠せば開発者が抱え、開発者から隠せば運用者が抱え、運用者から隠せば午前3時の顧客が抱えることになる。
      counter:
        name: 偶有的な複雑さ
        note: |-
          Brooks は複雑さを本質的なものと偶有的なものに分けた。システムが抱える複雑さの多くは偶有的なもので、それは移すのではなく消せる
      guideline: |-
        「シンプルな API」がきれいすぎると感じたら、自分が取り除いた複雑さを誰が引き受けたのかを問う。答えられないなら、単純化したのではなく、よそへ移しただけだ。
      source: |-
        Dan Saffer『Designing for Interaction』(New Riders, 2006) 所収の Larry Tesler へのインタビュー。1980 年代半ば、Apple で MacApp を推していた時期に「複雑性保存の法則」を唱えたと本人が語っている。

  - slug: dunning-kruger-effect
    tag: cognition
    source_url: https://doi.org/10.1037/0022-3514.77.6.1121
    see_also:
      - curse-of-knowledge
      - peter-principle
      - believability-weighted-decisions
    en:
      title: Dunning-Kruger Effect
      concept: People who are least skilled at something tend to overrate their ability the most.
      stance: Treat confidence as a reason to check the record, not as evidence
      mechanism: |-
        Lacking expertise in a domain also means lacking the meta-skill required to recognize one's own incompetence. In the original study the bottom quartile scored around the 12th percentile and placed themselves near the 60th. Top performers *under*-rated themselves, because they assumed others found the task as easy as they did.
      counter:
        name: Calibrated Confidence
        note: |-
          the effect is contested — much of the classic pattern is reproduced by regression to the mean in noisy self-assessment, so treat overconfidence as a prompt to check the record rather than as a diagnosis
      guideline: |-
        When someone declares a hard problem "easy," check their domain history before trusting the estimate. During scoping, pair confident newcomers with quiet veterans and weight the quiet voice.
      source: |-
        Justin Kruger & David Dunning, *Unskilled and Unaware of It* (JPSP, 1999).
    ja:
      title: ダニング・クルーガー効果
      concept: ある分野に疎い人ほど、自分の能力を過大評価しがちだ。
      stance: 自信は根拠ではなく、実績を確かめるきっかけにする
      mechanism: |-
        ある分野の専門性がない人は、自分の無能さに気づくためのメタスキルも持っていない。元の研究では、下位四分位の被験者は実際の成績が12パーセンタイル程度だったのに、自己評価は60パーセンタイル付近だった。逆に上位の被験者は、他人にも同じくらい簡単だろうと考えて自分を過小評価した。
      counter:
        name: 較正された自信
        note: |-
          この効果には異論がある。古典的なパターンの多くは、ノイズの多い自己評価で起きる平均への回帰でも再現できる。だから過信は診断としてではなく、実績を確かめるきっかけとして扱う
      guideline: |-
        誰かが難しい問題を「簡単」と言い切ったら、その見積りを信じる前にその分野での実績を確認する。スコープを決める段階では、自信のある新人と口数の少ないベテランを組ませ、口数の少ない側の意見を重く見る。
      source: |-
        Justin Kruger & David Dunning『Unskilled and Unaware of It』(Journal of Personality and Social Psychology, 1999)。

  - slug: curse-of-knowledge
    tag: cognition
    source_url: https://doi.org/10.1086/261651
    see_also:
      - xy-problem
      - dunning-kruger-effect
      - principle-of-least-astonishment
      - context-not-control
      - bus-factor
      - narratives-not-slides
      - braintrust
      - programming-as-theory-building
    en:
      title: Curse of Knowledge
      concept: "Once you know something, you can't easily imagine what it's like not to know it."
      stance: You cannot see your own assumptions, so watch a newcomer try
      mechanism: |-
        Once you know a thing, you cannot easily imagine not knowing it. Engineers write docs, error messages, and APIs that are obvious to themselves and opaque to the next person who has to use them.
      counter:
        name: Write for Your Audience
        note: |-
          docs that explain everything bury the expert reader; an operator at 3 AM needs the command, not the tutorial
      guideline: |-
        Before shipping documentation or a public API, have someone who has never touched the system attempt the task while you watch silently. Their confusion points exactly at the assumptions you forgot to spell out.
      source: |-
        Colin Camerer, George Loewenstein & Martin Weber, *The Curse of Knowledge in Economic Settings: An Experimental Analysis* (Journal of Political Economy, 1989).
    ja:
      title: 知識の呪い
      concept: 一度知ってしまうと、知らなかったときの感覚を想像できなくなる。
      stance: 自分の前提は自分には見えない。初めての人に試してもらう
      mechanism: |-
        一度知ってしまうと、知らなかった頃の状態はなかなか想像できない。エンジニアは、自分には自明でも次に使う人には分かりにくいドキュメントやエラーメッセージ、API を書いてしまう。
      counter:
        name: 読み手に合わせて書く
        note: |-
          何もかも説明する文書では、熟練した読み手が必要な情報にたどり着けない。午前3時の運用担当に必要なのはチュートリアルではなくコマンドだ
      guideline: |-
        ドキュメントや公開 API を出す前に、システムを触ったことのない人にその作業を実際にやってもらい、自分は黙って見る。その人がつまずいた箇所が、そのまま書き忘れた前提を示している。
      source: |-
        Colin Camerer, George Loewenstein & Martin Weber『The Curse of Knowledge in Economic Settings: An Experimental Analysis』(Journal of Political Economy, 1989)。

  - slug: swiss-cheese-model
    tag: safety
    source_url: https://doi.org/10.1136/bmj.320.7237.768
    example_url: "https://about.gitlab.com/blog/2017/02/10/postmortem-of-database-outage-of-january-31/"
    see_also:
      - normalization-of-deviance
      - normal-accident-theory
      - blameless-postmortem
      - five-whys
      - automation-bias
      - lethal-trifecta
    en:
      title: Swiss Cheese Model
      concept: Every safeguard has holes; accidents happen when the holes in several layers line up.
      stance: Never stop at the one layer that failed
      mechanism: |-
        Every protective layer (review, test, alert, runbook, rollback) has holes. Accidents happen when holes across multiple independent layers happen to align. No single layer can ever be perfect, so resilience comes from layers that fail in independent ways.
      counter:
        name: Normal Accident Theory
        note: |-
          layers are not independent and each one adds interactions of its own; past a point, another safeguard is another way to fail
      guideline: |-
        During an incident review, do not stop at "the one thing that failed." Enumerate every layer that should have caught the failure and ask why each hole was open at exactly that moment. The fix is rarely a single layer; prefer changes that make the layers fail independently of each other.
      example: |-
        On January 31, 2017, a GitLab.com engineer meant to wipe the data directory of a lagging PostgreSQL replica but ran the command on the primary. Then every safeguard turned out to have its own hole: the daily pg_dump backups had been failing because of a version mismatch, the failure emails were rejected so nobody saw them, and disk snapshots were not enabled for the database servers. GitLab restored from a six-hour-old staging snapshot and lost about 5,000 projects, 5,000 comments and 700 user accounts created in that window.
      source: |-
        James Reason, *Human Error* (Cambridge University Press, 1990) — the layered-defenses model; the Swiss-cheese picture of it is from Reason, *Human error: models and management* (BMJ, 2000), which is what this links to. Larouzée & Le Coze (Safety Science, 2020) trace the cheese metaphor to Rob Lee.
    ja:
      title: スイスチーズモデル
      concept: どの防御層にも穴がある。事故は複数の層の穴がそろったときに起きる。
      stance: 失敗した一層で止まらず、すべての層の穴を見る
      mechanism: |-
        レビュー、テスト、アラート、ランブック、ロールバックといった防御層には、どれも穴がある。事故は、独立した複数の層の穴がたまたま一列にそろったときに起きる。どの層も完璧にはできないので、信頼性は、それぞれ別の理由で失敗する層を重ねることで得る。
      counter:
        name: 通常事故理論
        note: |-
          層は互いに独立しておらず、層を足すたびにその層の相互作用も増える。ある程度を超えると、安全策を一つ足すことは失敗の経路を一つ足すことになる
      guideline: |-
        インシデントレビューでは「失敗した一か所」で終わらせない。その失敗を止めるはずだった層をすべて挙げ、なぜその瞬間に各層の穴が開いていたのかを問う。一つの層を直すだけで済むことはまれだ。層同士が互いに独立して失敗するようにする変更を優先する。
      example: |-
        2017年1月31日、GitLab.com のエンジニアは遅れていた PostgreSQL のレプリカのデータディレクトリを消すつもりで、プライマリで消してしまった。そこから先の防御にもそれぞれ穴があった。毎日の pg_dump バックアップはバージョンの不一致で失敗し続けており、その失敗通知のメールは受信側で拒否されて誰も気づかず、データベースサーバーではディスクのスナップショットも有効になっていなかった。GitLab は6時間前のステージング用スナップショットから復旧し、その間に作られた約5,000のプロジェクト、約5,000のコメント、約700のユーザーアカウントを失った。
      source: |-
        James Reason『Human Error』(Cambridge University Press, 1990) が多層防護のモデルを示した。スイスチーズの図は Reason『Human error: models and management』(BMJ, 2000、本項のリンク先) から。チーズの比喩そのものは Rob Lee によるものだと Larouzée & Le Coze (Safety Science, 2020) が跡づけている。

  - slug: premature-optimization
    tag: performance
    source_url: https://doi.org/10.1145/356635.356640
    example_url: "https://nee.lv/2021/02/28/How-I-cut-GTA-Online-loading-times-by-70/"
    see_also:
      - amdahls-law
      - pareto-principle
    en:
      title: Premature Optimization
      concept: "Optimizing before measuring spends effort on code that isn't the bottleneck."
      stance: Tune only what you measured; decide early only what you cannot tune later
      mechanism: |-
        Knuth's full sentence is: "We should forget about small efficiencies, say about 97% of the time: premature optimization is the root of all evil. Yet we should not pass up our opportunities in that critical 3%." Intuition about where time goes is usually wrong, so effort spent before measuring lands on code that is not hot. It adds complexity, and by entangling hot and cold paths it makes the real optimization harder to do later.
      counter:
        name: Performance Is Architecture
        note: |-
          some performance is set by early design (data layout, number of round trips, sync vs async) and cannot be profiled in later; for those decisions, think about speed before there is anything to measure
      guideline: |-
        Write the obvious code first. Only optimize hot paths that a profiler proves are bottlenecks. Leave the other 97% of the code simple — that's where the next maintainer will live.
      example: |-
        For years GTA Online took minutes to load. In 2021 a player who goes by t0st profiled it and found that almost all the time went to two plain pieces of code: a parser that called sscanf, and through it strlen, again and again over a 10 MB JSON file, and a duplicate check that compared each of 63,000 items against every item before it. Patching just those two spots cut his load time from about six minutes to 1 minute 50 seconds, and Rockstar shipped a fix in March 2021.
      source: |-
        Donald E. Knuth, *Structured Programming with go to Statements* (Computing Surveys, 1974).
    ja:
      title: 早すぎる最適化
      concept: 計測する前に最適化すると、ボトルネックでない箇所に工数を使ってしまう。
      stance: 測ってから直す。後で直せない設計だけは先に考える
      mechanism: |-
        Knuth の原文は「小さな効率のことは、まあ 97% の場面では忘れるべきだ。早すぎる最適化は諸悪の根源である。とはいえ、決定的な 3% での機会は逃すべきではない」だ。時間がどこで使われているかの勘はたいてい外れるので、計測前の最適化はホットでないコードに工数を使うことになる。そのうえ複雑さが増え、ホットパスとコールドパスが絡み合って、本当に必要な最適化が後からやりにくくなる。
      counter:
        name: 性能は設計で決まる
        note: |-
          性能の一部は初期の設計（データ配置、往復回数、同期か非同期か）で決まり、後からプロファイルしても直せない。そうした判断では、測れるものができる前から速さを考える
      guideline: |-
        まず素直なコードを書く。最適化するのは、プロファイラでボトルネックだと確かめたホットパスだけにする。残り97%のクリティカルでないコードは単純なまま残す。次のメンテナーが日々触るのはそこだ。
      example: |-
        GTA Online は長年、読み込みに何分もかかっていた。2021年、t0st と名乗るプレイヤーがプロファイルを取ると、時間のほとんどは平凡な2か所のコードで使われていた。10MB の JSON を読むパーサーが sscanf を、その中で strlen を何度も呼んでいたことと、6万3,000件の項目を1件ずつそれまでの全項目と比べる重複チェックだ。この2か所を直すだけで読み込みは約6分から1分50秒に縮み、Rockstar も2021年3月に修正を出した。
      source: |-
        Donald E. Knuth『Structured Programming with go to Statements』(Computing Surveys, 1974)。

  - slug: linus-law
    tag: maintainability
    source_url: https://web.archive.org/web/2024/http://www.catb.org/~esr/writings/cathedral-bazaar/cathedral-bazaar/
    example_url: "https://heartbleed.com/"
    see_also:
      - cunninghams-law
      - brandolinis-law
      - small-changes
    en:
      title: Linus's Law
      concept: A bug that stumps one person is often obvious to someone else looking at the same code.
      stance: When the same bugs slip through, add different eyes, not harder looks
      mechanism: |-
        "Given enough eyeballs, all bugs are shallow." A defect that looks impossible to one person often becomes trivial when many independent perspectives are applied to it — provided the code is actually visible to those perspectives.
      counter:
        name: Many Eyes, Few Looking
        note: |-
          visibility is not review; the Heartbleed bug sat in OpenSSL's public source for two years before its disclosure in 2014, and some code needs a few paid, expert eyes rather than many casual ones
      guideline: |-
        If the same class of bug keeps slipping through, the fix is not more careful review by the same people — it is exposing the code to more, differently-shaped eyes. Rotate reviewers, open up internal libraries, run bug bounties.
      example: |-
        The Heartbleed bug entered OpenSSL in December 2011 and shipped in OpenSSL 1.0.1 in March 2012, in code that was open for anyone to read and ran on a large part of the web's servers. It became public only on April 7, 2014, after engineers at Codenomicon and Neel Mehta of Google Security found it independently. Many potential eyeballs did not mean many actual reviewers.
      source: |-
        Eric S. Raymond, *The Cathedral and the Bazaar* (1999) — named for Linus Torvalds.
    ja:
      title: リーナスの法則
      concept: 一人では見つからないバグも、同じコードを見る別の人にはあっさり分かることが多い。
      stance: 同じ種類のバグが抜けるなら、目を凝らすより違う目を足す
      mechanism: |-
        「十分な目玉があれば、あらゆるバグは浅い。」一人では手に負えないように見える欠陥も、独立した多くの視点が加わると簡単な問題に変わることが多い。ただし、その人たちが実際にコードを見られることが前提だ。
      counter:
        name: 目は多くても見ていない
        note: |-
          公開されていることとレビューされていることは別だ。Heartbleed のバグは2014年に公表されるまで、2年間 OpenSSL の公開ソースに残っていた。コードによっては、気軽に眺める大勢より、報酬を受けた少数の専門家の目が必要になる
      guideline: |-
        同じ種類のバグが何度もすり抜けるなら、同じ人がもっと慎重にレビューしても解決しない。視点の違う多くの人にコードを見せる。レビュアーを入れ替え、社内ライブラリを公開し、バグバウンティを実施する。
      example: |-
        Heartbleed のバグは2011年12月に OpenSSL に入り、2012年3月の OpenSSL 1.0.1 で出荷された。誰でも読めるコードで、ウェブの多くのサーバーで動いていた。それでも公になったのは2014年4月7日で、Codenomicon のエンジニアたちと Google Security の Neel Mehta がそれぞれ独立に見つけてからだった。読める目が多いことと、実際に読む人が多いことは違う。
      source: |-
        Eric S. Raymond『The Cathedral and the Bazaar』(1999)。Linus Torvalds にちなんで名付けられた法則の出典。

  - slug: cap-theorem
    tag: distributed-systems
    source_url: https://doi.org/10.1145/564585.564601
    example_url: "https://github.blog/news-insights/company-news/oct21-post-incident-analysis/"
    see_also:
      - two-generals-problem
      - fallacies-of-distributed-computing
    en:
      title: CAP Theorem
      concept: During a network partition, a data store must give up either consistency or availability.
      stance: Choose what to give up before the partition chooses for you
      mechanism: |-
        A networked data store cannot simultaneously guarantee **C**onsistency, **A**vailability, and **P**artition tolerance. Because network partitions are not optional in the real world, the live choice is really between consistency and availability *at the moment a partition happens*.
      counter:
        name: PACELC / Tunable Consistency
        note: |-
          partitions are rare; the trade-off you pay every day is latency against consistency (Abadi, 2012), so a design argued only in CAP terms ignores the normal case
      guideline: |-
        Decide *before* an outage whether each operation prefers consistency or availability. The partition will happen; the only question is what your system does when it does.
      example: |-
        On October 21, 2018, a 43-second network cut between GitHub's East Coast hub and its primary East Coast data center led its MySQL failover tooling to promote West Coast databases, and both sites ended up holding writes the other lacked. GitHub chose to keep data consistent over keeping the site fully available: it paused webhooks and Pages builds and ran degraded for 24 hours and 11 minutes while it reconciled the data. Its postmortem says the extended degradation was worth ensuring the consistency of users' data.
      source: |-
        Eric Brewer, *Towards Robust Distributed Systems* (PODC keynote, 2000); proved by Seth Gilbert & Nancy Lynch (*SIGACT News*, 2002).
    ja:
      title: CAP定理
      concept: ネットワーク分断が起きたら、データストアは一貫性か可用性のどちらかを捨てる。
      stance: 分断が来る前に、何を諦めるか決めておく
      mechanism: |-
        ネットワーク越しに使うデータストアは、**一貫性 (C)**・**可用性 (A)**・**分断耐性 (P)** を同時には保証できない。現実にはネットワーク分断を避けられないので、実際に選ぶのは*分断が起きたときに*一貫性と可用性のどちらを取るかだ。
      counter:
        name: PACELC / 調整可能な一貫性
        note: |-
          分断はまれだ。毎日払っているのは、レイテンシと一貫性のトレードオフのほうだ（Abadi, 2012）。CAP の言葉だけで議論した設計は、平常時を考えていない
      guideline: |-
        障害が起きる*前*に、操作ごとに一貫性と可用性のどちらを優先するかを決めておく。分断はいずれ起きる。問題は、そのときシステムがどう動くかだけだ。
      example: |-
        2018年10月21日、GitHub の東海岸のネットワーク拠点と東海岸のメインのデータセンターの間で通信が43秒途切れ、MySQL のフェイルオーバーの仕組みが西海岸のデータベースを昇格させた。その結果、両方のサイトに相手にない書き込みが残った。GitHub はサイトを完全に動かし続けるよりデータの一貫性を守ることを選び、Webhook と Pages のビルドを止め、データを突き合わせる間、24時間11分にわたって機能を落として運用した。ポストモーテムには、長い機能低下はユーザーのデータの一貫性を守るためなら払う価値があったと書かれている。
      source: |-
        Eric Brewer『Towards Robust Distributed Systems』(PODC 基調講演, 2000)。Seth Gilbert & Nancy Lynch が証明した (SIGACT News, 2002)。

  - slug: littles-law
    tag: performance
    source_url: https://doi.org/10.1287/opre.9.3.383
    example_url: "https://github.com/Netflix/concurrency-limits"
    see_also:
      - tail-at-scale
      - theory-of-constraints
      - small-changes
      - cost-of-delay
      - kingmans-formula
      - makers-schedule
    en:
      title: Little's Law
      concept: In a stable system, the average number of items inside equals arrival rate times average time spent.
      stance: To finish faster, start less
      mechanism: |-
        In any stable system, the average number of items in the system (L) equals the average arrival rate (λ) times the average time each item spends in it (W): **L = λW**. It holds regardless of arrival distribution or service discipline.
      counter:
        name: Utilization
        note: |-
          cut work-in-progress too far and servers sit idle between arrivals; throughput drops and the work you refused still has to be done somewhere
      guideline: |-
        To cut time-in-system without adding capacity, start less work: cap work-in-progress and shed, reject or defer what exceeds the cap, so the excess is refused quickly instead of queuing slowly. A cap without shedding just moves the queue somewhere you are not measuring.
      example: |-
        Netflix used to configure fixed concurrency limits for its services through laborious performance testing, and in auto-scaling systems those limits went stale, so a service could fall over instead of shedding excess load. Its open-source concurrency-limits library instead derives each service's limit from Little's Law, limit = average RPS × average latency, and adjusts it at runtime from measured latency.
      source: |-
        John D. C. Little, *A Proof for the Queuing Formula L = λW* (Operations Research, 1961).
    ja:
      title: リトルの法則
      concept: 安定した系では、系の中にある件数の平均は、到着率と平均滞在時間の積に等しい。
      stance: 早く終わらせたければ、始める数を減らす
      mechanism: |-
        安定したシステムでは、系内の平均件数 (L) は平均到着率 (λ) と平均滞在時間 (W) の積に等しく、**L = λW** となる。到着の分布やサービス規律に関係なく成り立つ。
      counter:
        name: 稼働率
        note: |-
          仕掛りを削りすぎると到着の合間にサーバが遊び、スループットが落ちる。断った仕事も、どこかで誰かがやらなければならない
      guideline: |-
        容量を増やさずに滞在時間を縮めたいなら、始める仕事を減らす。仕掛りに上限を設け、上限を超えた分は捨てるか断るか後回しにする。そうすれば超過分は行列で長く待たされず、すぐに断られる。捨てずに上限だけ設けても、行列は測っていない場所に移るだけだ。
      example: |-
        Netflix は以前、サービスごとの同時実行数の上限を手間のかかる性能試験で決めて固定していた。だがオートスケールする環境ではその値がすぐ古くなり、サービスは余分な負荷を捨てられずに落ちることがあった。そこでオープンソースの concurrency-limits ライブラリでは、リトルの法則（上限 = 平均 RPS × 平均レイテンシ）から上限を求め、計測したレイテンシをもとに実行中に調整するようにした。
      source: |-
        John D. C. Little『A Proof for the Queuing Formula L = λW』(Operations Research, 1961)。

  - slug: two-generals-problem
    tag: distributed-systems
    source_url: https://doi.org/10.1145/800213.806523
    example_url: "https://stripe.com/blog/idempotency"
    see_also:
      - cap-theorem
    en:
      title: Two Generals Problem
      concept: Over an unreliable channel, two parties can never be certain they have agreed.
      stance: Sent is not received, so design for retries
      mechanism: |-
        Two parties communicating over an unreliable channel can never be *certain* they have reached agreement — every message needs an acknowledgment, which itself needs an acknowledgment, forever. No fixed number of messages yields common knowledge.
      counter:
        name: Good-Enough Certainty
        note: |-
          certainty is impossible but rarely needed; TCP, payments and every RPC run on high probability plus a way to reconcile, and waiting for proof means never acting
      guideline: |-
        Never assume "I sent it, so they got it." Make every cross-network action safely retryable and idempotent, and reconcile state instead of trusting a single round-trip.
      example: |-
        Stripe's 2017 engineering post on API idempotency starts from a case the client cannot resolve: a call can succeed on the server but the connection breaks before the response arrives, so the client cannot know whether the charge happened. Rather than trying to get certainty, Stripe has clients send an idempotency key with each request, so a retry with the same key returns the saved result instead of charging the customer twice.
      source: |-
        E. A. Akkoyunlu, K. Ekanadham & R. V. Huber, *Some Constraints and Tradeoffs in the Design of Network Communications* (SOSP, 1975) — the first statement of the problem; named "the two generals problem" and framed as a database problem by Jim Gray, *Notes on Data Base Operating Systems* (1978).
    ja:
      title: 二人の将軍問題
      concept: |-
        信頼できない通信路では、二者は合意できたと確信できない。
      stance: 送ったことは届いたことではない。再送を前提に作る
      mechanism: |-
        信頼できない通信路でやりとりする二者は、合意できたと決して*確信*できない。どのメッセージにも確認応答が要り、その応答にも確認応答が要り、これが永遠に続く。何往復しても共有知識には届かない。
      counter:
        name: 十分な確からしさ
        note: |-
          確実さは得られないが、必要になることもまれだ。TCP も決済もあらゆる RPC も、高い確率と後から突き合わせる手段で動いている。証明を待っていたら何もできない
      guideline: |-
        「送ったから届いた」とは決して考えない。ネットワークをまたぐ操作はすべて安全に再試行できるようにべき等にし、一往復の結果を信じるのではなく状態を突き合わせる。
      example: |-
        Stripe が2017年に書いた API の冪等性についての記事は、クライアントには判断のつかない状況から始まる。サーバー側では呼び出しが成功していても、応答が届く前に接続が切れれば、クライアントには課金が済んだかどうか分からない。Stripe は確実さを得ようとするのをやめ、クライアントにリクエストごとの冪等キーを送らせる。同じキーで再送すれば、二重に課金せず保存済みの結果を返す。
      source: |-
        E. A. Akkoyunlu, K. Ekanadham & R. V. Huber『Some Constraints and Tradeoffs in the Design of Network Communications』(SOSP, 1975)。この問題を初めて述べた論文。「二人の将軍問題」と名付け、データベースの問題として定式化したのは Jim Gray『Notes on Data Base Operating Systems』(1978)。

  - slug: peter-principle
    tag: organization
    source_url: https://en.wikipedia.org/wiki/Peter_principle
    example_url: "https://doi.org/10.1093/qje/qjz017"
    see_also:
      - dunning-kruger-effect
      - shirky-principle
    en:
      title: Peter Principle
      concept: People tend to get promoted until they reach a role they are bad at, and stay there.
      stance: Promote for the next role, not as a reward for this one
      mechanism: |-
        In a hierarchy, people are promoted on performance in their *current* role, not the one above. So everyone tends to rise until they reach a role they are bad at — and there they stay. Competence is promoted away; incompetence accumulates.
      counter:
        name: People Grow Into Roles
        note: |-
          promoting only those already proven at the next level means nobody gets the chance to learn it; stretch roles with support and a way back are how most good managers were made
      guideline: |-
        Do not promote your best engineer into management as a reward — it removes a great engineer and risks creating a poor manager. Offer a technical ladder, and evaluate candidates for the role above, not the one they already mastered.
      example: |-
        Alan Benson, Danielle Li and Kelly Shue studied sales workers at 131 U.S. firms and published the results in 2019. They found that firms promoted their best salespeople into management even when other observable traits better predicted who would be a good manager, and estimated that promoting people with lower managerial potential was costly. Firms leaned less on sales numbers when the management job carried more responsibility.
      source: |-
        Laurence J. Peter & Raymond Hull, *The Peter Principle* (1969).
    ja:
      title: ピーターの法則
      concept: 人は苦手な役職にたどり着くまで昇進し、そこにとどまりがちだ。
      stance: 昇進は、いまの役の褒美でなく次の役への適性で決める
      mechanism: |-
        階層組織では、人は*一つ上*の職務ではなく*今の*職務の成績で昇進する。そのため誰もが、自分に向かない職位に着くまで昇進を続け、そこにとどまる。有能な人は昇進して今の職務からいなくなり、無能が積み上がっていく。
      counter:
        name: 人は役職に合わせて育つ
        note: |-
          一つ上の職務ですでに実績がある人しか昇進させなければ、誰もその職務を学ぶ機会を得られない。良いマネージャーの多くは、支援と戻り道のある背伸びの役割から育ってきた
      guideline: |-
        一番優秀なエンジニアを、褒美としてマネジメントに昇進させない。優秀なエンジニアを一人失ううえに、力不足のマネージャーを生むおそれがある。技術職のキャリアラダーを用意し、候補者は、すでに習熟した職務ではなく一つ上の職務への適性で評価する。
      example: |-
        Alan Benson、Danielle Li、Kelly Shue の3人は米国131社の営業職のデータを分析し、2019年に結果を発表した。企業は、管理職としての適性をよく予測する別の特徴があっても、売上の高い営業担当者を管理職に昇進させていた。管理職としての適性が低い人を昇進させるコストは大きいと推計している。管理職の責任が重い場合には、企業は売上の数字に頼る度合いを下げていた。
      source: |-
        Laurence J. Peter & Raymond Hull『The Peter Principle』(1969)。

  - slug: parkinsons-law
    tag: organization
    source_url: https://www.economist.com/news/1955/11/19/parkinsons-law
    see_also:
      - type-1-vs-type-2-decisions
      - law-of-triviality
      - hofstadters-law
      - fixed-time-variable-scope
      - kingmans-formula
      - makers-schedule
    en:
      title: Parkinson's Law
      concept: Work expands to fill the time available for it.
      stance: Give open-ended work a short box
      mechanism: |-
        "Work expands so as to fill the time available for its completion." Give a task a week and it takes a week; the same task with a two-day deadline ships in two days. Slack is consumed, not banked.
      counter:
        name: Slack
        note: |-
          work that is always squeezed into the shortest box has no room for the thinking, learning and recovery that keep quality up (DeMarco, Slack, 2001)
      guideline: |-
        Set deliberately short timeboxes for open-ended work and review at the deadline. A tight box forces the scoping decisions an open one defers forever.
      source: |-
        C. Northcote Parkinson, *Parkinson's Law* (The Economist, 19 November 1955); expanded into *Parkinson's Law and Other Studies in Administration* (Houghton Mifflin, 1957).
    ja:
      title: パーキンソンの法則
      concept: 仕事は、完了までに使える時間をすべて使い切るまで膨らむ。
      stance: 終わりの見えない仕事には、短い箱を与える
      mechanism: |-
        「仕事は、それを完了するために与えられた時間を満たすまで膨張する。」一週間与えれば一週間かかり、同じ作業でも締切が二日なら二日で終わる。余った時間 (slack) は貯まらず、使い切られる。
      counter:
        name: 余裕
        note: |-
          いつも最短の箱に押し込まれる仕事には、品質を保つための思考、学習、回復の余地がない（DeMarco『Slack』2001年）
      guideline: |-
        終わりの見えない作業には、あえて短いタイムボックスを設け、締切の時点で見直す。期限がきついと、ゆるい期限ならいつまでも先送りできるスコープの判断をその場で下すことになる。
      source: |-
        C. Northcote Parkinson『Parkinson's Law』(The Economist, 1955 年 11 月 19 日)。『Parkinson's Law and Other Studies in Administration』(Houghton Mifflin, 1957) に発展した。

  - slug: wirths-law
    tag: performance
    source_url: https://doi.org/10.1109/2.348001
    see_also:
      - jevons-paradox
      - moores-law
    en:
      title: Wirth's Law
      concept: Software gets slower faster than hardware gets faster.
      stance: Treat faster hardware as a budget to protect, not to spend
      mechanism: |-
        "Software is getting slower more rapidly than hardware becomes faster." Each hardware gain is absorbed by added abstraction layers, features, and carelessness, so user-perceived speed stays flat or worsens.
      counter:
        name: Programmer Time Over Machine Time
        note: |-
          hardware is cheap and engineers are not; much of the "bloat" is abstraction that let a feature ship in weeks instead of months
      guideline: |-
        Treat the speed a faster machine buys you as a budget to protect, not a license to spend. Set a performance budget and fail the build when a release regresses against it.
      source: |-
        Niklaus Wirth, *A Plea for Lean Software* (IEEE Computer, February 1995) — where Wirth quotes the line as "Reiser's law", crediting his colleague Martin Reiser; the name Wirth's Law was attached later.
    ja:
      title: ヴィルトの法則
      concept: ソフトウェアが遅くなる速さは、ハードウェアが速くなる速さを上回る。
      stance: ハードの進歩は、使い切らずに守る予算と考える
      mechanism: |-
        「ソフトウェアは、ハードウェアが速くなるよりも速く遅くなっている。」ハードウェアが速くなるたびに、その分は抽象層や機能の追加と不注意に吸収され、利用者が体感する速度は変わらないか、むしろ悪くなる。
      counter:
        name: 機械の時間より人の時間
        note: |-
          ハードウェアは安く、エンジニアは高い。「肥大」の多くは、機能を数か月ではなく数週間で出すための抽象化だ
      guideline: |-
        マシンが速くなって得た余裕は、使ってよい分ではなく守るべき予算として扱う。性能予算を決め、リリースがそれより遅くなったらビルドを失敗させる。
      source: |-
        Niklaus Wirth『A Plea for Lean Software』(IEEE Computer, 1995 年 2 月)。Wirth 自身は同僚 Martin Reiser の言葉として「Reiser の法則」の名で引いている。「Wirth の法則」という呼び名は後から付いた。

  - slug: ninety-ninety-rule
    tag: estimation
    source_url: https://en.wikipedia.org/wiki/Ninety%E2%80%93ninety_rule
    see_also:
      - hofstadters-law
      - strangler-fig
    en:
      title: Ninety-Ninety Rule
      concept: The last 10% of the work tends to take as long as the first 90% did.
      stance: Expect "almost done" to hide as much work again
      mechanism: |-
        "The first 90% of the code accounts for the first 90% of the development time. The remaining 10% of the code accounts for the other 90% of the development time." The visible work hides a second, equally large body of integration, edge cases, and polish.
      counter:
        name: Good Enough to Ship
        note: |-
          the last 10% is sometimes not worth doing; polish nobody uses and edge cases nobody hits can be cut, and the hard part is deciding which
      guideline: |-
        When something looks "almost done," assume an entire second project remains: the last-10% of hardening, edge cases, and integration. Schedule it explicitly instead of treating it as a rounding error.
      source: |-
        Tom Cargill (Bell Labs); popularized by Jon Bentley, *Programming Pearls* (CACM, 1985).
    ja:
      title: 90対90の法則
      concept: 残り1割の作業に、最初の9割と同じくらいの時間がかかりがちだ。
      stance: 「ほぼ終わり」の先に、同じだけの仕事があると見込む
      mechanism: |-
        「最初の90%のコードが、開発時間の最初の90%を占める。残り10%のコードが、もう90%を占める。」目に見える作業の裏には、統合、エッジケース、仕上げという同じくらい大きな作業がもう一つ隠れている。
      counter:
        name: 出せる程度で十分
        note: |-
          最後の1割は、やる価値がないこともある。誰も使わない仕上げや誰も踏まないエッジケースは削れる。難しいのは、どれを削るかの判断だ
      guideline: |-
        「ほぼ完成」に見えたら、プロジェクトがもう一つ丸ごと残っていると考える。残りの10%にあたる堅牢化、エッジケース、統合だ。誤差として片づけず、スケジュールにはっきり組み込む。
      source: |-
        Tom Cargill (Bell Labs)。Jon Bentley が『Programming Pearls』(CACM, 1985) で広めた。

  - slug: eaglesons-law
    tag: maintainability
    source_url: https://wiki.c2.com/?EaglesonsLaw
    see_also:
      - chestertons-fence
      - kernighans-law
      - programming-as-theory-building
    en:
      title: Eagleson's Law
      concept: "Your own code that you haven't read in six months might as well be someone else's."
      stance: Write for the stranger you will be in six months
      mechanism: |-
        "Any code of your own that you haven't looked at for six months might as well have been written by someone else." Your mental model of the code evaporates far faster than the code does; context is not stored in the source.
      counter:
        name: Comments Rot
        note: |-
          the code is the only description that is guaranteed current; a comment or ADR that is not maintained becomes a confident lie, which is worse than nothing
      guideline: |-
        Write code and commit messages for the stranger you will become in six months. If a decision is not obvious from the code, record the *why* in a comment or an ADR — not just in your head.
      source: |-
        Origin unknown. Programming folklore attributed to a Peter Eagleson, of whom nothing else is recorded; the line circulates in collections of programming laws, with no first publication found.
    ja:
      title: イーグルソンの法則
      concept: 半年見ていない自分のコードは、他人が書いたコードも同然だ。
      stance: 半年後の、他人になった自分に向けて書く
      mechanism: |-
        「半年見ていない自分のコードは、他人が書いたも同然である。」コードについての頭の中のモデルは、コードそのものよりずっと早く消えていく。文脈はソースには残らない。
      counter:
        name: コメントは腐る
        note: |-
          最新だと確実に言えるのはコードだけだ。保守されないコメントや ADR は自信ありげな嘘になり、何もないより悪い
      guideline: |-
        コードとコミットメッセージは、半年後には他人同然になる自分に向けて書く。コードを読んでも分からない判断は、その「なぜ」を頭の中だけにとどめず、コメントか ADR に残す。
      source: |-
        出所は不明。Peter Eagleson という人物に帰されるプログラミングの口伝だが、その人物について他の記録はなく、初出も見つかっていない。プログラミングの法則集の中で流布している。

  - slug: hicks-law
    tag: interaction
    source_url: https://doi.org/10.1080/17470215208416600
    see_also:
      - millers-law
      - fitts-law
    en:
      title: Hick's Law
      concept: The more options people are given, the longer they take to choose one.
      stance: Make each option earn its place
      mechanism: |-
        The time to make a decision grows logarithmically with the number of choices: **T = b·log₂(n+1)**. More options do not just add visual clutter — they measurably slow every user down. Hick measured choice among equally likely options; on a menu people already know, they search rather than choose, so the law applies most to unfamiliar screens.
      counter:
        name: Expert Efficiency
        note: |-
          hiding options behind menus and defaults costs frequent users clicks and discoverability; a dense screen that experts learn once can be faster than a sparse one
      guideline: |-
        Cut the number of choices on any screen or API surface to the few that matter; push the rest behind defaults and progressive disclosure. Fewer doors, faster decisions.
      source: |-
        William E. Hick (1952) and Ray Hyman (1953) — the "Hick–Hyman Law."
    ja:
      title: ヒックの法則
      concept: 選択肢が増えるほど、人は一つを選ぶのに時間がかかる。
      stance: どの選択肢にも、そこにある理由を求める
      mechanism: |-
        決定にかかる時間は、選択肢の数の対数に比例して増え、式は **T = b·log₂(n+1)** になる。選択肢が増えると見た目が散らかるだけでなく、どの利用者も測れるほど遅くなる。Hick が測ったのは等確率の選択肢から選ぶ場面だ。見慣れたメニューでは人は選ぶのではなく探すので、この法則が一番よく当てはまるのは見慣れない画面だ。
      counter:
        name: 熟練者の効率
        note: |-
          選択肢をメニューや既定値の裏に隠すと、よく使う人のクリック数が増え、機能が見つけにくくなる。熟練者が一度覚えれば済む密な画面は、すかすかの画面より速いことがある
      guideline: |-
        画面や API で見せる選択肢は、本当に必要な少数に絞る。残りは既定値や段階的開示の裏に回す。入口が少ないほど、決定は速い。
      source: |-
        William E. Hick (1952) と Ray Hyman (1953)。「ヒック・ハイマンの法則」の出典。

  - slug: fitts-law
    tag: interaction
    source_url: https://doi.org/10.1037/h0055392
    example_url: "https://www.asktog.com/columns/022DesignedToGiveFitts.html"
    see_also:
      - hicks-law
    en:
      title: Fitts's Law
      concept: Small, distant targets take longer to hit and get missed more often.
      stance: Make frequent actions big and close, and dangerous ones small and far
      mechanism: |-
        The time to move to a target depends on its distance and size: distant, small targets are slow and error-prone; near, large targets are fast. Pointing is a physical act with a measurable cost.
      counter:
        name: Deliberate Friction
        note: |-
          the same law that makes a button easy to hit makes it easy to hit by accident; for irreversible actions a slower, harder target is the point
      guideline: |-
        Make frequent actions big and close to where the pointer already is; make destructive ones small, far from the frequent ones, and behind a confirmation. Screen edges and corners are effectively infinite targets, because the pointer stops there, so put primary actions there.
      example: |-
        Apple put the Macintosh menu bar at the top edge of the screen, while Microsoft, Sun and others attached menu bars to each window. Bruce Tognazzini, who wrote Apple's early interface guidelines, explained in 1999 that a menu on the screen edge has effectively infinite height, because the pointer stops there, so users can fling the mouse up without aiming, and he called Mac menus at least five times faster to reach. In a test he ran at Apple with a second monitor stacked above, so the menu bar was no longer on an edge, users overshot, slowed down, and their access times fell to about those of Windows users.
      source: |-
        Paul M. Fitts, *The Information Capacity of the Human Motor System in Controlling the Amplitude of Movement* (Journal of Experimental Psychology, 1954).
    ja:
      title: フィッツの法則
      concept: 小さく遠いターゲットほど、押すのに時間がかかり、押し間違えも増える。
      stance: よく使う操作は近く大きく、危ない操作は遠く小さく
      mechanism: |-
        ターゲットまで動かす時間は、その距離と大きさで決まる。遠くて小さいターゲットは時間がかかって外しやすく、近くて大きいターゲットは速い。ポインティングは、測れるコストを伴う身体の動作だ。
      counter:
        name: 意図的な摩擦
        note: |-
          ボタンが押しやすくなれば、同じ理屈で誤って押すことも増える。取り消せない操作では、遅くて押しにくいことこそが狙いだ
      guideline: |-
        よく使う操作は大きくし、ポインタが今ある場所の近くに置く。破壊的な操作は小さくし、よく使う操作から離して、確認を挟む。画面の端と角はカーソルがそこで止まるので、無限に大きいターゲットに近くなる。だから主要な操作はそこに置く。
      example: |-
        Apple は Macintosh のメニューバーを画面の上端に置き、Microsoft や Sun などはメニューバーをウィンドウごとに付けた。Apple の初期のインターフェースガイドラインを書いた Bruce Tognazzini は1999年、画面の端にあるメニューはポインタがそこで止まるので実質的に高さが無限になり、狙わずにマウスを上へ放り投げればよいと説明し、Mac のメニューには少なくとも5倍速く届くと書いた。彼が Apple で行った試験では、上にもう1台モニタを重ねてメニューバーが端でなくなると、利用者は行き過ぎてから減速するようになり、操作時間は Windows の利用者並みに落ちた。
      source: |-
        Paul M. Fitts『The Information Capacity of the Human Motor System in Controlling the Amplitude of Movement』(Journal of Experimental Psychology, 1954)。

  - slug: millers-law
    tag: cognition
    source_url: https://doi.org/10.1037/h0043158
    see_also:
      - dunbars-number
      - hicks-law
    en:
      title: Miller's Law
      concept: Working memory holds only a handful of chunks (Miller said about seven; later estimates are lower).
      stance: Don't make people hold more than a few things at once
      mechanism: |-
        Miller put the span of immediate memory at about seven chunks; later work, notably Cowan (2001), puts working memory nearer four. Either way the limit is small, and past it people drop items rather than slow down.
      counter:
        name: Too Much Chunking
        note: |-
          every grouping is a level of indirection; split a short list into named groups and people now have to remember the groups as well
      guideline: |-
        Group related items into a handful of named chunks — phone-number style — wherever a person must hold state in their head: function arguments, form fields, menu groups, on-call steps.
      source: |-
        George A. Miller, *The Magical Number Seven, Plus or Minus Two* (Psychological Review, 1956); Nelson Cowan, *The magical number 4 in short-term memory: A reconsideration of mental storage capacity* (Behavioral and Brain Sciences, 2001) — the lower estimate.
    ja:
      title: ミラーの法則
      concept: 作業記憶に保てるのは数個のまとまりだけだ（Miller は7前後とし、後の研究はもっと少ないとする）。
      stance: 人に一度に覚えさせるのは、数個までにする
      mechanism: |-
        Miller は即時記憶の範囲を約7チャンクとした。後の研究、特に Cowan (2001) は作業記憶を4前後とする。どちらにしても限界は小さく、それを超えると人は遅くなるのではなく、項目を取りこぼす。
      counter:
        name: まとめすぎ
        note: |-
          まとめるたびに間接参照が一段増える。短い一覧を名前付きのグループに分けると、グループ名まで覚えなければならなくなる
      guideline: |-
        関数の引数、フォーム項目、メニューのグループ、オンコール手順のように、人が状態を頭の中に保たなければならない場所では、関連する項目を電話番号のように少数の名前付きチャンクにまとめる。
      source: |-
        George A. Miller『The Magical Number Seven, Plus or Minus Two』(Psychological Review, 1956)。低い見積りは Nelson Cowan『The magical number 4 in short-term memory: A reconsideration of mental storage capacity』(Behavioral and Brain Sciences, 2001) の出典。

  - slug: fallacies-of-distributed-computing
    tag: distributed-systems
    source_url: https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing
    see_also:
      - postels-law
      - murphys-law
      - cap-theorem
      - static-stability
      - chaos-engineering
    en:
      title: Fallacies of Distributed Computing
      concept: Networked code quietly assumes eight things about the network that are false in production.
      stance: Write as if the network will fail, lag and cost you
      mechanism: |-
        Newcomers to distributed systems silently assume the network is reliable, latency is zero, bandwidth is infinite, the network is secure, topology is stable, there is one administrator, transport cost is zero, and the network is homogeneous. Each of these eight can fail in production, and the code that assumed it fails with it.
      counter:
        name: Don't Distribute
        note: |-
          Fowler's first law of distributed object design; the cheapest way to survive the eight fallacies is not to make the call remote in the first place
      guideline: |-
        Before shipping any cross-process call, name which of the eight assumptions you are relying on and add an explicit timeout, retry, and failure path for each.
      source: |-
        L. Peter Deutsch drafted seven at Sun Microsystems in 1994, folding in four "Fallacies of Networked Computing" already identified there by Bill Joy and Lyon (given as Dave Lyon in the source, often as Tom Lyon); James Gosling added the eighth around 1997 — Ingrid Van Den Hoogen, *Deutsch's Fallacies, 10 Years After* (Java Developer's Journal, 2004). Arnon Rotem-Gal-Oz, *Fallacies of Distributed Computing Explained* (2006), is the standard commentary.
    ja:
      title: 分散コンピューティングの誤謬
      concept: ネットワーク越しのコードは、本番では成り立たない8つの前提を暗に置いている。
      stance: ネットワークは落ちるし遅いしタダではない、と思って書く
      mechanism: |-
        分散システムに慣れていない人は、ネットワークは信頼できる、遅延はゼロ、帯域は無限、通信は安全、構成は変わらない、管理者は一人、転送コストはゼロ、ネットワークは均質だ、と無意識に仮定する。この8つの仮定はどれも本番で崩れうるし、崩れればそれを前提にしたコードも一緒に壊れる。
      counter:
        name: 分散させない
        note: |-
          Fowler の分散オブジェクト設計の第一法則。8つの誤謬を乗り切る一番安い方法は、そもそも呼び出しをリモートにしないことだ
      guideline: |-
        プロセス間呼び出しを出す前に、8つの仮定のどれに頼っているかを書き出し、それぞれにタイムアウト、リトライ、失敗時の処理を明示的に用意する。
      source: |-
        L. Peter Deutsch が 1994 年に Sun Microsystems で 7 つにまとめた。そこには Bill Joy と Lyon (出典では Dave Lyon、Tom Lyon とされることも多い) が同社ですでに挙げていた「Fallacies of Networked Computing」の 4 つが含まれる。8 つ目は 1997 年頃に James Gosling が加えた。Ingrid Van Den Hoogen『Deutsch's Fallacies, 10 Years After』(Java Developer's Journal, 2004) が経緯の出典。解説の定番は Arnon Rotem-Gal-Oz『Fallacies of Distributed Computing Explained』(2006)。

  - slug: ironies-of-automation
    tag: safety
    source_url: https://doi.org/10.1016/0005-1098(83)90046-8
    example_url: "https://bea.aero/fileadmin/uploads/tx_elyextendttnews/presentation.rapport.final.05juillet2012.en_04.pdf"
    see_also:
      - normal-accident-theory
      - toil
      - avoid-fallback
      - automation-bias
    en:
      title: Ironies of Automation
      concept: Automation leaves people only the hardest cases, after their skills have faded from disuse.
      stance: The more you automate, the more people must practise by hand
      mechanism: |-
        Automating the routine parts of a task leaves the human only the rarest, hardest exceptions — while their manual skill and situational awareness atrophy from disuse, precisely at the moment a failing automated system hands control back to them.
      counter:
        name: Toil
        note: |-
          keeping people on routine manual work only to keep them practiced has its own cost: repetitive work that scales with load, burns time and invites slips, so the push to automate is real, and the tension is resolved by better human-machine teaming rather than by automating less
      guideline: |-
        Keep operators sharp with regular game-days and hands-on drills, and design handoffs so a human takes over with context, not cold.
      example: |-
        On June 1, 2009, ice crystals likely blocked the pitot probes of Air France flight 447, the speed readings disagreed, and the autopilot disconnected over the Atlantic. The crew's manual inputs destabilized the flight path and they did not recognize the stall that followed. France's BEA listed among the causes an absence of training in manual handling at high altitude.
      source: |-
        Lisanne Bainbridge, *Ironies of Automation* (Automatica, 1983).
    ja:
      title: 自動化の皮肉
      concept: 自動化は人に最も難しい例外だけを残し、その対応に要る腕は使わないうちに鈍る。
      stance: 自動化するほど、手で扱う練習が要る
      mechanism: |-
        作業の定型部分を自動化すると、人には一番まれで難しい例外だけが残る。しかも手作業の技能と状況の把握は、使わないうちに衰えていく。自動化システムが失敗して制御を人に返すのは、ちょうどそういうときだ。
      counter:
        name: トイル
        note: |-
          腕を鈍らせないためだけに定型作業を人に続けさせるのにもコストがある。負荷に比例して増える繰り返し作業は時間を食い、ミスを招くので、自動化を進める理由は確かにある。この対立は、自動化を減らすことではなく、人と機械の連携をよくすることで解く
      guideline: |-
        定期的なゲームデーと実地訓練で、運用担当の勘を保つ。引き継ぎは、人が何も知らないままいきなり引き取るのではなく、状況を把握したうえで引き取れるように設計する。
      example: |-
        2009年6月1日、大西洋上のエールフランス447便で、ピトー管が氷晶でふさがったとみられ、速度の計測値が食い違って自動操縦が切れた。乗員の手動操作は飛行経路を不安定にし、その後の失速にも気づかなかった。フランスの事故調査機関 BEA は、高高度での手動操縦の訓練がなかったことを原因の一つに挙げた。
      source: |-
        Lisanne Bainbridge『Ironies of Automation』(Automatica, 1983)。

  - slug: principle-of-least-privilege
    tag: security
    source_url: https://web.mit.edu/Saltzer/www/publications/protection/
    example_url: "https://www.justice.gov/media/1019711/dl?inline"
    see_also:
      - kerckhoffs-principle
      - lethal-trifecta
    en:
      title: Principle of Least Privilege
      concept: "Every permission a component doesn't need widens the damage when something goes wrong."
      stance: Start from nothing and grant only what is proven necessary
      mechanism: |-
        Every component granted more authority than it strictly needs enlarges the blast radius of any bug, compromise, or accident, and multiplies the interactions an auditor must reason about.
      counter:
        name: Psychological Acceptability
        note: over-restriction that users route around defeats itself
      guideline: |-
        Default every process, service account, and token to deny, then add only the minimal scopes the job provably needs; re-audit the grants whenever the job changes.
      example: |-
        In the 2019 Capital One breach, a firewall misconfiguration let an outsider run commands on one server and obtain credentials for the role used by its web application firewall. According to the DOJ complaint, that role could list more than 700 folders or buckets of data in Capital One's cloud storage and copy out the ones it had permissions for.
      source: |-
        Jerome Saltzer & Michael Schroeder, *The Protection of Information in Computer Systems* (Proceedings of the IEEE, 1975).
    ja:
      title: 最小権限の原則
      concept: 不要な権限を持つ部品ほど、問題が起きたときの被害範囲が広がる。
      stance: 権限はゼロから始め、必要と示せたものだけ足す
      mechanism: |-
        必要な分を超える権限を与えられた部品は、バグや侵害、事故が起きたときの被害範囲を広げ、監査する人が考えなければならない相互作用も増やす。
      counter:
        name: 心理的受容性
        note: 利用者が回避するほど厳しい制限は、かえって守りを崩す
      guideline: |-
        プロセス、サービスアカウント、トークンはすべて既定で拒否にし、その仕事に必要だと確かめられた最小限のスコープだけを加える。仕事の内容が変わったら、そのたびに権限を監査し直す。
      example: |-
        2019年の Capital One の情報流出では、ファイアウォールの設定ミスにより、外部の人物が一つのサーバ上でコマンドを実行し、Web アプリケーションファイアウォールが使うロールの認証情報を手に入れた。司法省の訴状によれば、このロールはCapital One のクラウドストレージにある700を超えるフォルダやバケットを一覧でき、権限のあるものからデータをコピーできた。
      source: |-
        Jerome Saltzer & Michael Schroeder『The Protection of Information in Computer Systems』(Proceedings of the IEEE, 1975)。

  - slug: kerckhoffs-principle
    tag: security
    source_url: https://www.petitcolas.net/kerckhoffs/
    example_url: "https://doi.org/10.1007/978-3-540-88313-5_7"
    see_also:
      - principle-of-least-privilege
      - lethal-trifecta
    en:
      title: Kerckhoffs's Principle
      concept: A system that is secure only while its design stays secret is not secure.
      stance: Assume the attacker has read your design, and keep the secret in the keys
      mechanism: |-
        A cryptosystem should remain secure even if everything about it except the key is public. Secrecy of the algorithm is brittle: mechanisms leak, get reverse-engineered, and get reused across systems.
      counter:
        name: Defense in Depth
        note: obscurity may be one thin extra layer, never the foundation
      guideline: |-
        Assume the attacker has your source and design. Put all of the secret in rotatable keys, and never rely on a hidden algorithm to protect anything.
      example: |-
        NXP kept the design of CRYPTO1, the 48-bit cipher in its MIFARE Classic smart card, secret, and the card was used in transit systems such as London's Oyster card and the Dutch OV-chipkaart. In 2008 researchers at Radboud University Nijmegen reverse engineered the cipher and authentication protocol from recorded card-reader traffic. Their attack recovers the secret key from one or two authentication attempts with a genuine reader in under a second, enough to clone a card.
      source: |-
        Auguste Kerckhoffs, *La cryptographie militaire* (Journal des sciences militaires, January and February 1883) — the principle, stated as the second of six requirements; both parts are scanned at the linked page.
    ja:
      title: ケルクホフスの原理
      concept: 設計が秘密である間だけ安全なシステムは、安全ではない。
      stance: 設計は読まれている前提で、秘密は鍵だけに置く
      mechanism: |-
        暗号方式は、鍵以外のすべてが公開されても安全であるべきだ。アルゴリズムを秘密にして守るやり方はもろい。仕組みは漏れるし、リバースエンジニアリングされるし、他のシステムで使い回される。
      counter:
        name: 多層防御
        note: |-
          秘匿は薄い追加の一層にはなっても、土台には決してならない
      guideline: |-
        攻撃者はソースコードも設計もすべて手にしている前提で考える。秘密はすべて交換できる鍵に寄せ、隠したアルゴリズムで何かを守ろうとしない。
      example: |-
        NXP は MIFARE Classic カードに使う48ビットの暗号 CRYPTO1 の設計を非公開にしていた。このカードはロンドンの Oyster カードやオランダの OV-chipkaart などの交通システムで使われていた。2008年、ラドバウド大学ナイメーヘンの研究者たちはカードと読み取り機の通信を記録して暗号と認証プロトコルを解析した。本物の読み取り機との1、2回の認証から1秒足らずで秘密鍵を取り出せる攻撃を示し、カードの複製も可能になった。
      source: |-
        Auguste Kerckhoffs『La cryptographie militaire』(Journal des sciences militaires, 1883 年 1 月・2 月)。6 つの要件の 2 番目としてこの原理を述べた論文の出典。リンク先に両号のスキャンがある。

  - slug: gustafsons-law
    tag: performance
    source_url: https://doi.org/10.1145/42411.42415
    example_url: "https://arxiv.org/abs/2304.10397"
    see_also:
      - amdahls-law
      - moores-law
    en:
      title: Gustafson's Law
      concept: When the problem grows with the machine, parallel speedup keeps growing nearly linearly.
      stance: Ask whether the problem grows with the machine
      mechanism: |-
        For a fixed time budget, a larger machine lets you solve a proportionally larger problem, so the serial fraction shrinks with scale and speedup grows near-linearly — the optimistic counterpart to Amdahl's fixed-workload pessimism.
      counter:
        name: Amdahl's Law
        note: for a fixed-size workload, the serial fraction still hard-caps speedup
      guideline: |-
        Before justifying more cores, ask whether the problem size grows with the hardware. If the workload is fixed, reason with Amdahl; if it scales, Gustafson applies.
      example: |-
        In a 2023 paper, AMD engineers ran rocHPL, their Linpack implementation for the Frontier supercomputer, on 1 to 128 nodes of Frontier's early-access system Crusher. At each node count they grew the problem size N to fill the GPUs' memory again, rather than holding it fixed. Performance went from 153 TFLOPS on one node to 17.75 PFLOPS on 128 nodes, over 90% weak-scaling efficiency.
      source: |-
        John L. Gustafson, *Reevaluating Amdahl's Law* (Communications of the ACM, 1988).
    ja:
      title: グスタフソンの法則
      concept: 問題の規模が計算機とともに大きくなるなら、並列化の効果はほぼ比例して伸びる。
      stance: マシンと一緒に問題も大きくなるかを問う
      mechanism: |-
        使える時間を固定すると、大きな計算機ではそれに比例して大きな問題を解ける。そのため規模が大きくなるほど逐次部分の割合は小さくなり、速度向上はほぼ線形に伸びる。作業量を固定して考えるアムダールの悲観的な見方に対する、楽観的な側の見方だ。
      counter:
        name: アムダールの法則
        note: |-
          作業量の大きさが固定なら、やはり逐次部分が速度向上の上限を決める
      guideline: |-
        コアの追加を求める前に、問題の規模がハードウェアに合わせて大きくなるかを確かめる。作業量が固定ならアムダールで考え、規模とともに増えるならグスタフソンで考える。
      example: |-
        2023年の論文で、AMD の技術者たちはスーパーコンピュータ Frontier 向けの Linpack 実装 rocHPL を、Frontier の先行利用システム Crusher の1から128ノードで動かした。ノード数を増やすたびに、問題サイズ N を固定せず、GPU のメモリをまた埋めるところまで大きくした。性能は1ノードの153 TFLOPS から128ノードの17.75 PFLOPS まで伸び、弱スケーリング効率は90%を超えた。
      source: |-
        John L. Gustafson『Reevaluating Amdahl's Law』(Communications of the ACM, 1988)。

  - slug: tail-at-scale
    tag: distributed-systems
    source_url: https://doi.org/10.1145/2408776.2408794
    example_url: "https://grafana.com/blog/2021/08/27/grafana-tempo-1.1-released-new-hedged-requests-reduce-latency-by-45/"
    see_also:
      - littles-law
      - error-budget
      - kingmans-formula
    en:
      title: The Tail at Scale
      concept: When one request fans out to many servers, the slowest one sets the response time.
      stance: In a fan-out, watch the tail, not the average
      mechanism: |-
        In a service that fans out to many components, rare per-node slowness (GC pauses, contention, a failing disk) is near-certain to hit some node on every request. So tail latency (p99, p99.9) governs the user experience even when medians look healthy.
      counter:
        name: Redundancy Has a Price
        note: |-
          hedged and tied requests add load; don't chase the tail where the median is what users feel
      guideline: |-
        Set SLOs on p99/p99.9, not the mean, and deploy tail-tolerance — hedged requests, micro-partitioning — instead of trying to make every node uniformly fast.
      example: |-
        In August 2021, Grafana's tracing backend Tempo 1.1 added hedged requests: when a read from object storage takes longer than a set threshold, Tempo sends it again and uses whichever answer comes back. With the threshold at the backend's p99, only the slowest 1% of requests are resent. Grafana reported that query p99 fell from about 4.5 seconds to 2.5 seconds, a 45% improvement.
      source: |-
        Jeffrey Dean & Luiz André Barroso, *The Tail at Scale* (Communications of the ACM, 2013).
    ja:
      title: スケールの裾野
      concept: 一つのリクエストが多数のサーバに分かれると、最も遅いサーバが応答時間を決める。
      stance: ファンアウトでは、平均でなく遅い裾を見る
      mechanism: |-
        多数の部品に処理を広げるサービスでは、ノードごとにはまれな遅延（GC の停止、競合、故障しかけのディスク）が、ほぼすべてのリクエストでどこかのノードに当たる。そのため中央値が健全に見えても、テールレイテンシ（p99、p99.9）が利用者の体感を左右する。
      counter:
        name: 冗長化には代償がある
        note: |-
          ヘッジドリクエストや連動リクエストは負荷を増やす。利用者の体感を決めるのが中央値なら、テールを追いかけない
      guideline: |-
        SLO は平均ではなく p99／p99.9 に設定する。すべてのノードを同じように速くしようとするのではなく、ヘッジドリクエストやマイクロパーティショニングのようなテール対策を入れる。
      example: |-
        2021年8月、Grafana のトレーシング基盤 Tempo 1.1 はヘッジドリクエストを加えた。オブジェクトストレージへの読み出しが設定したしきい値より長くかかると、もう一度リクエストを送り、先に返ってきた方を使う。しきい値をバックエンドの p99 にすれば、再送されるのは最も遅い1%のリクエストだけになる。Grafana によると、p99 は約4.5秒から2.5秒に下がり、45%改善した。
      source: |-
        Jeffrey Dean & Luiz André Barroso『The Tail at Scale』(Communications of the ACM, 2013)。

  - slug: ashbys-law
    tag: systems
    source_url: https://archive.org/details/introductiontocy00ashb
    see_also:
      - teslers-law
      - normal-accident-theory
      - kiss-principle
    en:
      title: Ashby's Law of Requisite Variety
      concept: A controller can only handle a system if it can respond to as many states as the system has.
      stance: Match the system's variety, or cut it down
      mechanism: |-
        A controller can regulate a system only if it can match the variety of states that system can produce. Under-powered control simply cannot cope with a sufficiently rich environment.
      counter:
        name: Constrain the Environment
        note: excess control variety is itself cost and complexity
      guideline: |-
        When incidents keep escaping your alerts and runbooks, either add matching response capability or deliberately shrink the system's state space: fewer configurations, stricter inputs.
      source: |-
        W. Ross Ashby, *An Introduction to Cybernetics* (Chapman & Hall, 1956; the linked scan is the Wiley, New York, printing of the same year), ch. 11 — the law of requisite variety.
    ja:
      title: アシュビーの必要多様性の法則
      concept: 制御側は、対象がとりうる状態と同じだけの対応を持たないと制御できない。
      stance: システムの多様さに見合う手を持つか、多様さを減らす
      mechanism: |-
        制御する側が系を調整できるのは、その系が生み出しうる状態の多様さに見合うだけの対応を持つときだけだ。制御が力不足なら、十分に複雑な環境にはそもそも対処できない。
      counter:
        name: 環境そのものを制約する
        note: |-
          制御側の多様さが過剰なら、それ自体がコストと複雑さになる
      guideline: |-
        障害がアラートや手順書を何度もすり抜けるなら、それに見合うだけ対応能力を増やすか、設定を減らし入力を厳しくして、系がとりうる状態をあえて減らす。
      source: |-
        W. Ross Ashby『An Introduction to Cybernetics』(Chapman & Hall, 1956。リンク先のスキャンは同年の Wiley, New York 版) 第 11 章。必要多様性の法則の出典。

  - slug: law-of-demeter
    tag: maintainability
    source_url: https://doi.org/10.1109/52.35588
    see_also:
      - leaky-abstractions
      - dry-principle
      - single-responsibility-principle
    en:
      title: Law of Demeter
      concept: "Code that reaches through other objects' internals breaks when anything in the chain changes."
      stance: Talk to your neighbours, not to their neighbours
      mechanism: |-
        An object that reaches through other objects' internals (`a.getB().getC().doThing()`) couples itself to the entire dependency chain, so a change anywhere along that chain ripples back and breaks it.
      counter:
        name: Pragmatism over Dogma
        note: strict application breeds forwarding and wrapper bloat
      guideline: |-
        Only call methods on your direct collaborators, your arguments, objects you create, and your own fields. If you are chaining getters, add a method to the object that owns the data.
      source: |-
        Karl Lieberherr & Ian Holland, *Assuring Good Style for Object-Oriented Programs* (IEEE Software, 1989).
    ja:
      title: デメテルの法則
      concept: 他のオブジェクトの内部をたどるコードは、その連鎖のどこが変わっても壊れる。
      stance: 隣とだけ話し、隣の隣には手を伸ばさない
      mechanism: |-
        他のオブジェクトの内部をたどって呼び出すコード（`a.getB().getC().doThing()`）は、依存の連鎖全体と結びついてしまう。そのため連鎖のどこかが変わると、その影響が伝わってこのコードが壊れる。
      counter:
        name: 教条より実用
        note: |-
          厳密に適用すると、転送メソッドやラッパーが増えすぎる
      guideline: |-
        メソッドを呼ぶ相手は、直接の協力オブジェクト、引数、自分で生成したオブジェクト、自分のフィールドに限る。getter をつなげて呼んでいるなら、データを持っているオブジェクトの側にメソッドを足す。
      source: |-
        Karl Lieberherr & Ian Holland『Assuring Good Style for Object-Oriented Programs』(IEEE Software, 1989)。

  - slug: jevons-paradox
    tag: incentives
    source_url: https://archive.org/details/in.ernet.dli.2015.224624
    example_url: "https://www.sandia.gov/-jytsao/energy/"
    see_also:
      - cobra-effect
      - wirths-law
    en:
      title: Jevons Paradox
      concept: Making a resource cheaper to use can increase how much of it is used in total.
      stance: Make something cheaper and expect more of it to be used
      mechanism: |-
        Making a resource cheaper to use per unit lowers its effective price and can raise total consumption instead of lowering it — the efficiency gain is spent on more usage rather than banked as savings.
      counter:
        name: Cap the Rebound
        note: |-
          pair efficiency with a quota, cap, or price signal to actually capture the savings
      guideline: |-
        When you make something cheaper — compute, storage, an internal API — expect demand to balloon; provision and budget for the rebound instead of assuming a net reduction.
      example: |-
        Sandia National Laboratories researcher Jeff Tsao and colleagues compiled lighting data spanning three centuries, six continents and five lighting technologies. Each gain in efficiency was met by consuming more light, so global energy use for lighting showed a 100% rebound: the efficiency gains were fully offset, and energy use for lighting did not fall. The authors still argue for better lighting, and say their result is misread as proof that efficiency is counterproductive.
      source: |-
        William Stanley Jevons, *The Coal Question* (Macmillan, 1865), ch. 7 — "It is wholly a confusion of ideas to suppose that the economical use of fuel is equivalent to a diminished consumption."
    ja:
      title: ジェヴォンズのパラドックス
      concept: 資源を安く使えるようにすると、かえって総使用量が増えることがある。
      stance: 安くすれば、使われる量は増えると見込む
      mechanism: |-
        資源を単位あたり安く使えるようになると実効価格が下がり、総消費量は減るどころか増えることがある。効率化で浮いた分は節約として残らず、さらなる利用に回る。
      counter:
        name: 反動に上限を設ける
        note: |-
          効率化には割当、上限、価格シグナルを組み合わせ、節約分を実際に手元に残す
      guideline: |-
        計算資源、ストレージ、社内 API などを安くしたら、需要が大きく膨らむと見込む。全体として減ると決めつけず、反動を見込んで容量と予算を確保する。
      example: |-
        サンディア国立研究所の Jeff Tsao らは、3世紀、6大陸、5つの照明技術にわたる照明のデータを集めた。効率が上がるたびに使う光の量が増え、照明に使う世界のエネルギーは100%のリバウンドを示した。効率化の分はすべて相殺され、照明のエネルギー消費は減らなかった。それでも著者らは照明技術の改良を進めるべきだとし、この結果が効率化は逆効果だという意味に誤読されていると述べている。
      source: |-
        William Stanley Jevons『The Coal Question』(Macmillan, 1865) 第 7 章。「燃料を経済的に使うことが消費の減少に等しいと考えるのは、まったくの考え違いである」の出典。

  - slug: normal-accident-theory
    tag: safety
    source_url: https://en.wikipedia.org/wiki/Normal_Accidents
    see_also:
      - normalization-of-deviance
      - swiss-cheese-model
      - ironies-of-automation
      - ashbys-law
      - five-whys
    en:
      title: Normal Accident Theory
      concept: In complex, tightly coupled systems, accidents are built into the structure.
      stance: Loosen the coupling before you add more safeguards
      mechanism: |-
        In systems that are both interactively complex and tightly coupled, small independent failures interact in ways no designer anticipated and propagate faster than operators can intervene — so accidents become a property of the structure, not bad luck.
      counter:
        name: High-Reliability Organizations
        note: |-
          organizations such as aircraft carriers and air-traffic control run tightly coupled, complex systems with very few accidents, through redundancy, deference to expertise and constant attention to small failures
      guideline: |-
        Reduce coupling — add buffers, timeouts, bulkheads, and circuit breakers — and cut complexity before adding more safety interlocks, which themselves add interactions.
      source: |-
        Charles Perrow, *Normal Accidents: Living with High-Risk Technologies* (Basic Books, 1984).
    ja:
      title: 通常事故理論
      concept: 複雑で密に結合したシステムでは、事故は構造そのものから生じる。
      stance: 安全装置を足す前に、結合を緩める
      mechanism: |-
        相互作用が複雑で、しかも密に結合した系では、独立した小さな故障が設計者の予想しない形で絡み合い、運用者が手を打つより速く広がる。そのため事故は運の悪さではなく、構造がもつ性質になる。
      counter:
        name: 高信頼性組織（HRO）
        note: |-
          空母や航空管制のような組織は、冗長性、専門性への敬意、小さな失敗への絶え間ない注意によって、密結合で複雑な系をごく少ない事故で動かしている
      guideline: |-
        安全のための連動装置を足す前に、バッファ、タイムアウト、バルクヘッド、サーキットブレーカで結合を緩め、複雑さを減らす。連動装置そのものも相互作用を増やす。
      source: |-
        Charles Perrow『Normal Accidents: Living with High-Risk Technologies』(Basic Books, 1984)。

  - slug: broken-windows-theory
    tag: safety
    source_url: https://www.theatlantic.com/magazine/archive/1982/03/broken-windows/304465/
    example_url: "https://www.rug.nl/staff/e.m.steg/keizerlindenbergstegdisorder.pdf"
    see_also:
      - normalization-of-deviance
      - boy-scout-rule
      - code-health-standard
    en:
      title: Broken Windows Theory
      concept: Visible disorder left unrepaired can signal that standards are optional, inviting more.
      stance: Fix the defect in front of you before it becomes the standard
      mechanism: |-
        An unrepaired broken window signals that nobody is watching, which lowers the cost of the next violation. In a codebase, one tolerated hack, one skipped test and one permanently silenced alert together announce that the standard is optional.
      counter:
        name: Repair Is Not Free
        note: |-
          attention spent on paint is attention not spent on the foundation, and the criminological evidence for the original claim is contested
      guideline: |-
        Repair the first visible defect in a file you are already touching, and give every tolerated exception an owner and a date. Do not open a refactor for a window you are not standing next to.
      example: |-
        In a 2008 field experiment in Groningen, researchers attached flyers to bicycles parked in an alley with no trash cans and varied only the wall: clean, or covered in graffiti next to a no-graffiti sign. With the clean wall, 33% of cyclists littered the flyer; with graffiti, 69% did. One visible violation made people more likely to break a different rule.
      source: |-
        James Q. Wilson & George L. Kelling, *Broken Windows* (The Atlantic, March 1982).
    ja:
      title: 割れ窓理論
      concept: 放置された小さな乱れは、基準は守らなくてよいという合図になり、さらに乱れを呼びやすい。
      stance: 目の前の小さな乱れは、それが基準になる前に直す
      mechanism: |-
        割れたまま放置された窓は「誰も見ていない」という合図になり、次の違反のハードルを下げる。コードベースでも、見逃されたハック、飛ばされたテスト、ずっとミュートされたままのアラートが一つずつあれば、合わせて「この基準は守らなくてよい」と知らせることになる。
      counter:
        name: 修繕もタダではない
        note: |-
          塗装に注意を向ければ、その分だけ土台への注意が減る。そもそも元の犯罪学的な主張を裏づける証拠には異論がある
      guideline: |-
        いま触っているファイルに目に見える欠陥があれば、最初の一つを直す。黙認する例外にはすべて担当者と期限を付ける。自分がいま手を入れていない場所の窓を直すために、リファクタリングを始めない。
      example: |-
        2008年、オランダのフローニンゲンで行われた実地実験では、ゴミ箱のない路地に停めた自転車にチラシを付け、壁の状態だけを変えた。壁がきれいなときと、落書き禁止の掲示の横に落書きがあるときである。壁がきれいなときにチラシを捨てたのは33%、落書きがあるときは69%だった。目に見える違反が一つあると、人は別のルールも破りやすくなった。
      source: |-
        James Q. Wilson & George L. Kelling『Broken Windows』(The Atlantic, 1982 年 3 月号)。

  - slug: yagni
    tag: maintainability
    source_url: https://ronjeffries.com/xprog/articles/practices/pracnotneed/
    see_also:
      - chestertons-fence
      - galls-law
      - working-backwards
      - last-responsible-moment
    en:
      title: YAGNI
      concept: Code built for imagined future needs costs time now and rarely fits the need that arrives.
      stance: Build for the case you have, not the one you imagine
      mechanism: |-
        Speculative generality is paid for three times: writing the abstraction, carrying it while it is unused, and unpicking it when the anticipated requirement finally arrives in a different shape. Predictions about future requirements are usually wrong in exactly the details the abstraction fixed.
      counter:
        name: Chesterton's Fence
        note: |-
          YAGNI licenses you not to build something; it never licenses you to delete something whose purpose you have not established
      guideline: |-
        Implement the case you actually have. When you feel the pull to generalize, name the second concrete case first — if you cannot, you do not have a pattern, you have a guess.
      source: |-
        Ron Jeffries, Extreme Programming practice notes; named "You Aren't Gonna Need It" and popularized in Kent Beck, *Extreme Programming Explained* (1999).
    ja:
      title: YAGNI
      concept: 想像した将来のために書いたコードは、今の工数を食い、実際の要件に合うこともまれだ。
      stance: 想像した将来ではなく、いまある要件のために作る
      mechanism: |-
        推測で一般化したコードには、3回コストを払う。抽象を書くとき、使われないまま抱えているとき、そして予想した要件が実際には違う形で来て、抽象をほどくときだ。将来の要件の予測は、たいていその抽象が固定してしまった細部で外れる。
      counter:
        name: チェスタトンの柵
        note: |-
          YAGNI が認めるのは作らないことだけで、目的を確かめていないものを消すことまでは認めていない
      guideline: |-
        実装するのは、いま実際にあるケースだけにする。一般化したくなったら、まず2つ目の具体的なケースを挙げる。挙げられないなら、それはパターンではなく当て推量だ。
      source: |-
        Ron Jeffries による Extreme Programming の実践ノート。"You Aren't Gonna Need It" として命名され、Kent Beck『Extreme Programming Explained』(1999) で広まった。

  - slug: kiss-principle
    tag: maintainability
    source_url: https://en.wikipedia.org/wiki/KISS_principle
    see_also:
      - kernighans-law
      - ashbys-law
      - choose-boring-technology
    en:
      title: KISS Principle
      concept: A system has to be simple enough for an ordinary person to fix under bad conditions.
      stance: Simple means someone else can fix it at 3 AM
      mechanism: |-
        "Keep it simple, stupid" came out of aircraft design, where the requirement was that a jet be repairable by an average mechanic in a field with basic tools. The test was never elegance — it was whether an ordinary person could fix it in the worst circumstances the thing would actually meet.
      counter:
        name: Ashby's Law of Requisite Variety
        note: |-
          a system simpler than the problem it has to regulate cannot cope with it, and simplicity below that floor is displaced complexity rather than less of it
      guideline: |-
        Judge a design by who can repair it at 3 AM, not by how it reads in review. If the on-call engineer needs the author on the call, it is not simple — it is familiar to one person.
      source: |-
        Attributed to Kelly Johnson at Lockheed's Skunk Works (c. 1960), as a field-maintainability requirement for combat aircraft.
    ja:
      title: KISS の原則
      concept: システムは、普通の人が悪条件の中でも直せる程度に単純である必要がある。
      stance: 単純とは、夜中の3時に他人が直せることだ
      mechanism: |-
        "Keep it simple, stupid" は航空機設計から出た言葉で、要件は「平均的な整備兵が、基本的な工具だけで、野戦で直せること」だった。問われたのは優雅さではなく、その機体が実際に出会う最悪の状況で、普通の人が直せるかどうかだった。
      counter:
        name: アシュビーの必要多様性の法則
        note: |-
          制御すべき問題より単純な系は、その問題に対処できない。その下限を下回る単純さは、複雑さを減らしたのではなく、よそへ移しただけだ
      guideline: |-
        設計は、レビューでの読みやすさではなく「午前3時に誰が直せるか」で評価する。オンコール担当が作者を呼ばないと直せないなら、それは単純なのではなく、一人が慣れているだけだ。
      source: Lockheed Skunk Works の Kelly Johnson に帰される (1960 年頃)。戦闘機の野戦整備性の要求として。

  - slug: dry-principle
    tag: maintainability
    source_url: https://pragprog.com/titles/tpp20/the-pragmatic-programmer-20th-anniversary-edition/
    see_also:
      - law-of-demeter
      - single-responsibility-principle
    en:
      title: DRY Principle
      concept: Knowledge kept in two places drifts apart, because nothing makes the copies change together.
      stance: Deduplicate knowledge, not text
      mechanism: |-
        Duplicated knowledge drifts, because nothing forces the copies to change together. The cost is not the extra characters — it is that some future editor fixes one copy and ships a system that now quietly contradicts itself.
      counter:
        name: Duplication Is Cheaper Than the Wrong Abstraction
        note: |-
          two blocks that merely look alike today will fight each other the moment they need to diverge
      guideline: |-
        Deduplicate knowledge, not text. Before merging two similar blocks, ask whether they change for the same reason and at the request of the same person; if not, leave them apart.
      source: |-
        Andrew Hunt & David Thomas, *The Pragmatic Programmer* (Addison-Wesley, 1999) — "every piece of knowledge must have a single, unambiguous, authoritative representation within a system."
    ja:
      title: DRY 原則
      concept: 同じ知識を二か所に置くと、一緒に変わる保証がないので食い違っていく。
      stance: 重複をなくすのは、テキストではなく知識
      mechanism: |-
        重複した知識はいずれずれる。コピー同士を一緒に変えさせるものが何もないからだ。問題は余分な文字数ではない。将来誰かが片方だけを直し、気づかないうちに矛盾を抱えたシステムを出してしまうことだ。
      counter:
        name: 誤った抽象より重複のほうが安い
        note: |-
          今たまたま似ているだけの2つのブロックは、別々に変える必要が出たとたんに互いの足かせになる
      guideline: |-
        なくすのはテキストの重複ではなく知識の重複だ。似た2つのブロックをまとめる前に、同じ理由で、同じ人の要求によって変わるかを確かめる。そうでなければ分けたままにする。
      source: |-
        Andrew Hunt & David Thomas『The Pragmatic Programmer』(Addison-Wesley, 1999)。「あらゆる知識は、システムの中で単一かつ明確で権威ある表現を持たねばならない」の出典。

  - slug: theory-of-constraints
    tag: performance
    source_url: https://en.wikipedia.org/wiki/Theory_of_constraints
    example_url: "https://www.dbrmfg.co.nz/Critical%20Chain%20in%20Marine%20Corps%20Depot.pdf"
    see_also:
      - amdahls-law
      - littles-law
      - cost-of-delay
      - kingmans-formula
    en:
      title: Theory of Constraints
      concept: "A system's throughput is set by its single tightest bottleneck."
      stance: Improve the bottleneck first, because everything else is waiting on it
      mechanism: |-
        Every chain has one weakest link. Improvement anywhere else raises local efficiency while total throughput stays flat — and often makes things worse, because the faster upstream stage simply piles more work in front of the real bottleneck.
      counter:
        name: The Constraint Moves
        note: |-
          relieve one and another takes its place, so a process permanently optimized around yesterday's bottleneck starves at the new one
      guideline: |-
        Find the constraint, exploit it fully before you buy capacity, and subordinate every other stage to it. Then measure again — you have just created a different bottleneck somewhere else.
      example: |-
        In 2001 the Marine Corps Maintenance Center in Albany, Georgia, was overhauling five MK-48 heavy haulers a month against demand for ten, and nearly every shop was thought to be a bottleneck. A Theory of Constraints analysis found enough physical capacity; the real constraint was a push scheduling policy that released work regardless of resource status. After switching to pull scheduling, MK-48 repair cycle time fell from an average of 167 days to 58.
      source: |-
        Eliyahu M. Goldratt & Jeff Cox, *The Goal: A Process of Ongoing Improvement* (North River Press, 1984).
    ja:
      title: 制約理論
      concept: システムの処理量は、最も詰まっている一か所で決まる。
      stance: 改善はボトルネックに集める。ほかはそれを待っているだけだ
      mechanism: |-
        鎖には必ずいちばん弱い環が一つある。それ以外のどこを改善しても、その場所の効率は上がるが、全体のスループットは変わらない。むしろ悪化することが多い。速くなった上流工程が、本当のボトルネックの前に仕掛品をさらに積み上げるからだ。
      counter:
        name: 制約は移動する
        note: |-
          一つを緩めれば別のものが制約になる。昨日のボトルネックに合わせて恒久的に最適化した工程は、新しい制約の前で立ち往生する
      guideline: |-
        制約を特定し、能力を買い足す前にまずそれを目一杯使い切り、他の全工程をそれに従わせる。そのあと測り直す。今の改善で、別の場所に新しいボトルネックができているからだ。
      example: |-
        2001年、ジョージア州オールバニの海兵隊整備センターは、月10台の需要に対して大型輸送車両 MK-48 を月5台しか整備できず、ほぼすべての工程がボトルネックだと思われていた。制約理論による分析では、物理的な能力は十分にあり、本当の制約は資源の状況に関係なく作業を投入するプッシュ型の計画方針だった。プル型の計画に切り替えると、MK-48 の修理リードタイムは平均167日から58日に縮んだ。
      source: |-
        Eliyahu M. Goldratt & Jeff Cox『The Goal: A Process of Ongoing Improvement』(North River Press, 1984)。

  - slug: occams-razor
    tag: cognition
    source_url: https://en.wikipedia.org/wiki/Occam%27s_razor
    see_also:
      - normalcy-bias
      - hanlons-razor
    en:
      title: Occam's Razor
      concept: The explanation that needs the fewest unverified assumptions is usually the right one.
      stance: Test the explanation with the fewest assumptions first
      mechanism: |-
        Under incident pressure the mind reaches for the interesting hypothesis — a kernel bug, a bad disk, an attacker. The explanation requiring the fewest unverified assumptions is often the deploy that went out twenty minutes ago.
      counter:
        name: Hickam's Dictum
        note: |-
          a system can carry several independent faults at once, and the simplest story that fits the symptoms is not automatically the true one
      guideline: |-
        Rank your hypotheses by how many unverified assumptions each needs, and test the cheapest first. Ask "what changed?" before "what is broken?"
      source: |-
        Attributed to William of Ockham (c. 1287–1347); the shaving metaphor and the formula *entia non sunt multiplicanda praeter necessitatem* are both later glosses on his principle of parsimony.
    ja:
      title: オッカムの剃刀
      concept: 検証されていない仮定が最も少ない説明が、たいてい正しい。
      stance: 仮定の少ない説明から確かめる
      mechanism: |-
        インシデント対応で追い込まれると、人は面白い仮説に飛びつく。カーネルのバグ、壊れたディスク、攻撃者。だが、未検証の仮定がいちばん少なくて済む説明は、多くの場合「20分前に出たデプロイ」だ。
      counter:
        name: ヒッカムの格言
        note: |-
          システムは独立した障害を同時にいくつも抱えることがある。症状に合ういちばん単純な説明が、そのまま真実とは限らない
      guideline: |-
        仮説を「未検証の仮定がいくつ必要か」で並べ、安く確かめられるものから検証する。「何が壊れたか」より先に「何が変わったか」を聞く。
      source: |-
        オッカムのウィリアム (1287 年頃–1347) に帰される。「剃刀」の比喩も、定式 *entia non sunt multiplicanda praeter necessitatem* も、彼の倹約の原理に対する後世の注釈である。

  - slug: single-responsibility-principle
    tag: maintainability
    source_url: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
    see_also:
      - dry-principle
      - law-of-demeter
      - conways-law
    en:
      title: Single Responsibility Principle
      concept: A module serving two groups gets conflicting change requests from both.
      stance: Split code along the line of who asks for changes
      mechanism: |-
        When one module serves two audiences, their change requests arrive on different schedules and collide in the same file. Coupling is not really about calls between modules — it is about who is entitled to force you to edit them.
      counter:
        name: Premature Decomposition
        note: |-
          splitting by imagined responsibilities produces a scatter of one-method classes and moves all the complexity into the wiring between them
      guideline: |-
        Define responsibility by who asks for the change, not by what the code does. If two different people can each demand an edit to the same module, split it along that line and nowhere else.
      source: |-
        Robert C. Martin, *Agile Software Development: Principles, Patterns, and Practices* (2002); sharpened to "a module should be responsible to one, and only one, actor" in *The Single Responsibility Principle* (The Clean Code Blog, 8 May 2014), which is what this links to, and restated in *Clean Architecture* (2017).
    ja:
      title: 単一責任の原則
      concept: |-
        二つの利用者グループに使われるモジュールには、両方から食い違う変更要求が届く。
      stance: コードは、変更を頼んでくる人の境目で分ける
      mechanism: |-
        一つのモジュールを二つの利用者グループが使っていると、それぞれの変更要求は別々のタイミングで届き、同じファイルの上でぶつかる。結合の問題は、実はモジュール間の呼び出しではなく、誰があなたにそのモジュールの修正を迫れるかにある。
      counter:
        name: 早すぎる分解
        note: |-
          想像した責務で分割すると、メソッドが一つしかないクラスが散らばり、複雑さはすべてクラス同士のつなぎ込みに移るだけになる
      guideline: |-
        責務は、コードが何をするかではなく、誰が変更を求めてくるかで決める。同じモジュールに対して別々の人がそれぞれ修正を求められるなら、その線で分割し、それ以外では分けない。
      source: |-
        Robert C. Martin『Agile Software Development: Principles, Patterns, and Practices』(2002)。『The Single Responsibility Principle』(The Clean Code Blog, 2014 年 5 月 8 日、本項のリンク先) で「モジュールはただ一人のアクターに対して責任を負う」と鋭くされ、『Clean Architecture』(2017) で再掲された。

  - slug: principle-of-least-astonishment
    tag: interaction
    source_url: https://en.wikipedia.org/wiki/Principle_of_least_astonishment
    example_url: "https://www.nysd.uscourts.gov/sites/default/files/2021-02/20cv6539%20Citibank%20Opinion.pdf"
    see_also:
      - hyrums-law
      - curse-of-knowledge
    en:
      title: Principle of Least Astonishment
      concept: Behavior that surprises users costs more than behavior that is slightly worse but expected.
      stance: When in doubt, do what users already expect
      mechanism: |-
        Users arrive with a model assembled from every similar thing they have used. A behavior that is defensible but surprising costs more than a behavior that is slightly worse but predicted, because the surprise is paid again by every user, every time, forever.
      counter:
        name: Astonishment Is Relative
        note: |-
          designing only for today's expectations freezes bad conventions in place; sometimes the right move is to surprise everyone once, loudly, with a migration path
      guideline: |-
        When two designs are close, take the one that matches the convention your users already know — the flag name, the exit code, the sort order. Spend deliberate surprise only where you can afford to announce it.
      example: |-
        On August 11, 2020, Citibank meant to send Revlon's lenders only an interest payment but wired out nearly $900 million, including about $894 million of principal. In its Flexcube software, suppressing a principal payment required setting three fields (FRONT, FUND and PRINCIPAL) to an internal wash account, yet all three employees who built and approved the payment believed setting PRINCIPAL alone was enough. The approver wrote, "Principal is going to wash."
      source: |-
        Long-standing folklore in language and interface design; stated explicitly in Michael F. Cowlishaw, *The Design of the REXX Language* (IBM Systems Journal, 1984).
    ja:
      title: 驚き最小の原則
      concept: 利用者を驚かせる挙動は、少し劣っても予想どおりの挙動より高くつく。
      stance: 迷ったら、利用者が予想するとおりに動かす
      mechanism: |-
        利用者は、これまで使ってきた似たものすべてから組み立てたモデルを持ってやって来る。筋は通っていても意外な挙動は、少し劣っていても予想どおりの挙動より高くつく。驚きのコストは、すべての利用者が毎回、いつまでも払い続けるからだ。
      counter:
        name: 驚きは相対的である
        note: |-
          今日の期待だけに合わせて設計すると、悪い慣習がそのまま固定される。移行手順を用意したうえで、一度だけ大々的に全員を驚かせるのが正しいこともある
      guideline: |-
        2つの設計が拮抗したら、フラグ名、終了コード、並び順など、利用者がすでに知っている慣習に合うほうを選ぶ。意図した驚きは、告知するコストを払える場所でだけ使う。
      example: |-
        2020年8月11日、Citibank は Revlon の貸し手に利息だけを払うつもりで、元本約8億9400万ドルを含む約9億ドルを送金してしまった。同行の Flexcube というソフトでは、元本の支払いを止めるには FRONT、FUND、PRINCIPAL の三つの欄をすべて社内の振替口座に設定する必要があった。しかし支払いを作成し承認した3人とも、PRINCIPAL だけを設定すれば足りると思っていた。承認者は「元本は振替口座へ回る」と書いていた。
      source: |-
        言語・インタフェース設計の古くからの言い伝え。Michael F. Cowlishaw『The Design of the REXX Language』(IBM Systems Journal, 1984) に明示的な記述がある。

  - slug: second-system-effect
    tag: systems
    source_url: https://en.wikipedia.org/wiki/Second-system_effect
    see_also:
      - brooks-law
      - galls-law
      - worse-is-better
      - strangler-fig
    en:
      title: Second-System Effect
      concept: After a first success, designers tend to pack the ideas they deferred into the second system.
      stance: In a rewrite, carry over the constraints, not the wish list
      mechanism: |-
        The first system is built cautiously, by someone unsure of the ground. Its success converts that caution into confidence, and every idea deferred the first time is loaded into the rewrite at once. The result, Brooks warns, is the most dangerous system a designer ever builds: over-general and late.
      counter:
        name: Dead-End Architecture
        note: |-
          some first systems cannot be grown: a data model, a platform or a security boundary that blocks the next step outright, and there a deliberate, scoped second system is the right call
      guideline: |-
        When rewriting, carry forward the constraints and not just the wish list. Cut the deferred features to the few that actually blocked users, and replace the original one piece at a time.
      source: Fred Brooks, *The Mythical Man-Month* (Addison-Wesley, 1975), chapter 5.
    ja:
      title: セカンドシステム症候群
      concept: 最初の成功のあと、設計者は先送りしたアイデアを二作目に詰め込みがちだ。
      stance: 作り直しで持ち越すのは、願望リストではなく制約
      mechanism: |-
        最初のシステムは、足場がどれだけ固いか分からない人が慎重に作る。それが成功すると慎重さは自信に変わり、1回目に見送ったアイデアがまとめて書き直しに注ぎ込まれる。Brooks によれば、そうしてできるのは設計者が作るものの中でいちばん危険なシステムで、汎用にしすぎたうえに遅れる。
      counter:
        name: 行き止まりのアーキテクチャ
        note: |-
          育てようのない最初のシステムもある。データモデル、プラットフォーム、セキュリティ境界が次の一歩を完全に塞いでいるなら、範囲を絞って意図的に作る2番目のシステムが正しい判断になる
      guideline: |-
        書き直すときは、やりたいことの一覧だけでなく制約も引き継ぐ。見送っていた機能は、実際に利用者の妨げになっていた少数まで削り、元のシステムを一つずつ置き換える。
      source: Fred Brooks『人月の神話』(Addison-Wesley, 1975) 第 5 章。

  - slug: moores-law
    tag: performance
    source_url: https://doi.org/10.1109/N-SSC.2006.4785860
    see_also:
      - wirths-law
      - gustafsons-law
      - the-bitter-lesson
    en:
      title: Moore's Law
      concept: The number of transistors on a chip at lowest cost per part doubles about every two years.
      stance: Don't count on next year's hardware to save the design
      mechanism: |-
        Moore's observation was economic rather than physical: the component count giving the lowest cost per component doubles about every two years. It held for half a century and quietly underwrote every plan that assumed hardware would rescue it — but single-thread performance stopped following it once Dennard scaling ended around 2005.
      counter:
        name: Wirth's Law
        note: |-
          the gains get spent rather than banked, and clock speed stopped rising long before transistor counts did
      guideline: |-
        Do not budget for the hardware bailing out a design. If the workload is single-threaded and latency-bound, next year's machine will not save it — you have to parallelize it or do less work.
      source: |-
        Gordon E. Moore, *Cramming More Components onto Integrated Circuits* (Electronics, 19 April 1965; reprinted in IEEE Solid-State Circuits Society Newsletter, 2006, which is what this links to), which projected a doubling every year; Moore revised it to every two years in *Progress in Digital Integrated Electronics* (IEDM, 1975).
    ja:
      title: ムーアの法則
      concept: 部品単価が最も安くなるチップのトランジスタ数は、約2年ごとに倍になる。
      stance: 来年のハードが設計を救ってくれると当てにしない
      mechanism: |-
        ムーアの観察は物理ではなく経済の話だった。部品あたりのコストが最小になる集積度が、およそ2年で倍になるというものだ。これは半世紀にわたって成り立ち、「いずれハードウェアが何とかしてくれる」と見込んだあらゆる計画を暗黙のうちに支えてきた。だが2005年頃にデナードスケーリングが終わってから、シングルスレッド性能はこの曲線に乗らなくなった。
      counter:
        name: ヴィルトの法則
        note: |-
          得られた余力は貯めておかれずに使い切られる。しかもクロック速度は、トランジスタ数よりずっと早く頭打ちになった
      guideline: |-
        設計の問題をハードウェアが救ってくれる前提で予算を組まない。ワークロードがシングルスレッドでレイテンシ律速なら、来年のマシンでも解決しない。並列化するか、処理の量を減らすしかない。
      source: |-
        Gordon E. Moore『Cramming More Components onto Integrated Circuits』(Electronics, 1965 年 4 月 19 日、IEEE Solid-State Circuits Society Newsletter 2006 年の再録が本項のリンク先) は毎年の倍増を予測した。2 年ごとへの修正は『Progress in Digital Integrated Electronics』(IEDM, 1975)。

  - slug: amaras-law
    tag: estimation
    source_url: https://en.wikipedia.org/wiki/Roy_Amara
    see_also:
      - survivorship-bias
      - lindy-effect
    en:
      title: Amara's Law
      concept: New technology is overrated in its first years and underrated over a decade.
      stance: Discount the two-year hype, but respect the ten-year shift
      mechanism: |-
        A new technology is judged on a demo, which flatters it, and then adopted against an installed base, which resists it — so the first two years disappoint. The same compounding that made the early forecast wrong then runs for a decade in the other direction, and the ten-year forecast turns out to be wrong too, this time low.
      counter:
        name: Some Things Simply Do Not Arrive
        note: |-
          survivorship makes the law look inevitable, because the technologies that never got a long run are not the ones quoted back at us
      guideline: |-
        Discount two-year forecasts about a new technology and take ten-year ones seriously — but plan around the version that actually ships, not the one in the demo.
      source: |-
        Roy Amara, president of the Institute for the Future; attributed and circulated from the 1970s onward.
    ja:
      title: アマラの法則
      concept: 新しい技術は、最初の数年は過大評価され、十年単位では過小評価される。
      stance: 二年先の熱狂は割り引き、十年先の変化は侮らない
      mechanism: |-
        新技術はデモで評価され、デモは技術を実際より良く見せる。そのうえ導入先には既存の設備があり、それが新技術を受け入れない。だから最初の2年は期待外れに終わる。その後、初期の予測を外させたのと同じ複利が10年かけて逆向きに働き、10年予測も外れる。今度は低すぎる方向にだ。
      counter:
        name: そもそも来ないものもある
        note: |-
          生存者バイアスのせいで、この法則は必然に見える。長く続かなかった技術は、あとから引き合いに出されないからだ
      guideline: |-
        新技術の2年予測は割り引き、10年予測は真剣に受け止める。ただし計画は、デモ版ではなく実際に出荷される版を前提に立てる。
      source: Institute for the Future 会長 Roy Amara に帰される。1970 年代以降に流布した言葉。

  - slug: the-bitter-lesson
    tag: systems
    source_url: https://web.archive.org/web/2024/http://www.incompleteideas.net/IncIdeas/BitterLesson.html
    see_also:
      - cargo-cult-engineering
      - moores-law
    en:
      title: The Bitter Lesson
      concept: In AI, general methods that scale with compute have, in the long run, beaten hand-coded human knowledge.
      stance: Bet on what gets better on its own when the budget doubles
      mechanism: |-
        Across seven decades of AI research the approaches that won were search and learning scaled with available computation, not the ones that encoded human insight about the domain. Built-in knowledge helps in the short run and becomes the ceiling in the long run, because unlike computation it does not get cheaper every year.
      counter:
        name: Compute Is Not Free
        note: |-
          inside a fixed budget domain knowledge is often the only lever you have, and the lesson describes the trajectory of a field rather than the right move this quarter
      guideline: |-
        When choosing between encoding what you know and building something that learns from more data or more compute, ask which one improves on its own when the budget doubles. Bet on that one for anything with a multi-year horizon.
      source: Richard S. Sutton, *The Bitter Lesson* (13 March 2019).
    ja:
      title: 苦い教訓
      concept: AIでは長い目で見ると、計算量とともに伸びる汎用手法が、人が作り込んだ知識に勝ってきた。
      stance: 予算が倍になったとき、勝手に良くなるほうに賭ける
      mechanism: |-
        AI研究の70年を通じて勝ってきたのは、使える計算量に合わせてスケールする探索と学習で、その分野についての人間の知見を組み込んだ手法ではなかった。作り込んだ知識は短期的には役に立つが、長期的には天井になる。計算資源と違って、毎年安くなるわけではないからだ。
      counter:
        name: 計算資源はタダではない
        note: |-
          予算が固定されていれば、使える手段が領域知識しかないことも多い。この教訓は分野がたどってきた流れを述べたもので、今四半期に何をすべきかを示すものではない
      guideline: |-
        知っていることを組み込むか、より多くのデータや計算から学ぶものを作るかで迷ったら、予算が倍になったときに手を加えなくても良くなるのはどちらかを考える。数年単位の取り組みなら、そちらに賭ける。
      source: Richard S. Sutton『The Bitter Lesson』(2019 年 3 月 13 日)。

  - slug: metcalfes-law
    tag: systems
    source_url: https://en.wikipedia.org/wiki/Metcalfe%27s_law
    example_url: "https://doi.org/10.1007/s11390-015-1518-1"
    see_also:
      - dunbars-number
      - brooks-law
    en:
      title: Metcalfe's Law
      concept: "Each new node adds value to every existing one, so a network's value outgrows its size."
      stance: Add connections in a product, cut them in a team
      mechanism: |-
        A network of n nodes has n(n−1)/2 possible connections, so its value was claimed to scale with n². The exponent is disputed — n log n fits real networks better — but the shape holds: each new node adds value to every existing node, which is why networks tip rather than grow smoothly.
      counter:
        name: The Same Quadratic Is a Cost
        note: |-
          connections are an asset between users and a liability between colleagues; Brooks' Law is Metcalfe's Law with the sign flipped
      guideline: |-
        For a product whose value comes from other users, spend early effort on the smallest network that is already useful to its own members, not on features. For a team, do the opposite and cut connections.
      example: |-
        In 2015 researchers at the Chinese Academy of Sciences tested four proposed network-value laws against real financial and user data from Tencent and Facebook. Metcalfe's law, value proportional to the square of the number of users, fit both companies' data better than the alternatives they tested, and the paper reports that costs also grew with the square of network size. It is one fit on two social platforms; the n log n critique by Briscoe, Odlyzko and Tilly still stands.
      source: |-
        Attributed to Robert Metcalfe (c. 1980); the n log n critique is Bob Briscoe, Andrew Odlyzko & Benjamin Tilly, *Metcalfe's Law is Wrong* (IEEE Spectrum, July 2006).
    ja:
      title: メトカーフの法則
      concept: ノードが一つ増えるたびに既存の全ノードの価値が上がり、価値は規模より速く増える。
      stance: プロダクトではつながりを増やし、チームでは減らす
      mechanism: |-
        n ノードのネットワークには n(n−1)/2 通りの接続がありうるので、価値は n² に比例すると言われた。指数には異論があり、実際のネットワークには n log n のほうがよく合う。それでも形は変わらない。新しいノードは既存の全ノードに価値を足す。だからネットワークは滑らかには育たず、ある時点で一気に傾く。
      counter:
        name: 同じ二次関数はコストでもある
        note: 接続は利用者どうしでは資産だが、同僚どうしでは負債になる。ブルックスの法則はメトカーフの法則の符号を反転させたものだ
      guideline: |-
        他の利用者から価値が生まれるプロダクトでは、初期の労力を機能ではなく、参加者にとってすでに役に立つ最小のネットワークづくりに注ぐ。チームでは逆に、接続を減らす。
      example: |-
        2015年、中国科学院の研究者たちは、ネットワークの価値に関する4つの法則を、Tencent と Facebook の実際の財務データと利用者数で検証した。価値は利用者数の2乗に比例するというメトカーフの法則が、両社のデータに、検証したほかの法則よりよく当てはまった。論文はコストも規模の2乗で増えていたと報告している。ただしこれは二つのソーシャル基盤での当てはめで、Briscoe、Odlyzko、Tilly による n log n の反論は今も残っている。
      source: |-
        Robert Metcalfe に帰される (1980 年頃)。n log n による批判は Bob Briscoe, Andrew Odlyzko & Benjamin Tilly『Metcalfe's Law is Wrong』(IEEE Spectrum, 2006 年 7 月)。

  - slug: ringelmann-effect
    tag: organization
    source_url: https://en.wikipedia.org/wiki/Ringelmann_effect
    example_url: "https://web.mit.edu/curhan/www/docs/Articles/15341_Readings/Group_Dynamics/required_reading/4Latane_et_al_1979_Many_hands_make_light_the_work.pdf"
    see_also:
      - bystander-effect
      - dunbars-number
    en:
      title: Ringelmann Effect
      concept: Each person contributes less as a group grows, most of all when no one can see who did what.
      stance: Make each contribution visible and owned
      mechanism: |-
        Ringelmann had men pull a rope alone and in teams, and measured the force. Each additional person contributed less than they had alone — partly coordination loss, partly reduced individual effort once the contribution stopped being separable. It shows up wherever output is pooled and nobody can see who produced which part.
      counter:
        name: Separable Contribution
        note: |-
          the effect is a property of how the work is measured rather than of the people; make the individual contribution legible and most of it disappears
      guideline: |-
        Give every workstream one named owner and a visible output. If you cannot say who produced which part of a result, expect the group to produce less than the sum of its members.
      example: |-
        In 1979, Latané, Williams and Harkins at Ohio State had students shout as loudly as they could, alone or in groups. In groups of two they produced 66% of their individual capacity and in groups of six only 36%. Blindfolded and wearing headphones, students who only believed others were shouting with them still shouted at 82% (one partner) and 74% (five partners) of their solo intensity, so about half the loss came from reduced effort rather than coordination.
      source: |-
        Maximilien Ringelmann, *Recherches sur les moteurs animés: Travail de l'homme* (Annales de l'Institut National Agronomique, 1913).
    ja:
      title: リンゲルマン効果
      concept: 集団が大きくなるほど、一人ひとりが出す力は減る。誰の成果か見えないと特にそうだ。
      stance: 誰が何をしたかを見えるようにし、担当を決める
      mechanism: |-
        リンゲルマンは、綱を一人で引かせた場合とチームで引かせた場合の力を測った。人を増やすたびに、一人あたりの力は単独のときより小さくなった。一部は連携のロスで、一部は誰がどれだけやったか分からなくなったとたんに個人の努力が減ることによる。成果が合算され、誰がどの部分を出したか見えない場所なら、どこでも起きる。
      counter:
        name: |-
          一人ずつの仕事を見えるようにする
        note: |-
          この効果は人の性質ではなく、仕事の測り方から生まれる。誰がどれだけやったかが見えるようにすれば、効果の大半は消える
      guideline: |-
        作業の流れごとに、名前の分かる担当者を一人と、目に見える成果物を決める。結果のどの部分を誰が出したか言えないなら、その集団は全員の力の合計より少ない成果しか出さないと見ておく。
      example: |-
        1979年、オハイオ州立大学の Latané、Williams、Harkins は、学生に一人で、または集団で、できるだけ大きな声を出させた。2人組では一人のときの能力の66%、6人組では36%しか出なかった。目隠しとヘッドホンをつけ、他の人も叫んでいると思い込ませただけの条件でも、声の強さは一人のときの82%（相手が1人）と74%（相手が5人）に落ちた。損失のおよそ半分は連携のずれではなく、努力の減少から来ていた。
      source: |-
        Maximilien Ringelmann『Recherches sur les moteurs animés: Travail de l'homme』(Annales de l'Institut National Agronomique, 1913)。

  - slug: shirky-principle
    tag: incentives
    source_url: https://kk.org/thetechnium/the-shirky-prin/
    example_url: "https://www.propublica.org/article/inside-turbotax-20-year-fight-to-stop-americans-from-filing-their-taxes-for-free"
    see_also:
      - goodharts-law
      - peter-principle
    en:
      title: Shirky Principle
      concept: Institutions tend to keep alive the problem they exist to solve.
      stance: Ask every fixer what "fixed" would look like
      mechanism: |-
        An organization built to solve a problem draws its budget, headcount and status from that problem persisting. Nobody has to be cynical for this to work: the incentives simply never point at making the team unnecessary, so over time the solution quietly becomes an argument for the problem.
      counter:
        name: Some Problems Are Permanent
        note: |-
          treating every long-lived team as self-serving destroys the ones doing necessary maintenance, which is invisible precisely when it is working
      guideline: |-
        For any team or tool created to fix something, write down what "fixed" looks like and when you will check. A platform team that cannot describe its own obsolescence is optimizing for its own survival.
      example: |-
        ProPublica reported in October 2019, from Intuit's internal documents, that the maker of TurboTax had spent two decades fighting proposals to make US tax filing free and simple, including a government-run free filing option and return-free filing where the IRS pre-fills returns. A 2007 Intuit board presentation said: "For a decade proposals have sought to create IRS tax software or a ReturnFree Tax System; All were stopped." In ProPublica's reading, a company that sells help with a complicated chore worked to keep the chore complicated.
      source: |-
        Clay Shirky, named and quoted in Kevin Kelly, *The Shirky Principle* (The Technium, 2010).
    ja:
      title: シャーキーの原理
      concept: 組織は、自分たちが存在する理由である問題を残そうとする。
      stance: 解決役の組織には、「解けた」とは何かを問う
      mechanism: |-
        ある問題を解くために作られた組織は、その問題が残り続けることで予算、人員、地位を得る。これが起きるのに、誰かが冷笑的である必要はない。チームを不要にする方向には、インセンティブが一度も向かないだけだ。時間が経つうちに、解決策はいつの間にか問題を残しておく理由に変わっていく。
      counter:
        name: |-
          なくならない問題もある
        note: |-
          長く続くチームをすべて自己保身だとみなすと、必要な保守をしているチームまでなくしてしまう。保守は、うまくいっているときほど目に見えない
      guideline: |-
        何かを直すために作ったチームやツールには、「直った」とはどういう状態か、いつそれを確かめるかを書き出しておく。自分たちが不要になる条件を説明できないプラットフォームチームは、自分たちの存続を目的にしている。
      example: |-
        ProPublica は2019年10月、Intuit の社内文書をもとに、TurboTax を売るこの会社が20年にわたり米国の確定申告を無料で簡単にする提案に反対してきたと報じた。対象には政府が運営する無料の申告手段や、IRS が申告書を事前に記入しておく方式も含まれる。2007年の取締役会資料には「10年間、IRS の税務ソフトや ReturnFree Tax System を作る提案が出てきたが、すべて止めた」とある。ProPublica の見立てでは、面倒な手続きの手助けを売る会社が、その手続きを面倒なままにしようとしていた。
      source: |-
        Clay Shirky の言。Kevin Kelly『The Shirky Principle』(The Technium, 2010) で命名・引用された。

  - slug: error-budget
    tag: operations
    source_url: https://sre.google/sre-book/embracing-risk/
    example_url: "https://sre.google/workbook/slo-engineering-case-studies/"
    see_also:
      - goodharts-law
      - tail-at-scale
      - toil
      - normalization-of-deviance
      - andon
    en:
      title: Error Budget
      concept: |-
        An SLO below 100% leaves a measurable allowance of failure, and that allowance can be spent.
      stance: Spend the allowed failure on shipping, and stop when it runs out
      mechanism: |-
        Product teams are judged on velocity and operations teams on reliability, so every release becomes a negotiation decided by whoever argues harder. Past a point users cannot tell the difference (someone on a 99%-reliable phone cannot tell 99.99% from 99.999%), but the last fraction costs the most and blocks the most change. Once the target is explicit, the gap between it and perfect is a budget: 99.9% over 30 days is about 43 minutes of failure, and both sides can see how much of it is left.
      counter:
        name: Normalization of Deviance
        note: |-
          a standing allowance for failure teaches a team that each failure is routine; the outage that should have alarmed people gets logged against the budget and never investigated
      guideline: |-
        Agree on the SLO and the policy before the incident, not during it: while budget remains, ship; when it is spent, freeze feature releases and put the time into reliability until it recovers. Keep data loss and security outside the budget entirely.
      example: |-
        After moving to Google Cloud, Evernote set its first SLO at 99.95% uptime per calendar month for certain services, counting even maintenance windows as downtime, and said it used the SLO and error budget to decide where to spend engineering effort, reviewing performance monthly with Google. In 2017, while chasing a complex bug, it applied an SLO calculation to quantify customer impact and cut its weekly release windows from five to two.
      source: |-
        Marc Alvidrez, "Embracing Risk" (with "Motivation for Error Budgets" by Mark Roth), in Beyer, Jones, Petoff & Murphy (eds.), *Site Reliability Engineering* (O'Reilly, 2016), ch. 3 — where the error budget is defined and "100% is probably never the right reliability target" is argued.
    ja:
      title: エラーバジェット
      concept: 100% 未満の SLO は許容できる失敗の量を決める。その量は使ってよい予算だ。
      stance: 許された失敗は出荷に使い、尽きたら止める
      mechanism: |-
        プロダクト開発は速度で、運用は信頼性で評価される。だからリリースのたびに交渉になり、声の大きい側が勝つ。ある水準を超えると利用者は違いに気づかない（信頼性 99% のスマートフォンを使う人には 99.99% と 99.999% の差は分からない）のに、最後のわずかな差にいちばんコストがかかり、いちばん変更を止める。目標を明示すれば、目標と完璧の差が予算になる。30日で 99.9% なら失敗に使えるのは約43分で、残りがいくらかを両者が同じ数字で見られる。
      counter:
        name: 逸脱の常態化
        note: |-
          失敗を許す枠があると、チームは失敗をいつものことだと覚える。本来なら騒ぎになるはずの障害も予算から差し引かれるだけで、調べられずに終わる
      guideline: |-
        SLO と、予算を使い切ったときの方針は、障害の最中ではなく事前に合意しておく。予算が残っていればリリースし、使い切ったら機能リリースを止め、回復するまで信頼性に時間を使う。データ消失とセキュリティは、そもそも予算の外に置く。
      example: |-
        Evernote は Google Cloud へ移ったあと、一部のサービスに暦月ごとの稼働率99.95%という最初の SLO を置き、メンテナンス時間も停止として数えた。SLO とエラーバジェットを使って開発の手をどこに割くか決め、Google と月に一度その実績を見直したという。2017年に複雑なバグを追っていたときは、SLO の計算で顧客への影響を数字にし、週のリリース枠を5回から2回に減らした。
      source: |-
        Marc Alvidrez「Embracing Risk」(「Motivation for Error Budgets」節は Mark Roth)、Beyer, Jones, Petoff & Murphy 編『Site Reliability Engineering』(O'Reilly, 2016) 第 3 章。エラーバジェットの定義と「100% がふさわしい信頼性目標であることはおそらくない」という主張の出典。

  - slug: toil
    tag: operations
    source_url: https://sre.google/sre-book/eliminating-toil/
    example_url: "https://sre.google/workbook/eliminating-toil/"
    see_also:
      - ironies-of-automation
      - error-budget
      - you-build-it-you-run-it
      - churn-rule
    en:
      title: Toil
      concept: |-
        Manual, repetitive operational work grows with the service and, left unchecked, crowds out engineering.
      stance: Treat repeated manual work as a defect, not a duty
      mechanism: |-
        Toil is work that is manual, repetitive, automatable, interrupt-driven, leaves the system no better than it found it, and scales linearly with traffic or users. Each instance is small and urgent, so it always beats project work in the moment. Because it grows with the service and engineering time does not, a team that never pushes back ends up doing nothing else.
      counter:
        name: Ironies of Automation
        note: |-
          automating a task removes the practice people needed to handle it when the automation fails, and some automation costs more to build and keep alive than the toil it replaces
      guideline: |-
        Measure the share of each person's time spent on toil and set a ceiling (Google uses 50%). When a task comes back a third time (a rule of thumb, not the book's), file it as engineering work; when it scales with users, treat it as a defect rather than a chore.
      example: |-
        Google's datacenter network engineers had to handle each failed line card in its Saturn and Jupiter switch fabrics by hand: check that traffic could move, drain the switch, reboot or replace the card, and undrain it. Jupiter was more than six times larger than any earlier Google fabric, and the volume of these repairs grew with it. The team automated the procedure, first reboot and reinstall, then replacement on a second failure, which freed engineers for other work; it also concluded that spending nearly three years (2012-2015) analyzing memory errors before automating had been unnecessary.
      source: |-
        Vivek Rau, "Eliminating Toil", in Beyer, Jones, Petoff & Murphy (eds.), *Site Reliability Engineering* (O'Reilly, 2016), ch. 5 — the definition of toil and the 50% cap.
    ja:
      title: トイル
      concept: 手作業の繰り返し運用はサービスと一緒に増え、放っておけば開発の時間を食い尽くす。
      stance: 繰り返す手作業は、務めではなく欠陥として扱う
      mechanism: |-
        トイルとは、手作業で、繰り返し発生し、自動化でき、割り込みでやって来て、片づけてもシステムが良くならず、トラフィックや利用者数に比例して増える作業だ。一件ずつは小さく急ぎなので、その場では必ずプロジェクト作業より優先される。サービスとともに増えるのに開発の時間は増えないので、押し返さないチームは、最後にはトイルしかしなくなる。
      counter:
        name: 自動化の皮肉
        note: |-
          作業を自動化すると、自動化がうまく動かなくなったときに人が対処するための慣れが失われる。作って動かし続けるコストが、置き換えたトイルより高くつく自動化もある
      guideline: |-
        一人ひとりの時間のうちトイルが占める割合を測り、上限を決める（Google は 50%）。同じ作業が三度目に来たら（本書ではなく経験則）開発タスクとして起票する。利用者数に比例して増える作業は、雑用ではなく欠陥として扱う。
      example: |-
        Google のデータセンターネットワークでは、Saturn と Jupiter のスイッチで故障したラインカードを一枚ずつ手で処理していた。トラフィックを移せるか確かめ、スイッチを切り離し、カードを再起動か交換して、元に戻す。Jupiter はそれまでのどのファブリックより6倍以上大きく、修理の件数も同じように増えた。チームは手順を自動化し（1回目は再起動と再インストール、2回目で交換）、エンジニアを別の仕事に回せるようにした。自動化の前にメモリエラーの分析へ3年近く（2012年から2015年）かけたのは不要だったとも結論づけている。
      source: |-
        Vivek Rau「Eliminating Toil」、Beyer, Jones, Petoff & Murphy 編『Site Reliability Engineering』(O'Reilly, 2016) 第 5 章。トイルの定義と 50% 上限の出典。

  - slug: blameless-postmortem
    tag: operations
    source_url: https://www.etsy.com/codeascraft/blameless-postmortems
    see_also:
      - swiss-cheese-model
      - normalization-of-deviance
      - hanlons-razor
      - bystander-effect
      - mechanisms-not-good-intentions
      - five-whys
      - braintrust
      - pre-mortem
      - psychological-safety
    en:
      title: Blameless Postmortem
      concept: |-
        Punishing the person nearest a failure teaches people to hide what they did.
      stance: Fix what made the mistake easy, not the person who made it
      mechanism: |-
        The people closest to an incident hold the only accurate account of what they saw, what they believed and why the action made sense at the time. If telling that story can cost them, they tell a shorter one, and the organization loses the information it needs to fix the conditions that made the mistake easy. The error repeats with someone else's name on it. Blameless is not consequence-free: a just culture still separates an honest mistake inside a bad system from knowingly disregarding a risk.
      counter:
        name: Diffused Ownership
        note: |-
          when nobody is answerable, the action items have no owner and quietly expire; some teams name a person accountable for the fix precisely because blamelessness leaves no one holding it
      guideline: |-
        Write the postmortem as a timeline of what people saw and why each action made sense then, and end with changes to the system, not to a person, each with one named owner and a date. Ban "human error" as a root cause; ask what made the error easy to make.
      source: |-
        John Allspaw, *Blameless PostMortems and a Just Culture* (Code as Craft, Etsy, 2012); the practice is codified in Lunney & Lueder, "Postmortem Culture", *Site Reliability Engineering* (O'Reilly, 2016), ch. 15.
    ja:
      title: 非難なきポストモーテム
      concept: 障害のいちばん近くにいた人を罰すると、人は自分のしたことを隠すようになる。
      stance: 直すのは人ではなく、間違えやすくしていた仕組み
      mechanism: |-
        障害の現場にいた人だけが、何を見て、何を信じ、なぜその操作がその時点で妥当に思えたかを正確に語れる。語ることで不利益を被るなら、その人は話を短くする。すると組織は、ミスを起こしやすくしていた条件を直すための情報を失う。同じ誤りが、別の人の名前で繰り返される。非難しないことは、何をしても責任を問わないことではない。公正な文化は、悪い仕組みの中での正直なミスと、リスクを承知で無視したこととを区別する。
      counter:
        name: 責任の拡散
        note: 誰も責任を負わないと、対策項目に持ち主がいなくなり、いつの間にか立ち消える。だから責めないことと引き換えに、修正の担当者だけは名指しするチームもある
      guideline: |-
        ポストモーテムは、各人が何を見て、なぜその操作がその時点で妥当だったかを時系列で書き、人ではなく仕組みの変更で締めくくる。変更ごとに担当者を一人決め、期日を付ける。根本原因に「ヒューマンエラー」と書くのは禁止し、何がその誤りを起こしやすくしていたかを問う。
      source: |-
        John Allspaw『Blameless PostMortems and a Just Culture』(Code as Craft, Etsy, 2012)。実践としては Lunney & Lueder「Postmortem Culture」『Site Reliability Engineering』(O'Reilly, 2016) 第 15 章にまとめられている。

  - slug: working-backwards
    tag: decision
    source_url: https://www.allthingsdistributed.com/2006/11/working_backwards.html
    see_also:
      - xy-problem
      - yagni
      - narratives-not-slides
      - pre-mortem
      - wicked-problems
      - most-ideas-fail
    en:
      title: Working Backwards
      concept: |-
        Teams that start from a solution often build things no customer needed; starting from the announcement exposes that early.
      stance: If you cannot say what the customer gets, you are not ready to build
      mechanism: |-
        Engineers start from what they can build and look for customers afterwards. A press release written before any code forces the team to state who the customer is, what problem they have and why existing options fail, in words the customer would use. If that page is hard to write, the product is unclear, and rewriting a page is far cheaper than rewriting the product.
      counter:
        name: Build to Learn
        note: |-
          when customers cannot judge an idea on paper (a new platform, an infrastructure change, something with no precedent) a cheap prototype tells you more than a polished press release
      guideline: |-
        Before a project starts, write a one-page press release and an FAQ for the customer, and review them as a team. If you cannot name the customer and their problem in the first paragraph, do not start building.
      source: |-
        Werner Vogels, *Working Backwards* (All Things Distributed, 2006) — Amazon's CTO describing the press-release-first process; Ian McAllister's Quora answer "What is Amazon's approach to product development and product management?" is the source of "if the press release is hard to write, the product is probably going to suck"; Colin Bryar & Bill Carr, *Working Backwards* (St. Martin's Press, 2021) — the PR/FAQ process in full.
    ja:
      title: ワーキング・バックワーズ
      concept: 解決策から始めると、誰も必要としないものを作ることが多い。発表文から始めれば早く気づける。
      stance: 顧客が何を得るか言えないうちは、作り始めない
      mechanism: |-
        エンジニアは作れるものから考え始め、顧客は後から探しがちだ。コードを書く前にプレスリリースを書くと、誰が顧客で、どんな問題を抱え、既存の手段がなぜ駄目なのかを、顧客自身の言葉で書かざるを得なくなる。その一枚が書きにくいなら、製品の輪郭がぼやけている。紙一枚を書き直すほうが、製品を作り直すよりずっと安い。
      counter:
        name: 作って学ぶ
        note: 顧客が紙の上では判断できないもの（新しいプラットフォーム、基盤の変更、前例のないもの）では、磨いたプレスリリースより安い試作品のほうが多くを教えてくれる
      guideline: |-
        プロジェクトを始める前に、顧客向けのプレスリリース一枚と FAQ を書き、チームでレビューする。最初の段落で顧客とその問題を言えないなら、作り始めない。
      source: |-
        Werner Vogels『Working Backwards』(All Things Distributed, 2006)。Amazon の CTO がプレスリリースから書き始める手順を説明したもの。「プレスリリースが書きにくいなら、その製品はたぶんひどい」は Ian McAllister の Quora の回答「What is Amazon's approach to product development and product management?」から。PR/FAQ の全体像は Colin Bryar & Bill Carr『Working Backwards』(St. Martin's Press, 2021)。

  - slug: disagree-and-commit
    tag: decision
    source_url: https://www.aboutamazon.com/news/company-news/2016-letter-to-shareholders
    see_also:
      - type-1-vs-type-2-decisions
      - law-of-triviality
      - believability-weighted-decisions
      - context-not-control
      - last-responsible-moment
    en:
      title: Disagree and Commit
      concept: |-
        Waiting for everyone to agree is often slower than committing and correcting course if the call turns out wrong.
      stance: Disagree once and fully, then commit, unless it cannot be undone
      mechanism: |-
        When a group needs consensus, the decision moves at the speed of its most persistent skeptic, and late in the debate the answer often cannot be known anyway. A dissenter who keeps arguing can also half-execute the choice they lost, which makes the outcome worse whichever option was right. Separating "do you agree" from "will you commit" lets the disagreement be stated fully and the work still go ahead at full effort.
      counter:
        name: Groupthink
        note: |-
          a culture that prizes commitment teaches people to stop objecting early, and silent compliance hides the dissent that would have caught the error
      guideline: |-
        State your disagreement once, in full, with your reasons. Then say "I disagree and commit" and execute as if it were your idea. If you are the senior person, do it too: back the team's call instead of making them convince you. For an irreversible decision, or one with a safety or ethical risk, do not commit quietly: escalate.
      source: |-
        Jeff Bezos, *2016 Letter to Shareholders* (Amazon.com, Inc., 2017) — "use the phrase 'disagree and commit'", with the Amazon Studios example. The phrase predates Amazon: Karen Southwick, *High Noon* (1999), records Scott McNealy using it at Sun Microsystems, and Richard Tedlow, Andy Grove's biographer, lists "disagree and then commit" alongside "constructive confrontation" among the parts of Intel culture under Grove ("Andy Grove: A Biographer's Tale", *HBS Working Knowledge*, 2006). Netflix's culture memo (jobs.netflix.com, current version) uses the same rule, "disagree then commit", in its "informed captain" model, where one named person makes each significant decision after "farming for dissent".
    ja:
      title: 反対してもコミットする
      concept: 全員の同意を待つより、決めて実行し、誤りなら軌道修正するほうが速いことが多い。
      stance: 反対は一度きっちり言い、戻せない決定以外は乗る
      mechanism: |-
        合意を求める集団では、決定はいちばんしつこい懐疑派の速さでしか進まない。しかも議論も終盤になると、正解はどのみち分からないことが多い。議論に負けた反対者が、決まった方針を中途半端にしか実行しないこともあり、そうなるとどちらが正しかったにせよ結果は悪くなる。「同意するか」と「コミットするか」を分ければ、反対は言い尽くしたうえで、実行には全力を注げる。
      counter:
        name: 集団浅慮
        note: |-
          コミットを重んじる文化では、人は早いうちに反対するのをやめるようになる。黙って従う人が増えると、誤りに気づけたはずの異論が表に出てこない
      guideline: |-
        反対意見は一度だけ、理由を添えて全部言う。そのうえで「反対だがコミットする」と言い、自分の案だったつもりで実行する。立場が上の人も同じようにする。チームに自分を説得させるのではなく、チームの判断を後押しする。ただし取り返しのつかない決定や、安全・倫理上のリスクがある決定では、黙ってコミットせずエスカレーションする。
      source: |-
        Jeff Bezos『2016 年 株主への手紙』(Amazon.com, Inc., 2017 年)。"use the phrase 'disagree and commit'" と Amazon Studios の例。語句自体は Amazon 以前からある。Karen Southwick『High Noon』(1999) は Sun Microsystems の Scott McNealy がこの語を使っていたと記している。Andy Grove の伝記を書いた Richard Tedlow は、Grove 時代の Intel の文化の一部として "constructive confrontation" と並べて "disagree and then commit" を挙げている (「Andy Grove: A Biographer's Tale」『HBS Working Knowledge』2006)。Netflix のカルチャーメモ (jobs.netflix.com の現行版) も "disagree then commit" という同じ決まりを "informed captain" のモデルの中で使う。重要な決定はそれぞれ名指しされた一人が、"farming for dissent" (異論を集めること) を経て下す。

  - slug: you-build-it-you-run-it
    tag: operations
    source_url: https://queue.acm.org/detail.cfm?id=1142065
    see_also:
      - conways-law
      - toil
      - mechanisms-not-good-intentions
    en:
      title: You Build It, You Run It
      concept: |-
        When the team that writes a service also operates it, the cost of every operational weakness lands on the people who can fix it.
      stance: Whoever can fix it should be the one it wakes up
      mechanism: |-
        When software is thrown over a wall to a separate operations team, the people who take the page and face the angry customer are not the people who can change the code, so the fix arrives late or as a workaround. Developers who are paged for their own service learn which shortcuts hurt, and design for failure because they are the ones who will be woken up. Running it also puts them in daily contact with customers, which shortens the path from a complaint to a change. The incentive only works when the ownership is real: the team has to be able to change what it is paged for.
      counter:
        name: Developer Cognitive Load
        note: |-
          owning the whole cycle widens what each developer must know and the priorities they juggle every week; without shared tooling and an on-call rotation it ends in burnout, and Netflix, which runs the model, says it supports people who want depth over breadth in finding other roles
      guideline: |-
        Put the team that ships a service on its pager, and give it the authority and the deploy rights to fix what pages it. Pair that with a paved road (shared deploy, observability and alerting tooling) and a rotation, so no one person is on call for everything. Do not apply it to a team that cannot change the thing it is woken up for; that hands over the pager, not the ownership.
      source: |-
        Jim Gray, "A Conversation with Werner Vogels", *ACM Queue* 4(4) (2006) — Amazon's CTO on why every service team runs what it builds: "You build it, you run it." The trade-off is from Philip Fisher-Ogden, Greg Burrell & Dianne Marsh, *Full Cycle Developers at Netflix — Operate What You Build* (Netflix Technology Blog, 2018).
    ja:
      title: 作った者が運用する
      concept: サービスを作るチームが運用も担えば、運用上の弱点のコストは、それを直せる人のところに落ちる。
      stance: 直せる人が、起こされる人であるべきだ
      mechanism: |-
        ソフトウェアを壁の向こうの運用チームに投げ渡すと、呼び出しを受けて怒った顧客に向き合う人と、コードを変えられる人が別々になる。だから修正は遅れるか、回避策で終わる。自分のサービスで呼び出される開発者は、どの手抜きが痛いかを身をもって知り、夜中に起こされるのが自分なので障害を前提に設計する。運用していれば顧客とも日々接するので、苦情から変更までの距離も縮まる。ただしこの動機づけが働くのは、オーナーシップに実態があるときだけだ。呼び出しの原因になったものを、チーム自身が変えられなければならない。
      counter:
        name: 開発者の認知負荷
        note: 開発から運用までを丸ごと持つと、開発者一人が知るべきことと毎週抱える優先事項が増える。共通の道具とオンコールのローテーションがなければ燃え尽きに行き着く。このモデルを採る Netflix も、幅より深さを求める人には、そうした役割を見つける手助けをするとしている
      guideline: |-
        サービスをリリースしたチームを、そのサービスのオンコールに就ける。呼び出しの原因を直す権限とデプロイ権限も渡す。デプロイ、可観測性、アラートの共通基盤（舗装された道）とオンコールのローテーションを用意し、一人が全部を抱えないようにする。呼び出される対象を自分で変えられないチームには適用しない。それでは所有を渡したことにならず、呼び出しを押しつけるだけだ。
      source: |-
        Jim Gray「A Conversation with Werner Vogels」『ACM Queue』4(4) (2006)。Amazon の CTO が、各サービスチームが作ったものを自分で運用する理由を語ったインタビューで、"You build it, you run it." の出典。トレードオフは Philip Fisher-Ogden, Greg Burrell & Dianne Marsh『Full Cycle Developers at Netflix — Operate What You Build』(Netflix Technology Blog, 2018) から。

  - slug: static-stability
    tag: distributed-systems
    source_url: https://builder.aws.com/content/3K9SiqiJ369TGkkGzqPM95BuYWI/static-stability-using-availability-zones
    example_url: "https://aws.amazon.com/message/12721/"
    see_also:
      - avoid-fallback
      - constant-work
      - fallacies-of-distributed-computing
    en:
      title: Static Stability
      concept: |-
        A system that has to take new action to survive a failure depends on that action succeeding at the moment things are going wrong.
      stance: Don't make recovery depend on acting during the failure
      mechanism: |-
        Recovering from a failure usually means doing something the system does not do in normal operation: launching replacement instances, calling a control plane, changing routes. Control planes have more moving parts than data planes and so are more likely to be impaired, which means recovery leans on the weaker half of the system at the moment it is needed most. A statically stable design keeps working when a dependency is impaired, because the capacity and state it needs are already in place. Amazon runs its stateless services across three Availability Zones overprovisioned by 50 percent, so losing one leaves the other two able to carry the load without launching anything.
      counter:
        name: Cost of Idle Capacity
        note: |-
          capacity held for a failure that rarely happens is paid for every day, and scaling to demand is cheaper wherever a slow recovery is acceptable; the source itself concedes that building services zone by zone rather than regionally adds complexity
      guideline: |-
        List what your service must do to recover from losing a zone or a dependency. For every step that calls a control plane or launches something, decide whether to have it in place beforehand instead: spare capacity in every zone, the last good configuration cached locally, serving that continues while the control plane is down. Reserve this for paths whose failure you cannot afford; elsewhere, scale on demand.
      example: |-
        On December 7, 2021, an internal network problem in AWS's us-east-1 region impaired the EC2 APIs that launch and describe instances for hours, and new launches did not fully recover until 2:40 PM PST. AWS's summary noted that "running EC2 instances were unaffected by this event": workloads already running kept serving because the data plane did not need the impaired control plane, while anything that depended on launching new capacity to recover was stuck.
      source: |-
        Becky Weiss & Mike Furr, *Static stability using Availability Zones* (Amazon Builders' Library, 2019) — "In a statically stable design, the overall system keeps working even when a dependency becomes impaired", with EC2's control-plane/data-plane split and the 50 percent overprovisioning across three zones.
    ja:
      title: 静的安定性
      concept: |-
        障害を乗り切るのに新しい動作が必要なシステムは、状況がいちばん悪いときにその動作が成功することに頼っている。
      stance: 障害の最中に何かをしないと助からない作りにしない
      mechanism: |-
        障害からの復旧には、普段はしない操作がつきものだ。代わりのインスタンスを起動する、コントロールプレーンを呼ぶ、経路を切り替える、などだ。コントロールプレーンはデータプレーンより可動部が多く、そのぶん劣化しやすい。つまり復旧は、いちばん必要なときに、システムの弱いほうに頼ることになる。静的に安定した設計では、依存先が劣化しても動き続ける。必要な容量と状態が前もってそろっているからだ。Amazon はステートレスなサービスを3つのアベイラビリティーゾーンで50%の余剰を持たせて動かしており、1つを失っても残りの2つが何も起動せずに負荷を引き受けられる。
      counter:
        name: 遊休容量のコスト
        note: |-
          まれにしか起きない障害のための容量にも、毎日お金がかかる。復旧が遅くても許される場所では、需要に合わせて伸縮させるほうが安い。リージョン単位ではなくゾーン単位でサービスを作ると複雑さが増すことは、出典自身も認めている
      guideline: |-
        ゾーンや依存先を一つ失ったとき、サービスが復旧のために何をしなければならないかを書き出す。コントロールプレーンを呼ぶ手順や何かを起動する手順ごとに、代わりに前もって用意しておけないかを判断する。たとえば全ゾーンに予備の容量を置く、最後に正常だった設定を手元にキャッシュする、コントロールプレーンが落ちても配信を続ける、といった形だ。これは失敗が許されない経路に限り、それ以外は需要に応じて伸縮させる。
      example: |-
        2021年12月7日、AWS の us-east-1 で内部ネットワークの障害が起き、インスタンスを起動したり一覧したりする EC2 の API が数時間使えなくなった。新規起動が戻ったのは太平洋標準時の14時40分だった。AWS のまとめには「稼働中の EC2 インスタンスはこの事象の影響を受けなかった」とある。データプレーンは止まったコントロールプレーンを必要としないので、すでに動いていたものは動き続け、回復に新しい容量の起動を必要とするものだけが止まった。
      source: |-
        Becky Weiss & Mike Furr『Static stability using Availability Zones』(Amazon Builders' Library, 2019)。"In a statically stable design, the overall system keeps working even when a dependency becomes impaired" という定義、EC2 のコントロールプレーンとデータプレーンの区別、3 ゾーンでの 50% の余剰の出典。

  - slug: avoid-fallback
    tag: distributed-systems
    source_url: https://builder.aws.com/content/3EuS9Sakq7L3VLQIF3qzfMfke1Y/avoiding-fallback-in-distributed-systems
    example_url: "https://blog.cloudflare.com/post-mortem-on-cloudflare-control-plane-and-analytics-outage/"
    see_also:
      - static-stability
      - constant-work
      - ironies-of-automation
      - chaos-engineering
    en:
      title: Avoid Fallback
      concept: |-
        A fallback path runs only after something has already failed, so the least-tested code in the system runs under the worst conditions.
      stance: Distrust code that runs only when things are already broken
      mechanism: |-
        Fallback code sits idle in normal operation, so its bugs, its capacity limits and its stale data go unnoticed until it is needed. It then switches on in the middle of an outage, when load is unusual and other parts are degraded, and adds a new mode to a system that is already behaving strangely. A fallback that routes around a cache straight to a database, or onto a secondary service, can move load onto something never sized for it and widen a partial failure; Amazon.com's outage around 2001 began that way. Amazon's conclusion is that the effort is usually better spent making the primary path more available.
      counter:
        name: Graceful Degradation
        note: |-
          returning a reduced answer beats returning an error when the reduced path runs all the time, as when a recommendations panel falls back to a static list it serves anyway; the danger is the path that never runs, not degradation itself
      guideline: |-
        Before adding a fallback, ask whether the same effort would make the primary path more available: push data to the caller ahead of time instead of pulling it at request time, add redundancy. If you keep a fallback, run it in production continuously, not only on failure, and treat its output as an equally valid source. Delete fallback paths nobody has exercised.
      example: |-
        On November 2, 2023, a power failure at Cloudflare's main Portland data center took down its control plane and analytics, and Cloudflare failed over to its disaster-recovery sites in Europe. The fallback had never been tested at that scale: Cloudflare had "never tested fully taking the entire PDX-04 facility offline," some newer products had no tested DR procedure, log processing was not supported at the DR site at all, and retrying clients swamped the services that did come up. Full restoration took until November 4.
      source: |-
        Jacob Gabrielson, *Avoiding fallback in distributed systems* (Amazon Builders' Library, 2019) — the Amazon.com outage of around 2001, when every web server fell back to querying the database directly once the caches failed together, and "At Amazon, we avoid fallback in our systems because it's difficult to prove and its effectiveness is hard to test."
    ja:
      title: フォールバックを避ける
      concept: |-
        フォールバック経路は何かがすでに失敗したあとでしか動かない。だから、システムでいちばん試されていないコードが最悪の条件で動く。
      stance: 壊れたときにしか動かないコードを信用しない
      mechanism: |-
        フォールバックのコードは平常時には使われないので、そのバグも、容量の限界も、データが古くなっていることも、必要になるまで誰も気づかない。そのコードが、障害の最中、つまり負荷がいつもと違い、ほかの部分も劣化しているときに動き出し、すでに挙動のおかしいシステムに新しい動作モードを一つ加える。キャッシュを迂回してデータベースへ直接向かうフォールバックや、予備のサービスに切り替えるフォールバックは、その負荷を想定していない場所に負荷を移し、部分的な障害を広げることがある。2001年頃の Amazon.com の障害はそうして始まった。Amazon は、その労力はたいてい主経路の可用性を上げるほうに使ったほうがよいと結論づけている。
      counter:
        name: グレースフル・デグラデーション
        note: |-
          縮退した経路が普段から動いているなら、エラーを返すより縮退した答えを返すほうがよい。おすすめ欄が、普段から出している固定リストに切り替える場合などだ。危ないのは縮退そのものではなく、普段一度も動かない経路のほうだ
      guideline: |-
        フォールバックを足す前に、同じ労力で主経路の可用性を上げられないかを考える。リクエストのたびに取りに行く代わりに呼び出し側へ前もってデータをプッシュしておく、冗長化する、といった方法がある。フォールバックを残すなら、障害時だけでなく本番で常に動かし、その出力を主経路と同等に正当なデータ源として扱う。誰も動かしたことのないフォールバック経路は消す。
      example: |-
        2023年11月2日、Cloudflare のポートランドの主要データセンターで電源が落ち、コントロールプレーンと分析機能が止まった。Cloudflare は欧州の災害復旧サイトに切り替えたが、この退避がその規模で試されたことはなかった。「PDX-04 の施設全体を落とす試験はしたことがなかった」うえ、一部の新しい製品には試験済みの復旧手順がなく、ログ処理は復旧サイトでそもそも動かず、立ち上がったサービスにはクライアントの再試行が殺到した。完全な復旧は11月4日までかかった。
      source: |-
        Jacob Gabrielson『Avoiding fallback in distributed systems』(Amazon Builders' Library, 2019)。キャッシュが一斉に落ちてすべての Web サーバがデータベースへ直接問い合わせた、2001 年頃の Amazon.com の障害と、"At Amazon, we avoid fallback in our systems because it's difficult to prove and its effectiveness is hard to test." の出典。

  - slug: constant-work
    tag: distributed-systems
    source_url: https://builder.aws.com/content/3F05oqNtNUWxHJ5r6L6I2HrH4rI/reliability-constant-work-and-a-good-cup-of-coffee
    see_also:
      - static-stability
      - avoid-fallback
    en:
      title: Constant Work
      concept: |-
        A system whose work grows with the number of changes or failures does the most work exactly when it has the least headroom.
      stance: In control loops, do the same work whether or not anything changed
      mechanism: |-
        Most systems do more work as conditions get worse: more retries, more changes to propagate, more health transitions to process. That extra work arrives when the system has the least headroom, and the code that handles it is the code that runs least often. A constant-work design does the same amount regardless: Route 53's health-check aggregators send DNS servers a fixed-size table of every status every few seconds, and Network Load Balancer nodes reload their full configuration from S3 every few seconds even when nothing has changed. A surge of failures produces no extra work, so there is no overload mode to discover in production.
      counter:
        name: Elasticity
        note: |-
          doing the full work every cycle wastes resources when little has changed; for configuration and health status the cost is negligible, but for a web fleet the savings from scaling with load usually win over running peak capacity all day
      guideline: |-
        For control loops that propagate configuration or health, send the whole state on a fixed schedule instead of deltas on change, and size the payload for the maximum, not the typical case. Keep the amount of work independent of how many things changed. Use it where the work is small; for request-serving capacity, scale with load and design the overload case explicitly.
      source: |-
        Colm MacCárthaigh, *Reliability, constant work, and a good cup of coffee* (Amazon Builders' Library, 2021) — the coffee-urn analogy, the Route 53 health-check and Network Load Balancer configuration examples, and the admission that physical constant work "usually come[s] at the cost of waste."
    ja:
      title: 一定の作業量
      concept: 変更や障害の数に応じて仕事が増えるシステムは、余力がいちばん少ないときにいちばん多くの仕事をする。
      stance: 制御系では、変化の有無に関係なく同じ量の仕事をさせる
      mechanism: |-
        多くのシステムは、状況が悪くなるほど仕事が増える。再試行が増え、伝播すべき変更が増え、処理すべきヘルス状態の遷移が増える。その追加の仕事は余力がいちばん少ないときにやって来て、それを処理するのは、ふだんいちばん実行されないコードだ。一定の作業量で動く設計は、状況にかかわらず同じだけ仕事をする。Route 53 ではヘルスチェックの集約役が、全ステータスを収めた固定長の表を数秒ごとに DNS サーバーへ送り、Network Load Balancer のノードは何も変わっていなくても数秒ごとに S3 から設定全体を読み込み直す。障害が一斉に起きても仕事は増えないので、本番で初めて出会う過負荷モードがない。
      counter:
        name: 伸縮性
        note: |-
          毎回すべての仕事をすれば、ほとんど何も変わっていないときには資源の無駄になる。設定やヘルス状態の伝播ならコストは無視できるが、Web サーバー群では、ピーク容量を一日中動かすより、負荷に合わせて伸縮させて節約するほうがたいてい得になる
      guideline: |-
        設定やヘルス状態を伝える制御ループでは、変更のたびに差分を送るのではなく、決まった間隔で状態全体を送る。ペイロードの大きさは平均ではなく最大に合わせる。仕事の量を、変わったものの数に左右させない。この方式は仕事が小さい場所で使い、リクエストを処理する容量は負荷に応じて伸縮させ、過負荷時の振る舞いを明示的に設計する。
      source: |-
        Colm MacCárthaigh『Reliability, constant work, and a good cup of coffee』(Amazon Builders' Library, 2021)。コーヒーアーン (大型の給茶器) のたとえ、Route 53 のヘルスチェックと Network Load Balancer の設定配布の例、物理的な一定作業は "usually come at the cost of waste" と認めている箇所の出典。

  - slug: mechanisms-not-good-intentions
    tag: organization
    source_url: https://aws.amazon.com/blogs/enterprise-strategy/strategy-is-a-winding-road-mechanisms-keep-you-on-track/
    example_url: "https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/"
    see_also:
      - blameless-postmortem
      - goodharts-law
      - you-build-it-you-run-it
      - context-not-control
    en:
      title: Mechanisms, Not Good Intentions
      concept: |-
        Asking people to try harder after a failure changes little, because the failure happened to people who were already trying.
      stance: Replace "be careful" with something that works without anyone remembering
      mechanism: |-
        Many mistakes are made by people who meant well and knew the rule, so telling them again adds nothing they lacked. Attention is finite and fades, so a fix that depends on someone remembering often fades, and the same error comes back. What changes behavior is a mechanism: a tool, its actual adoption, and inspection that checks whether it works. A checklist nobody reads is not a mechanism; a gate that blocks the merge is.
      counter:
        name: Resist Proxies
        note: |-
          a mechanism can harden into the goal; once following the process is what gets judged, people defend a bad outcome by saying they followed it, and nobody asks whether the process still serves the result
      guideline: |-
        When a postmortem action item says "be more careful", "remind the team" or "double-check", replace it with a change that works without anyone remembering: a CI check, a safe default, a field that cannot be skipped. Give each one an owner and a date to inspect whether it is used and whether it worked. Retire mechanisms that no longer change outcomes.
      example: |-
        On July 2, 2019, a single regular expression in a Cloudflare WAF rule backtracked catastrophically and exhausted CPU on its HTTP-serving cores worldwide, taking traffic down for 27 minutes. Instead of asking engineers to write safer regexes, Cloudflare's fixes were mechanisms: switch to the re2 or Rust regex engine, which give run-time guarantees, add performance profiling of every rule to the test suite, restore the CPU-usage protection that had been removed, and require staged rollouts for rules.
      source: |-
        An internal Amazon saying, not a published Bezos text. Gregor Hohpe, *Strategy Is a Winding Road. Mechanisms Keep You on Track.* (AWS Enterprise Strategy blog, 2021) records "At Amazon we have a common saying: 'Good intentions don't work—mechanisms do'" and defines a mechanism as tools, adoption and inspection; attributions of the line to Jeff Bezos are secondhand. The counter-force is from Jeff Bezos, *2016 Letter to Shareholders* (Amazon.com, Inc., 2017): "The process is not the thing."
    ja:
      title: 善意ではなく仕組み
      concept: 失敗のあとで「もっと気をつけろ」と求めても、ほとんど何も変わらない。失敗した人は、もともと気をつけていたからだ。
      stance: 「気をつける」を、誰も覚えていなくても効く仕組みに置き換える
      mechanism: |-
        ミスの多くは、善意があってルールも知っている人が起こす。だから言い聞かせ直しても、その人に足りなかったものは何も増えない。注意力には限りがあり、時間とともに薄れる。誰かが覚えていることに頼る対策もしばしば薄れ、同じ誤りがまた起きる。行動を変えるのは仕組みだ。ここでいう仕組みは、道具、その道具が実際に使われていること（採用）、機能しているかを確かめる点検（検査）の三つがそろったものを指す。誰も読まないチェックリストは仕組みではないが、マージを止めるゲートは仕組みだ。
      counter:
        name: 代理指標に抗う
        note: |-
          仕組みは、それ自体が目的として固まることがある。プロセスに従ったかどうかで評価されるようになると、人は悪い結果を「プロセスどおりにやった」と弁護し、そのプロセスがまだ結果の役に立っているかを誰も問わなくなる
      guideline: |-
        ポストモーテムの対策項目が「注意する」「チームに周知する」「ダブルチェックする」なら、誰も覚えていなくても働く変更に置き換える。CI のチェック、安全な既定値、飛ばせない入力欄などだ。それぞれに担当者と、使われているか、効果があったかを点検する期日を付ける。もう結果を変えていない仕組みは廃止する。
      example: |-
        2019年7月2日、Cloudflare の WAF ルールに入っていた正規表現ひとつが破滅的なバックトラックを起こし、世界中の HTTP 処理用の CPU を使い切って、27分間トラフィックを止めた。Cloudflare は「もっと安全な正規表現を書こう」と呼びかけるかわりに、仕組みで直した。実行時間が保証される re2 か Rust の正規表現エンジンへの切り替え、全ルールの性能測定をテストに組み込むこと、外されていた CPU 使用量の保護を戻すこと、ルールの段階的なリリースの義務化である。
      source: |-
        Amazon 社内の言い回しで、Bezos の公表文書が出典ではない。Gregor Hohpe『Strategy Is a Winding Road. Mechanisms Keep You on Track.』(AWS Enterprise Strategy blog, 2021) が "At Amazon we have a common saying: 'Good intentions don't work—mechanisms do'" と記録し、仕組みを道具・採用・点検からなるものと定義している。Jeff Bezos の言葉とする説は二次資料による。対抗する力は Jeff Bezos『2016 年 株主への手紙』(Amazon.com, Inc., 2017 年) の "The process is not the thing." から。

  - slug: andon
    tag: operations
    source_url: https://global.toyota/en/company/vision-and-philosophy/production-system/
    example_url: "https://www.thisamericanlife.org/403/transcript"
    see_also:
      - normalization-of-deviance
      - error-budget
      - five-whys
      - genchi-genbutsu
      - makers-schedule
    en:
      title: Andon (Stop the Line)
      concept: |-
        Letting anyone who sees an abnormality stop the line keeps a defect from traveling downstream, where it costs more to find and fix.
      stance: Let anyone stop the line, and never punish a stop
      mechanism: |-
        A defect caught where it is made has one cause and an obvious fix; the same defect found three stations later is buried under work built on top of it, and the person who could explain it has moved on. Pressure to keep the line moving makes each worker discount what they saw and assume someone downstream will catch it. Toyota's jidoka moved the decision into the station: first a loom that stopped itself when a thread broke, later a cord any operator can pull to halt the line and light the andon board. The stop is not the point; it forces the abnormality to be examined while the evidence is still fresh.
      counter:
        name: Throughput Pressure
        note: |-
          every stop costs output, and where a team is judged on throughput, pulling the cord becomes a cost someone has to justify, so a cord that fires often or falsely teaches people to route around it
      guideline: |-
        Make a red main-branch build, a failed canary or a breached SLO halt further merges or deploys for everyone, and let anyone pull that cord without asking permission. Keep the trigger narrow enough that it rarely fires falsely, and treat a stop that nobody investigates as a defect in the response, not in the person who pulled it.
      example: |-
        At the old GM plant in Fremont, California, which closed in 1982, workers said the rule was that the line must never stop, and one recalled that stopping it could get you fired. When GM and Toyota reopened it as NUMMI, workers got an andon cord: a pull summoned team leaders, and the line stopped only if they could not fix the problem. NUMMI's defect rate was among the best in America from the start, with near-perfect quality ratings within months of the first car in December 1984.
      source: |-
        Toyota Motor Corporation, *Toyota Production System* (official page, global.toyota) — jidoka, the andon board and the stop cord any operator can pull, traced to the Toyoda Power Loom with a weft-breakage automatic stopping device, developed in 1896; the page credits Taiichi Ohno (1912–1990) with establishing the system and the framework of Just-in-Time.
    ja:
      title: アンドン（ラインを止める）
      concept: |-
        異常に気づいた人が誰でもラインを止められれば、欠陥は下流へ流れない。下流で見つかれば、見つけるのも直すのも高くつく。
      stance: 誰でもラインを止められるようにし、止めた人を咎めない
      mechanism: |-
        欠陥は、作られたその場で捕まえれば原因は一つで、直し方も明らかだ。三工程先で見つかった同じ欠陥は、その上に積まれた作業の下に埋もれ、事情を説明できた人はもう別の仕事をしている。ラインを動かし続けろという圧力があると、作業者は自分が見たものを軽く見積もり、下流の誰かが気づくだろうと考える。トヨタの自働化は、この判断を工程の中に移した。最初は糸が切れると自動で止まる織機で、のちには、どの作業者でも引けばラインが止まってアンドンが点灯する紐になった。止めること自体が目的なのではない。証拠が新しいうちに、異常を調べざるを得なくすることが目的だ。
      counter:
        name: スループットの圧力
        note: |-
          止めるたびに生産量は落ちる。スループットで評価されるチームでは、紐を引くことは誰かが理由を説明しなければならないコストになる。頻繁に、あるいは誤って止まる紐があると、人はそれを避けて通るようになる
      guideline: |-
        main ブランチのビルドが赤い、カナリアが失敗した、SLO を割った、といったときには、全員のマージやデプロイが止まるようにする。その紐は誰でも許可なく引けるようにする。誤発火がめったに起きない程度に条件を絞る。誰も調べない停止は、引いた人ではなく対応する側の欠陥として扱う。
      example: |-
        カリフォルニア州フリーモントにあった GM の旧工場（1982年閉鎖）では、ラインは決して止めてはならないというのが決まりで、止めたらクビになったと語る労働者もいた。GM とトヨタがここを NUMMI として再開すると、作業者にアンドンのひもが与えられた。引くとチームリーダーが駆けつけ、その場で直せないときだけラインが止まる。NUMMI の不良率は最初から米国でも最良の水準になり、1984年12月の最初の1台から数か月でほぼ完璧な品質評価を得た。
      source: |-
        トヨタ自動車『トヨタ生産方式』(global.toyota の公式ページ)。自働化、アンドン (異常表示盤)、どの作業者も引ける停止紐の出典。その源流を、緯糸切断自動停止装置を備えた豊田式汽力織機 (1896 年開発) に求めている。同ページは大野耐一 (1912–1990) がこの方式と、ジャスト・イン・タイムの枠組みを確立したとしている。

  - slug: five-whys
    tag: operations
    source_url: https://www.routledge.com/Toyota-Production-System-Beyond-Large-Scale-Production/Ohno/p/book/9780915299140
    see_also:
      - swiss-cheese-model
      - normal-accident-theory
      - blameless-postmortem
      - andon
      - xy-problem
      - genchi-genbutsu
    en:
      title: Five Whys
      concept: |-
        The first answer to "why did this fail" is usually a symptom, and fixing a symptom leaves the cause in place to fail again.
      stance: Keep asking why until you reach something you can change
      mechanism: |-
        Investigations stop at the first cause that someone could plausibly have prevented, because it closes the ticket and names an action. That cause is usually the one nearest in time (a bad config push, a full disk), and fixing it removes this instance without touching whatever produced it. Asking why again of each answer walks the chain back to a condition (a missing check, a process nobody owns) whose fix prevents a whole class of failures. Five is a rule of thumb, not a required depth.
      counter:
        name: Swiss Cheese Model
        note: |-
          a single chain of whys picks one path through an accident that had several, the analyst's choice at each step decides which root cause comes out, and in complex systems there is often no single root to find
      guideline: |-
        In the postmortem, keep asking why of each answer until you reach something the team can change that would have stopped the chain, and give that change an owner. Branch whenever an answer has more than one cause, and never stop at a person: "the engineer made a mistake" is a cue to ask why the mistake was easy to make.
      source: |-
        Taiichi Ohno, *Toyota Production System: Beyond Large-Scale Production* (Productivity Press, 1988; originally 『トヨタ生産方式』, Diamond, 1978), ch. 2 "Evolution of the Toyota Production System", section "Repeating Why Five Times" — the method as the basis of Toyota's approach to problems.
    ja:
      title: なぜなぜ分析
      concept: |-
        「なぜ失敗したか」への最初の答えはたいてい症状だ。症状だけを直しても原因は残り、また同じ失敗が起きる。
      stance: 変えられるものに届くまで、なぜを問い続ける
      mechanism: |-
        調査は、誰かが防げたはずだと言える最初の原因で止まりがちだ。そこで止めればチケットを閉じられ、対策も一つ書けるからだ。その原因はたいてい時間的にいちばん近いもの（誤った設定の投入、ディスクの枯渇）で、直してもこの一件が消えるだけで、それを生んだものには手が付かない。答えが出るたびにもう一度「なぜ」と問えば、連鎖をさかのぼって、直せば同じ種類の失敗をまとめて防げる条件（欠けていたチェック、持ち主のいないプロセス）に行き着く。五回は目安で、その深さまで掘らなければならないわけではない。
      counter:
        name: スイスチーズモデル
        note: |-
          なぜを一本の鎖でたどると、複数の経路があった事故から一本だけを選ぶことになる。各段で分析者が何を選ぶかによって、出てくる根本原因が変わる。複雑なシステムでは、単一の根本原因がそもそも存在しないことも多い
      guideline: |-
        ポストモーテムでは、答えが出るたびに「なぜ」を問い、チームが変えられて、しかも変えていれば連鎖を断てたはずのものに行き着くまで続ける。その変更には担当者を付ける。一つの答えに原因が複数あるなら枝分かれさせ、人のところで止めない。「エンジニアがミスをした」は、なぜそのミスが起こしやすかったのかを問う合図だ。
      source: |-
        大野耐一『トヨタ生産方式：脱規模の経営をめざして』(ダイヤモンド社, 1978 年)。英訳『Toyota Production System: Beyond Large-Scale Production』(Productivity Press, 1988) 第 2 章「Evolution of the Toyota Production System」の節「Repeating Why Five Times」。トヨタの問題解決の基本としての「なぜを五回繰り返す」の出典。

  - slug: chaos-engineering
    tag: operations
    source_url: https://principlesofchaos.org/
    example_url: "https://www.infoq.com/news/2014/10/netflix-cassandra"
    see_also:
      - murphys-law
      - fallacies-of-distributed-computing
      - avoid-fallback
      - pesticide-paradox
    en:
      title: Chaos Engineering
      concept: |-
        Resilience that has never been exercised is a hypothesis, and production will test it whether or not you schedule the test.
      stance: Break it on purpose before production does it for you
      mechanism: |-
        Failover paths, retries and redundancy run only when something breaks, so they decay between failures: a config drifts, a dependency is added, a timeout changes, and nobody notices until the real outage. Staging cannot reproduce production's traffic, data and coupling, so a test there tells you less than you would hope about the system people actually use. Injecting failure on purpose, in production, against a stated hypothesis about steady-state behavior, makes those weaknesses show up on a weekday afternoon with engineers watching instead of at 3 a.m. Netflix built Chaos Monkey early in its move to AWS to kill instances at random, so every service had to survive losing one.
      counter:
        name: First, Do No Harm
        note: |-
          deliberately degrading a system real customers depend on spends their trust, and much of the same knowledge comes cheaper from fault-injection tests, game days and design review; on a system already known to be fragile an experiment only confirms what you knew, so fix it first
      guideline: |-
        Pick one dependency, write down what steady state should look like while it is down, and take it away in production during working hours with an abort switch and someone watching. Start with a small slice of traffic, widen only after the system holds, and do not experiment on a service you already expect to fall over.
      example: |-
        In late September 2014, AWS rebooted about a tenth of its EC2 fleet on short notice to patch a Xen vulnerability. Of Netflix's 2,700+ production Cassandra nodes, 218 were rebooted and 22 did not come back, yet Netflix reported zero downtime that weekend. The team credited the Chaos Monkey runs against Cassandra it had started a year earlier, which had forced it to build the automation that detected and replaced the failed nodes.
      source: |-
        *Principles of Chaos Engineering* (principlesofchaos.org, last updated March 2019) — the definition, the steady-state hypothesis, running experiments in production and minimizing blast radius; Netflix Technology Blog, *5 Lessons We've Learned Using AWS* (2010) — the introduction of Chaos Monkey.
    ja:
      title: カオスエンジニアリング
      concept: 一度も試されていない耐障害性は仮説にすぎない。予定を組もうと組むまいと、本番がいずれそれを試す。
      stance: 本番に壊される前に、自分で壊して確かめる
      mechanism: |-
        フェイルオーバー、リトライ、冗長構成は、何かが壊れたときにしか動かない。だから障害と障害の間に劣化していく。設定がずれる、依存が増える、タイムアウトが変わる。そうした変化に、本物の障害が来るまで誰も気づかない。ステージングでは本番のトラフィックもデータも結合も再現できないので、そこでの試験から分かる、人が実際に使うシステムのことは期待するより少ない。定常状態についての仮説を立て、本番で意図的に障害を注入すれば、弱点は深夜3時ではなく、エンジニアが見ている平日の午後に表に出る。Netflix は AWS への移行初期に、インスタンスを無作為に落とす Chaos Monkey を作り、どのサービスにもインスタンスを一台失っても動き続けることを求めた。
      counter:
        name: まず害をなさない
        note: |-
          実際の顧客が頼っているシステムをわざと劣化させれば、その顧客の信頼を削ることになる。同じ知見の多くは、障害注入テスト、ゲームデイ、設計レビューでもっと安く得られる。もろいと分かっているシステムで実験しても分かっていたことを確かめるだけなので、まず直す
      guideline: |-
        依存先を一つ選び、それが落ちている間の定常状態がどうあるべきかを書き出す。そのうえで業務時間中に、中止スイッチと見張り役を用意して、本番でその依存先を取り除く。トラフィックのごく一部から始め、システムが持ちこたえてから範囲を広げる。落ちると見込んでいるサービスでは実験しない。
      example: |-
        2014年9月末、AWS は Xen の脆弱性を塞ぐため、EC2 のおよそ1割を急に再起動した。Netflix の本番 Cassandra ノード2,700台超のうち218台が再起動され、22台は戻らなかったが、その週末のダウンタイムはゼロだったと Netflix は報告した。チームはその1年前から Cassandra に Chaos Monkey を走らせていたことを理由に挙げた。それで故障ノードを見つけて置き換える自動化を作らざるをえなかったのだ。
      source: |-
        『Principles of Chaos Engineering』(principlesofchaos.org, 2019 年 3 月最終更新)。定義、定常状態の仮説、本番での実験、影響範囲の最小化の出典。Netflix Technology Blog『5 Lessons We've Learned Using AWS』(2010) は Chaos Monkey を初めて紹介した記事。

  - slug: context-not-control
    tag: organization
    source_url: https://jobs.netflix.com/culture
    see_also:
      - conways-law
      - mechanisms-not-good-intentions
      - curse-of-knowledge
      - disagree-and-commit
    en:
      title: Context, Not Control
      concept: |-
        As an organization grows, rules and approvals tend to scale worse than shared understanding; Netflix's argument is that people given the reasons behind a goal make better local decisions than people given a procedure.
      stance: Fix the missing context before you write a rule
      mechanism: |-
        A rule encodes someone's judgment about the cases they could foresee, so it fails on the ones they could not, and every approval step sends a decision to a person with less detail than the one asking. As a company grows, each incident adds a rule and rules accumulate faster than anyone removes them, until people follow the procedure instead of thinking about the outcome. When managers spend their effort on the why (the goal, the constraints, what good looks like), the people closest to the work can decide quickly and still pull in the same direction. Netflix calls the result "highly aligned and loosely coupled".
      counter:
        name: Guardrails
        note: |-
          some failures (a leaked credential, a compliance breach, an irreversible deletion) cost too much to leave to judgment, and context does nothing for a newcomer who has not absorbed it yet
      guideline: |-
        When a team makes a call you would have made differently, ask what context they were missing before you write a rule, and fix the context first. Keep hard controls (approval gates, enforced policy) for decisions that are irreversible, unethical or a material risk, and record why each one exists so it can be removed when the reason goes away.
      source: |-
        Netflix, *Netflix Culture Memo* (jobs.netflix.com, current version c. 2024), with the same principles set out in Reed Hastings & Erin Meyer, *No Rules Rules: Netflix and the Culture of Reinvention* (Penguin Press, 2020) — "context not control", "highly aligned and loosely coupled", and keeping rules to a minimum to avoid the process creep that comes with growth.
    ja:
      title: 統制ではなく文脈を
      concept: 組織が大きくなるほど、ルールと承認は共有された理解ほどにはスケールしにくい。手順を渡された人より目標の背景を渡された人のほうが現場でよい判断をする、というのが Netflix の主張だ。
      stance: ルールを書く前に、足りなかった文脈を渡す
      mechanism: |-
        ルールは、書いた人が予見できた場面についての判断を固めたものだ。だから予見できなかった場面には合わない。承認を一段挟むたびに、判断は申請者より細部を知らない人に回される。会社が大きくなると、障害のたびにルールが一つ増え、誰かが減らすより速く積み上がる。やがて人は結果を考えずに手順に従うだけになる。管理者が「なぜ」（目標、制約、何がよい状態か）に力を注げば、仕事にいちばん近い人がすばやく決め、それでも同じ方向に進める。Netflix はこの状態を「高度に整合し、疎に結合した」と呼ぶ。
      counter:
        name: ガードレール
        note: |-
          一部の失敗（認証情報の漏洩、コンプライアンス違反、取り消せない削除）は、判断に任せるには代償が大きすぎる。また文脈は、まだそれを身につけていない新人には役に立たない
      guideline: |-
        自分なら別の判断をしたと思う決定をチームが下したら、ルールを書く前に、チームに欠けていた文脈は何かを問い、まず文脈を補う。強い統制（承認ゲート、強制されるポリシー）は、取り返しのつかない決定、倫理に反する決定、重大なリスクを伴う決定に限る。統制ごとに存在理由を書き残し、理由がなくなったら外せるようにする。
      source: |-
        Netflix『Netflix Culture Memo』(jobs.netflix.com, 2024 年頃の版)。同じ原則は Reed Hastings & Erin Meyer『No Rules Rules: Netflix and the Culture of Reinvention』(Penguin Press, 2020) にもまとめられている。「context not control」、「highly aligned and loosely coupled」、成長に伴うプロセスの肥大を避けるためにルールを最小限に保つという方針の出典。

  - slug: code-health-standard
    tag: maintainability
    source_url: https://google.github.io/eng-practices/review/reviewer/standard.html
    see_also:
      - boy-scout-rule
      - broken-windows-theory
      - law-of-triviality
      - braintrust
      - small-changes
    en:
      title: Approve What Improves Code Health
      concept: |-
        Holding every change to a standard of perfection makes review slow, and slow review leaves the codebase worse, not better.
      stance: Approve better, not perfect
      mechanism: |-
        There is no perfect code, only better code, so a reviewer who waits for perfect is holding out for a bar nobody reaches while the change sits. Authors respond by batching work into large changes that get reviewed less carefully, or by not touching the code that needs it, and the improvement the change carried never lands. A bar of net improvement keeps each merge moving the codebase in the right direction, while still letting the reviewer refuse anything that makes it worse.
      counter:
        name: Broken Windows Theory
        note: |-
          a reviewer who waves each small flaw through because the change is a net improvement can still leave a codebase full of tolerated flaws, each one making the next easier to accept
      guideline: |-
        Approve a change once it definitely leaves the code healthier than before, even if you would have written it differently. Prefix polish with "Nit:" so the author can skip it, and block only on what makes the code worse: outside an emergency, do not approve a change that definitely worsens overall code health.
      source: |-
        Google, "The Standard of Code Review", *Google Engineering Practices Documentation* (2019) — "favor approving a CL once it is in a state where it definitely improves the overall code health", "there is no such thing as 'perfect' code—there is only better code", and "Nit:" for optional comments.
    ja:
      title: コードの健全性を上げるなら承認する
      concept: すべての変更に完璧を求めるとレビューが遅くなり、遅いレビューはコードベースを良くするどころか悪くする。
      stance: 完璧でなくても、良くなるなら通す
      mechanism: |-
        完璧なコードは存在しない。あるのは、より良いコードだけだ。完璧を待つレビュアーは誰も届かない基準にこだわり、その間、変更は止まったままになる。作者は作業をまとめて大きな変更にするようになり、そのぶんレビューは粗くなる。あるいは直すべきコードに手を出さなくなり、変更に含まれていたはずの改善はいつまでも入らない。差し引きで良くなるかを基準にすれば、マージのたびにコードベースは正しい方向へ進み、それでいてレビュアーは悪くする変更を拒める。
      counter:
        name: 割れ窓理論
        note: |-
          差し引きで改善だからと小さな欠点を一つずつ通していくと、見過ごされた欠点だらけのコードベースが残る。一つ通すたびに、次も通しやすくなる
      guideline: |-
        変更によってコードが以前より確実に健全になるなら、自分なら違う書き方をしたとしても承認する。磨き込みの指摘には「Nit:」を付けて、作者が見送れるようにする。ブロックするのはコードを悪くする点だけにする。緊急時を除き、全体としてコードの健全性を確実に悪くする変更は承認しない。
      source: |-
        Google「The Standard of Code Review」『Google Engineering Practices Documentation』(2019)。"favor approving a CL once it is in a state where it definitely improves the overall code health"、"there is no such thing as 'perfect' code—there is only better code"、任意の指摘に付ける「Nit:」の出典。

  - slug: beyonce-rule
    tag: maintainability
    source_url: https://abseil.io/resources/swe-book/html/ch11.html
    see_also:
      - hyrums-law
      - churn-rule
      - pesticide-paradox
      - one-version-rule
      - test-oracle-problem
    en:
      title: Beyoncé Rule
      concept: |-
        In a shared codebase, the behavior no test checks is the behavior that changes without warning.
      stance: If you depend on it, put a test on it
      mechanism: |-
        A team changing infrastructure that the whole codebase uses cannot read every caller, so the only contract it can check at scale is the test suite. Whatever the suite does not exercise is invisible to them and changes without warning, not through carelessness but because nothing told them it mattered. The rule turns that blind spot into an assignment of responsibility: if an unrelated change passes all your tests and still breaks your product, the fix and the missing test are yours. It is only fair where a pervasive CI system runs everyone's tests against everyone's changes.
      counter:
        name: Churn Rule
        note: |-
          a test-shaped contract tells the changer what it broke, not that breaking it was free; the team making the change still owes its users the migration
      guideline: |-
        Write a test for every behavior your product relies on in a shared library or dependency, and make sure it runs in the CI that gates other people's changes. When something breaks and no test caught it, add that test before closing the incident. If you own the shared code, say up front that tests are the contract, and do not invoke the rule unless your changes actually run consumers' tests.
      source: |-
        Adam Bender, "Testing Overview", in Winters, Manshreck & Wright, *Software Engineering at Google* (O'Reilly, 2020), ch. 11 — "If you liked it, then you shoulda put a test on it", invoked by infrastructure teams making changes across the entire codebase.
    ja:
      title: ビヨンセ・ルール
      concept: 共有コードベースでは、どのテストも確かめていない挙動こそが予告なく変わる。
      stance: 頼っている挙動には、テストを置く
      mechanism: |-
        コードベース全体が使う基盤を変えるチームは、呼び出し側をすべて読むことはできない。この規模で確かめられる契約は、テストスイートしかない。スイートが確かめていない挙動は変更する側から見えず、予告なく変わる。不注意のせいではなく、それが大事だと知らせるものが何もないからだ。このルールは、その死角を責任の分担に置き換える。無関係な変更が自分たちのテストを全部通ったのに製品に問題が出たなら、修正も、足りなかったテストも自分たちの仕事になる。このルールが公平なのは、誰の変更に対しても全員のテストを走らせる CI が行き渡っている場合に限られる。
      counter:
        name: チャーンルール
        note: |-
          テストの形をした契約は、変更する側に何を壊したかを教えるだけで、壊してよかったことにはならない。変更するチームは、利用者の移行作業をそれでも負う
      guideline: |-
        共有ライブラリや依存先に頼っている挙動には、すべてテストを書く。そのテストが、他人の変更を止める CI の中で走るようにする。テストで捕まえられずに何かが壊れたら、障害を閉じる前にそのテストを足す。共有コードを持つ側なら、テストが契約だと前もって宣言する。ただし、自分の変更で利用者側のテストを実際に走らせていないなら、このルールを持ち出さない。
      source: |-
        Adam Bender「Testing Overview」、Winters, Manshreck & Wright『Software Engineering at Google』(O'Reilly, 2020) 第 11 章。"If you liked it, then you shoulda put a test on it" と、コードベース全体に変更をかける基盤チームがこのルールを使うことの出典。

  - slug: churn-rule
    tag: organization
    source_url: https://abseil.io/resources/swe-book/html/ch01.html
    see_also:
      - beyonce-rule
      - hyrums-law
      - toil
      - one-version-rule
    en:
      title: Churn Rule
      concept: |-
        When the team that changes shared infrastructure can push the migration onto its users, the cost of the change multiplies by the number of users.
      stance: Whoever changes shared code pays for the migration
      mechanism: |-
        Each consuming team meets the change cold: it ramps up on a problem it has never seen, solves its own instance and throws the knowledge away. Across hundreds of teams that is hundreds of shallow learning curves, and dependent projects spend progressively more effort just keeping up. The team that made the change never sees the bill, so nothing pushes it to change less often or make changes cheaper. Requiring the changer to do the migration puts the cost where the decision is made, and a few experts who learn the problem once can apply it everywhere.
      counter:
        name: Code Ownership
        note: |-
          people who change a codebase they do not live in miss its local reasons, so a central migration still needs the owning team's review, and some changes only its owners can make safely
      guideline: |-
        If you own a library, service or platform, budget the migration as part of the change: move the callers yourself, or change in place in a backward-compatible way. Do not ship a deprecation notice and a deadline as the migration plan. Invest in the tooling that makes cross-codebase changes cheap, and send each change to the owning team for review instead of landing it unseen.
      source: |-
        Titus Winters, "What Is Software Engineering?", in Winters, Manshreck & Wright, *Software Engineering at Google* (O'Reilly, 2020), ch. 1 — the 2012 "Churn Rule": "infrastructure teams must do the work to move their internal users to new versions themselves or do the update in place, in backward-compatible fashion."
    ja:
      title: チャーンルール
      concept: 共有基盤を変えるチームが移行作業を利用者に押しつけられると、変更のコストは利用者の数だけ膨らむ。
      stance: 共有のコードを変える側が、移行の費用も持つ
      mechanism: |-
        利用側のチームはどれも、初めて見る問題にゼロから取りかかり、自分の分だけ片づけて、得た知識を捨てる。チームが何百もあれば、浅い学習が何百回も繰り返され、依存するプロジェクトは追従するだけで年々多くの手間を取られる。変更したチームにはその請求書が届かないので、変更を減らしたり安くしたりする理由がない。移行を変更する側の仕事と決めれば、コストは決定を下した場所に戻り、一度問題を深く学んだ少数の専門家がそれをすべての箇所に適用できる。
      counter:
        name: コードオーナーシップ
        note: 普段触っていないコードを変える人は、そのコードにある固有の事情を見落とす。だから中央で一括して行う移行でもオーナーチームのレビューは要るし、オーナーにしか安全にできない変更もある
      guideline: |-
        ライブラリやサービス、プラットフォームを持つ側なら、移行作業を変更の一部として見積もる。呼び出し側は自分たちで移すか、後方互換を保ったままその場で変える。非推奨の告知と期限だけを移行計画として出さない。コードベースをまたぐ変更を安くする道具に投資し、変更は黙って入れず、一つずつオーナーチームのレビューに回す。
      source: |-
        Titus Winters「What Is Software Engineering?」、Winters, Manshreck & Wright『Software Engineering at Google』(O'Reilly, 2020) 第 1 章。2012 年に定めた「Churn Rule」("infrastructure teams must do the work to move their internal users to new versions themselves or do the update in place, in backward-compatible fashion") の出典。

  - slug: fixed-time-variable-scope
    tag: estimation
    source_url: https://basecamp.com/shapeup/1.2-chapter-03
    see_also:
      - parkinsons-law
      - hofstadters-law
      - sunk-cost-fallacy
      - technical-debt
      - cost-of-delay
    en:
      title: Fixed Time, Variable Scope
      concept: |-
        When scope is fixed and time is not, the date slips and the scope stays; fixing the time instead forces a choice about what matters.
      stance: Decide what the work is worth before you ask how long it takes
      mechanism: |-
        An estimate starts from a design and ends with a number, and the number is usually wrong in the same direction because the unknowns only surface once the work is under way. When the date slips, the scope stays, since every item already has an advocate and asking for more time feels cheaper than cutting something. Fixing the time first (what *Shape Up* calls the appetite) turns the question from "how long will this take" into "what is the best version we can ship in this much time", so cutting scope becomes the normal move rather than an admission of failure. An overrun project that keeps getting extensions is the same force again, now fed by sunk cost.
      counter:
        name: Quality as the Hidden Variable
        note: |-
          under a fixed date a team that cannot or will not cut scope cuts tests, review and error handling instead, and some work (a protocol, a compliance requirement) has a floor below which no slice is worth shipping
      guideline: |-
        Before the work starts, decide how much time it is worth, not how long it will take, and shape the scope to fit. When the time runs out, stop by default: ship what is done if it stands on its own, otherwise reshape it and decide afresh whether to bet on it again; do not quietly extend. Cut features before tests or review, and do not fix the time on work that cannot be sliced below a coherent minimum.
      source: |-
        Ryan Singer, *Shape Up* (Basecamp, 2019), ch. 3 "Set Boundaries" — the appetite and "fixed time, variable scope"; ch. 8 "The Betting Table" — the circuit breaker: "by default the project doesn't get an extension". Earlier, 37signals, *Getting Real* (2006), "Fix Time and Budget, Flex Scope": "Never throw more time or money at a problem, just scale back the scope."
    ja:
      title: 時間を固定し、スコープを変える
      concept: スコープを固定して時間を固定しないと、ずれるのは期日で、スコープは残る。時間を固定すれば、何が大事かを選ばざるを得なくなる。
      stance: かかる時間より先に、かける価値のある時間を決める
      mechanism: |-
        見積りは設計から始まり、数字で終わる。その数字はたいてい同じ方向に外れる。未知のことは作業が進んでから初めて出てくるからだ。期日がずれてもスコープは残る。どの項目にも推す人がいて、何かを削るより時間を延ばすほうが安く感じるからだ。先に時間を固定すると（『Shape Up』はこれを「アペタイト」と呼ぶ）、問いは「どれだけかかるか」から「この時間で出せる最良の版は何か」に変わり、スコープを削るのは失敗を認めることではなく普通の判断になる。超過したプロジェクトに延長を重ねるのも同じ力が働いた結果で、そこにはサンクコストも加わっている。
      counter:
        name: 隠れた変数としての品質
        note: 期日が固定されてもスコープを削れない、あるいは削らないチームは、代わりにテストやレビュー、エラー処理を削る。また、プロトコルやコンプライアンス要件のように、それ以下に切っては出す意味のない下限がある仕事もある
      guideline: |-
        作業を始める前に、どれだけかかるかではなく、どれだけの時間をかける価値があるかを決め、スコープをそれに合わせる。時間が尽きたら原則として止める。できた部分が単独で成り立つなら出し、そうでなければ問題の切り方を作り直して、もう一度賭けるかを改めて決める。黙って延長しない。機能はテストやレビューより先に削る。筋の通った最小単位より細かく切れない仕事では、時間を固定しない。
      source: |-
        Ryan Singer『Shape Up』(Basecamp, 2019) 第 3 章「Set Boundaries」。アペタイトと "fixed time, variable scope" の出典。第 8 章「The Betting Table」のサーキットブレーカー ("by default the project doesn't get an extension")。先行して 37signals『Getting Real』(2006)「Fix Time and Budget, Flex Scope」("Never throw more time or money at a problem, just scale back the scope")。

  - slug: strangler-fig
    tag: maintainability
    source_url: https://martinfowler.com/bliki/StranglerFigApplication.html
    see_also:
      - second-system-effect
      - galls-law
      - ninety-ninety-rule
      - lehmans-laws
    en:
      title: Strangler Fig
      concept: |-
        Replacing a live system piece by piece around its edges is usually safer than replacing it all at once.
      stance: Make every step of a migration shippable, and plan the deletion up front
      mechanism: |-
        A complete rewrite has to reproduce years of behavior nobody wrote down, while users keep needing features the old system must still deliver, so the target moves while the new system is not yet usable. Nothing reaches production until the end, so the risk and the value both land on a cutover day that often never comes. Routing one capability at a time to new code keeps each step small enough to verify and roll back, and each step starts paying back as soon as it lands. The price is transitional architecture: interception layers and adapters built to be thrown away.
      counter:
        name: Clean Cutover
        note: |-
          when the old system cannot be intercepted cleanly, or the transitional layer would cost more than the rewrite, a single planned switch avoids the common end state of incremental migration: the easy routes move, the tangled core never does, and the organization runs and pays for two systems indefinitely
      guideline: |-
        Put an interception point (a proxy, router or facade) in front of the legacy system and move one slice of behavior behind it at a time, starting with one that delivers value on its own. Define "done" at the start, track the share of traffic still on the old path, and budget deleting the old code and the transitional layer as part of the project, not as cleanup for later.
      source: |-
        Martin Fowler, *Strangler Fig Application* (martinfowler.com; originally "Strangler Application", 2004; rewritten 2024) — the fig metaphor and the case that the reduced risk and earlier value of gradual modernization outweigh the cost of transitional architecture.
    ja:
      title: ストラングラーフィグ
      concept: 稼働中のシステムは、一度に置き換えるより、周縁から少しずつ置き換えるほうがたいてい安全だ。
      stance: 移行は一歩ずつ出せる形にし、旧系の削除まで計画する
      mechanism: |-
        全面的な書き直しは、誰も書き残していない何年分もの挙動を再現しなければならない。その間も利用者は新しい機能を必要とし、それは古いシステムに足すしかないので、新システムが使えるようになる前に目標が動いていく。最後まで本番に何も出ないので、リスクも価値も切り替え日に一度に来る。しかもその日は来ないことが多い。機能を一つずつ新しいコードへ回せば、一歩ごとに検証も切り戻しもできる大きさに収まり、出したそばから元が取れ始める。その代わり、捨てる前提で作る振り分け層やアダプタなど、移行のためだけのアーキテクチャが要る。
      counter:
        name: 一括切り替え
        note: 古いシステムにきれいな振り分け点を置けないときや、移行用の層が書き直しより高くつくときは、計画した一度の切り替えのほうが、段階的移行のありがちな末路を避けられる。簡単な経路だけが移り、いちばん絡み合った部分はいつまでも移らず、組織は二つのシステムを運用し、その費用を払い続ける
      guideline: |-
        レガシーシステムの前に振り分け点（プロキシ、ルーター、ファサード）を置き、挙動を一部分ずつその裏へ移す。最初は、それだけで価値を生む部分を選ぶ。「完了」の定義を最初に決め、古い経路に残っているトラフィックの割合を追う。古いコードと移行用の層を消す作業は、後片づけではなくプロジェクトの一部として見積もる。
      source: |-
        Martin Fowler『Strangler Fig Application』(martinfowler.com。原題「Strangler Application」、2004 年。2024 年に書き直し)。絞め殺しのイチジクのたとえと、段階的な刷新ではリスクの低さと早く得られる価値が移行用アーキテクチャのコストを上回るという主張の出典。

  - slug: choose-boring-technology
    tag: decision
    source_url: https://mcfunley.com/choose-boring-technology
    see_also:
      - kiss-principle
      - lindy-effect
    en:
      title: Choose Boring Technology
      concept: |-
        Every unfamiliar technology a team adopts brings unknown failure modes and a permanent operating cost, and a team can afford only a few of them.
      stance: Spend new technology only where it sets you apart
      mechanism: |-
        Most of a technology's cost is paid after launch: keeping a system working reliably for years costs far more than the convenience it bought while building. With a mature tool the failure modes are well understood because someone has already hit them; with a new one the unknown unknowns are larger, and the team discovers them in production. Each addition is also one more thing to monitor, hire for and keep patched, and that cost stays after the novelty wears off. So novelty is a budget, not a free choice: McKinley gives every company about three innovation tokens.
      counter:
        name: Fitness for Purpose
        note: |-
          boring is not the same as never new; when the existing stack genuinely cannot do the job, forcing it costs more than a token, and a stack that never moves becomes the legacy nobody wants to work on
      guideline: |-
        Before adding a language, datastore or framework, write down what it would take to do the job with what you already run and why that falls short, and make the decision with everyone who will operate it, not inside one team. Spend new technology only where it sets the product apart. When you do adopt something, plan to retire what it replaces.
      source: |-
        Dan McKinley, *Choose Boring Technology* (mcfunley.com, 2015) — "every company gets about three innovation tokens", drawn from his years at Etsy.
    ja:
      title: 退屈な技術を選べ
      concept: 不慣れな技術を採り入れるたびに、未知の故障モードと恒久的な運用コストが付いてくる。チームが抱えられる数は多くない。
      stance: 新しい技術は、差がつくところにだけ使う
      mechanism: |-
        技術のコストの大半はリリース後に払う。システムを何年も安定して動かし続けるコストは、作る段階で得た便利さよりはるかに大きい。成熟した道具は、誰かがすでに落とし穴を踏んでいるので壊れ方がよく分かっている。新しい道具では「知らないことすら知らない」領域が広く、チームはそれを本番で見つけることになる。一つ増えるたびに、監視し、扱える人を採用し、パッチを当て続けなければならない対象が増え、目新しさが消えてもそのコストは残る。だから新しさは自由に選べるものではなく予算だ。McKinley は、どの会社にもイノベーショントークンはおよそ三枚しかないとする。
      counter:
        name: 目的への適合
        note: |-
          退屈な技術を選ぶとは、新しいものを決して入れないことではない。今の技術スタックでは本当に仕事ができないなら、無理に使い続けるほうがトークン一枚より高くつく。まったく変わらないスタックは、誰も触りたがらないレガシーになる
      guideline: |-
        言語、データストア、フレームワークを足す前に、今動かしているもので同じ仕事をするには何が要り、なぜそれでは足りないのかを書き出す。そのうえで、一つのチームの中ではなく、それを運用することになる全員で決める。新しい技術は、製品を他と差別化する場所にだけ使う。何かを採り入れるなら、それが置き換えるものを廃止する計画も立てる。
      source: |-
        Dan McKinley『Choose Boring Technology』(mcfunley.com, 2015)。"every company gets about three innovation tokens" の出典。Etsy 在籍時の経験に基づく。

  - slug: technical-debt
    tag: maintainability
    source_url: https://c2.com/doc/oopsla92.html
    see_also:
      - lehmans-laws
      - boy-scout-rule
      - fixed-time-variable-scope
    en:
      title: Technical Debt
      concept: |-
        Code shipped before the team fully understands the problem charges extra on later changes to that code until someone rewrites it.
      stance: Record shortcuts as loans, and repay them where you change code most
      mechanism: |-
        The first version of a program records what the team understood when it wrote it, and that understanding keeps improving after the code stops changing. Every later change has to work around the gap between the two, and the extra effort recurs on each change the way interest recurs on a loan. The cost is spread thin and lands on whoever touches the code next, so no single change makes repaying it look worthwhile, and the balance grows until the whole team slows down. Cunningham did not object to the shortcut itself; his warning was about debt that is not paid back with a rewrite while it is still small.
      counter:
        name: Premature Repayment
        note: |-
          paying down debt early spends time on code whose design may still change or that may be deleted before anyone touches it again, so cleaning up ahead of the next change can cost more than the interest it saves
      guideline: |-
        Treat code written before the team fully understood the problem as a loan: write down where it is and what repaying it would take, and schedule the rewrite while the code is still fresh in someone's head. Repay first where the team changes code most often, not where the code merely looks worst. Do not let debt pile up unrecorded.
      source: |-
        Ward Cunningham, *The WyCash Portfolio Management System* (OOPSLA '92 Experience Report, 1992) — "Shipping first time code is like going into debt. A little debt speeds development so long as it is paid back promptly with a rewrite." and "Every minute spent on not-quite-right code counts as interest on that debt." The prudent/reckless distinction is from Martin Fowler, *Technical Debt Quadrant* (martinfowler.com, 2009).
    ja:
      title: 技術的負債
      concept: 問題を十分に理解する前に出したコードは、誰かが書き直すまで、そのコードをその後変えるたびに余計なコストを生む。
      stance: 近道は借金として記録し、よく触るところから返す
      mechanism: |-
        プログラムの最初の版には、書いた時点でチームが理解していたことが刻まれる。コードが変わらなくなった後も、理解は深まり続ける。その後の変更はどれも両者のずれをよけて進めることになり、その余計な手間は、借金の利息のように変更のたびにかかる。コストは薄く広がって次にそのコードに触る人にかかるので、どの変更から見ても返すほどではないように見え、残高はチーム全体が遅くなるまで増えていく。Cunningham は手抜きそのものを責めてはいない。問題にしたのは、小さいうちに書き直して返さない負債だ。
      counter:
        name: 早すぎる返済
        note: |-
          負債を早く返すと、設計がまだ変わるかもしれないコードや、次に誰かが触る前に消えるかもしれないコードに時間を使うことになる。次の変更の前に片づけるほうが、節約できる利息より高くつくこともある
      guideline: |-
        問題を十分に理解する前に書いたコードは借金として扱う。どこにあり、返すには何が要るかを書き残し、コードが誰かの記憶に新しいうちに書き直しの予定を立てる。返済は、見た目が一番ひどいコードではなく、チームが一番よく変えるコードから始める。記録のないまま負債をためない。
      source: |-
        Ward Cunningham『The WyCash Portfolio Management System』(OOPSLA '92 Experience Report, 1992)。"Shipping first time code is like going into debt. A little debt speeds development so long as it is paid back promptly with a rewrite." と "Every minute spent on not-quite-right code counts as interest on that debt." の出典。慎重な負債と無謀な負債の区別は Martin Fowler『Technical Debt Quadrant』(martinfowler.com, 2009)。

  - slug: lehmans-laws
    tag: maintainability
    source_url: https://doi.org/10.1109/PROC.1980.11805
    see_also:
      - technical-debt
      - boy-scout-rule
      - strangler-fig
    en:
      title: Lehman's Laws of Software Evolution
      concept: |-
        A program in real use must keep changing or grow less useful, and each change makes it more complex unless work is spent to simplify it.
      stance: Budget for simplifying, not just for changing
      mechanism: |-
        A program that automates part of the world is a model of that world, and the world keeps moving: users' needs shift, the business changes, and the program's own arrival changes how people work. So the program is never finished, and each release reopens the gap between the model and what it models. Changes are made under pressure by people who do not hold the whole design in mind, so special cases and dependencies are added faster than they are removed, and the structure decays. Lehman drew the laws from watching large systems evolve over many releases, and in the same paper describes them as arising from the habits and practices of people and organizations rather than being immutable like the laws of physics.
      counter:
        name: Stability Is a Feature
        note: |-
          every change makes users relearn something and breaks someone who relied on the old behavior, so for a protocol, file format or tool that others build on, freezing the design can be worth more than keeping up with the world
      guideline: |-
        Budget ongoing change as the normal cost of a program in use, not as an exception after launch. Reserve part of every cycle for work that reduces complexity, such as deleting dead paths and merging special cases, and track a complexity measure across releases so you see the trend before it stalls you. Freeze only what other people build on, and say so when you do.
      source: |-
        Meir M. Lehman, *Programs, Life Cycles, and Laws of Software Evolution* (Proceedings of the IEEE, vol. 68, no. 9, 1980), Table I — Continuing Change: "A program that is used and that as an implementation of its specification reflects some other reality, undergoes continual change or becomes progressively less useful."; Increasing Complexity: "As an evolving program is continually changed, its complexity, reflecting deteriorating structure, increases unless work is done to maintain or reduce it."; p. 1069: the laws are "clearly not immutable, as for example, are the laws of physics" and "arise from the habits and practices of people and organizations".
    ja:
      title: レーマンのソフトウェア進化の法則
      concept: 実際に使われているプログラムは、変わり続けなければ役に立たなくなる。そして変えるたびに、手をかけて単純にしない限り複雑になっていく。
      stance: 変更だけでなく、単純化にも予算を割く
      mechanism: |-
        世の中の仕事の一部を自動化するプログラムは、その世界のモデルであり、世界は動き続ける。利用者の求めるものは移り、業務は変わり、プログラムが入ったこと自体が人の働き方を変える。だからプログラムが完成することはなく、リリースのたびにモデルと現実のずれがまた開く。変更は時間に追われ、設計の全体を頭に入れていない人の手で入るので、例外処理や依存は減るより速く増え、構造は傷んでいく。Lehman はこれらの法則を、大規模システムが何度ものリリースを経て変わっていく様子から導いた。同じ論文で、物理法則のように不変なものではなく、人と組織の習慣ややり方から生まれるものだと述べている。
      counter:
        name: 安定も機能のうち
        note: |-
          変更のたびに利用者は覚え直しを強いられ、古い挙動に頼っていた誰かが壊れる。他人がその上に作るプロトコルやファイル形式、ツールなら、世の中に追従するより設計を凍結するほうが価値を生むこともある
      guideline: |-
        継続的な変更は、リリース後の例外ではなく、使われているプログラムの通常のコストとして予算に入れる。毎回のサイクルの一部を、使われない経路の削除や例外処理の統合など、複雑さを減らす作業にあてる。複雑さの指標をリリースごとに追い、身動きが取れなくなる前に傾向をつかむ。凍結するのは他人がその上に作るものだけにし、凍結するときはそう明言する。
      source: |-
        Meir M. Lehman『Programs, Life Cycles, and Laws of Software Evolution』(Proceedings of the IEEE, vol. 68, no. 9, 1980) の表 I。継続的変化 ("A program that is used and that as an implementation of its specification reflects some other reality, undergoes continual change or becomes progressively less useful.") と複雑さの増大 ("As an evolving program is continually changed, its complexity, reflecting deteriorating structure, increases unless work is done to maintain or reduce it.") の出典。p. 1069 の "clearly not immutable, as for example, are the laws of physics" と "arise from the habits and practices of people and organizations" も同じ論文から。

  - slug: bus-factor
    tag: organization
    source_url: https://doi.org/10.1109/ICPC.2016.7503718
    see_also:
      - bystander-effect
      - curse-of-knowledge
      - programming-as-theory-building
    en:
      title: Bus Factor
      concept: |-
        The fewer people who can keep a system running, the more its future depends on each of them staying.
      stance: Anything only one person can do is a risk to fix now
      mechanism: |-
        Knowledge tends to concentrate on its own: whoever wrote a part fixes it fastest, so the next change goes to them too, and every round widens the gap. Nobody decides to make one person indispensable; it is the cheapest choice each time, and the risk stays invisible until that person leaves, falls ill or simply goes on vacation. In a sample of 133 popular GitHub projects, Avelino and colleagues found that 65% have a truck factor of two or less, meaning that losing at most two developers would leave most of their files without an active author. Spreading knowledge spends time now against a loss that may never come, so it usually loses the scheduling argument unless someone makes it an explicit goal.
      counter:
        name: Depth of Ownership
        note: |-
          a specialist who owns an area works far faster and notices more than a rotation of people who each know a little, and a small team that copies everything into a second head spends time it does not have
      guideline: |-
        List the parts of your system that only one person can change or operate. For each, pair a second person on the next real change instead of writing a handover document nobody reads. Rotate on-call and code review so knowledge moves as a side effect of normal work. Treat a planned absence as a drill: if a week away stalls a system, fix that before someone leaves for good.
      source: |-
        Folklore: the question of what becomes of a project if a key person is "hit by a bus" was in circulation by 1994, when Michael McLay posted "If Guido was hit by a bus?" to the Python mailing list on 29 June 1994 (python.org mailing-list archive, python-1994q2, message 1040). Measured in Guilherme Avelino, Leonardo Passos, Andre Hora & Marco Tulio Valente, *A Novel Approach for Estimating Truck Factors* (ICPC, 2016) — the truck factor as "the minimal number of developers that have to be hit by a truck (or quit) before a project is incapacitated", and the finding that "the majority of our target systems (65%) have TF ≤ 2".
    ja:
      title: バス係数
      concept: システムを動かし続けられる人が少ないほど、その将来は一人ひとりが辞めずにいることにかかってくる。
      stance: 一人しかできないことは、いま潰すべきリスクだ
      mechanism: |-
        知識は放っておくと偏りやすい。ある部分を書いた人が一番速く直せるので、次の変更もその人に回り、そのたびに差が開く。誰か一人を欠かせない存在にしようと決めた人はいない。その都度いちばん安い選択をした結果で、そのリスクは本人が辞めるか、病気になるか、ただ休暇を取るまで見えない。Avelino らが GitHub の人気プロジェクト133件を調べたところ、65%はトラック係数が2以下だった。開発者が一人か二人抜けるだけで、大半のファイルを書いた人がいなくなる。知識を広げるのは、来ないかもしれない損失に備えて今の時間を使うことなので、誰かがはっきり目標に掲げない限り、スケジュールの議論ではたいてい負ける。
      counter:
        name: 所有の深さ
        note: |-
          ある領域を持つ専門家は、少しずつ知っている人の持ち回りよりずっと速く動き、問題にも多く気づく。小さなチームがあらゆる知識を二人目にも持たせようとすると、ない時間を使うことになる
      guideline: |-
        一人しか変更も運用もできない箇所を洗い出す。それぞれについて、誰も読まない引き継ぎ文書を書くのではなく、次の実際の変更で二人目をペアにつける。オンコールとコードレビューを持ち回りにして、普段の仕事のついでに知識が移るようにする。予定された不在は訓練として扱う。一週間の休みでシステムが止まるなら、誰かが本当に辞める前に直す。
      source: |-
        出所は口伝。主要人物が「バスにはねられたら」プロジェクトはどうなるのかという問いは 1994 年には出回っており、この年 Michael McLay が Python のメーリングリストに「If Guido was hit by a bus?」を投稿している (1994 年 6 月 29 日。python.org のメーリングリストアーカイブ python-1994q2 の 1040 番)。計測は Guilherme Avelino, Leonardo Passos, Andre Hora & Marco Tulio Valente『A Novel Approach for Estimating Truck Factors』(ICPC, 2016)。トラック係数の定義 ("the minimal number of developers that have to be hit by a truck (or quit) before a project is incapacitated") と、"the majority of our target systems (65%) have TF ≤ 2" という結果の出典。

  - slug: pesticide-paradox
    tag: maintainability
    source_url: https://openlibrary.org/books/OL2205629M/Software_testing_techniques
    see_also:
      - beyonce-rule
      - chaos-engineering
      - test-oracle-problem
    en:
      title: Pesticide Paradox
      concept: |-
        Every way of finding bugs leaves behind the bugs it cannot find, so a test suite that never changes finds fewer and fewer.
      stance: Keep changing how you look for bugs
      mechanism: |-
        A test method catches a particular kind of bug, and once a team has run it for a while those bugs are fixed and developers learn not to write them. What remains are the bugs the method is blind to, so the same tests keep passing while the defects move to places they do not look. As with insects after seasons of the same pesticide, what survives is what the treatment cannot kill. A green suite then shows how well the code avoids yesterday's bugs, not how few bugs it has.
      counter:
        name: Old Tests Still Guard
        note: |-
          a test that has not failed in years still keeps a fixed bug from coming back and pins behavior others rely on, so retiring old tests to chase new bugs gives up protection they still provide
      guideline: |-
        Keep the regression suite, but do not count on it to find new bugs. Add tests aimed at what the suite does not exercise: new inputs, fuzzing, property-based tests, exploratory sessions. When a bug escapes to production, ask which kind of test would have caught it and add that kind, not only that one case. Review the suite on a schedule and remove tests that duplicate each other.
      source: |-
        Boris Beizer, *Software Testing Techniques* (2nd ed., Van Nostrand Reinhold, 1990), "The Pesticide Paradox and the Complexity Barrier" — "Every method you use to prevent or find bugs leaves a residue of subtler bugs against which those methods are ineffectual", and "Test suites wear out."
    ja:
      title: 殺虫剤のパラドックス
      concept: バグを見つける方法はどれも、その方法では見つからないバグを残す。だから変わらないテストスイートが見つけるバグは減っていく。
      stance: バグの探し方を変え続ける
      mechanism: |-
        テスト手法は特定の種類のバグを捕まえる。しばらく使い続けると、その種類のバグは直され、開発者もそれを書かなくなる。残るのはその手法から見えないバグなので、同じテストは通り続け、欠陥はテストが見ていない場所へ移っていく。同じ殺虫剤を何シーズンも撒いた後に残るのが、その薬では死なない虫であるのと同じだ。そうなると、テストが全部通ることが示すのは、コードが昨日のバグをどれだけ避けているかであって、バグがどれだけ少ないかではない。
      counter:
        name: 古いテストの守り
        note: |-
          何年も落ちていないテストも、直したバグの再発を止め、他人が頼る挙動を固定している。新しいバグを追うために古いテストを捨てれば、今も効いている守りを失う
      guideline: |-
        回帰テストは残すが、それで新しいバグが見つかるとは期待しない。新しい入力、ファジング、プロパティベーステスト、探索的テストなど、スイートが確かめていないところを狙うテストを足す。本番にバグが漏れたら、どの種類のテストなら捕まえられたかを考え、その一件だけでなく、その種類のテストを足す。スイートは定期的に見直し、互いに重複するテストは消す。
      source: |-
        Boris Beizer『Software Testing Techniques』(第 2 版、Van Nostrand Reinhold, 1990)「The Pesticide Paradox and the Complexity Barrier」。"Every method you use to prevent or find bugs leaves a residue of subtler bugs against which those methods are ineffectual" と "Test suites wear out." の出典。

  - slug: narratives-not-slides
    tag: decision
    source_url: https://www.aboutamazon.com/news/company-news/2017-letter-to-shareholders
    see_also:
      - working-backwards
      - curse-of-knowledge
      - type-1-vs-type-2-decisions
      - programming-as-theory-building
    en:
      title: Narratives, Not Slides
      concept: |-
        An argument cut down to slides and bullets loses the links between its points, so the gaps and warnings that prose would have exposed pass through the review unnoticed.
      stance: For decisions that matter, write prose, not bullets
      mechanism: |-
        A bullet list records claims without the links between them: which point rests on which, and which one matters most. When an analysis is condensed to fit a slide, the reasoning that would expose a gap or a warning is what gets cut, and each step up a hierarchy condenses it again; the board that investigated the loss of Space Shuttle Columbia found that information is "inevitably lost" this way. Prose forces the author to state the links, and a group that reads the document in silence at the start of the meeting argues about the same text rather than about the presenter's delivery. The price is time: Bezos says a good memo can take a week or more, so the practice pays only for decisions worth that week.
      counter:
        name: Working Software over Comprehensive Documentation
        note: |-
          when running code would settle a design question faster than prose, a document written first spends a week recording guesses, and a design doc that is really an implementation manual should not be written at all
      guideline: |-
        For a decision that is expensive to reverse, or that people outside the team must approve, write the proposal as a few pages of prose: the problem, the options considered, the trade-offs and the recommendation. Open the review with everyone reading it in silence, then discuss. Do not write one for a reversible change or for a question a quick prototype will answer; build the prototype instead.
      source: |-
        Jeff Bezos, *2017 Letter to Shareholders* (Amazon.com, Inc., 2018) — "We don't do PowerPoint (or any other slide-oriented) presentations at Amazon. Instead, we write narratively structured six-page memos.", read silently at the start of each meeting, and a memo that "might take a week or more"; Columbia Accident Investigation Board, *Report*, vol. I (2003), ch. 7, "Engineering by Viewgraphs" — "When engineering analyses and risk assessments are condensed to fit on a standard form or overhead slide, information is inevitably lost."; Malte Ubl, *Design Docs at Google* (industrialempathy.com, 2020) — the engineering form, and design docs that are "really implementation manuals" as a sign that none was needed. The counter-force is from the *Manifesto for Agile Software Development* (2001).
    ja:
      title: スライドではなく文章で
      concept: スライドと箇条書きに縮めた議論は、論点どうしのつながりを失う。文章なら露わになったはずの穴や警告が、気づかれないままレビューを通り抜ける。
      stance: 重い決定は、箇条書きではなく文章で書く
      mechanism: |-
        箇条書きは主張を並べるが、主張どうしのつながりは書かない。どの点がどの点に支えられ、どれがいちばん重要なのかが抜け落ちる。分析をスライドに収めようとすると、穴や警告を示すはずの推論から先に削られ、組織の階層を一段上がるたびにまた縮められる。スペースシャトル・コロンビア号の事故を調べた委員会は、こうして情報は「必ず失われる」と指摘した。文章で書くと、書き手はつながりを言葉にせざるを得ない。会議の冒頭に全員が黙って読めば、発表者の話しぶりではなく、同じ文面をもとに議論できる。代わりに時間がかかる。Bezos によれば、よいメモには一週間以上かかることもある。だから割に合うのは、その一週間に見合う決定だけだ。
      counter:
        name: 包括的なドキュメントよりも動くソフトウェア
        note: |-
          動くコードのほうが文章より早く設計上の問いに答えを出せるなら、先に書く文書は推測を一週間かけて書き留めるだけになる。実のところ実装手順書でしかない設計文書は、そもそも書かない
      guideline: |-
        取り消すのに高くつく決定や、チームの外の人の承認が要る決定は、数ページの文章で提案する。問題、検討した選択肢、トレードオフ、推奨案を書く。レビューは全員が黙って読むところから始め、それから議論する。取り消しやすい変更や、簡単な試作で答えが出る問いには書かない。試作を作る。
      source: |-
        Jeff Bezos『2017 年 株主への手紙』(Amazon.com, Inc., 2018 年)。"We don't do PowerPoint (or any other slide-oriented) presentations at Amazon. Instead, we write narratively structured six-page memos."、会議の冒頭に黙って読むこと、メモに "a week or more" かかりうることの出典。Columbia Accident Investigation Board『Report』第 1 巻 (2003) 第 7 章「Engineering by Viewgraphs」。"When engineering analyses and risk assessments are condensed to fit on a standard form or overhead slide, information is inevitably lost." の出典。Malte Ubl『Design Docs at Google』(industrialempathy.com, 2020)。エンジニアリングでの形と、設計文書が "really implementation manuals" になっているなら、そもそも要らなかったしるしだという指摘の出典。対抗原理は『アジャイルソフトウェア開発宣言』(2001) から。

  - slug: one-version-rule
    tag: maintainability
    source_url: https://abseil.io/resources/swe-book/html/ch16.html
    see_also:
      - churn-rule
      - hyrums-law
      - beyonce-rule
    en:
      title: One-Version Rule
      concept: |-
        When consumers may choose which version of a shared dependency to use, each choice becomes a conflict for someone who never made it.
      stance: Treat every second version as a debt with an owner and an end date
      mechanism: |-
        Two components that pin different versions of the same library each work on their own. A program that comes to depend on both gets a link failure at best, or one copy picked at random at runtime, and the team that pays is the one that combined them, not the ones that pinned. Every extra version also adds another place a security fix or an upgrade has to land, and the copies drift apart until moving off the old one is a project of its own. Hiding the second copy, by shading or renaming, does not make the conflict go away. Allowing exactly one version per dependency removes the choice, so an upgrade can be done once for every caller, and adding a dependency no longer breaks a bystander through a version conflict.
      counter:
        name: Semantic Import Versioning
        note: |-
          where no one owns every caller, as across an open-source ecosystem, nobody can make the single change that moves everyone, so letting incompatible major versions live side by side under different import paths lets each caller upgrade on its own schedule and accepts the duplicate copies as the price, which is the approach Go modules take
      guideline: |-
        Keep one version of every shared dependency, internal or third-party, and do each upgrade as one change that moves every caller. When an upgrade cannot land in one step, allow a second version only under a different name, with an owner and an end date, and delete it when the date comes. Do not let a team fork or pin a shared library on its own. Where projects have genuinely different security, legal or release requirements, split them into separate repositories, but hold each one to a single version per dependency.
      source: |-
        Titus Winters, "Version Control and Branch Management", in Winters, Manshreck & Wright, *Software Engineering at Google* (O'Reilly, 2020), ch. 16 — "For every dependency in our repository, there must be only one version of that dependency to choose.", shading solutions that "work neither in theory nor in practice", and "What is important is not whether we focus on monorepo; it's to adhere to the One-Version principle to the greatest extent possible"; Google Open Source, *The One Version Rule* (third-party policy) — "There may only be one version of a package in `//third_party`." The counter-force is Russ Cox, *Semantic Import Versioning* (research!rsc, 2018) — "to make it possible to upgrade the clients of that package one at a time and still have a buildable result".
    ja:
      title: ワン・バージョン・ルール
      concept: 共有する依存先のどのバージョンを使うかを利用者が選べると、選ぶたびに、選んでいない誰かが衝突を抱える。
      stance: 二つ目のバージョンは、持ち主と期限つきの負債とみなす
      mechanism: |-
        同じライブラリの別々のバージョンに固定した二つのコンポーネントは、それぞれ単独では動く。両方に依存するプログラムができると、よくてリンクエラー、悪ければ実行時にどちらか一方がでたらめに選ばれる。そのツケを払うのは固定したチームではなく、二つを組み合わせたチームだ。バージョンが一つ増えるたびに、セキュリティ修正やアップグレードを入れる場所も一つ増える。コピーどうしの差は広がっていき、古いほうから移るだけで一つのプロジェクトになる。シェーディングや名前の付け替えで二つ目のコピーを隠しても、衝突は消えない。依存先ごとにバージョンを一つだけと決めれば選択肢がなくなり、アップグレードを全呼び出し側に対して一度で済ませられ、依存を足しても、バージョンの衝突で無関係な誰かが壊れることはなくなる。
      counter:
        name: セマンティック・インポート・バージョニング
        note: |-
          オープンソースのエコシステムのように、すべての呼び出し側を持つ者がいない場では、全員を一度に移す変更は誰にもできない。互換性のないメジャーバージョンを別のインポートパスで並べて置けば、呼び出し側はそれぞれの都合でアップグレードでき、コピーが重複するのはその代価として受け入れる。Go のモジュールはこのやり方を採っている
      guideline: |-
        社内のものも外部のものも、共有する依存先はバージョンを一つに保つ。アップグレードは、すべての呼び出し側を一度に移す一つの変更にする。一度で入らないアップグレードに限り、二つ目のバージョンを別の名前で、オーナーと期限を付けて許し、期限が来たら消す。チームが共有ライブラリを勝手にフォークしたり固定したりするのは認めない。セキュリティ、法務、リリースの要件が本当に違うプロジェクトはリポジトリを分けてよいが、それぞれの中では依存先ごとにバージョンを一つに保つ。
      source: |-
        Titus Winters「Version Control and Branch Management」、Winters, Manshreck & Wright『Software Engineering at Google』(O'Reilly, 2020) 第 16 章。"For every dependency in our repository, there must be only one version of that dependency to choose."、シェーディングは "work neither in theory nor in practice"、"What is important is not whether we focus on monorepo; it's to adhere to the One-Version principle to the greatest extent possible" の出典。Google Open Source『The One Version Rule』(サードパーティのポリシー) の "There may only be one version of a package in `//third_party`." も参照。対抗原理は Russ Cox『Semantic Import Versioning』(research!rsc, 2018) の "to make it possible to upgrade the clients of that package one at a time and still have a buildable result" から。

  - slug: genchi-genbutsu
    tag: decision
    source_url: https://www.toyota-global.com/company/history_of_toyota/75years/text/leaping_forward_as_a_global_corporation/chapter4/section7/item4.html
    see_also:
      - five-whys
      - andon
      - goodharts-law
      - most-ideas-fail
      - mcnamara-fallacy
    en:
      title: Genchi Genbutsu (Go and See)
      concept: |-
        Decisions made from reports drift away from what is actually happening, because each layer of summary drops the detail that did not fit its form.
      stance: See the real thing yourself before you trust the summary
      mechanism: |-
        A report is written by someone who chose what to include, in categories fixed before the problem appeared, so the anomaly that matters can be averaged away or left out. A dashboard shows only what someone thought to measure, and the failure nobody predicted has no panel. The further the person deciding sits from the work, the more layers of summary lie between them, and each layer is also shaped by what its writer expects the reader to want. Toyota made going to the source one of the five key concepts of the Toyota Way: find the facts where the work happens before deciding.
      counter:
        name: Trust the Aggregate
        note: |-
          a visit shows one shift, one user or one trace, and people judge from a small sample as if it stood for the whole (the belief in the law of small numbers), so for a question about the whole fleet the dashboard that covers every case is the better witness
      guideline: |-
        Before you decide on a fix, a priority or a postmortem conclusion, look at the primary evidence yourself: reproduce the bug, read the raw logs and the trace of one failing request, watch a real user hit the problem, or sit on the support queue for an hour. Use what you saw to question the dashboard, not to replace it.
      source: |-
        Toyota Motor Corporation, *The Toyota Way 2001*, as recorded in Toyota's official history *75 Years of Toyota*, ch. 4, sec. 7 — "Genchi Genbutsu (go to the source to find the facts)", one of five key concepts compiled in April 2001; Toyota, *Sustainable Management Report 2016*, p. 23 — "go to the source to find the facts to make correct decisions, build consensus and achieve goals at our best speed." The book's opening message credits the founder with applying it: "Kiichiro thoroughly applied the principle of genchi genbutsu (going and seeing for oneself)" (Fujio Cho, *75 Years of Toyota*, Message, 2012). The bias behind the counter-force is from Amos Tversky & Daniel Kahneman, *Belief in the Law of Small Numbers* (Psychological Bulletin, 1971).
    ja:
      title: 現地現物
      concept: 報告をもとに下す判断は、実際に起きていることから離れていく。要約が一段挟まるたびに、その形式に収まらなかった細部が落ちるからだ。
      stance: 要約を信じる前に、現物を自分の目で見る
      mechanism: |-
        報告は、何を入れるかを選んだ誰かが、問題が起きる前に決まっていた区分に沿って書く。だから肝心の異常が、平均にならされたり書き漏らされたりする。ダッシュボードには、誰かが測ろうと思ったものしか映らず、誰も予想しなかった障害の画面はない。判断する人が現場から遠いほど、間に挟まる要約は増える。どの段も、書き手が読み手の求めていると思うものに寄っていく。トヨタは現地現物を、トヨタウェイの五つのキーワードの一つに据えた。判断の前に、仕事が行われている場所で事実をつかむ。
      counter:
        name: 集計を信じる
        note: |-
          現場で見られるのは一つのシフト、一人の利用者、一本のトレースだ。人は小さな標本を全体の代表のように扱いがちだ (少数の法則の信念)。全体についての問いなら、すべての事例を含むダッシュボードのほうが確かな証人になる
      guideline: |-
        修正、優先順位、ポストモーテムの結論を決める前に、一次情報を自分の目で確かめる。バグを再現する、生のログと失敗したリクエスト一件のトレースを読む、実際の利用者が問題にぶつかる様子を見る、一時間サポートの窓口に座る。見たものはダッシュボードを疑うのに使い、置き換えるのには使わない。
      source: |-
        トヨタ自動車『トヨタウェイ 2001』。公式社史『トヨタ自動車75年史』第 4 章第 7 節の記録による。"Genchi Genbutsu (go to the source to find the facts)" は 2001 年 4 月にまとめられた五つのキーワードの一つ。トヨタ『Sustainable Management Report 2016』p. 23 の "go to the source to find the facts to make correct decisions, build consensus and achieve goals at our best speed." も参照。75年史の巻頭メッセージで張富士夫会長は、創業者がこの原則を徹底して実践したと述べている ("Kiichiro thoroughly applied the principle of genchi genbutsu (going and seeing for oneself)"、2012)。対抗原理の背景にあるバイアスは Amos Tversky & Daniel Kahneman『Belief in the Law of Small Numbers』(Psychological Bulletin, 1971) から。

  - slug: believability-weighted-decisions
    tag: decision
    source_url: https://www.principles.com/principles/633d5d13-8610-425f-ad62-cd62347d9165/
    see_also:
      - disagree-and-commit
      - dunning-kruger-effect
      - law-of-triviality
    en:
      title: Believability-Weighted Decisions
      concept: |-
        When a group counts every opinion the same, or defers to rank, the people who have actually done the thing before are outvoted by those who have not.
      stance: Weigh views by track record, not by rank or headcount
      mechanism: |-
        In a design review everyone can form a view on every part, but only some of the room has built or run something like it. A show of hands gives the first-timer and the engineer who ran the last migration one vote each, and deferring to the most senior person only swaps one blind spot for another. Dalio's test is narrow and checkable: the most believable people have "repeatedly and successfully accomplished the thing in question" and can explain the cause and effect behind their view. Bridgewater shows the equal-weighted and the believability-weighted vote side by side: when they agree the matter is settled, and when they split, it tries again to resolve the disagreement and otherwise goes with the weighted vote. The split itself is where the information is.
      counter:
        name: Wisdom of Crowds
        note: |-
          when judgments are made independently, a plain equal-weight aggregate is hard to beat (the median guess of Galton's fairground crowd was within 1 percent of the ox's weight), and picking experts in advance bets on a track record that may not carry over to the new question
      guideline: |-
        Before a contested technical call, ask who has built or run this kind of thing before and whether it worked, and give their view more weight than headcount or title. Collect views in writing before the discussion so they stay independent, and look at both the plain tally and the weighted one; where they disagree, dig in rather than letting the weighted side win by default. Base believability on outcomes you can check, such as systems shipped and postmortems, and drop the weighting for questions nobody on the team has faced before.
      source: |-
        Ray Dalio, *Principles: Life & Work* (Simon & Schuster, 2017), work principle "Believability Weight Your Decision Making" (principles.com) — "the best decisions are made by an idea meritocracy with believability-weighted decision making", the most believable people being those who "have repeatedly and successfully accomplished the thing in question", and a tool that "displays both the equal-weighted average and the believability-weighted results". Netflix's culture memo (jobs.netflix.com, current version) makes the same point: "not all opinions are created equal". The counter-force is Francis Galton, *Vox Populi* (Nature, 1907).
    ja:
      title: 信頼度で重みづけする意思決定
      concept: 集団がどの意見も同じ一票と数えたり、役職に従ったりすると、実際にそれをやったことのある人が、やったことのない人に多数決で負ける。
      stance: 意見の重みは、肩書きや人数ではなく実績で決める
      mechanism: |-
        設計レビューでは誰でもどの部分にも意見を持てるが、似たものを作ったり運用したりした経験があるのは一部の人だけだ。挙手で決めれば、初めて触る人も前回の移行をやり遂げたエンジニアも同じ一票になる。いちばん上の人に従っても、別の死角に置き換わるだけだ。Dalio の基準は狭く、確かめられる。最も信頼できるのは、問題になっていることを「繰り返し成功させてきた」うえで、自分の見解の因果を説明できる人だ。Bridgewater では、均等に数えた票と信頼度で重みづけした票を並べて示す。両者が一致すれば決着とし、割れたらもう一度すり合わせ、それでも決まらなければ重みづけした票に従う。割れたこと自体に情報がある。
      counter:
        name: 群衆の知恵
        note: |-
          判断が互いに独立していれば、均等な重みの単純な集計を上回るのは難しい (Galton が見た品評会の群衆の推定の中央値は、牛の重さとの差が 1% もなかった)。専門家を前もって選ぶのは、過去の実績が新しい問いにも通じるほうに賭けることだ
      guideline: |-
        意見の割れる技術判断の前に、この種のものを作ったり運用したりした人は誰か、それはうまくいったかを確かめ、その人の見解を人数や肩書きより重く扱う。議論の前に意見を書面で集めて独立性を保ち、単純な集計と重みづけした集計の両方を見る。両者が食い違ったら、重みづけした側を自動的に勝たせず、掘り下げる。信頼度は、出荷したシステムやポストモーテムなど、確かめられる結果をもとに決める。チームの誰も経験したことのない問いでは、重みづけをやめる。
      source: |-
        Ray Dalio『Principles: Life & Work』(Simon & Schuster, 2017) の仕事の原則「Believability Weight Your Decision Making」(principles.com)。"the best decisions are made by an idea meritocracy with believability-weighted decision making"、最も信頼できる人の条件 "have repeatedly and successfully accomplished the thing in question"、"displays both the equal-weighted average and the believability-weighted results" という道具の出典。Netflix のカルチャーメモ (jobs.netflix.com の現行版) も "not all opinions are created equal" と同じことを言う。対抗原理は Francis Galton『Vox Populi』(Nature, 1907) から。

  - slug: braintrust
    tag: organization
    source_url: https://review.firstround.com/spark-creativity-with-these-tips-from-pixars-president/
    see_also:
      - code-health-standard
      - blameless-postmortem
      - curse-of-knowledge
      - psychological-safety
    en:
      title: Braintrust (Notes Without Authority)
      concept: |-
        Feedback from people who can overrule the owner gets defended against rather than used; peers with no power to impose a fix can be candid, and the owner can afford to hear them.
      stance: Give candid notes, and leave the fix to the owner
      mechanism: |-
        Someone deep in a piece of work loses perspective and needs outside eyes. But if those eyes can impose a fix, the owner comes in to defend the work instead of to hear about it, and reviewers drift from naming the problem to dictating their own solution. Taking away the veto changes both sides: reviewers can be blunt because nothing they say is binding, and the owner can listen because nothing they hear is an order. The owner, who still answers for the result and knows constraints the room does not, then chooses the remedy.
      counter:
        name: Review as a Gate
        note: |-
          where a blind spot's cost lands on someone other than the owner (a security hole, lost data, another team's pager), advice that can be ignored is not enough, and a reviewer has to be able to block
      guideline: |-
        In a design or RFC review, let reviewers name problems and their suspected causes but not dictate the fix, and leave the decision with the author, who answers each point in writing. Fill the room with peers who have built something similar, not the manager who rates the author. Where a mistake would land on others (security, data loss, an irreversible migration), keep a blocking approval, but run it as a separate step from the advisory review.
      source: |-
        Ed Catmull, quoted in "Spark Creativity with These Tips from Pixar's President" (*First Round Review*, 2015) — "the Braintrust should have no authority", so that the person responsible "would never have to come into the room in a defensive posture"; the practice is set out at length in Ed Catmull with Amy Wallace, *Creativity, Inc.* (Random House, 2014). The counter-force is the approver model of code review, where "the reviewer can certainly deny approval" (Google, *The Standard of Code Review*).
    ja:
      title: ブレイントラスト (権限を持たない助言)
      concept: オーナーを覆せる人からの意見は、活かされるより先に防御の対象になる。修正を強制できない仲間なら率直に言えるし、オーナーも落ち着いて聞ける。
      stance: 率直に指摘し、直し方は持ち主に任せる
      mechanism: |-
        仕事に深く入り込んだ人は全体が見えなくなり、外の目を必要とする。ところがその目が修正を押しつけられるなら、オーナーは話を聞くためではなく作品を守るために部屋に入り、レビュアーは問題を指摘するところから自分の解決策を指図するところへずれていく。拒否権を外すと両側が変わる。言ったことに拘束力がないからレビュアーは遠慮なく言え、聞いたことが命令ではないからオーナーは耳を傾けられる。そのうえで、結果に責任を持ち、その場の誰も知らない制約を知っているオーナーが直し方を選ぶ。
      counter:
        name: 関門としてのレビュー
        note: |-
          死角のツケがオーナー以外の誰か (セキュリティの穴、失われたデータ、別チームのオンコール) に回るなら、無視できる助言では足りず、レビュアーが止められなければならない
      guideline: |-
        設計レビューや RFC のレビューでは、レビュアーは問題とその原因と思われるものを指摘するが、直し方は指図しない。判断は作者に任せ、作者は指摘の一つひとつに書面で答える。部屋には、作者を評価する上司ではなく、似たものを作った経験のある仲間を集める。誤りのツケが他人に回るもの (セキュリティ、データ消失、取り消せない移行) では、止める権限のある承認を残す。ただし助言のためのレビューとは別の手順にする。
      source: |-
        Ed Catmull の発言。「Spark Creativity with These Tips from Pixar's President」(『First Round Review』, 2015) による。"the Braintrust should have no authority" と、責任者が "would never have to come into the room in a defensive posture" で済むようにするという点の出典。仕組みの全体は Ed Catmull with Amy Wallace『Creativity, Inc.』(Random House, 2014) に詳しい。対抗原理は、"the reviewer can certainly deny approval" とするコードレビューの承認者モデル (Google『The Standard of Code Review』) から。
  - slug: brandolinis-law
    tag: cognition
    source_url: https://en.wikipedia.org/wiki/Brandolini%27s_law
    example_url: "https://daniel.haxx.se/blog/2026/01/26/the-end-of-the-curl-bug-bounty/"
    see_also:
      - cunninghams-law
      - linus-law
      - kernighans-law
      - automation-bias
    en:
      title: Brandolini's Law
      concept: |-
        Refuting a false claim takes far more effort than making it, so a stream of cheap claims can swamp the people who have to check them.
      stance: Make a claim carry its own evidence before you spend yours on it
      mechanism: |-
        A claim can be stated in one line; showing it is wrong means reading the context, reproducing the case and writing up why it fails. The person making the claim pays the first cost and the checker pays the second, and nothing stops the first from being much cheaper. curl's security team has seven members; in 2025 each incoming report drew three or four of them, by Stenberg's estimate for 30 minutes and sometimes up to three hours each; as of early July 2025, about 20% of that year's submissions so far were AI slop and about 5% had turned out to be genuine vulnerabilities. When producing a claim gets cheaper, as generated text has made it, the gap widens.
      counter:
        name: Cunningham's Law
        note: |-
          in front of people who know the subject, a wrong claim often draws its correction quickly and for free, so posting your best guess and letting others fix it can beat holding back until every claim is checked
      guideline: |-
        Where claims arrive faster than you can check them (bug reports, review comments, security disclosures), ask the claimant for the evidence up front: steps to reproduce, a failing test, the log. Timebox the first look, and watch what a reward attracts: even one paid only for confirmed results can draw more claims than you can check, and then it is better dropped. Do not use this to wave away a short report from someone with nothing to gain; a terse report that reproduces deserves full attention.
      example: |-
        curl ended its bug bounty, officially on January 31, 2026. In his January 2026 post, Daniel Stenberg wrote that in previous years somewhere north of 15% of submissions ended up as confirmed vulnerabilities, but "Starting 2025, the confirmed-rate plummeted to below 5%." He named AI slop among the reasons and said the change was "In an attempt to remove the incentives for submitting made up lies."
      source: |-
        Alberto Brandolini, tweet (Twitter, 11 January 2013) — "The bullshit asimmetry: the amount of energy needed to refute bullshit is an order of magnitude bigger than to produce it." (spelling as in the tweet itself; Wikipedia's citation retitles it); Daniel Stenberg, "Death by a thousand slops" (daniel.haxx.se, July 2025) — the curl security team's numbers as of early July 2025; Daniel Stenberg, "The end of the curl bug-bounty" (daniel.haxx.se, January 2026) — the example, including the confirmed rate from 2025 on.
    ja:
      title: ブランドリーニの法則
      concept: 誤った主張を論破するには、それを言うよりはるかに手間がかかる。だから安い主張が大量に来ると、確かめる側の手が回らなくなりうる。
      stance: 反論に手間をかける前に、まず主張に証拠を出させる
      mechanism: |-
        主張は一行で言える。それが誤りだと示すには、文脈を読み、事例を再現し、なぜ成り立たないかを書かなければならない。主張する側が払うのは前者で、確かめる側が払うのは後者だ。前者がずっと安くて済むのを止める仕組みはない。curl のセキュリティチームは7人で、2025年は報告が来るたびに3〜4人が、Stenberg の見積りでそれぞれ30分、ときには3時間ほどかけていた。2025年7月初めの時点で、その年にそれまで送られてきたものの約20%は AI が生成したゴミで、本物の脆弱性だったのは約5%だった。生成されたテキストのせいで主張を作るのが安くなるほど、この差は広がる。
      counter:
        name: カニンガムの法則
        note: |-
          詳しい人が見ている場では、間違った主張にはすぐに無料で訂正がつくことが多い。主張を一つ残らず確かめてから出すより、自分の推測を出して直してもらうほうが早い場合もある
      guideline: |-
        確かめる速さを超えて主張が届く場所（バグ報告、レビューコメント、脆弱性の報告）では、最初に証拠を求める。再現手順、失敗するテスト、ログを出してもらう。最初の確認には時間の上限を決める。報酬が何を呼び込むかも見ておく。確認済みの結果にだけ払う報酬でも、確かめきれないほどの主張を集めるなら、やめたほうがいい。ただし、得るもののない人からの短い報告を切り捨てる口実にはしない。短くても再現する報告は、きちんと見る。
      example: |-
        curl はバグバウンティを終え、正式な終了日は2026年1月31日だった。2026年1月の記事での Daniel Stenberg によれば、以前は報告の15%強が確認済みの脆弱性になっていたが、2025年からその割合は5%未満に落ちた。理由の一つに AI が生成したゴミを挙げ、でっち上げの嘘を送る動機をなくすための措置だと書いている。
      source: |-
        Alberto Brandolini のツイート (Twitter, 2013年1月11日)。"The bullshit asimmetry: the amount of energy needed to refute bullshit is an order of magnitude bigger than to produce it."（綴りはツイートの原文のまま。Wikipedia の出典表記は題を言い換えている）。2025年7月初め時点の curl のセキュリティチームの数字は Daniel Stenberg「Death by a thousand slops」(daniel.haxx.se, 2025年7月) による。事例と、2025年以降の確認率は Daniel Stenberg「The end of the curl bug-bounty」(daniel.haxx.se, 2026年1月) による。
  - slug: automation-bias
    tag: cognition
    source_url: https://doi.org/10.1177/0018720810376055
    example_url: "https://www.ntsb.gov/investigations/Pages/HWY18FH011.aspx"
    see_also:
      - ironies-of-automation
      - swiss-cheese-model
      - brandolinis-law
      - test-oracle-problem
      - small-changes
      - lethal-trifecta
    en:
      title: Automation Bias
      concept: |-
        People working with an automated aid tend to let it stand in for their own checking: they miss what it fails to flag and follow it when it is wrong.
      stance: Answer for the outcome, not for having followed the tool
      mechanism: |-
        Checking costs attention, and an aid that is usually right makes each check feel wasted, so its output quietly replaces the search a person would otherwise do. Parasuraman and Manzey's review describes two kinds of error: "Automation bias results in making both omission and commission errors when decision aids are imperfect." It is not a beginner's mistake: "Automation bias occurs in both naive and expert participants, cannot be prevented by training or instructions, and can affect decision making in individuals as well as in teams." In a user study by Perry et al., participants with an AI code assistant wrote significantly less secure code than those without one, and were more likely to believe their code was secure.
      counter:
        name: Algorithm Aversion
        note: |-
          the opposite error is common too: Dietvorst, Simmons and Massey found that "people more quickly lose confidence in algorithmic than human forecasters after seeing them make the same mistake", and so drop an aid that still beats them
      guideline: |-
        Wherever an automated aid feeds a decision (generated code, scanner results, an alert that says all clear), name a person who answers for the outcome, not for having followed the tool. On high-stakes paths such as security, data migrations and production changes, have the reviewer check against the requirement, not against the tool's own output, and keep a record of what the aid missed. Do not re-derive by hand what the tool has shown it does better; spot-check low-stakes output instead.
      example: |-
        On March 23, 2018, a Tesla Model X operating with Traffic-Aware Cruise Control and Autosteer moved into a gore area on US-101 in Mountain View, California, and struck a damaged crash attenuator; the driver died. The NTSB's probable cause included the Autopilot steering the SUV into the gore area due to system limitations, and the driver's lack of response due to distraction "likely from a cell phone game application and overreliance on the Autopilot partial driving automation system."
      source: |-
        Kathleen L. Mosier, Linda J. Skitka, Susan Heers & Mark Burdick, *Automation Bias: Decision Making and Performance in High-Tech Cockpits* (International Journal of Aviation Psychology, 1998) and Linda J. Skitka, Kathleen L. Mosier & Mark Burdick, *Does automation bias decision-making?* (International Journal of Human-Computer Studies, 1999) — early empirical studies of the bias; Raja Parasuraman & Dietrich H. Manzey, *Complacency and Bias in Human Use of Automation: An Attentional Integration* (Human Factors, 2010) — the review quoted above; Neil Perry, Megha Srivastava, Deepak Kumar & Dan Boneh, *Do Users Write More Insecure Code with AI Assistants?* (CCS, 2023) — the code assistant study; Berkeley J. Dietvorst, Joseph P. Simmons & Cade Massey, *Algorithm Aversion: People Erroneously Avoid Algorithms After Seeing Them Err* (Journal of Experimental Psychology: General, 2015) — the counter.
    ja:
      title: 自動化バイアス
      concept: 自動化された補助を使う人は、自分で確かめる代わりにそれを頼りがちだ。補助が指摘しないものを見落とし、補助が間違っていてもそれに従う。
      stance: ツールに従ったかではなく、結果に責任を持つ
      mechanism: |-
        確かめるには注意がいる。たいてい正しい補助を使っていると、一回ごとの確認が無駄に思えてきて、本来なら自分でする探索がいつのまにか補助の出力に置き換わる。Parasuraman と Manzey のレビューは誤りを二種類に分け、補助が不完全なとき、自動化バイアスは見落とし（omission）と誤った指示への追従（commission）の両方を生むとしている。初心者だけの問題でもない。初心者にも熟練者にも起き、訓練や指示では防げず、個人の判断にもチームの判断にも影響するという。Perry らのユーザ実験では、AI のコードアシスタントを使った参加者は使わなかった参加者より有意に安全性の低いコードを書き、しかも自分のコードは安全だと思いやすかった。
      counter:
        name: アルゴリズム嫌悪
        note: |-
          逆向きの誤りもよく起きる。Dietvorst、Simmons、Massey によれば、人は同じ間違いを見たとき、人間の予測者よりアルゴリズムのほうに早く信頼を失う。そのため、まだ自分より正確な補助を手放してしまう
      guideline: |-
        自動化された補助が判断に入る場所（生成されたコード、スキャナの結果、異常なしと告げるアラート）では、ツールに従ったかどうかではなく、結果に責任を持つ人を一人決める。セキュリティ、データ移行、本番の変更のように影響の大きい経路では、レビュアーはツールの出力ではなく要件と照らし合わせて確かめ、補助が見落としたものを記録しておく。ツールのほうが確かだとわかっている作業を手でやり直すことはしない。影響の小さい出力は抜き取りで確かめる。
      example: |-
        2018年3月23日、カリフォルニア州マウンテンビューの US-101 で、Traffic-Aware Cruise Control と Autosteer を使って走っていた Tesla Model X が分岐部の導流帯に入り、損傷していた衝撃吸収装置に衝突して、運転者が亡くなった。NTSB は推定原因として、システムの限界から Autopilot が車を導流帯に向けたことと、運転者が反応しなかったことを挙げた。運転者が反応しなかったのは、おそらく携帯電話のゲームアプリに気を取られていたことと、部分的な運転自動化システムである Autopilot に頼りすぎていたためだとしている。
      source: |-
        Kathleen L. Mosier, Linda J. Skitka, Susan Heers & Mark Burdick『Automation Bias: Decision Making and Performance in High-Tech Cockpits』(International Journal of Aviation Psychology, 1998) と Linda J. Skitka, Kathleen L. Mosier & Mark Burdick『Does automation bias decision-making?』(International Journal of Human-Computer Studies, 1999)。このバイアスを検証した初期の研究。Raja Parasuraman & Dietrich H. Manzey『Complacency and Bias in Human Use of Automation: An Attentional Integration』(Human Factors, 2010) は本文で引いたレビュー。コードアシスタントの実験は Neil Perry, Megha Srivastava, Deepak Kumar & Dan Boneh『Do Users Write More Insecure Code with AI Assistants?』(CCS, 2023)。反対の力は Berkeley J. Dietvorst, Joseph P. Simmons & Cade Massey『Algorithm Aversion: People Erroneously Avoid Algorithms After Seeing Them Err』(Journal of Experimental Psychology: General, 2015)。
  - slug: small-changes
    tag: maintainability
    source_url: https://google.github.io/eng-practices/review/developer/small-cls.html
    see_also:
      - code-health-standard
      - boy-scout-rule
      - linus-law
      - littles-law
      - automation-bias
    en:
      title: Small Changes
      concept: |-
        The larger a change sent for review, the less closely each line is read: defects slip through and the change waits longer for a first look.
      stance: Send a change small enough to read in one sitting
      mechanism: |-
        A reviewer's attention runs out. In SmartBear's study of 2,500 reviews at Cisco, reviews of under 200 lines found defects at a relatively high rate and the results trailed off considerably above that; its authors concluded that "Anything larger overwhelms reviewers and defects are not uncovered." Google's guide adds the scheduling side: "It’s easier for a reviewer to find five minutes several times to review small CLs than to set aside a 30 minute block to review one large CL." At Google the median change modifies 24 lines, and authors wait a median of under an hour for initial feedback on small changes and about 5 hours on very large ones.
      counter:
        name: Per-Change Overhead
        note: |-
          every change pays a fixed cost whatever its size (a review round trip, a CI run, the reviewer switching context), so splitting work multiplies those costs and the waits between them; when reviews are slow, a chain of tiny dependent changes can take far longer to land than one coherent change
      guideline: |-
        Make each change one self-contained thing: about 100 lines is usually reasonable and 1000 lines usually too large, though the reviewer has the final say. Send refactoring separately from behaviour changes, and stack dependent changes instead of piling them into one. Do not split a purely mechanical change (a rename, generated code) just to hit a number, and do not cut a design so finely that the reviewer can no longer see what it does.
      source: |-
        Google, "Small CLs", *Google Engineering Practices Documentation* — "100 lines is usually a reasonable size for a CL, and 1000 lines is usually too large, but it’s up to the judgment of your reviewer."; SmartBear Software, "Code Review at Cisco Systems", in *Best Kept Secrets of Peer Code Review* (Smart Bear, 2006) — a vendor's case study of 2,500 reviews, which recommends that "LOC under review should be under 200, not to exceed 400."; Caitlin Sadowski, Emma Söderberg, Luke Church, Michal Sipko & Alberto Bacchelli, *Modern Code Review: A Case Study at Google* (ICSE-SEIP, 2018) — the change size and review latency figures. DORA, "Working in small batches" (dora.dev) — the counter, the fixed cost per change: "One reason work is done in large batches is because of the large fixed cost of handing off changes."
    ja:
      title: 小さな変更
      concept: レビューに出す変更が大きいほど、一行ずつは丁寧に読まれなくなる。欠陥はすり抜け、最初に見てもらうまでの待ちも長くなる。
      stance: 一度に読み切れる大きさで変更を出す
      mechanism: |-
        レビュアーの注意には限りがある。SmartBear が Cisco で 2,500件のレビューを調べた研究では、200行未満のレビューは比較的高い率で欠陥を見つけ、それを超えると結果は大きく落ちた。著者たちは、それより大きいとレビュアーは手に負えなくなり、欠陥は見つからないと結論している。Google のガイドは時間の取り方の面を挙げる。大きな変更一つのために30分のまとまった時間を空けるより、小さな変更のために5分を何度か見つけるほうがレビュアーには楽だ。Google では変更の行数の中央値は24行で、最初のフィードバックまでの待ち時間の中央値は、小さな変更で1時間未満、とても大きな変更で約5時間だった。
      counter:
        name: 変更ごとの固定費
        note: |-
          変更には大きさに関係なくかかる固定費がある（レビューの往復、CI の実行、レビュアーの頭の切り替え）。細かく割るほどその費用と待ちが増える。レビューが遅い場では、依存し合う小さな変更を順に通すほうが、まとまった一つの変更より取り込みまでずっと時間がかかることがある
      guideline: |-
        変更は一つで完結するものにする。100行くらいならたいてい妥当で、1000行はたいてい大きすぎる。ただし最後はレビュアーが決める。リファクタリングは振る舞いの変更と別に出し、依存し合う変更は一つにまとめず、順番に積んで出す。名前の変更や生成コードのような機械的な変更を、行数を合わせるためだけに割ることはしない。レビュアーが全体として何をするのか見えなくなるほど、設計を細かく切り分けることもしない。
      source: |-
        Google「Small CLs」『Google Engineering Practices Documentation』。"100 lines is usually a reasonable size for a CL, and 1000 lines is usually too large, but it’s up to the judgment of your reviewer." SmartBear Software「Code Review at Cisco Systems」、『Best Kept Secrets of Peer Code Review』(Smart Bear, 2006) 所収。2,500件のレビューを扱ったベンダー自身の事例研究で、"LOC under review should be under 200, not to exceed 400." と勧めている。変更の大きさとレビュー待ちの数字は Caitlin Sadowski, Emma Söderberg, Luke Church, Michal Sipko & Alberto Bacchelli『Modern Code Review: A Case Study at Google』(ICSE-SEIP, 2018) による。変更ごとの固定費というカウンターは DORA「Working in small batches」(dora.dev) による。"One reason work is done in large batches is because of the large fixed cost of handing off changes."
  - slug: programming-as-theory-building
    tag: maintainability
    source_url: https://doi.org/10.1016/0165-6074(85)90032-8
    see_also:
      - bus-factor
      - curse-of-knowledge
      - eaglesons-law
      - narratives-not-slides
    en:
      title: Programming as Theory Building
      concept: |-
        A program's design lives in the heads of the people who built it, and the code and documents carry only part of it, so once those people are gone, changes tend to erode the design even with full documentation in hand.
      stance: Code stays maintainable only while someone can say why it is the way it is
      mechanism: |-
        Peter Naur argued that programming is mainly the programmers building up a theory of the matters at hand: how the program maps onto the world it serves, why each part is the way it is, and how a new demand fits into it. That knowledge stays with the people, "any documentation being an auxiliary, secondary product." In one case he describes, a second group extending a compiler had full documentation, annotated program texts, written design discussion and personal advice from the original authors, and still proposed patches that "effectively destroyed its power and simplicity"; the original group spotted them instantly. About ten years later, after others had changed it without that guidance, the original structure was "still visible, but made entirely ineffective by amorphous additions of many different kinds." Naur's conclusion: "The death of a program happens when the programmer team possessing its theory is dissolved," and rebuilding the theory merely from the documentation is "strictly impossible." Code accepted from a generator that nobody on the team has reasoned through is likely to start out in that state.
      counter:
        name: Fake the Rational Design
        note: |-
          Parnas and Clements argue for writing the design down as if it had been derived rationally and keeping that record current with every change, so new programmers do not have to depend completely on the old staff; where people move on often, a maintained record is a safer bet than counting on who stays
      guideline: |-
        When a system changes hands, plan an overlap: the new owners make real changes while the old team reviews them, and the handover ends when the old team stops catching patches that fight the design. Before merging code from a generator or a contractor, have the person who will own it explain why it is shaped the way it is; if nobody can, treat it as unowned. When a program's team is gone, Naur's advice is to discard the old text and let the new team solve the problem afresh, which he expects to cost no more than reviving it; where a rewrite is out of reach, rebuild the theory by pairing on real changes before restructuring anything.
      source: |-
        Peter Naur, *Programming as Theory Building* (Microprocessing and Microprogramming, 1985) — programming as building "a certain kind of insight, a theory, of the matters at hand", the compiler case, "The death of a program happens when the programmer team possessing its theory is dissolved.", and revival from documentation being "strictly impossible". The counter-force is from David L. Parnas & Paul C. Clements, *A Rational Design Process: How and Why to Fake It* (IEEE Transactions on Software Engineering, 1986) — "When new programmers join the project they do not have to depend completely on the old staff for their information."
    ja:
      title: プログラミングは理論の構築である
      concept: プログラムの設計は作った人たちの頭の中にあり、コードや文書が運べるのはその一部だけだ。だから作った人たちがいなくなると、文書がそろっていても、変更を重ねるうちに設計が崩れやすい。
      stance: 理由を言える人がいるうちが、保守できるコードだ
      mechanism: |-
        Peter Naur は、プログラミングとは主にプログラマが対象についての理論を組み立てることだと論じた。プログラムが現実のどこに対応しているか、各部分がなぜそうなっているか、新しい要求をどこにどう収めるか。その知識は人に残り、文書は「補助的で二次的な産物」にすぎない。Naur が挙げる例では、コンパイラを拡張することになった別のグループが、完全な文書、注釈つきのプログラム、設計の議論を書いたもの、原作者からの直接の助言まで受け取っていた。それでも彼らが出した修正案は、元の構造の力と簡潔さを「事実上壊す」パッチで、原作者のグループはすぐにそれを見抜いた。その後、原作者の助言なしに別の人たちが手を入れ続け、約10年後には元の構造は「まだ見えるが、さまざまな種類の無定形な追加によってまったく役に立たなくなっていた」。Naur の結論は「プログラムの死は、その理論を持つプログラマのチームが解散したときに起きる」であり、文書だけから理論を立て直すのは「厳密に不可能」だとした。チームの誰も筋道を追っていない生成コードを受け入れると、最初からこの状態に近くなりやすい。
      counter:
        name: 合理的な設計を装う
        note: |-
          Parnas と Clements は、設計を合理的に導いたかのように書き残し、変更のたびにその記録を最新に保つべきだと論じた。そうすれば新しく入った人は古いメンバーだけに頼らずにすむ。人の入れ替わりが多い職場では、誰が残るかに賭けるより、保たれた記録のほうが確かだ
      guideline: |-
        システムの担当が替わるときは、重なる期間を取る。新しい担当が実際に変更を加え、前のチームがそれをレビューする。設計に逆らうパッチを前のチームが見つけなくなったら、引き継ぎを終える。生成コードや外注のコードをマージする前に、それを持つことになる人に、なぜこういう形なのかを説明させる。誰も説明できないなら、持ち主のいないコードとして扱う。チームがいなくなったプログラムについて、Naur は古いプログラムを捨てて新しいチームに問題を解き直させるよう勧め、そのほうが復活させるより高くはつかないとした。書き直せないなら、何かを組み替える前に、実際の変更をペアで進めて理論を組み立て直す。
      source: |-
        Peter Naur『Programming as Theory Building』(Microprocessing and Microprogramming, 1985)。プログラミングを "a certain kind of insight, a theory, of the matters at hand" を組み立てる活動とみる見方、コンパイラの例、"The death of a program happens when the programmer team possessing its theory is dissolved."、文書からの復活が "strictly impossible" だという主張の出典。対抗原理は David L. Parnas & Paul C. Clements『A Rational Design Process: How and Why to Fake It』(IEEE Transactions on Software Engineering, 1986) から。"When new programmers join the project they do not have to depend completely on the old staff for their information." の出典。
  - slug: test-oracle-problem
    tag: maintainability
    source_url: https://doi.org/10.1093/comjnl/25.4.465
    see_also:
      - pesticide-paradox
      - beyonce-rule
      - automation-bias
      - type-1-vs-type-2-decisions
    en:
      title: Test Oracle Problem
      concept: |-
        A test can only catch a wrong answer if something independent of the code knows the right one, and for many programs nothing does.
      stance: Before trusting a passing test, ask what it was checked against
      mechanism: |-
        Elaine Weyuker pointed out that "A frequently invoked assumption in program testing is that there is an oracle": the tester, or some other mechanism, can tell whether an output is correct. "A program is non-testable if either an oracle does not exist" or checking the output would take the tester an extraordinary amount of time. When nobody can say what the right answer is, the expected value in a test tends to come from running the code itself, and then the test records what the code does, not what it should do; it passes on every bug that was already there when it was written. Tests generated from the implementation are especially prone to this. Chen, Cheung and Yiu, building on Weyuker, wrote that "the availability of test oracles is pragmatically unattainable in most situations," and proposed metamorphic testing: derive follow-up inputs from tests that passed and check that the outputs relate the way they must, which needs no oracle.
      counter:
        name: Production as the Oracle
        note: |-
          for a cheap, reversible change, a partial and time-limited deployment judged against real traffic and SLOs catches problems no test author thought to write down
      guideline: |-
        For every test that guards something important, be able to say where its expected value came from: a spec, a hand calculation, an independent implementation, a domain expert. Treat snapshot tests and generated tests whose expectations were copied from the current output as change detectors, not as evidence the code is right. Where no oracle exists, test what must hold anyway: invariants, round trips, and relations between the outputs of related inputs. For a reversible change behind good monitoring, a canary can be the check; keep hand-built oracles for changes that are expensive to undo.
      source: |-
        Elaine J. Weyuker, *On Testing Non-Testable Programs* (The Computer Journal, 1982) — "A frequently invoked assumption in program testing is that there is an oracle", and a program as non-testable when no oracle exists or checking takes an extraordinary amount of time; T. Y. Chen, S. C. Cheung & S. M. Yiu, *Metamorphic Testing: A New Approach for Generating Next Test Cases* (Technical Report HKUST-CS98-01, Hong Kong University of Science and Technology, 1998) — "the availability of test oracles is pragmatically unattainable in most situations", and tests that need no oracle. The counter-force is from Alec Warner & Štěpán Davidovič, "Canarying Releases", in *The Site Reliability Workbook* (O'Reilly, 2018) — canarying as "a partial and time-limited deployment of a change in a service and its evaluation."
    ja:
      title: テストオラクル問題
      concept: テストが誤った答えを捕まえられるのは、コードとは別に正しい答えを知っているものがあるときだけだ。そして多くのプログラムには、それがない。
      stance: 通ったテストは、何と照合したかを問う
      mechanism: |-
        Elaine Weyuker は「プログラムのテストでよく持ち出される前提は、オラクルがあるというものだ」と指摘した。テストする人か何らかの仕組みが、出力が正しいかどうかを判定できるという前提だ。オラクルが存在しないか、出力の確認にテストする人が途方もない時間をかけなければならないなら、そのプログラムはテストできない。正しい答えを誰も言えないとき、テストの期待値はコードを動かした結果から取られやすい。そうなると、テストが記録するのはコードがすべきことではなく、コードがしていることになり、書いた時点ですでにあったバグはすべて通してしまう。実装から生成したテストは、とくにこうなりやすい。Chen、Cheung、Yiu は Weyuker を踏まえて「テストオラクルが手に入ることは、たいていの状況で現実的に望めない」と書き、メタモーフィックテストを提案した。通ったテストから次の入力を作り、出力どうしが満たすべき関係を満たしているかを確かめる。これならオラクルは要らない。
      counter:
        name: 本番を判定役にする
        note: |-
          安くて取り消せる変更なら、一部に期間を限って出し、実際のトラフィックと SLO に照らして見るほうが、テストを書く人が思いつかなかった問題を拾える
      guideline: |-
        大事なものを守るテストは、期待値の出どころを言えるようにする。仕様、手計算、独立した別実装、その分野の専門家などだ。現在の出力をそのまま期待値にしたスナップショットテストや生成テストは、変化の検知器として扱い、コードが正しい証拠とはみなさない。オラクルがないところでは、どのみち成り立つはずのことを確かめる。不変条件、往復変換、関連する入力どうしの出力の関係などだ。監視の整った取り消せる変更なら、カナリアを確認手段にしてよい。手で作るオラクルは、取り消しが高くつく変更のためにとっておく。
      source: |-
        Elaine J. Weyuker『On Testing Non-Testable Programs』(The Computer Journal, 1982)。"A frequently invoked assumption in program testing is that there is an oracle" と、オラクルがないか確認に途方もない時間がかかるプログラムをテスト不能とする定義の出典。T. Y. Chen, S. C. Cheung & S. M. Yiu『Metamorphic Testing: A New Approach for Generating Next Test Cases』(Technical Report HKUST-CS98-01, Hong Kong University of Science and Technology, 1998)。"the availability of test oracles is pragmatically unattainable in most situations" と、オラクルの要らないテストの出典。対抗原理は Alec Warner & Štěpán Davidovič「Canarying Releases」『The Site Reliability Workbook』(O'Reilly, 2018) から。カナリアを "a partial and time-limited deployment of a change in a service and its evaluation" とする定義の出典。
  - slug: lethal-trifecta
    tag: security
    source_url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
    example_url: "https://invariantlabs.ai/blog/mcp-github-vulnerability"
    see_also:
      - principle-of-least-privilege
      - kerckhoffs-principle
      - swiss-cheese-model
      - automation-bias
    en:
      title: The Lethal Trifecta
      concept: |-
        An AI agent that can read private data, takes in content from outside and can send data out can be steered into leaking that data by whoever wrote the content.
      stance: Treat any text an agent reads as instructions from whoever wrote it
      mechanism: |-
        "LLMs follow instructions in content," and they are "unable to reliably distinguish the importance of instructions based on where they came from." So anyone who can put text in front of an agent (a web page, an email, an issue) can tell it to gather the private data it can reach and send it out through any outbound channel it has. Each capability is useful on its own, and the danger appears only when one session has all three, often because a user mixed tools from different sources. Simon Willison has collected dozens of such cases; vendors usually fixed them by locking down the exfiltration vector, but "we still don't know how to 100% reliably prevent this from happening." Filters that claim to catch 95% of attacks do not close the gap: "in web application security 95% is very much a failing grade."
      counter:
        name: Constrain the Flow, Not the Tools
        note: |-
          an assistant worth having often needs all three; a design like Google DeepMind's CaMeL keeps them by planning the steps from the user's trusted request alone and tagging data with capabilities, so within the control and data flow it tracks, untrusted content cannot change which steps run or send private data where policy forbids; when you build the agent yourself, that can serve better than taking a capability away, but it finishes fewer tasks: on the AgentDojo benchmark the paper reports 77% with CaMeL against 84% for an undefended agent
      guideline: |-
        Before connecting a tool to an agent, write down which of the three it adds: private data, untrusted content, or a way to send data out (including links, image loads, pull requests and email). When a session ends up with all three, take one away: browse in a sandbox with no credentials, cut the outbound channel, or make a human approve each outbound action. Do not count a prompt-injection filter as the control. An agent that reads only trusted data, or whose output never leaves the machine, does not need this.
      example: |-
        In May 2025 Marco Milanta and Luca Beurer-Kellner of Invariant Labs reported an attack through the official GitHub MCP server. An attacker files an issue carrying a prompt injection on the user's public repository; when the user asks the agent to look at the open issues, the agent reads it, pulls data from the user's private repositories into context and leaks it in a pull request on the public repository, where the attacker can read it. The authors stress that the attack "does not require the MCP tools themselves to be compromised" and call it "a fundamental architectural issue that must be addressed at the agent system level."
      source: |-
        Simon Willison, *The lethal trifecta for AI agents: private data, untrusted content, and external communication* (simonwillison.net, 2025) — the three ingredients and "The only way to stay safe there is to avoid that lethal trifecta combination entirely." The counter-force is from Edoardo Debenedetti et al., *Defeating Prompt Injections by Design* (arXiv, 2025) — CaMeL "explicitly extracts the control and data flows from the (trusted) query", so untrusted data "can never impact the program flow", and the task-completion figures (77% against 84% undefended on AgentDojo).
    ja:
      title: 致命的な三点セット
      concept: 非公開データを読めて、外から来た内容を取り込み、外へデータを送れる AI エージェントは、その内容を書いた誰にでも操られてデータを漏らしうる。
      stance: エージェントが読む文章は、書いた人からの指示だと思う
      mechanism: |-
        LLM は内容の中にある指示に従う。しかも指示の重みを、それがどこから来たかで確実に区別することができない。だから Web ページでもメールでも issue でも、エージェントの前に文章を置ける人は、エージェントが触れる非公開データを集めて、手持ちの送信手段で外に出すよう指示できる。三つの能力はそれぞれ単独なら役に立つ。危険になるのは一つのセッションが三つともそろえたときで、利用者が出どころの違うツールを組み合わせた結果そうなることが多い。Simon Willison はこうした事例を何十件も集めている。ベンダーはたいてい持ち出しの経路をふさいで直したが、「これを 100% 確実に防ぐ方法は、まだわかっていない」。攻撃の 95% を捕まえると謳うフィルタでは穴はふさがらない。「Web アプリケーションのセキュリティでは、95% は明らかに落第点だ」。
      counter:
        name: 道具ではなく流れを縛る
        note: |-
          役に立つアシスタントは三つを同時に要することが多い。Google DeepMind の CaMeL のような設計は、信頼できる利用者の依頼だけから手順を組み、データに権限の印をつけて三つとも残す。そうすれば、CaMeL が追跡する制御とデータの流れの範囲では、信頼できない内容がどの手順を実行するかを変えることも、ポリシーが禁じる先へ非公開データを送ることもできない。エージェントを自分で作るなら、能力を一つ外すよりこちらが合うこともある。ただし、こなせるタスクは減る。論文によれば、ベンチマーク AgentDojo で CaMeL は77%、防御なしのエージェントは84%だった
      guideline: |-
        エージェントにツールをつなぐ前に、そのツールが三つのどれを足すかを書き出す。非公開データ、信頼できない内容、外へ送る手段(リンク、画像の読み込み、プルリクエスト、メールを含む)だ。一つのセッションに三つがそろったら、一つを外す。認証情報のないサンドボックスで閲覧させる、送信経路を断つ、外への送信は一件ずつ人が承認する、のどれかにする。プロンプトインジェクションのフィルタを対策として数えない。信頼できるデータだけを読むエージェントや、出力が手元から出ないエージェントには要らない。
      example: |-
        2025年5月、Invariant Labs の Marco Milanta と Luca Beurer-Kellner は、GitHub 公式 MCP サーバを通した攻撃を報告した。攻撃者は利用者の公開リポジトリに、プロンプトインジェクションを仕込んだ issue を立てる。利用者がエージェントに open な issue を見るよう頼むと、エージェントはそれを読み、利用者の非公開リポジトリのデータをコンテキストに取り込み、公開リポジトリへのプルリクエストに書き出してしまう。攻撃者はそこで読める。著者らは、この攻撃は "does not require the MCP tools themselves to be compromised" と強調し、"a fundamental architectural issue that must be addressed at the agent system level." だと書いている。
      source: |-
        Simon Willison『The lethal trifecta for AI agents: private data, untrusted content, and external communication』(simonwillison.net, 2025)。三つの要素と "The only way to stay safe there is to avoid that lethal trifecta combination entirely." の出典。対抗原理は Edoardo Debenedetti ほか『Defeating Prompt Injections by Design』(arXiv, 2025) から。CaMeL が "explicitly extracts the control and data flows from the (trusted) query" し、信頼できないデータが "can never impact the program flow" とする出典で、タスク達成率（AgentDojo で77%、防御なしは84%）も同じ論文による。
  - slug: cost-of-delay
    tag: decision
    source_url: https://leanmagazine.net/lean/cost-of-delay-don-reinertsen/
    example_url: "https://blackswanfarming.com/black-swan-farming-using-cost-of-delay/"
    see_also:
      - littles-law
      - theory-of-constraints
      - pareto-principle
      - fixed-time-variable-scope
      - last-responsible-moment
      - most-ideas-fail
    en:
      title: Cost of Delay
      concept: |-
        Work gets ordered by size, by gut feel or by whoever asks loudest, while what each item loses every week it waits goes uncounted, so the most valuable work often waits behind the merely visible.
      stance: Ask what a week of waiting costs before asking what it costs to build
      mechanism: |-
        Most work loses value while it waits: revenue not yet earned, a market window closing, a penalty date coming closer. A backlog ordered by effort or by an undefined "priority" says nothing about that loss, and people's private guesses about it are far apart. Reinertsen, who argued for putting a number on it, puts the spread this way: "The intuition of members of the same team typically differs by 50 to 1, so the real estimate surprises most team members." Once the cost of delay is a number, dividing it by the expected duration (CD3) puts first the items that release the most value per week of scarce capacity, which a ranking by value alone or by size alone does not.
      counter:
        name: Reserved Engineering Time
        note: |-
          instead of making engineering work win its place item by item, fix its share of capacity by rule; Google caps operational work for SREs at 50% of their time and says "Their remaining time should be spent using their coding skills on project work."; the SRE book does not discuss cost of delay, but by this entry's reading a fixed share protects work such as paying down debt, whose loss in any one week looks small and so rarely tops a ranking
      guideline: |-
        For the items at the top of the backlog, estimate what each one loses per week of waiting, in money, and write the assumptions next to the number. Divide by the expected duration and schedule in that order. A rough range is enough: the point is to expose how far apart people's guesses are, not to be precise. Keep a fixed share of capacity outside the ranking for work whose value is long-term.
      example: |-
        Maersk Line put a dollar cost of delay on each requirement for its Global Customer Service System and scheduled them by CD3. Looking at the spread, the authors found the most valuable and urgent 25% of requirements were worth three orders of magnitude more than the bottom 25%: "Not ten times, or one hundred times, but a thousand times more valuable."
      source: |-
        Don Reinertsen interviewed in *Lean Magazine* (2012), on his book *The Principles of Product Development Flow* (Celeritas, 2009) — "A cost-of-delay calculation establishes the value of time on the critical path of the project.", the 50-to-1 spread in intuition, and sequencing work "with the highest cost of delay per unit of scarce resource consumed."; Ben Linders' InfoQ interview with Joshua Arnold (2015), which quotes Reinertsen: "If you only quantify one thing, quantify the Cost of Delay"; Black Swan Farming (Joshua J. Arnold's site), *Cost of Delay Divided by Duration* — CD3 as "a prioritisation/scheduling method that maximises the value delivered in a given time period when you have limited capacity." The counter-force is from Benjamin Treynor Sloss, "Introduction", in Beyer, Jones, Petoff & Murphy (eds.), *Site Reliability Engineering* (O'Reilly, 2016), and its "Ensuring a Durable Focus on Engineering" section — the 50% cap on operational work; applying it to the ranking is this entry's reading. Joshua J. Arnold and Özlem Yüce, "Black Swan Farming using Cost of Delay" (2013, an IEEE-format paper republished on Arnold's site, Black Swan Farming) — the Maersk Line example.
    ja:
      title: 遅延コスト
      concept: 仕事は大きさや勘、声の大きさで並べられ、待たせた週ごとに失う価値は数えられない。だから一番価値のある仕事が、目立つだけの仕事の後ろで待たされることが多い。
      stance: 作る費用より先に、一週間待たせる費用を聞く
      mechanism: |-
        たいていの仕事は待っている間に価値を失う。まだ入ってこない売上、閉じていく市場の窓、近づいてくる違約金の期日。工数や中身の決まっていない「優先度」で並べたバックログは、その損失について何も言わない。しかも、その損失を各自が頭の中で見積もると大きく食い違う。数字にすべきだと説いた Reinertsen は、その幅をこう言う。"The intuition of members of the same team typically differs by 50 to 1, so the real estimate surprises most team members." 遅延コストを数字にすれば、それを見込み期間で割る（CD3）ことで、限られた人手の一週間あたりに最も多くの価値を出す仕事が先に来る。価値だけ、大きさだけで並べてもこうはならない。
      counter:
        name: 開発時間の取り置き
        note: |-
          エンジニアリングの仕事に一件ずつ順位を勝ち取らせるのではなく、人手の取り分をルールで決めておく。Google は SRE の運用作業を時間の50%までに抑え、"Their remaining time should be spent using their coding skills on project work." としている。SRE 本は遅延コストの話をしていないが、本項の読みでは、決まった取り分があれば負債の返済のように一週間あたりの損が小さく見え、順位の上に来にくい仕事を守れる
      guideline: |-
        バックログの上位について、一週間待たせるごとに失う額を見積り、その前提を数字の横に書く。それを見込み期間で割り、その順に着手する。幅のある大まかな見積りで構わない。狙いは正確さではなく、各自の見積りがどれだけ食い違っているかを表に出すことだ。効果が長期にわたる仕事のために、順位の外に一定の人手を残しておく。
      example: |-
        Maersk Line は Global Customer Service System の要求それぞれに遅延コストをドルで付け、CD3 の順に着手した。その分布を見ると、最も価値が高く緊急な上位25%の要求は、下位25%より三桁大きな価値を持っていた。"Not ten times, or one hundred times, but a thousand times more valuable."
      source: |-
        Don Reinertsen への『Lean Magazine』のインタビュー (2012)。著書『The Principles of Product Development Flow』(Celeritas, 2009) の内容を語ったもので、"A cost-of-delay calculation establishes the value of time on the critical path of the project." と、直感が50対1も食い違うという話、仕事を "with the highest cost of delay per unit of scarce resource consumed." の順に並べるという話の出典。"If you only quantify one thing, quantify the Cost of Delay" は、Ben Linders による Joshua Arnold への InfoQ のインタビュー (2015) で Reinertsen の言葉として引かれたもの。CD3 は Joshua J. Arnold のサイト Black Swan Farming の『Cost of Delay Divided by Duration』による。"a prioritisation/scheduling method that maximises the value delivered in a given time period when you have limited capacity." の出典。対抗原理は Benjamin Treynor Sloss「Introduction」、Beyer, Jones, Petoff & Murphy 編『Site Reliability Engineering』(O'Reilly, 2016) とその「Ensuring a Durable Focus on Engineering」節から。運用作業を50%までに抑えるという出典で、これを順位づけに当てはめたのは本項の読みだ。Joshua J. Arnold, Özlem Yüce「Black Swan Farming using Cost of Delay」(2013 年に IEEE 形式の論文として書かれ、Arnold のサイト Black Swan Farming に再掲)。Maersk Line の事例の出典。
  - slug: last-responsible-moment
    tag: decision
    source_url: https://ptgmedia.pearsoncmg.com/images/9780321150783/samplepages/0321150783.pdf
    see_also:
      - type-1-vs-type-2-decisions
      - yagni
      - cost-of-delay
      - disagree-and-commit
    en:
      title: The Last Responsible Moment
      concept: |-
        Commit too early and a guess hardens into the design; wait too long and an option quietly expires, so the decision gets made by default without anyone making it.
      stance: Know when each decision expires, and decide before it does
      mechanism: |-
        At the start of a project the team knows least, and an early commitment narrows the field of view before the facts arrive. Holding a decision open lets learning catch up. But every open decision has a deadline that nobody announces: the Poppendiecks define the last responsible moment as "the moment at which failing to make a decision eliminates an important alternative." A contract renews, an API ships and gets callers, another team builds on an assumption, and the alternative is gone. "If commitments are delayed beyond the last responsible moment, then decisions are made by default, which is generally not a good approach to making decisions." They add that some decisions, such as usability design, layering and component packaging, are best made early, and that "A bias toward late commitment must not degenerate into a bias toward no commitment."
      counter:
        name: Most Responsible Moment
        note: |-
          Wirfs-Brock finds she cannot tell when the last responsible moment is, and that aiming for it lulls her into thinking there will always be time to change her mind; she prefers to decide as soon as a decision has a positive impact, which often comes earlier
      guideline: |-
        For each open design decision, write down the event that would remove an alternative (a contract date, a release that freezes an interface, another team starting to build on it) and put its date on the calendar. Decide before that date, not on it. Do not use this to postpone decisions that unblock other work or that shape everything after them, such as layering.
      source: |-
        Mary & Tom Poppendieck, *Lean Software Development: An Agile Toolkit* (Addison-Wesley, 2003), ch. 3, "Tool 8: The Last Responsible Moment", pp. 57–59 — the definition, "decisions are made by default" and the warning against a bias toward no commitment; they credit the term to the Lean Construction Institute. Rebecca Wirfs-Brock, "Agile Architecture Myths #2 Architecture Decisions Should Be Made At the Last Responsible Moment" (2011) — the "most responsible moment".
    ja:
      title: 最終責任時点
      concept: 早く決めすぎると推測がそのまま設計として固まる。待ちすぎると選択肢が黙って消え、誰も決めないまま成り行きで決まってしまう。
      stance: 決定ごとの期限を知り、その手前で決める
      mechanism: |-
        プロジェクトの初めはチームが最も物を知らない時期で、早い段階で決めると事実が出そろう前に視野が狭まる。決定を保留すれば、学びが追いつく時間ができる。だが保留中の決定には、誰も知らせてくれない期限がある。Poppendieck 夫妻は最終責任時点を "the moment at which failing to make a decision eliminates an important alternative." と定義する。契約が自動更新される、API が出て呼び出し元がつく、別のチームがある前提の上に作り始める。そうして選択肢は消える。"If commitments are delayed beyond the last responsible moment, then decisions are made by default, which is generally not a good approach to making decisions." 夫妻は、使い勝手の設計、レイヤ分け、コンポーネントのまとめ方のように早く決めたほうがよいものもあるとし、"A bias toward late commitment must not degenerate into a bias toward no commitment." とも書いている。
      counter:
        name: 最も責任ある時点
        note: |-
          Wirfs-Brock は、最終責任時点がいつなのか自分には見分けられないと書く。それを狙うと、いつでも考え直す時間があると思い込んでしまうという。だから、決めることで良い影響が出る時点が来たら決めるほうを選ぶ。その時点は、多くの場合もっと早く来る
      guideline: |-
        保留中の設計判断ごとに、選択肢を消してしまう出来事（契約の期日、インタフェースが固まるリリース、別チームがその上に作り始めること）を書き出し、その日付をカレンダーに入れる。その日になってからではなく、その前に決める。他の作業を止めている決定や、レイヤ分けのように後のすべてを形づくる決定を先送りする口実には使わない。
      source: |-
        Mary & Tom Poppendieck『Lean Software Development: An Agile Toolkit』(Addison-Wesley, 2003) 第3章「Tool 8: The Last Responsible Moment」(pp. 57–59)。定義、「decisions are made by default」、決めないことへの偏りへの警告の出典。用語は Lean Construction Institute の造語だと同書が書いている。「最も責任ある時点」は Rebecca Wirfs-Brock「Agile Architecture Myths #2 Architecture Decisions Should Be Made At the Last Responsible Moment」(2011)。
  - slug: pre-mortem
    tag: decision
    source_url: https://hbr.org/2007/09/performing-a-project-premortem
    see_also:
      - blameless-postmortem
      - working-backwards
      - murphys-law
      - psychological-safety
    en:
      title: Pre-Mortem
      concept: |-
        People who doubt a plan the team has already committed to tend to keep quiet; asking them to explain a failure that has already happened draws the doubts out.
      stance: Assume the plan already failed, and make finding out why the clever move
      mechanism: |-
        In an ordinary plan review there is, in Klein's words, "silent pressure in these meetings not to surface doubts that might disturb the team's harmony", and people keep back what they would not ordinarily mention "for fear of being impolitic"; the opening paragraph of his HBR article says "too many people are reluctant to speak up about their reservations during the all-important planning phase." The pre-mortem changes the frame: the leader tells the team the plan has failed and asks why. In Klein's words, "The pre-mortem reverses this dynamic—people show how smart they are by the quality of the issues that they raise." Writing reasons alone first, before anyone speaks, keeps one senior voice from setting the list. In a study of 178 college students that Klein reports, the pre-mortem group showed the greatest drop in confidence in a hypothetical plan compared with groups that critiqued the plan or listed pros and cons; the study measured confidence, not whether the plan would have worked. Klein's HBR article says prospective hindsight "increases the ability to correctly identify reasons for future outcomes by 30%", but the 1989 study it rests on measured how many and what kind of reasons people gave when an outcome was framed as certain, not whether the reasons were right.
      counter:
        name: Bias for Action
        note: |-
          hunting for failure on every plan breeds caution; Klein himself notes that pre-mortems "tend to encourage risk aversion", and for a cheap, reversible step, trying it teaches more than imagining how it goes wrong
      guideline: |-
        At the kickoff of any project that would hurt if it failed, after the plan is presented, tell the team the project has failed. Give everyone two minutes to write down the reasons alone, then go round the room one reason per person until the lists are empty, and give the top few an owner and a change to the plan. Skip it for small, reversible changes, where shipping and watching is cheaper.
      source: |-
        Gary Klein, "Performing a Project Premortem", *Harvard Business Review* (September 2007) — the method; Gary Klein, "The Pre-Mortem Method", *Psychology Today* (2021) — his fuller account of the steps and of the student study, the "silent pressure" line and "The pre-mortem reverses this dynamic"; Gary Klein, "Double-Barreled Pre-Mortems", *Psychology Today* (2025) — the warning about risk aversion; Deborah J. Mitchell, J. Edward Russo & Nancy Pennington, "Back to the future: Temporal perspective in the explanation of events", *Journal of Behavioral Decision Making* 2 (1989) — the study behind the 30% figure, which measured the number and kind of reasons, not their accuracy. Amazon, "Leadership Principles" (amazon.jobs) — the counter's name, Bias for Action: "Many decisions and actions are reversible and do not need extensive study."
    ja:
      title: プレモーテム
      concept: すでに決まった計画に疑問を持つ人は、黙っていることが多い。失敗はもう起きたことにして、その理由を説明してもらうと、疑問が表に出てくる。
      stance: 計画はもう失敗したと考え、理由を見つけた人が賢い場にする
      mechanism: |-
        普通の計画レビューには、Klein の言う "silent pressure in these meetings not to surface doubts that might disturb the team's harmony" がある。人は "for fear of being impolitic"、ふだんなら問題として口にしないことを胸にしまう。Klein の HBR 記事は冒頭の段落で "too many people are reluctant to speak up about their reservations during the all-important planning phase." と書いている。プレモーテムは前提を入れ替える。リーダーが計画は失敗したと告げ、なぜかを尋ねる。Klein の言葉では "The pre-mortem reverses this dynamic—people show how smart they are by the quality of the issues that they raise." 誰かが話す前に各自で理由を書かせれば、上の立場の一人がリストを決めてしまうことも防げる。Klein が紹介する大学生178人の研究では、架空の計画について、計画を批評した組や長所と短所を挙げた組に比べ、プレモーテムの組で計画への自信が最も大きく下がった。測ったのは自信で、計画がうまくいったかどうかではない。Klein の HBR 記事は、未来の出来事を起きたことにして考えると "increases the ability to correctly identify reasons for future outcomes by 30%" と書く。だが元になった1989年の研究が測ったのは、結果を確実なものとして示したときに挙がる理由の数と種類で、その理由が正しいかどうかは測っていない。
      counter:
        name: 行動を優先する
        note: |-
          どの計画でも失敗探しをすると、慎重になりすぎる。Klein 自身、プレモーテムは "tend to encourage risk aversion" と書いている。安く戻せる一歩なら、失敗を想像するより試したほうが多くを学べる
      guideline: |-
        失敗すると痛いプロジェクトでは、キックオフで計画の説明が終わったら、このプロジェクトは失敗したとチームに告げる。各自に二分間、一人で理由を書かせ、それから一人一つずつ順に、リストが尽きるまで読み上げてもらう。上位のいくつかには担当者と計画の変更を割り当てる。小さく戻せる変更ではやらない。出して様子を見るほうが安い。
      source: |-
        Gary Klein「Performing a Project Premortem」『Harvard Business Review』(2007年9月号)。手法の出典。Gary Klein「The Pre-Mortem Method」『Psychology Today』(2021) は手順と学生の研究についての本人による詳しい説明で、"silent pressure" の一文と "The pre-mortem reverses this dynamic" の出典。リスク回避への警告は Gary Klein「Double-Barreled Pre-Mortems」『Psychology Today』(2025)。30%という数字の元になった研究は Deborah J. Mitchell, J. Edward Russo & Nancy Pennington「Back to the future: Temporal perspective in the explanation of events」『Journal of Behavioral Decision Making』2 (1989)。測ったのは理由の数と種類で、正しさではない。カウンターの名前は Amazon「Leadership Principles」(amazon.jobs) の Bias for Action から。"Many decisions and actions are reversible and do not need extensive study." の出典。
  - slug: wicked-problems
    tag: decision
    source_url: https://doi.org/10.1007/BF01405730
    see_also:
      - xy-problem
      - working-backwards
      - most-ideas-fail
    en:
      title: Wicked Problems
      concept: |-
        For some problems, working out what the problem is and choosing a solution are the same act, so the requirements cannot be settled before the design starts and there is no point at which the problem is done.
      stance: When solving changes the problem, treat its statement as a draft, not a gate
      mechanism: |-
        Rittel and Webber contrasted "tame" problems, such as solving an equation or checkmate in five moves, where the mission is clear and so is whether it has been solved, with "wicked" ones, which include nearly all public policy issues. For a wicked problem, "The information needed to understand the problem depends upon one's idea for solving it", so "The formulation of a wicked problem is the problem!" Phased methods that start with "understand the problems or the mission" assume you can understand first and solve afterwards; for wicked problems "one cannot first understand, then solve." And "Wicked problems have no stopping rule": work ends because the planner runs out of time, or money, or patience, not because the problem says it is finished. Product and organisational questions with many stakeholders can behave this way, with each proposal changing what people say they want.
      counter:
        name: Understand the Problem First
        note: |-
          Pólya's method opens with "You have to understand the problem." and asks "What is the unknown?" before any plan is made; for much engineering work, such as a bug, a migration or a latency target, writing down the unknown, the data and the condition first is what makes it solvable, and calling such work "wicked" excuses skipping that step
      guideline: |-
        Before writing requirements, ask two questions: does the problem statement change every time someone proposes a solution, and is there no test that would say it is solved? If both are yes, stop trying to freeze the requirements first: put the people who disagree in the same review, show small versions early, and decide in advance when you will stop, since the problem will not tell you. If either is no, treat it as tame and write the problem statement.
      source: |-
        Horst W. J. Rittel & Melvin M. Webber, "Dilemmas in a General Theory of Planning", *Policy Sciences* 4 (1973), 155–169 — the tame/wicked distinction and the ten properties of wicked problems. George Pólya, *How to Solve It* (Princeton University Press, 1945) — the counter, understanding the problem before devising a plan.
    ja:
      title: 厄介な問題
      concept: 問題によっては、何が問題かを見極めることと解決策を選ぶことが同じ作業になる。だから設計を始める前に要求を固めることはできず、ここで終わりという地点もない。
      stance: 解くたびに問題が変わるなら、問題の書き方は関門でなく下書きだ
      mechanism: |-
        Rittel と Webber は、方程式を解く、五手で詰めるといった「飼いならされた（tame）」問題と、「厄介な（wicked）」問題を対比した。前者は目的がはっきりしていて、解けたかどうかもはっきりしている。後者には公共政策の問題のほぼすべてが含まれる。厄介な問題では "The information needed to understand the problem depends upon one's idea for solving it" であり、だから "The formulation of a wicked problem is the problem!" となる。"understand the problems or the mission" から始まる段階的な手法は、まず理解し、それから解けると仮定している。厄介な問題では "one cannot first understand, then solve." しかも "Wicked problems have no stopping rule"。作業が終わるのは時間か金か根気が尽きたからで、問題が終わったと告げるからではない。関係者の多いプロダクトや組織の問いは、案を出すたびに皆の言う要望が変わり、こうなることがある。
      counter:
        name: まず問題を理解する
        note: |-
          Pólya の方法は "You have to understand the problem." で始まり、計画を立てる前に "What is the unknown?" と問う。バグや移行、レイテンシの目標のような技術の仕事の多くは、先に未知のもの、与えられたもの、条件を書き出すことで解けるようになる。そうした仕事を「厄介な問題」と呼ぶのは、その手順を飛ばす言い訳になる
      guideline: |-
        要求を書く前に二つ確かめる。誰かが解決策を出すたびに問題の書き方が変わるか。解けたと判定できるテストがないか。両方とも当てはまるなら、要求を先に固めようとしない。意見の違う人を同じレビューに集め、小さな版を早く見せ、いつやめるかを先に決めておく。問題のほうは終わりを教えてくれない。どちらかが当てはまらないなら、飼いならされた問題として扱い、問題記述を書く。
      source: |-
        Horst W. J. Rittel & Melvin M. Webber「Dilemmas in a General Theory of Planning」『Policy Sciences』4 (1973), 155–169。飼いならされた問題と厄介な問題の区別、厄介な問題の十の性質の出典。George Pólya『How to Solve It』(Princeton University Press, 1945)。計画を立てる前に問題を理解するという、カウンターの出典。
  - slug: most-ideas-fail
    tag: decision
    source_url: https://exp-platform.com/Documents/ExPThinkWeek2009Public.pdf
    see_also:
      - survivorship-bias
      - genchi-genbutsu
      - twymans-law
      - cost-of-delay
      - working-backwards
      - wicked-problems
    en:
      title: Most Ideas Fail
      concept: |-
        In online controlled experiments at large web companies, most ideas that survived the team's own pruning do nothing or make things worse once they are measured, and experts tend to be poor at telling in advance which ones.
      stance: Treat your favourite idea as a hypothesis that will probably fail
      mechanism: |-
        Every feature is built because someone believes it will have value, and the review that approves it runs on the same beliefs. When Microsoft measured ideas in online controlled experiments, "only about 1/3 of ideas improve the metrics they were designed to improve"; the authors estimate that a team launching ten ideas without measuring gets roughly a third good, a third flat and a third negative, so the total value is small. Teams tend to run experiments when they are less sure, but the paper notes that Amazon evaluated every new feature and still saw a success rate below 50%. Without a measurement nobody finds out: "For most ideas, the change in key metrics will be too small to detect over time." Guessing does not fix it: "It is humbling to see how bad experts are at estimating the value of features (us included)." In the authors' survey on the outcomes of eight of their A/B tests, none of more than 200 respondents got six or more right.
      counter:
        name: Conviction Bets
        note: |-
          some decisions cannot be put through a controlled experiment at all; the same paper agrees with Davenport that experiments suit strategy execution, not strategy formulation, and are "not suited for assessing a major change in business models, a large merger or acquisition", and grants that measuring is sometimes "non-economical"; by this entry's reading, there someone has to commit on judgement
      guideline: |-
        Before building, write down the metric the idea is meant to move and by how much, then ship it behind a flag to a randomised share of users. Drop or rework what does not move the metric, however sure the team was. Where you cannot randomise (too little traffic, a long-term bet, a change you cannot roll back), say so and decide on judgement without claiming it was measured.
      source: |-
        Ronny Kohavi et al., *Online Experimentation at Microsoft* (Microsoft ThinkWeek, 2009) — "only about 1/3 of ideas improve the metrics they were designed to improve", the estimate of a third good, a third flat and a third negative, and the survey of eight A/B tests. The counter-force is the same paper's section 6.7, which agrees with Thomas H. Davenport, *How to Design Smart Business Experiments* (2009, as cited in the paper), that experiments are not suited to strategy formulation, and distinguishes "not measurable" from "non-economical to measure"; reading that as a licence to commit on judgement is this entry's, not the paper's.
    ja:
      title: 大半のアイデアは失敗する
      concept: 大手 Web 企業のオンライン対照実験では、チームが自分たちでふるいにかけた後のアイデアでも、測ってみると大半は効果がないか逆効果で、どれがそうかを専門家が事前に見分けるのも苦手なことが多い。
      stance: 気に入っている案ほど、たぶん外れる仮説として扱う
      mechanism: |-
        どの機能も、誰かが価値があると信じたから作られる。それを承認するレビューも同じ信念で動く。Microsoft がアイデアをオンラインの対照実験で測ると "only about 1/3 of ideas improve the metrics they were designed to improve" だった。測らずに十のアイデアを出したチームは、およそ三分の一が良く、三分の一が変化なし、三分の一が悪い結果になり、全体の価値は小さいと著者らは見積もる。実験は自信のない案ほど行われやすいが、論文によれば新機能をすべて評価していた Amazon でも成功率は50%を下回った。しかも測らなければ誰も気づかない。"For most ideas, the change in key metrics will be too small to detect over time." 勘で当てようとしても当たらない。"It is humbling to see how bad experts are at estimating the value of features (us included)." 著者らが自分たちの A/B テスト八件の結果を当てさせた調査では、200件を超える回答のうち、六件以上当てた人は一人もいなかった。
      counter:
        name: 確信への賭け
        note: |-
          対照実験にそもそもかけられない決定もある。同じ論文は、実験が向くのは戦略の実行で戦略の立案ではなく、"not suited for assessing a major change in business models, a large merger or acquisition" だという Davenport の指摘に同意し、測るのが "non-economical" な場合があることも認めている。本項の読みでは、そこでは誰かが判断で決めるしかない
      guideline: |-
        作る前に、そのアイデアで動かしたい指標とその幅を書いておき、フラグの裏に置いてランダムに選んだ一部の利用者に出す。指標が動かなければ、チームがどれだけ自信を持っていても捨てるか作り直す。ランダムに割り振れないとき（トラフィックが少ない、長期の賭け、戻せない変更）はそう明記し、測ったふりをせずに判断で決める。
      source: |-
        Ronny Kohavi ほか『Online Experimentation at Microsoft』(Microsoft ThinkWeek, 2009)。"only about 1/3 of ideas improve the metrics they were designed to improve" と、良い・変化なし・悪いがそれぞれ三分の一という見積り、A/B テスト八件の調査の出典。対抗原理は同じ論文の 6.7 節による。Thomas H. Davenport『How to Design Smart Business Experiments』(2009, 論文での引用による) の、実験は戦略の立案に向かないという指摘に同意し、"not measurable" と "non-economical to measure" を分けている。それを判断で決めてよい根拠と読むのは本項の解釈で、論文の主張ではない。
  - slug: kingmans-formula
    tag: performance
    source_url: https://doi.org/10.1017/S0305004100036094
    example_url: "https://blog.dnsimple.com/2026/02/erldns-v10-release/"
    see_also:
      - littles-law
      - theory-of-constraints
      - tail-at-scale
      - parkinsons-law
      - makers-schedule
    en:
      title: Kingman's Formula
      concept: As a server's utilization approaches 100%, the time work spends waiting for it climbs steeply, and variability in arrivals and service multiplies the climb.
      stance: Keep headroom wherever someone is waiting on the answer
      mechanism: |-
        Kingman's approximation for the mean wait in a single-server queue (G/G/1) is **E(Wq) ≈ (ρ/(1−ρ)) · ((ca² + cs²)/2) · τ**, where ρ is utilization, ca and cs are the coefficients of variation of arrival and service times, and τ is the mean service time; it is also called the VUT equation, after its three factors. The utilization term does the damage: ρ/(1−ρ) is 4 at 80%, 9 at 90% and 19 at 95%, so going from 90% to 95% busy roughly doubles the wait with nothing else changed. Those multipliers, like the formula, are for one server; a pool of several servers sharing a queue keeps the wait short up to a higher utilization before it starts to climb. Variability multiplies it, so bursty arrivals and uneven job sizes lengthen the wait at any load. The approximation is generally accurate, and most accurate for a system close to saturation. Little's Law says L = λW but not why W grows; Kingman's formula shows where the growth comes from. The same arithmetic plausibly applies to people: a team whose every hour is booked tends to make every new request wait. That is an inference from the model, not something Kingman measured.
      counter:
        name: Headroom Costs Money
        note: |-
          spare capacity is paid for whether or not anyone uses it, so whoever owns the budget pushes utilization up, and often rightly; the Google SRE book says "Efficient use of resources is important any time a service cares about money." and treats provisioning as a large lever on a service's total cost, so where a slower answer costs little, running hotter frees money for work that matters more
      guideline: |-
        For anything latency-sensitive (a service, a shared build runner, the on-call engineer), set a utilization ceiling below saturation (well below for a single server or a single person; a pool of interchangeable workers can run closer to full) and add capacity or shed load when you cross it, not after latency has already spiked. Cut variability too: smaller, more uniform jobs wait less at the same load. Set the ceiling by weighing what a slower answer costs against what the idle capacity costs, and raise it where waiting is cheap.
      example: |-
        In February 2026 DNSimple described version 10 of erldns, its authoritative DNS server: when scheduler utilization goes above 90%, the server reduces the rate at which it accepts work. The post asks why not push for 100% utilization and answers with Kingman's formula, saying queueing latency grows hyperbolically with utilization, so the 90% ceiling is a deliberate trade-off to stay away from the latency cliff.
      source: |-
        J. F. C. Kingman, *The single server queue in heavy traffic* (Mathematical Proceedings of the Cambridge Philosophical Society, 1961) — the heavy-traffic approximation for the mean wait in a single-server queue. Beyer, Jones, Petoff & Murphy (eds.), *Site Reliability Engineering* (O'Reilly, 2016), Introduction, "Efficiency and Performance" — the counter, the pressure to use resources efficiently.
    ja:
      title: キングマンの公式
      concept: サーバの稼働率が 100% に近づくほど、仕事がその前で待つ時間は急に伸びる。到着と処理のばらつきは、その伸びをさらに大きくする。
      stance: 誰かが答えを待つところには、余裕を残す
      mechanism: |-
        単一サーバの待ち行列 (G/G/1) の平均待ち時間について、Kingman の近似式は **E(Wq) ≈ (ρ/(1−ρ)) · ((ca² + cs²)/2) · τ** となる。ρ は稼働率、ca と cs は到着間隔と処理時間の変動係数、τ は平均処理時間だ。三つの因子の頭文字から VUT 式とも呼ばれる。効いてくるのは稼働率の項で、ρ/(1−ρ) は 80% で 4、90% で 9、95% で 19 になる。ほかが同じなら、90% から 95% に上げるだけで待ち時間はほぼ倍になる。この倍率も式そのものも、サーバが一台の場合の話だ。複数のサーバが一つの待ち行列を分け合うなら、もっと高い稼働率まで待ちは短いままで、そこから伸び始める。ばらつきの項は掛け算で効くので、到着の偏りや仕事の大きさの不揃いは、どの負荷でも待ちを長くする。この近似はおおむね正確で、飽和に近い系ほどよく合う。リトルの法則は L = λW を言うだけで、W がなぜ伸びるかは言わない。キングマンの公式はその伸びがどこから来るかを示す。同じ計算はおそらく人にも当てはまり、予定が埋まりきったチームでは新しい依頼がどれも待たされがちになる。これはモデルからの推論で、Kingman が測ったものではない。
      counter:
        name: 余裕にも金がかかる
        note: |-
          余らせた容量は、使われなくても費用がかかる。だから予算を持つ側は稼働率を上げようとし、それが正しいことも多い。Google の SRE 本は "Efficient use of resources is important any time a service cares about money." と書き、容量の確保がサービスの総費用を大きく左右すると見ている。答えが遅くなっても損が小さいところでは、詰めて回して浮いたお金をもっと大事な仕事に回せる
      guideline: |-
        レイテンシが問題になるもの（サービス、共有のビルドランナー、オンコール担当）には、飽和より下に稼働率の上限を決める。サーバが一台、担当が一人ならかなり下に置き、代わりの利く担当が何人もいるプールなら、もっと満杯に近づけて回してよい。上限を超えたら容量を足すか負荷を捨てる。レイテンシが跳ねてからでは遅い。ばらつきも減らす。仕事を小さく揃えれば、同じ負荷でも待ちは短くなる。上限は、答えが遅くなる損と遊ばせる容量の費用を比べて決め、待ちの安いところでは上げる。
      example: |-
        2026年2月、DNSimple は権威 DNS サーバ erldns のバージョン10を紹介した。スケジューラの稼働率が 90% を超えると、サーバは仕事を受け付ける速さを落とす。記事はなぜ 100% を目指さないのかと問い、キングマンの公式で答えている。待ち行列のレイテンシは稼働率に対して双曲線的に伸びるので、上限を 90% に置くのはレイテンシの崖から距離を取るための意図的なトレードオフだという。
      source: |-
        J. F. C. Kingman『The single server queue in heavy traffic』(Mathematical Proceedings of the Cambridge Philosophical Society, 1961)。単一サーバの待ち行列の平均待ち時間について、重負荷での近似を示した出典。Beyer, Jones, Petoff & Murphy 編『Site Reliability Engineering』(O'Reilly, 2016) の Introduction の「Efficiency and Performance」。カウンターの、資源を効率よく使えという圧力の出典。
  - slug: makers-schedule
    tag: organization
    source_url: https://paulgraham.com/makersschedule.html
    example_url: "https://bthdonohue.com/2018/05/02/three-day-no-meeting-schedule-for-engineers.html"
    see_also:
      - parkinsons-law
      - kingmans-formula
      - littles-law
      - andon
    en:
      title: Maker's Schedule, Manager's Schedule
      concept: People who make things need long unbroken blocks of time, and a calendar run in one-hour slots breaks those blocks into pieces too small to use.
      stance: Count a meeting's cost as the block it breaks, not the hour it takes
      mechanism: |-
        Paul Graham describes two ways of using a day. "The manager's schedule is for bosses": each day is cut into one-hour intervals, and a meeting is just one more slot. Makers, people who program or write, generally prefer to use time in units of half a day at least, because hard work needs a long run before it gets going. For them, "A single meeting can blow a whole afternoon, by breaking it into two pieces each too small to do anything hard in." Neither schedule is wrong: "Each type of schedule works fine by itself. Problems arise when they meet." The person booking the meeting usually sees only the hour it fills on their own calendar, so the cost to the maker tends to go uncounted. Google's code review guide draws the same line for reviewers: "If you are in the middle of a focused task, such as writing code, don’t interrupt yourself to do a code review."
      counter:
        name: Stop for the Line
        note: |-
          Toyota lets any operator stop the line so a problem is dealt with where it appears instead of piling up downstream; a team that guards every maker's block the same way can leave a blocked teammate, or a defect, waiting behind it
      guideline: |-
        Put meetings at the edges of the day or cluster them on fixed days, and keep blocks of at least half a day free of them for the people who build. Before booking a maker, count the block you would break, not the hour you take. Incidents get answered now; a teammate waiting on a review gets an answer at your next break point, within a day.
      example: |-
        Pinterest's product engineering organization experimented with a three-day no-meeting schedule, putting 9AM-5PM no-meeting blocks on engineers' calendars from Tuesday to Thursday. After about 100 days, managers reported very positive feedback, and a survey indicated that most engineers shared it; some said Monday and Friday meetings often spilled over. Several other engineering organisations at Pinterest then adopted the same schedule.
      source: |-
        Paul Graham, *Maker's Schedule, Manager's Schedule* (paulgraham.com, July 2009) — the two schedules and what one meeting costs a maker. Google, "Speed of Code Reviews", *Google Engineering Practices Documentation* — the advice not to interrupt a focused task for a review, and to answer within one business day. Brian Donohue, "Three day no-meeting schedule for engineers" (2018, first published on Pinterest's engineering blog, republished on his own site) — the Pinterest example. The counter-force is Toyota's andon, from Toyota Motor Corporation, *Toyota Production System* (global.toyota).
    ja:
      title: メイカーの時間割、マネージャーの時間割
      concept: ものを作る人には途切れない長い時間が要る。一時間刻みで回る予定表は、その時間を使えないほど細かく切ってしまう。
      stance: 会議の代償は、一時間ではなく壊す時間のまとまりで数える
      mechanism: |-
        Paul Graham は一日の使い方を二つに分ける。「マネージャーの時間割は上司のためのものだ」。一日は一時間ごとに区切られ、会議は枠がひとつ埋まるだけだ。プログラムを書いたり文章を書いたりするメイカーは、ふつう少なくとも半日単位で時間を使いたがる。難しい仕事は、動き出すまでに長い助走が要るからだ。メイカーにとっては「会議がひとつあるだけで午後がまるごと吹き飛ぶ。午後が二つに割れ、どちらも難しいことをするには短すぎるからだ」。どちらの時間割も間違いではない。「どちらの時間割も、それだけならうまくいく。問題は両者がぶつかったときに起きる」。会議を入れる側には自分の予定表の一時間しか見えないので、メイカーの損は数えられないまま終わりがちだ。Google のコードレビューのガイドも、レビューする側に同じ線を引いている。"If you are in the middle of a focused task, such as writing code, don’t interrupt yourself to do a code review."
      counter:
        name: ラインを止めて対処する
        note: |-
          トヨタは、問題が起きたら誰でもラインを止められるようにして、問題を後工程に溜めずにその場で扱う。メイカーのまとまった時間を同じように守りすぎるチームは、止まっている仲間や欠陥を、その後ろで待たせてしまうことがある
      guideline: |-
        会議は一日の端に寄せるか、決まった曜日にまとめる。作る人には、会議のない半日以上のまとまりを残す。メイカーの予定を押さえる前に、取る一時間ではなく壊すまとまりを数える。障害対応はすぐ答える。レビューを待っているチームメイトには、次の区切りで、遅くとも一日以内に答える。
      example: |-
        Pinterest のプロダクトエンジニアリング組織は、火曜から木曜まで、エンジニアの予定表に 9 時から 17 時の会議禁止枠を入れる「週三日は会議なし」を試した。約100日後、マネージャーにはとても好意的な声が届き、調査でも大半のエンジニアが同じ意見だった。月曜と金曜の会議がよくはみ出すという声もあった。その後、Pinterest のほかのエンジニアリング組織もいくつか同じやり方を取り入れた。
      source: |-
        Paul Graham『Maker's Schedule, Manager's Schedule』(paulgraham.com, 2009年7月)。二つの時間割と、会議ひとつがメイカーに負わせる代償の出典。Google「Speed of Code Reviews」『Google Engineering Practices Documentation』は、集中している作業をレビューのために中断しないこと、そして一営業日以内に答えることの出典。Pinterest の事例は Brian Donohue「Three day no-meeting schedule for engineers」(2018 年。Pinterest のエンジニアリングブログに載り、本人のサイトに転載)。対抗原理はトヨタのアンドンで、出典はトヨタ自動車『Toyota Production System』(global.toyota)。
  - slug: mcnamara-fallacy
    tag: decision
    source_url: https://ryanmadden.net/the-new-odds-transcript/
    see_also:
      - goodharts-law
      - survivorship-bias
      - genchi-genbutsu
      - twymans-law
    en:
      title: McNamara Fallacy
      concept: Decisions drift toward whatever can be counted, until what cannot be counted is treated as if it did not exist.
      stance: Name what you cannot count, and keep it beside the number
      mechanism: |-
        Daniel Yankelovich laid it out as four steps in a 1971 speech. "The first step is to measure whatever can be easily measured. This is okay as far as it goes." Then: "The second step is to disregard that which can't be easily measured or give it an arbitrary quantitative value." Then: "The third step is to presume that what can't be measured easily really isn't very important." Last: "The fourth step is to say that what can't be easily measured really doesn't exist." He called the end of that slide suicide, named it after Robert McNamara and pointed to the US experience in Vietnam. Numbers are cheap to collect, easy to compare and easy to defend in a meeting; judgements about trust, morale or the state of the code are not, so they tend to lose by default. It differs from Goodhart's Law: there the number gets gamed; here the number can be honest, and the harm comes from what was left out.
      counter:
        name: Measure It Anyway
        note: |-
          much of what looks unmeasurable can be measured roughly, and a rough number tells you more than an unexamined hunch; Hubbard argues that the belief something cannot be measured rests on misconceptions (How to Measure Anything, 2007)
      guideline: |-
        When a decision rests on a dashboard, write down what matters that the dashboard does not show, such as user trust, on-call load or code health, and put at least one direct look or survey beside the numbers. The SPACE authors make the same point about developer productivity: no single metric or dimension can capture it. For a narrow, well-instrumented question such as one endpoint's latency, the number is enough.
      source: |-
        Daniel Yankelovich, *The New Odds* (speech to the Marketing Strategy Conference of the Sales Executives Club of New York, 1971) — the four steps and the name. The common citation *Corporate Priorities* (1972) is the name of his firm's research programme, which this speech introduces; the four steps are in the speech itself. The link is a transcript published by Ryan Madden (2026), who says he acquired a copy of the original transcript from the UCSD library archives and published it with the copyright holder's permission; the page also links a PDF of that copy; it is the only full text of the speech we found online. Douglas W. Hubbard, *How to Measure Anything: Finding the Value of "Intangibles" in Business* (Wiley, 2007) — the counter's argument that much of what looks unmeasurable can be measured. Nicole Forsgren, Margaret-Anne Storey, Chandra Maddila, Thomas Zimmermann, Brian Houck and Jenna Butler, "The SPACE of Developer Productivity" (*ACM Queue* 19(1), 2021) — developer productivity cannot be measured by a single metric or dimension.
    ja:
      title: マクナマラの誤謬
      concept: 判断は数えられるものに寄っていき、やがて数えられないものは存在しないかのように扱われる。
      stance: 数えられないものも、数字の横に名前を書いておく
      mechanism: |-
        Daniel Yankelovich は 1971 年の講演で、これを四つの段階で示した。「第一段階は、簡単に測れるものを測ることだ。それ自体は、その範囲では問題ない」。次に「第二段階は、簡単に測れないものを無視するか、適当な数値を与えることだ」。そして「第三段階は、簡単に測れないものは実はあまり重要でないと決めてかかることだ」。最後に「第四段階は、簡単に測れないものは実は存在しないと言うことだ」。彼はこの行き着く先を自殺行為と呼び、Robert McNamara の名をとって名づけ、米国のベトナムでの経験を挙げた。数字は集めやすく、比べやすく、会議で守りやすい。信頼、士気、コードの状態についての判断はそうではないので、黙っていると負けがちだ。グッドハートの法則とは違う。あちらは数字が操作される。こちらは数字が正直でも、外したものから害が出る。
      counter:
        name: それでも測る
        note: |-
          測れないように見えるものの多くは粗くなら測れる。粗い数字でも、確かめていない勘よりは多くを教えてくれる。Hubbard は、何かが測れないという思い込みは誤解に基づいていると論じる（『How to Measure Anything』2007年）
      guideline: |-
        ダッシュボードで判断するときは、ダッシュボードに出てこないが大事なもの（利用者の信頼、オンコールの負担、コードの健全さなど）を書き出し、少なくとも一つは直接見たものかアンケートを数字の横に置く。SPACE の著者も、開発者の生産性は単一の指標や次元では測れないと書いている。一つのエンドポイントのレイテンシのように、狭くて計測が行き届いた問いなら数字だけで足りる。
      source: |-
        Daniel Yankelovich『The New Odds』(Sales Executives Club of New York の Marketing Strategy Conference での講演, 1971)。四つの段階と名前の出典。よく見る『Corporate Priorities』(1972) は、この講演で紹介される彼の会社の調査プログラムの名前だ。四つの段階は講演そのものにある。リンク先は Ryan Madden が公開した書き起こし (2026) で、本人によれば UCSD の図書館アーカイブから元の書き起こしを入手し、著作権者の許可を得て載せている。ページからはその写しの PDF にもリンクしている。ネットで見つかった講演の全文はこれだけだ。Douglas W. Hubbard『How to Measure Anything: Finding the Value of "Intangibles" in Business』(Wiley, 2007)。測れないように見えるものの多くは測れるという、カウンターの主張の出典。Nicole Forsgren, Margaret-Anne Storey, Chandra Maddila, Thomas Zimmermann, Brian Houck, Jenna Butler「The SPACE of Developer Productivity」(『ACM Queue』19(1), 2021)。開発者の生産性は単一の指標や次元では測れないという指摘の出典。
  - slug: twymans-law
    tag: cognition
    source_url: https://exp-platform.com/Documents/2014%20experimentersRulesOfThumb.pdf
    example_url: "https://exp-platform.com/Documents/2014%20experimentersRulesOfThumb.pdf"
    see_also:
      - goodharts-law
      - survivorship-bias
      - most-ideas-fail
      - mcnamara-fallacy
    en:
      title: Twyman's Law
      concept: When real effects that large are rare, a metric that moves surprisingly far is more often a bug in the measurement or the analysis than a real effect.
      stance: Treat a surprising number as a bug report until it survives checking
      mechanism: |-
        In its usual wording, "Any figure that looks interesting or different is usually wrong!" Kohavi and his co-authors explain it with Bayes' rule. Breakthroughs are rare: if experiment results centre on 0 with a standard deviation of 0.25%, a +2.0% gain in sessions per user is eight standard deviations out, so even a statistically significant result is more likely a bug, such as an instrumentation error. With 5% significance and 80% power, if real breakthroughs are one in 500 experiments, the chance that a significant result is a true positive drops to 3.1%. People also check results unevenly: a bad result for a favoured feature gets questioned, a great one gets celebrated, so the errors that flatter us survive longest.
      counter:
        name: Trivial Changes Can Have a Big Impact
        note: |-
          the same paper's Rule #1: trivial changes sometimes move key metrics a lot, like a Bing font-colour change worth over $10M a year; a team that treats every big win as a bug stops running the cheap long-shot experiments that find them
      guideline: |-
        When a result is far better or worse than past experiments, hold the announcement and check the plumbing first: how the metric is logged, whether the treatment changed what gets recorded, and whether the analysis compares like with like. Then replicate on a fresh sample. Ordinary, expected moves do not need this treatment.
      example: |-
        An MSN experiment with a new auto-suggest algorithm looked like a huge success: searches on Bing referred from MSN rose dramatically. Investigating because of this rule, the team found the new code was effectively issuing two searches whenever a user picked a suggestion, one of which the browser always dropped.
      source: |-
        Folklore, attributed to Tony Twyman via A. S. C. Ehrenberg, *The Teaching of Statistics: Corrections and Comments* (Journal of the Royal Statistical Society, Series A, 1975); documented in Ron Kohavi, Alex Deng, Roger Longbotham & Ya Xu, *Seven Rules of Thumb for Web Site Experimenters* (KDD, 2014) — the wording, the Bayes argument and the examples.
    ja:
      title: トワイマンの法則
      concept: それほど大きな本物の効果がめったにない場で指標が驚くほど大きく動いたら、本当の効果より、計測か分析のバグであることのほうが多い。
      stance: 意外な数字は、確かめるまでバグ報告として扱う
      mechanism: |-
        よく知られた言い方では「面白く見える数字、変わって見える数字は、たいてい間違っている！」。Kohavi らはベイズの定理で説明する。大当たりはまれだ。実験結果が平均 0、標準偏差 0.25% に分布しているなら、ユーザーあたりセッション数の +2.0% は平均から標準偏差 8 個分も外れている。統計的に有意でも、計測の誤りのようなバグである可能性のほうが高い。有意水準 5%、検出力 80% で、本物の大当たりが 500 回に 1 回なら、有意な結果が本当に効いている確率は 3.1% まで下がる。人の確かめ方も偏っている。肩入れした機能の悪い結果は疑うのに、良い結果は祝ってしまう。だから自分に都合のよい誤りほど長く生き残る。
      counter:
        name: ささいな変更が大きく効くこともある
        note: |-
          同じ論文のルール1。ささいな変更が主要な指標を大きく動かすことがある。Bing のフォントの色の変更は年間1000万ドル以上の価値があった。大きな勝ちをすべてバグ扱いするチームは、それを見つける安くて当たりにくい実験をやめてしまう
      guideline: |-
        過去の実験よりはるかに良い、あるいは悪い結果が出たら、発表を止めてまず配管を確かめる。指標がどう記録されているか、変更が記録される中身を変えていないか、分析が同じものどうしを比べているか。そのうえで新しいサンプルで再現する。予想どおりのふつうの動きには、ここまでしなくてよい。
      example: |-
        MSN で新しいオートサジェストのアルゴリズムを試した実験は、大成功に見えた。MSN から Bing に送られる検索が劇的に増えたからだ。この法則に従って調べると、新しいコードは利用者が候補を選ぶたびに実質二回検索を投げていて、そのうち一回は必ずブラウザが切っていた。
      source: |-
        Tony Twyman のものとされる言い伝え（フォークロア）で、A. S. C. Ehrenberg『The Teaching of Statistics: Corrections and Comments』(Journal of the Royal Statistical Society, Series A, 1975) を経て伝わった。Ron Kohavi, Alex Deng, Roger Longbotham & Ya Xu『Seven Rules of Thumb for Web Site Experimenters』(KDD, 2014) に記録されている。言い回し、ベイズによる説明、事例の出典。
  - slug: psychological-safety
    tag: organization
    source_url: https://doi.org/10.2307/2666999
    example_url: "https://rework.withgoogle.com/intl/en/guides/understand-team-effectiveness"
    see_also:
      - blameless-postmortem
      - braintrust
      - pre-mortem
      - hanlons-razor
    en:
      title: Psychological Safety
      concept: A team learns when its members admit mistakes, ask for help and disagree, and they do that far more readily when they believe it is safe to.
      stance: Make "I was wrong" and "I don't know" cheap to say
      mechanism: |-
        Amy Edmondson defined team psychological safety as "a shared belief held by members of a team that the team is safe for interpersonal risk taking". Asking a question, reporting an error or challenging a plan each risks looking ignorant or difficult in front of colleagues; when that risk feels high, people tend to stay quiet, and the team loses exactly the information it needed. In her study of 51 work teams in a manufacturing company, psychological safety was associated with learning behaviour, and learning behaviour mediated between psychological safety and team performance.
      counter:
        name: Felt Accountability
        note: |-
          in a three-year study of 545 New York City public schools, Higgins and colleagues found the best performance where psychological safety was relatively low and felt accountability relatively high, not where both were high as Edmondson's model predicts; they liken safety to "a pinch of yeast", so when results lag, raise accountability for shared goals before adding comfort (Academy of Management Discoveries, 2022)
      guideline: |-
        Leaders go first: say your own mistakes and unknowns out loud, ask for dissent before you decide, and answer bad news by thanking the messenger and fixing the system. Keep standards and deadlines where they are; safety is about speaking up, not about lowering the bar. Edmondson herself warns that "if you are ONLY creating psychological safety, then you are creating a comfort zone."
      example: |-
        Google's re:Work guide on its team-effectiveness research, code-named Project Aristotle (the guide was first published in 2015), says the researchers studied 180 teams and found that what mattered was less about who is on the team, and more about how the team worked together. Of the five dynamics it lists in order of importance, psychological safety comes first, defined with Edmondson's wording.
      source: |-
        Amy C. Edmondson, *Psychological Safety and Learning Behavior in Work Teams* (Administrative Science Quarterly, 1999) — the definition and the field study of 51 teams; "Leading in Tough Times: HBS Faculty member Amy C. Edmondson on Psychological Safety" (a Q&A on the Harvard Business School recruiting site), her answer under "Does Creating Psychological Safety Undermine Accountability?" — the "comfort zone" warning. The counter-force is from M. Higgins, Shoshana R. Dobrow, J. M. Weiner & Haiyang Liu, *When is psychological safety helpful in organizations? A longitudinal study* (Academy of Management Discoveries, 2022) — "the best conditions for fostering organizational performance occur when psychological safety is relatively low and felt accountability is relatively high."
    ja:
      title: 心理的安全性
      concept: チームが学べるのは、メンバーが間違いを認め、助けを求め、異を唱えるときだ。人がそうしやすくなるのは、そうしても安全だと信じているときだ。
      stance: 「間違えた」「知らない」を言いやすくしておく
      mechanism: |-
        Amy Edmondson はチームの心理的安全性を「このチームでは対人関係のリスクを取っても安全だという、メンバーが共有する信念」と定義した。質問する、ミスを報告する、計画に異を唱える。どれも同僚の前で無知に見えたり面倒な人に見えたりするリスクがある。そのリスクが高く感じられると人は黙りがちで、チームはまさに必要だった情報を失う。製造業の会社の51チームを調べた研究では、心理的安全性は学習行動と結びつき、学習行動が心理的安全性とチームの成果をつないでいた。
      counter:
        name: 説明責任の実感
        note: |-
          Higgins らがニューヨーク市の公立学校545校を3年間追った研究では、成果が最も高かったのは心理的安全性が相対的に低く、説明責任の実感が相対的に高い学校だった。Edmondson のモデルが言う両方とも高い学校ではない。彼らは心理的安全性を「ひとつまみのイースト」にたとえる。成果が伸びないときは、居心地を足す前に、共有の目標への説明責任を上げる（Academy of Management Discoveries, 2022年）
      guideline: |-
        まずリーダーがやって見せる。自分のミスと分からないことを口に出し、決める前に反対意見を求め、悪い知らせには知らせた人に礼を言って仕組みを直す。水準と締切は動かさない。心理的安全性は声を上げられることであって、基準を下げることではない。Edmondson 本人も「心理的安全性だけをつくるなら、それはコンフォートゾーンをつくっているにすぎない」と言う。
      example: |-
        Google の re:Work にある、Project Aristotle という名のチームの効果性の研究のガイド（2015年初出）によれば、研究者は180チームを調べ、大事なのは誰がチームにいるかより、チームがどう一緒に働くかだとわかった。重要な順に挙げた五つの要素の一番目が心理的安全性で、定義には Edmondson の言葉を使っている。
      source: |-
        Amy C. Edmondson『Psychological Safety and Learning Behavior in Work Teams』(Administrative Science Quarterly, 1999)。定義と、51チームを対象にした現場研究の出典。「コンフォートゾーン」の警告は、Harvard Business School の採用サイトにある Q&A「Leading in Tough Times: HBS Faculty member Amy C. Edmondson on Psychological Safety」での Edmondson の答え（「Does Creating Psychological Safety Undermine Accountability?」の項）。対抗原理は M. Higgins, Shoshana R. Dobrow, J. M. Weiner & Haiyang Liu『When is psychological safety helpful in organizations? A longitudinal study』(Academy of Management Discoveries, 2022) から。"the best conditions for fostering organizational performance occur when psychological safety is relatively low and felt accountability is relatively high." の出典。
