# Hammurabi — the single source of truth for the codex.
#
# Everything else is generated from this file: README.md, translations/ja.md and
# the website's data module. Never edit those by hand — edit this, then run
# `npm run generate` (and `npm run validate` to check it).
#
# `slug` is the permanent identity of a law. It appears in every permalink, so it
# must never change once published. `number` is display only and is assigned in
# file order by the generator; a new law is appended, never inserted.

