# Who or what each law is pictured by on the website.
#
# kind: person  — the originator. `image` is a freely licensed photo; when it
#                 is absent the site draws a monogram seal from `name`.
# kind: scene   — no free photo of the originator exists, so a freely licensed
#                 picture of what the law is about; `name` describes it.
# kind: company — the organisation the practice comes from; `logo` is its current
#                 official mark in its own colours. `viewbox` crops an SVG mark to
#                 its symbol when the file is a wide lockup.
# focus:        — optional {x, y, zoom} crop for a photo whose face is small or
#                 off-centre; see scripts/fetch-figures.mjs.
# kind: none    — no single originator; the site draws a seal from the title.
#
# Images are not hot-linked. `npm run fetch:figures` downloads them and writes
# the processed files to website/public/figures/, which are committed. Every
# non-PD image carries its author and licence, shown under the article's source.

